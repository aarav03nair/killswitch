un on seed 2 is a B2 deviation, and 'cancels payment' in acceptance text conflicts with B2 re-hold (B2 wins; fix acceptance wording). 7 collateral G3 holds need Aarav sign-off.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "20 Nov 08:54", "who": "maya", "msg": "→ in_progress: start: serve RunOptions.fault (+monitor, hold), live taint holds, ks score/inject, hero golden test"}, {"t": "20 Nov 09:05", "who": "pmo", "msg": "→ in_progress: For B3-27's reviewer (from kabir's B3-30 review): check the ks.approve record always precedes the ks.recover.<op> steps in the hero record (approve-before-steps ordering). Kabir's other three B3-30 follow-ups are in the B3-30 review text."}, {"t": "20 Nov 09:27", "who": "maya", "msg": "posted result summary"}, {"t": "20 Nov 09:27", "who": "maya", "msg": "→ in_review: ready for nisha: hero golden green native+container; make demo runs the hero path"}, {"t": "20 Nov 09:29", "who": "nisha", "msg": "review: done"}, {"t": "20 Nov 09:31", "who": "anaya", "msg": "→ in_review: metric audit: [Fact] seed 2: B=9 (2 culprit keys + INV-0012 + 6 held outbox items), R 0/9, recall 2/9, 9 operator unholds; held_honest_actions and collateral_stall 'unavailable'. OK: oracle seed-row fix; step-to-key map matches ADR-06 X/kept; B at t_rec-1 (widens B) and 'S*-equal effect is not tainted' are now ADR-06 §6 A1/A2. CHANGES: (1) revert the rseqs exclusion in post_alert_tainted (it only hides a WRONG repair; A2 already covers correct ones); (2) realrun recov map must require sig_ok; (3) [Our view] hero R=0 relies on operator releasing non-rerun holds, outside the §4 bench approver: score must count those unholds (A3) or the golden must run under the bench approver; claims must state 'after operator released N held items'."}, {"t": "20 Nov 09:35", "who": "vikram", "msg": "→ in_review: reporter finding: (a) correct by conservative taint; B2 text is stale on reporter. Seed 2 (h=11): only tainted invoice is INV-0012 v1 (billing seq 52, t12). Reporter's pre-suspend reads (seq 41 t10, seq 55 t12) touch INV-0002..0010 v1, all clean. Reporter acts on phase 1 (h+1, h+3), the tainted invoice is first visible at h+2 (M2), suspend seq 66 is at h+2, and at t14 rerun seq 70 writes INV-0012 v2 before reporter's seq 80 reads v2. Seeds 1/3/5 have the same shape; seed 0 has no tainted invoice. The reports: table move is not the cause. Not a planner bug. Action: amend B2 (drop reporter from rerun, list as independent)."}, {"t": "20 Nov 09:40", "who": "tara", "msg": "→ in_review: Anaya changes done: (1) rseqs exclusion reverted (A2 only); (2) realrun re-run backing and prov require sig_ok; (3) A3 scored: fp_cost.operator_unholds{total,honest,tainted}, held_honest_actions from hold Controls, collateral_stall {n,d,basis:s_star}. Seeds 0/1/2: R 0/1,0/5,0/9; C 0; tainted 0; irrev 0; reemitted 0; unholds 1/5/9 (honest 0/3/7); held_honest 0/3/7; stall 0; TTI 0/2/2; TTC 1. All B2 targets hold. Native+container 29 passed."}, {"t": "20 Nov 09:44", "who": "anaya", "msg": "→ in_review: metric re-audit: tests/score+oracle+integration 29 passed. (1) tainted/honest def was only implicit and contradicted ADR-06 §2 'key not in B' for held items; written into A3 as binding. (2) collateral_stall proxy now labelled proxy in ADR A3, TERMS row + §7.10, FACT-CARD O3; score.json basis=s_star ok. (3) sig_ok backing safe: sig_ok=False only on BAD_SIG/SCHEMA denials, which land no writes. (4) FACT-CARD O1-O4 own results + D-17 condition; TERMS clean-recovery row carries D-17. Open [Our view]: an operator-released tainted item recovery never touched counts honest."}, {"t": "20 Nov 10:21", "who": "maya", "msg": "posted result summary"}, {"t": "20 Nov 15:53", "who": "pmo", "msg": "→ done: Reviewed by nisha (done), metric audit by anaya, D-16/D-17 applied; maya updated test_hero_f2plus_golden for B2-a and the A3 fields."}]}, {"id": "B3-28", "title": "Console: live timeline and 5-beat pacing", "sprint": 3, "track": "eng", "owner": "ishaan", "reviewer": "maya", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "ks console --live renders ticks, alerts, controls and holds, with pacing for the CALL-01/zoya section 4 beats", "acceptance": ["Live view shows per-tick records, alerts, suspend and holds from the run dir/operator socket, read-only", "Pacing mode stops at beat boundaries (break, identify, contain, recover, audit) with a keypress; timings fit 5 min on the hero seed", "Degraded isolation and repro banners always visible"], "depends": ["B3-12"], "deliverable": "console/", "summary": "Maya review fixed: alerts from chained sig_ok ks.monitor ks.alert via side store + C4 Alert (alerts.jsonl ignored); plans show dry-run/not-in-record unless ks.approve matches recomputed plan_hash; failed verify => beats 'unverified' (red, UNTRUSTED) and unwitnessed records marked; holds counted from ks.control hold on outbox:* records; hard-coded LIVE lines derived (break readers from read sets, no HERO_LINE live); kept labelled by field; VOID banner only when degraded, per_agent_uid asserts none. Tests on real tests/recovery world + vikram hero plan (verify pinned OK for live-line test since fixture has no witness). Container tests/console green.", "review": "[maya · changes] Good: one static file, inline CSS/JS, embedded JSON escaped, no URLs/fetch (offline OK); deterministic; run dir untouched; never imports gateway/signer, never opens the operator socket; THREAT-MODEL wording 'tamper-evident up to the last witnessed head' used; degraded VOID and repro banners render first; PENDING beats carry a PENDING first line and amber tag. --pace ACCEPTED: I added the ADR-07 amendment (org/adr/ADR-07-cli-console.md, 'Amendments (B3-28 review)'): presenter pacing of the read-only view, run pacing stays --pause-at/--step (now served, B3-13). I ran it on vikram's real hero dry-run plan (tests/recovery world + plan_recovery + dry_run, plan written to plans/). MUST-FIX: (1) Not verified-only. Alerts come from alerts.jsonl, the unauthenticated copy (rundir.py: the chained ks.alert records are authoritative; ks.score never reads it). Take alerts from EXEC ks.alert records on c-0 (args from the side store by hash), like ks.score. Plans are unchained files: show 'dry-run file, not in the record' unless a ks.approve with a matching plan_hash exists, and recompute plan_hash. (2) When verify fails, Contain/Recover/Identify still render LIVE from the tampered record (seen on the real plan: VERIFY FAILED banner, yet beats 3 and 4 LIVE). On a non-OK verify every data beat must be status 'unverified' (red), not live; records after last_witnessed_seq should be marked unwitnessed. (3) Held items are counted from decision=='hold', but the gateway records holds as EXEC ks.control op=hold target outbox:* (B3-23). On the real hero run Contain shows 'held items: 0' while the payment and email were held. Count hold controls. (4) Hard-coded claims in LIVE beats: Break always adds 'billing, payments and comms read it; inventory and docs are independent', and Recover adds HERO_LINE whenever kept is non-empty, though the real plan also restores S-22 and re-runs compliance. Derive both from the record/plan or show them only in the PENDING fixture. (5) Container failure (root, per_agent_uid): test_degraded_banner_and_verify_always_present asserts 'attribution is VOID' in the html unconditionally; make it conditional on degraded, and add a per_agent_uid run assertion that no VOID banner shows. Lanes on the real plan: restore S-17.iban + S-22, re-run billing/comms/compliance/payments/reporter, kept triage on suppliers:S-17, independent docs/intake/inventory, flags 1. The lanes match the plan; the differences from CALL-02 B3 (compliance re-run, 1 flag) are B3-24's, ruled there. Minor: label the kept lane by field (risk note), not by row. Add a golden test on the real hero plan once B3-24 lands.\n\n[maya · done] Re-review: all five fixed. (1) Alerts only from exec, sig_ok ks.alert by ks.monitor, body from side store checked against args_hash, parsed as C4 Alert; forged alerts.jsonl never shows. Plans show 'dry-run file, not in the record' unless a ks.operator ks.approve matches the recomputed content_hash (= contract plan_hash). (2) Failed verify: beats 1-4 UNVERIFIED (red) with an UNTRUSTED line, audit FAIL, records after last_witnessed_seq marked. (3) Holds counted from ks.control op=hold on outbox:*: 14 on the hero fixture. (4) Break readers come from read sets; HERO_LINE and the fixture sentences appear only in PENDING beats; kept is labelled by field (triage: risk note of S-17). (5) The VOID check depends on isolation mode; in the container (per_agent_uid) the world run shows no VOID. Suites: local 861 passed / 8 skipped, container 880 passed. About the pinned verify: it is not a stub that hides console behaviour. I ran the hero fixture without the pin and the beat lines are identical; only the status changes (UNVERIFIED and the UNTRUSTED line). The test comment's reason is wrong, though. verify fails with hash_mismatch at seq 174 (ts_us slot collision), not because the witness is missing. tests/recovery/world.py _suspend appends at slot 0 outside the gateway slot counter, so the gateway's hold record lands on the same slot. The console test's injected ks.alert copies that pattern. Follow-up for vikram (fixture, not blocking): append through the gateway slot so the hero fixture verifies, then drop the pin. Ishaan: fix the comment. The real world run has no fault (runtime does not serve --fault yet), so beats 1-4 show PENDING there correctly. Golden test on the real hero run still waits for runtime fault support.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 21:45", "who": "ishaan", "msg": "posted result summary"}, {"t": "19 Nov 21:45", "who": "ishaan", "msg": "→ in_review: ready for review"}, {"t": "20 Nov 05:42", "who": "maya", "msg": "review: changes"}, {"t": "20 Nov 05:49", "who": "ishaan", "msg": "posted result summary"}, {"t": "20 Nov 05:49", "who": "ishaan", "msg": "→ in_review: Maya changes addressed"}, {"t": "20 Nov 05:57", "who": "maya", "msg": "review: done"}]}, {"id": "B3-29", "title": "ks.recovery: conflict rule and replan/flag (F2+x)", "sprint": 3, "track": "eng", "owner": "vikram", "reviewer": "maya", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Honest later writes on restored objects become flags at plan time or hold/stale_plan at apply", "acceptance": ["F2+x: triage's edit of S-22 conflicts and is flagged, not overwritten (test_triage_conflict)", "Revert-culprit-only baseline runs on objects and spares triage (test)", "Changed expect at apply -> hold/stale_plan (M8)"], "depends": ["B3-24"], "deliverable": "src/ks/recovery/", "summary": "(1) Fixture: world.py appended the suspend at ts_us slot 0 outside the gateway counter (driver bug, not gateway). Now the suspend goes through SystemQueue/FoldedControl, the real Witness runs in process, state.db is under the run dir. F2+ and S* pass ks.verify (test_world_verify.py). (2) conflict.py: recheck/first_stale give hold/stale_plan at apply (M8), for B3-30 to call inside the gateway txn. baseline.py: revert_culprit_only (oracle-assisted, per object, no conflict check, reports clobbered). Planner rule unchanged. test_conflict.py: F2+x gives exactly 1 write_write_conflict on S-22 by triage, IBAN restored, S-22 differs from S* (R>0). Hero has 0 flags, triage kept. Baseline spares triage on F2+ and clobbers it on F2+x. A gateway write between dry-run and apply halts the S-22 restore, and the new plan has a later as_of_seq plus the flag. Question for maya: on F2+x the conservative view reads make most downstream actions ride, and ADR §6.1 cancels their held items (10 cancels). Should rider items stay held instead? Local 912 passed/8 skipped; container 920 passed.", "review": "[maya · done] All three acceptance lines met; checked against CALL-02 B5 and ADR-05 §6.2/§8. Driver fix is right: the suspend now goes through SystemQueue/FoldedControl and the real Witness, and F2+/S* verify to the last seq (test_world_verify). F2+x: exactly 1 write_write_conflict (S-22, triage), no S-22 restore, IBAN restored, R>0. Hero: 0 flags, triage kept. M8 recheck gives hold/stale_plan and the replan has a later as_of_seq. Baseline is labelled oracle-assisted, spares triage on F2+, clobbers it on F2+x. Local 915 passed/8 skipped; container 926 passed. RULING on the question: riders stay held. ADR-05 §6.1 amended 20 Nov: cancel_outbox only for items of the suspect's own seed actions and for released items of non-re-run actions. Items of riders, replans and flagged actions get no step, stay held, and are listed. Reasons: X4, B2/B3-23 never-silently-dropped, cancel is irreversible. Follow-up is B3-48 (vikram). B3-30 (apply): call conflict.recheck inside the txn and halt at the first stale step. Execute only the cancels the planner emitted. The bench approver releases only items re-held by a re-run step of the approved plan, never rider items, which stay held to T and count in R. Console pin (B3-34): not removable yet. The fixture verifies, but the console test's injected ks.alert still appends at slot 0 outside the gateway and after the last witness push. Ishaan must queue it through SystemQueue (W._tick/extra_tick) first, then drop the pin.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "20 Nov 06:02", "who": "vikram", "msg": "→ in_progress: Fixture fix first (maya B3-28): tests/recovery/world.py _suspend appended the ks.monitor suspend at ts_us slot 0 outside Gateway._slot; open() reset the slot so the tick's next record reused slot 0 -> verify hash_mismatch (seq 174). Driver bug, not gateway. Fix: suspend queued on the gateway SystemQueue (control phase, FoldedControl), in-process real Witness pushed per tick, state db at <run>/workspace/state.db. New tests/recovery/test_world_verify.py: F2+ and S* run dirs verify ok (witnessed to last seq). Console pin can now be dropped (ishaan's test)."}, {"t": "20 Nov 06:17", "who": "vikram", "msg": "posted result summary"}, {"t": "20 Nov 06:17", "who": "vikram", "msg": "→ in_review: ready for review"}, {"t": "20 Nov 06:26", "who": "maya", "msg": "review: done"}]}, {"id": "B3-30", "title": "Recovery apply via c-0 (approval-bound)", "sprint": 3, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Approved plan steps execute as ks.recover.<op> envelopes on c-0 bound to the ks.approve plan_hash (F5)", "acceptance": ["ks.approve by ks.operator with {plan_id, plan_hash, steps}; each ks.recover.<op> carries {plan_id, plan_hash, n, step}", "Verify rejects a recovery record without a prior matching approval; edited plan file detected", "Apply while frozen (tamper/stall alert) -> recovery_frozen; after hero apply state digest equals S* on untainted objects"], "depends": ["B3-24", "B3-13"], "deliverable": "src/ks/runtime/recover.py", "summary": "Built src/ks/runtime/recover.py. RecoveryService serves ks.recover.<op> on c-0 through admit_system, after steps 3/5/6/10. Per step, in order: RecoverArgs {plan_id, plan_hash, n, step}; tool ks.recover.<op>; action id <plan_id>.<n>, so a double apply is nonce_reused. Then the freeze check (chained tamper/stall alert -> deny/recovery_frozen). Then binding: a prior ks.operator ks.approve listing n, and the plan file still hashes to plan_hash (else deny/out_of_scope). Then BEGIN IMMEDIATE + conflict.recheck in the same txn; stale -> hold/stale_plan, and the apply halts (later steps are refused before any record). restore uses apply_restore; the read set is the to-version. rerun uses vikram's ToolRerunner on the live txn (same code as the dry-run; dispatched items are never re-created) plus a post-run recheck of new objects. Repair versions are written when the re-run's value equals the head. Each re-held item gets a ks.control hold by ks.recovery, reason rerun_reheld. cancel_outbox is a status change. compensate is tool_error (no compensators). Outbox._unrecorded_rerun accepts the re-run record as the creating record, using the original's tick/key, so unhold -> dispatch works. bench_releasable lists only rerun_reheld items, never riders. Verify: new ks.verify.recovery, reason recovery_unbound (TAMPER, contracts 1.5.0 additive): no prior approval / edited plan file / step applied twice. Operator socket op recover; ks recover --dry-run / --apply (verify first, FROZEN). ks run --decisions SRC --decisions-head ANCHOR replays operator Controls and approvals at their source ticks (RunOptions SERVED). Hero: state after apply equals S* on every non-outbox object and equals the dry-run planned hashes. Re-held payloads equal S*; they dispatch after unhold; verify OK. Tests: tests/runtime/test_recover.py (17). Native 949 passed / 8 skipped. Edits outside runtime: gateway/system.py (route ks.recover.* to gw.recovery; SystemRequest.action_id), gateway/outbox.py (_unrecorded_rerun), verify/core.py (one call) + verify/recovery.py, contracts rundir VERIFY_REASONS + README, cli recover/--decisions-head, tests cli/run_options/contracts_12 updated, ADR-05 amendment line.", "review": "[kabir · done] DONE. Versioning: recovery_unbound is already in the committed 1.5.0 (73754ed). It was added after my B3-47 re-review (06:27) and before the commit (06:39). No 1.5.0 build exists without it. VerifyReport.reason is a pattern, not an enum, and goldens/schemas did not move, so nothing changes on the wire. 1.6.0 not required. Still a process slip: next time a reason added after review gets its own bump. Attacks run (scratch tests, all held): approval for another plan_hash -> deny/out_of_scope, no writes; ks.approve from ks.monitor/ks.recovery -> not exec, step denied; plan file replaced under the same id with a direct envelope -> out_of_scope; double apply -> nonce_reused, and verify catches it too; honest write AFTER approval -> hold/stale_plan, halt, verify OK. Every restore/cancel write set equals the step's obj. No recovery_unbound false positive on the hero or the halted runs. plan_id = p-<last_seq>, so a re-dry-run cannot overwrite an approved plan. --decisions-head with a foreign anchor: load_decisions runs verify(src, anchor), so a head/keyring/config mismatch is refused. The 3 edited tests are not weakened: recover now asserts IO, contain moved to its own test, the additive set was widened by exactly the new reasons. Native 946 passed, container 958 passed, make smoke OK (anchored). The 2-3 test_run_options failures come from maya's uncommitted B3-27 options.py (fault/culprit/hold now SERVED), not B3-30. Follow-ups (not blocking): (1) pin VERIFY_REASONS['recovery_unbound'] is TAMPER in test_contracts_15 and fix the README 1.5.0 heading to say B3-47 + B3-30; (2) add a test for a foreign --decisions-head refused (USAGE); (3) the test_cli placeholder list still says 'recover (B3-18+)'; (4) B3-27 changes cli_apply to a single apply op, and the reviewer must recheck that ks.approve is recorded before the first step in the same control phase.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 21:33", "who": "pmo", "msg": "→ todo: From vikram's B3-24: apply must skip outbox create for already-dispatched items (it raises), and must record repairs when a re-run's value equals the head (no new version is written)."}, {"t": "19 Nov 21:41", "who": "pmo", "msg": "→ todo: From kabir's B3-23 re-review: re-run outbox items re-enter HELD via the exec record with no ks.control hold record (breaks ADR-03 §7 like B3-23 finding 2). Only reachable in the rolled-back dry-run today; apply must emit the hold record."}, {"t": "20 Nov 05:43", "who": "pmo", "msg": "→ todo: From kabir's B3-23 review: re-run outbox items would stay held forever after an unhold (release-phase provenance check must accept the recovery record as the item's creating/last writer)."}, {"t": "20 Nov 06:00", "who": "pmo", "msg": "→ todo: From kabir's B3-20 review: wire  end to end (RunOptions.decisions served) with a test replaying an anchored source run's operator decisions."}, {"t": "20 Nov 06:01", "who": "pmo", "msg": "→ todo: Correction to previous note (shell ate the command name): wire \"ks run --decisions\" end to end (RunOptions.decisions served) with a test replaying an anchored source run's operator decisions."}, {"t": "20 Nov 06:27", "who": "pmo", "msg": "→ todo: From maya's B3-29 review: run conflict.recheck inside the apply txn and halt at the first stale step; the bench approver releases only items re-held by a re-run, never rider items (rider items of blocked actions stay held per ADR-05 §6.1 amended; B3-48)."}, {"t": "20 Nov 06:28", "who": "maya", "msg": "→ in_progress: start: c-0 ks.recover.<op> handler + ks recover apply"}, {"t": "20 Nov 06:52", "who": "maya", "msg": "posted result summary"}, {"t": "20 Nov 06:55", "who": "maya", "msg": "→ in_review: ready for kabir: native 949 passed/8 skipped; container 957 passed; make smoke OK (anchored). Reviewed B3-48 (done)."}, {"t": "20 Nov 09:05", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-31", "title": "ks.verify: dispatch window (F4) and alerts cross-check (F6)", "sprint": 3, "track": "eng", "owner": "arjun", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Verify F4 window check and F6 alerts.jsonl vs records, FROZEN derived from records", "acceptance": ["test_dispatch_window: a dispatch with a hold/taint seed/suspend in (created_seq, dispatched_seq) and no unhold -> TAMPER window_violation", "test_alerts_cross_check: deleting a tamper alert from alerts.jsonl -> TAMPER alert_mismatch", "FROZEN is computed from chained ks.alert records only (test_live_edit_freezes)"], "depends": ["B3-07", "B3-15", "B3-23"], "deliverable": "src/ks/verify/", "summary": "Round 2: window.py now (1) taints items created after a seed alert, (2) holds B2 re-created items, (3) side_pass fails side_entry_mismatch at seq when a chained ks.alert side entry is missing/redacted/non-Alert. Direct-seed limit noted in docstring. 3 regression tests in tests/verify/test_window.py; verify suite 44 pass.", "review": "[kabir · changes] Probes: scratchpad/p31/test_p31.py (in kabir session scratchpad). HOLDS: early dispatch (tick < release_tick incl. G3 v+2H) caught; late is legal; double/orphan dispatch caught; alerts.jsonl drop/reorder/edit all give alert_mismatch at the right seq; side entry swapped into another hash's filename (same prefix dir) gives side_entry_mismatch; value re-hash enforced at parse; skeleton read_set/outbox_ids now seed_invalid; PMO relative-path fix (db.resolve().as_uri()) correct and its test is right. RULING: extra alerts.jsonl line -> alert_mismatch, first_bad = n+1 is accepted (same convention as truncated: the record that should exist). BLOCKERS (reproduced, verify OK): (1) an item CREATED after a tamper alert whose evidence_versions are in its lineage (the gateway creates it held) is dispatched with no unhold: window_pass passes, because taint is only applied to items existing at alert time. Fix: at creation set flags.taint if lineage meets any seed seen so far. (2) A B2 re-created item (outbox write with before != None: back on hold by creation) resets flags to empty and dispatches with no unhold: passes. Fix: re-creation sets flags.hold. Optionally check the dispatch's write before == the item's last written version. (3) Deleting (or redacting) the side entries of chained ks.alert records: verify OK and frozen_from_records -> None. That unfreezes recovery and drops taint seeds by editing an unsigned file, which contradicts F5. Fix: an executed chained ks.alert whose args side entry is missing, redacted or not an Alert -> side_entry_mismatch at that seq (alerts hold no PII, so they are never redactable). Add one test each. NON-BLOCKING: taint seeds are direct only (the alert's evidence_versions); derived versions are not followed the way TaintView does. Note this as an honest limit in the window.py docstring.\n\n[kabir · done] Round 2 re-review. My 3 p31 probes (scratchpad/p31/test_p31.py) now fail as intended: (1) item created after a seed alert with evidence in its lineage, dispatched with no unhold -> window_violation; (2) B2 re-created item (outbox write before != None) dispatched with no unhold -> window_violation; (3) deleting the side entries of chained ks.alert records -> side_entry_mismatch at seq 2 (redacted is also covered, since _side_value returns None for redacted entries). Arjun's 3 regression tests match these. Direct-seed limit is noted in the window.py docstring. False-positive check: the honest world F2+ hero driver (tests/recovery/world.py), with the alert chained as a real ks.alert through the gateway SystemQueue plus the alerts.jsonl copy, verifies OK at H=0/3/6. S* and F2+ without the alert also verify OK, and so does an honest ks run with 10 agents. Runs, on a tree that includes maya/vikram/nisha WIP: native 918 passed, 8 skipped; container 927 passed; make smoke OK (anchored, per_agent_uid). Note: ks inject (F2+, F1, F3) is still not implemented in the runtime, so the hero path can only be checked through the world driver. That is B3-27 scope, not this issue.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 21:07", "who": "pmo", "msg": "→ todo: From kabir's B3-15 re-review (non-blocking): a skeleton-run record with a non-empty read_set or outbox_ids still verifies OK (should fail like write_set); verify never checks sidestore/ (side entries vs record hashes). Probes: scratchpad/p15b/test_probe15b.py."}, {"t": "19 Nov 21:38", "who": "pmo", "msg": "→ todo: PMO fixed a bug kabir found in his B3-46 review: ks verify on a RELATIVE run path failed reconcile (state.db opened via Path.as_uri on an unresolved path -> reconcile_mismatch, exit 4, on an honest run). Fix: src/ks/verify/core.py db.resolve().as_uri(). Regression test tests/runtime/test_world_runtime.py::test_verify_accepts_a_relative_run_path (fails without the fix). Kabir to glance at it when reviewing B3-31."}, {"t": "20 Nov 05:57", "who": "arjun", "msg": "→ in_progress: start"}, {"t": "20 Nov 06:08", "who": "arjun", "msg": "posted result summary"}, {"t": "20 Nov 06:08", "who": "arjun", "msg": "→ in_review: ready"}, {"t": "20 Nov 06:14", "who": "kabir", "msg": "review: changes"}, {"t": "20 Nov 06:28", "who": "arjun", "msg": "posted result summary"}, {"t": "20 Nov 06:28", "who": "arjun", "msg": "→ in_review: round 2 fixes"}, {"t": "20 Nov 06:39", "who": "kabir", "msg": "review: done"}, {"t": "20 Nov 06:39", "who": "kabir", "msg": "→ done: re-review passed"}]}, {"id": "B3-32", "title": "F8: frame and flood budget", "sprint": 3, "track": "eng", "owner": "nisha", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Bounded reader and per-connection denial budget with auto conn suspend", "acceptance": ["Reader takes at most MAX_FRAME_BYTES+1; oversize -> deny/schema with raw_hash over the prefix, connection closed", "K recorded denials per conn per tick, then Control{suspend, conn:<id>, reason=flood} by ks.gateway and close; agent not suspended", "A 10k-frame flood adds at most K+1 records per tick and no witness stall (test)"], "depends": ["B3-11"], "deliverable": "src/ks/gateway/", "summary": "Gateway.tick: FLOOD_K=8 recorded denials/conn/tick; surplus frames dropped+counted (flood_dropped), one Control{suspend conn:<id>, reason=flood, ks.gateway} via admit_system (agent untouched); barrier.py closes gateway.flooded conns (3-line edit). Reader bound/oversize deny-schema already existed (pop_frame/fill). Nits: pii extra recipients (cc/bcc/...) fail closed, lowercase IBANs, MANUAL_UNHOLD removed. Tests tests/gateway/test_flood.py; env 932 passed; container not run.", "review": "[kabir · done] Done (reviewer kabir). Ran: env 946 passed/3 failed (all tests/runtime/test_recover.py, B3-48 in-flight, pass in isolation, not B3-32); container 957 passed; make smoke OK (anchored, per_agent_uid). Attacks: (1) Reconnect: none possible; conns are fixed socketpairs made at spawn (run.py:188), no accept path, so a closed conn stays closed and per-agent records are bounded at K+1 once. (2) Crowd-out: only of the flooder's own later frames that tick; test_honest_conn_unaffected covers other agents; garbage is schema-denied cheaply before sig work. (3) In the real runtime the budget never fires: barrier C2 passes one frame per conn per tick (CALL-02 C2), and CALL-02 deferred F8b for exactly that reason. So this is defense-in-depth for direct Gateway.tick callers, consistent with ADR-04 RT11 'floods suspend only the connection'. Not suspending the agent is correct (garbage is attributed_agent=None and could be forged). Nits landed: lowercase IBAN (tested), MANUAL_UNHOLD gone from holds.py, cc/bcc fail closed. Non-blocking: no test for cc/bcc; only top-level keys are checked (nested headers.cc is not); state in the ADR-03/04 text that F8b is a backstop, not the primary bound.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "20 Nov 06:37", "who": "pmo", "msg": "→ todo: From kabir's B3-19 re-review (non-blocking, nisha): pii_egress allow-list keys on 'to' only; make extra recipients (cc/bcc) fail closed if ever added to the comms payload; find_pii misses lowercase IBANs; remove dead MANUAL_UNHOLD code."}, {"t": "20 Nov 06:39", "who": "nisha", "msg": "→ in_progress: start"}, {"t": "20 Nov 06:43", "who": "nisha", "msg": "posted result summary"}, {"t": "20 Nov 06:43", "who": "nisha", "msg": "→ in_review: ready"}, {"t": "20 Nov 06:54", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-33", "title": "ks.bench: baselines and seed harness", "sprint": 3, "track": "eng", "owner": "tara", "reviewer": "maya", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Bench runs F2+/F2+c/F2+x over N seeds against snapshot and revert-culprit-only baselines", "acceptance": ["ks bench --seeds 3 completes and writes per-seed score.json plus a summary table", "Snapshot and revert-culprit-only baselines scored with the same scorer (test)", "Runtime per seed logged; projected 20-seed time fits S4"], "depends": ["B3-26", "B3-27", "B3-30"], "deliverable": "src/ks/bench/", "summary": "Maya D10 re-return: contrast before recovery added. runner.bench takes contrast_baselines (system, no_op); runs/bench-b3-33/bench.md has per-fault CONTRAST tables with system and no_op (pause, no recovery, --hold 0 --no-lineage-hold), labelled, never aggregated. no_op contrast irreversible_tainted_released 12 median [6..18], total 245, >0 on 20/20 seeds (F2+ and F2+x; s1=10) vs 0 [0..0] with hold on; system contrast 0 (instant apply supersedes the queued payment). D10 note rewritten: hold covers alert-to-decision window. Only contrast tables regenerated, image killswitch:tara rebuilt. tests/bench+score 20 passed. Not committed.", "review": "[maya · changes] Harness, aggregation (nearest-rank, rationals, k/n) and fail-loud on baseline_failed are good; 18 tests green; re-ran F2+x/system/s1 and F2+/snapshot/s2 locally twice: byte-identical to each other. T=40 ACCEPTED as deviation, written as ADR-06-metrics A4 (quote 'T=40' with every number). Changes: (1) F3 'never detected 0/20' is wrong framing: on the current tree F3 s1 raises a scope alert at t_inject=15 and suspends comms; in your bench the snapshot cells applied at t_rec=16, so they paused, i.e. a suspend happened. Scorer t_alert needs evidence_seqs to intersect b_prod; a deny record is never in b_prod, so t_alert/t0 are null. And the system cell got no_plan, which runner.py drops silently. Route the scorer binding to anaya. Re-check B3-53's scope with nisha before she 'fixes detection'. (2) runner: a 'no_plan' note after a pause must be listed in failures/notes, not scored silently. (3) The committed scores are stale: same cells on the current tree differ only in collateral_stall d (+6: 388 vs 382, 387 vs 381). Find out whether that is code drift or container vs mac, then regenerate after the monitor/scorer fixes. (4) bench.md needs a header: T=40 (A4); snapshot and revert_culprit_only are oracle-assisted (given t_inject and culprit); collateral_stall is a proxy, basis s_star (A3 binding); add a p95 column (§4). (5) Explain F2+x held_honest 29 in bench.md: s1 has held_honest_outbox=27, i.e. triage's lineage items stay held because the conflict is flagged and the §4 approver never resolves flags. It is the cost of the flag, not a wrong revert, and should be read next to C=21/254. Same for revert_culprit_only's 27 (outbox untouched). (6) H=0 is §4 scope: run H=0 for F2+ and F2+x at least, plus a D10 contrast row (system, --hold 0 --no-lineage-hold) for those two faults. run_cell needs a no_lineage_hold flag. Other faults at H=0 can be deferred if listed in bench.md.\n\n[maya · changes] All prior asks met: A5 F3 tti 0/0 ttc 1 20/20, no_plan listed, T=40, labels, p95, H=0 tables, revert_culprit_only F3 failures listed. tests/bench+score 20 passed. One change. The D10 contrast result is real, not a bug, but bench.md reads it wrong. Cause: --pause-on-alert + instant apply. In F2+ s1 the tainted payment ob-16 is queued at tick 17 (crm iban t15 -> INV-0016 t16 -> payment t17), alert t17, H=0 release t18. The apply re-runs ob-15/16 and holds them before t18, so recovery itself supersedes the payment and the lineage hold has nothing left to do (contrast score.json = H=0 system except the flag). RT10 shows a leak because it runs with no recovery. Check I ran: F2+ s1 no_op (pause, no recovery) with --no-lineage-hold gives irreversible_tainted_released 10, R 29/29; the bench no_op H=0 with the hold gives 0. Asks: (1) add a no_op CONTRAST column (H=0, --no-lineage-hold) to the F2+/F2+x contrast tables, keep the system contrast; (2) rewrite the D10 reading note: the lineage hold covers the time between alert and the operator applying recovery; with an instant apply it is redundant for F2+; without a decision yet, 10 payments escape on s1 (give the 20-seed numbers). No contract change.\n\n[maya · done] D10 contrast verified: CONTRAST rows labelled per B3-53/s3, separate tables, never aggregated with system cells. Per-seed no_op score.json: s1=10, total 245, F2+ and F2+x identical on all 20 seeds (plausible: no recovery, so the x conflict never comes into play before the hold decision). tests/bench+score 20 passed. Not committed.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 21:40", "who": "pmo", "msg": "→ todo: From anaya's B3-26 review (non-blocking, tara): a revoked honest agent adds no stall_ticks (should count toward collateral stall); add a repo test that a valid ks.monitor alert blaming the wrong agent counts in false_accusations, sets t_alert and is excluded from tti_attribute."}, {"t": "20 Nov 09:58", "who": "tara", "msg": "→ in_progress: ks.bench built (agg, runner, snapshot baseline), CLI wired; scorer A3 taint-based fix + tests; full 20-seed container run in progress"}, {"t": "20 Nov 10:22", "who": "anaya", "msg": "→ in_progress: A3 rule confirmed: tainted = recovery touched key OR key in B with value_hash != S* (or absent in S*). Release-without-recovery is caught: added test_operator_release_without_recovery_counts_tainted_unhold (hold+unhold Controls via state.db, no ks.recover record -> unholds tainted=1/honest=1); tara's test only called item_tainted directly. Mutation (payload check off) fails both. Import-lint reason (scorer independence) now written into A3, plus residuals: coincidental S* payload = honest (harmless per A2); items first written >= t_rec with payload != S* count honest. tests/score 13 passed."}, {"t": "20 Nov 15:02", "who": "tara", "msg": "posted result summary"}, {"t": "20 Nov 15:02", "who": "tara", "msg": "→ in_review: bench done, tests green"}, {"t": "20 Nov 15:16", "who": "maya", "msg": "review: changes"}, {"t": "20 Nov 15:25", "who": "anaya", "msg": "→ in_progress: A5: confirmed. Detection anchored to first chained aler g an issue", "acceptance": ["Every RT in SPEC v2 has a runnable test; no silent skips (root-only tests run as root in CI-style command)", "Each xfail names an open issue id; list attached to the issue summary for S4", "Full suite green under PYTHONHASHSEED 0, 1, 999"], "depends": ["B3-25", "B3-27", "B3-30", "B3-31", "B3-32"], "deliverable": "tests/redteam/", "summary": "Built the rogue slot (src/ks/runtime/rogue.py plus run.py wiring; CLI: rogue runs are monitored) and the harness tests/redteam/conftest.py. Added RT1-RT13 modules plus tests/redteam/test_rt12_epoch_fence.py (kabir's B3-49 attack cases). Xfails: none left. The three strict xfails (B3-50 ks score refused rogue runs, RT11a; B3-51 hold=0 contrast, RT10/D10; B3-52 crm did not apply bank-update tickets, RT9) were fixed by tara, who removed the markers (B3-50/52 done, B3-51 in review). Fixes in other people's modules: gateway/stub.py (the dispatcher released a suspended author's queued items; RT5 found it); verify/core.py (epoch fence now covers HOLD and suspended/revoked act_chain ancestors); monitor/detectors.py (nested cc/bcc fail closed). The last native failure was mine: rogue.py's report channel used json.dumps, which broke the single-serializer test. It now uses canonical dumps_line through a sanitizer (_plain: bytes become hex, floats/big ints/other types become repr). RT2 now checks for the canonical '\"kind\":\"done\"'. Docs: ADR-02 §6 (epoch fence, replay_mismatch exit 6), THREAT-MODEL RT13 row, SPEC §5 as-built map. Evidence: full container suite (root, so the per-agent-uid tests run) at PYTHONHASHSEED 0/1/999: 1058 passed, 1 skipped (test_cli:121 'runtime serves these now', not a red-team test), 0 xfail, each time. Native: 1046 passed, 12 skipped (container-only uid tests). One failure there, test_run_options field list, came from a concurrent with_baselines edit and passes after the 12:02 test update. make smoke: OK (anchored).", "review": "[kabir · done] Verified. Container redteam 82 passed (root); native 79 passed, 3 skipped (uid-only). Each test docstring names its THREAT-MODEL claim. Mutation check (bind-mounted copies, repo untouched): epoch fence off -> 9 RT12 epoch-fence tests fail; pii_egress off -> 6 RT10 cc/bcc tests fail (the F3 run passes because scope suspends first, as its docstring says); stub dispatcher re-check off -> RT5, RT12 persistence, RT10 F3 fail; outbox provenance (unrecorded_item) off -> no RT fails, but 4 tests in tests/gateway/test_outbox.py do (unit only, no THREAT-MODEL row, acceptable). GAP: witness link ack signature check off (link._ingest accepts any sig) -> nothing in the whole suite fails. Not reachable by an agent (path-less socketpair, witness uid), so it doesn't block. Follow-ups: RT3c refused-peer count (run.py:289), ADR-02 s6 + RT13 exit 6, cc/bcc nested test, B3-49 attack cases + HOLD + dead act_chain, RT9 Pass wording all done. CARRIED to S4 (not done): (1) score ttc is still null rather than {unavailable: reason} when no containment deny (score.py:190); needs the B3-51 schema enum. (2) New test: a bad-sig or mismatched witness ack makes WitnessLink.push return None and leaves newest unchanged.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "20 Nov 05:49", "who": "pmo", "msg": "→ todo: From kabir's B3-13 review: print the refused-peer count in the run summary as RT3c evidence (refused operator peers are in memory only; ADR-00 doesn't require recording them on c-0)."}, {"t": "20 Nov 06:27", "who": "pmo", "msg": "→ todo: From kabir's B3-47 review: document replay_mismatch / exit 6 (DIVERGED) in ADR-02 §6 and the RT13 row of THREAT-MODEL/red-team spec."}, {"t": "20 Nov 06:54", "who": "pmo", "msg": "→ todo: From kabir's B3-32 review: add a cc/bcc pii_egress test and check nested cc fields fail closed; F8 budget is a backstop only (barrier sends one frame per connection per tick; F8b deferred by CALL-02)."}, {"t": "20 Nov 09:13", "who": "pmo", "msg": "→ todo: From kabir's B3-49 review (non-bl .refusals is a Counter (counted, not stored), per-tick line budget MAX_SIGNER_LINES_PER_TICK=8, handle() returns None past it and the barrier closes that connection (tick stays bounded, other agents unaffected). S3: Gateway binds conn_id to the barrier's agent per tick; envelope agent_id != connection's agent -> deny/bad_sig (sig_ok False). S2: spawn.plan_agent_uids; as root --shared-uid runs agents under one unprivileged uid (60001), never 0; banner/K2/teardown follow. Tests in tests/panel/test_skel01_panel_fixes.py pass natively (M1, M2 x2, S3, uid plan). LINUX-ROOT-ONLY, UNEXECUTED (skipped on macOS): test_shared_uid_run_as_root_uses_one_unprivileged_uid. Also unexecuted until the container: tests/witness/test_witness.py::test_witness_file_owned_by_witness_uid_mode_0600_and_gateway_holds_no_fd (B3-08). Full suite: 506 passed, 6 skipped.", "review": "[kabir · done] Accept. M1: newest = highest-count signature-verified ack, late acks drained after the witness exits. The anchor is never newer than a verified witness line, and the test verifies anchored --head. M2: refusals is a Counter, an 8-line per-tick budget, the flooder is closed, the tick is bounded, other agents unaffected. Path-less socketpairs mean a rogue cannot open more connections. A non-reading rogue only drops replies (non-blocking send), with no stall. Memory is bounded: _sig_in is capped at MAX_FRAME_BYTES and each read is at most 64 KiB. S3: the check is in _sig_ok, before nonce/action consumption and before any state effect, and the deny is recorded (sig_ok False, conn_id). S2: plan_agent_uids never gives an agent uid 0, and K2 and teardown cover the shared uid. FOLLOW-UPS (non-blocking): (a) an oversize or no-LF signer partial is silently cleared, not counted or closed. A drip never spends budget and can keep the select loop busy until the deadline, so count it as a line or close it (parity with gw F8). (b) S3 fails open when conn_id has no binding (direct admit() outside tick()). Deny unbound non-system conns. UNEXECUTED: test_shared_uid_run_as_root_uses_one_unprivileged_uid is Linux-root-only. It must pass in the container before the wave's demo.", "log": [{"t": "19 Nov 11:38", "who": "maya", "msg": "opened"}, {"t": "19 Nov 16:28", "who": "arjun", "msg": "→ in_progress: start"}, {"t": "19 Nov 16:28", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 16:28", "who": "arjun", "msg": "→ in_review: ready"}, {"t": "19 Nov 16:30", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-37", "title": "Skeleton refactor before parallel build: Gateway.tick() seam, tool dispatch interface, RNG module", "sprint": 3, "track": "eng", "owner": "maya", "reviewer": "panel", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Barrier is I/O+timing only behind Gateway.tick(); tools dispatch via a world/state interface; RNG lives in ks.rng — so owners don't collide", "acceptance": ["runtime/barrier.py contains no admission/control/view/dispatch logic", "gateway has no TOOLS table; dispatch via interface implemented by world", "ks.world does not import ks.runtime; all tests green"], "depends": ["B3-01"], "deliverable": "src/ks/", "summary": "Done. (1) runtime/barrier.py is now I/O + timing only: it sends what Gateway.open(tick, agents) returns, collects frames with deadlines and signer I/O, calls Gateway.tick(tick, [InFrame]) -> [(conn_id, ReplyFrame)], then does the sends, the K-miss/oversize close and the witness push. Epoch/view, admission and dispatch, plus agent_id ordering, now live in the gateway. TickBarrier no longer takes epochs. (2) gateway/stub.py has no TOOLS table. The new ks.gateway.dispatch defines the ToolDispatcher protocol (classify(env)->ActionClass, execute(env, txn)->Execution(result, read_set, write_set); StateTxn placeholder, None until ks.state is wired), and the record now carries read/write sets from Execution. ks.world.tools.SkeletonDispatcher implements it, and run.py wires it in. Gateway(..., dispatcher=) is a required kwarg. (3) RNG moved to ks.rng; runtime/rng.py is deleted, and world/skeleton and agent_template import ks.rng. ks.world never imports ks.runtime. src/ks/ARCHITECTURE.md maps module -> owner -> interface. New tests/skeleton/test_boundaries.py (5 tests) checks the seams: barrier AST, no TOOLS, world imports, rng location, Gateway.tick ordering and dispatch. Behaviour unchanged: ks run (seed 7, 3 agents, 6 ticks) + ks verify --head gives OK and anchored, and the suite is 462 passed. ks.state was not touched. Note: running pytest at the same time as another ks run fails intermittently with K2 'processes already run under uids 60000..' because uids are shared on this machine; this is environmental and was there before.", "review": "[panel · done] All 3 acceptance items met. Checked: barrier.py has no admission/control/view/dispatch (only frame length/LF for oversize close, which is I/O); no TOOLS anywhere in ks.gateway; ks.world has no static import of ks.runtime, and importing ks.world.tools/skeleton loads no ks.runtime module at runtime either. Boundary tests are real (relative and 'from ks import runtime' forms resolve), but static-only. On Mac: boundaries+units 8/8; full suite 445 pass, 2 fail + 11 errors are all dlsym prctl (Linux-only). Carried items, to fix before wave-3 merges: (1) Execution.read_set/write_set come from the dispatcher, so they are self-reported, which contradicts dispatch.py's own docstring. B3-06 acceptance bakes this in. Gateway must take the sets from txn, or cross-check against it. (2) There is no outbox field on Execution, but B3-06 I1 tools need one: add outbox=() now, or tara and nisha both edit dispatch.py. (3) There is no view seam: Gateway.open has view=() and B3-05 has nowhere to plug in. Add a ViewProvider to the protocol. (4) B3-09 hooks, B3-04 txn and nisha all edit Gateway.admit around execute(env, None), so sequence those. (5) Nit: barrier imports TickFrame but never uses it, and the AST test misses it because it only checks Name "nisha", "msg": "→ in_progress"}, {"t": "19 Nov 12:22", "who": "nisha", "msg": "posted result summary"}, {"t": "19 Nov 12:22", "who": "nisha", "msg": "→ in_review"}, {"t": "19 Nov 16:01", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-39", "title": "Run on Mac: Dockerfile + one-command demo (Apple Silicon + x86)", "sprint": 3, "track": "eng", "owner": "ishaan", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Aarav can run the real demo on his Mac via Docker Desktop/OrbStack with full per-agent isolation", "acceptance": ["multi-arch Dockerfile (python:3.13-slim) runs as root inside the container so per-agent uids work; no network needed at runtime", "make demo / scripts/demo.sh: build + ks run --fault F2+ --pause-at --step with run dir on a bind mount", "README section 'Run on macOS' incl. degraded native mode warning", "CI-style smoke test: container run + ks verify exits OK"], "depends": [], "deliverable": "Dockerfile", "summary": "Fixes: prctl/oom/proc guarded to Linux in spawn.py (BOOT, set_nondumpable, set_oom_score_adj, pids_with_uids); run.py forces degraded off Linux, so native verify reports isolation=degraded, attribution VOID, exit 0. Full suite native: 458 pass, 4 skip (need root). Added make smoke (UNEXECUTED: docker/OrbStack not installed). Base pinned python:3.13.1-slim-bookworm (tag not pulled/verified, no digest). Dockerfile wording now credits per-agent uids. README notes rundir.py chown-to-60000 bind-mount risk as untested. demo.sh hero-path switch (F2+) left as TODO.", "review": "[kabir · changes] Static review only: Docker is not installed on Aarav's Mac, so the image has never been built or run anywhere. (1) BLOCKER, README claim false: native 'degraded mode' crashes, it does not warn. src/ks/runtime/run.py calls set_nondumpable() unconditionally, and spawn.py set_nondumpable/BOOT call ctypes.CDLL(None).prctl, which does not exist on Darwin -> AttributeError. Reproduced with 'ks run --shared-uid'
