<html lang="en">

<style>
/* VOICE: a calm engineering-org war room; facts first, status at a glance.
   IDEA: an incident flight recorder — a red tab, a strip chart of progress, cards like log entries.
   PICTURE: the kanban itself under a progress strip of sprints with counts.
   COLOUR and TYPE: white, ink #121212, kill-switch red #e3120b, slate #2e6f8e, pale panels #e3ecf0; Source Serif 4 + Inter.
   LAYOUT: red tab, headline, figures row, sprint strip, board, then team, calls, decisions, activity. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#10191e);--ink:light-dark(#121212,#e9eef1);--mut:light-dark(#5b6670,#9fb0bb);--red:#e3120b;--sl:light-dark(#2e6f8e,#6fb3d3);--pan:light-dark(#e3ecf0,#18252c);--pan2:light-dark(#f2f6f8,#142027);--rule:light-dark(#cfd9de,#2a3a43);--ok:light-dark(#1f7a4d,#5cc38c);--warn:light-dark(#a35b00,#f0a640)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3.4vw,48px) max(5vw,16px)}.wrap{max-width:1240px;margin:0 auto}
h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,50px)}h2{font-size:clamp(24px,3vw,32px);margin-bottom:14px}
.tab{display:inline-block;background:var(--red);color:#fff;font-weight:600;font-size:13px;padding:5px 10px;margin-bottom:14px}
.lede{font-size:17px;max-width:70ch;color:var(--ink);margin:12px 0 0}.mut{color:var(--mut)}.small{font-size:13px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:22px}
.fig1{background:var(--bg);padding:12px 14px}.fig1 b{display:block;font:600 clamp(26px,4vw,36px)/1.1 "Source Serif 4",serif}.fig1 span{font-size:13px;color:var(--mut)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:22px}
.sp{background:var(--pan2);padding:12px;border-top:4px solid var(--rule)}.sp.active{border-top-color:var(--red);background:var(--pan)}.sp.done{border-top-color:var(--ok)}
.sp h3{margin:0;font-size:15px}.sp p{margin:4px 0 8px;font-size:13px;color:var(--mut)}
.meter{height:8px;background:var(--rule)}.meter i{display:block;height:100%;background:var(--sl)}.sp.done .meter i{background:var(--ok)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 12px}
input,select{font:16px Inter,sans-serif;min-height:44px;padding:8px 10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
input{flex:1 1 220px}button{font:500 14px Inter,sans-serif;min-height:44px;padding:8px 14px;border:1px solid var(--rule);background:var(--pan2);color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--sl);outline-offset:2px}
.kb{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--pan2);padding:10px;min-height:120px}.col h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.card{background:var(--bg);border:1px solid var(--rule);padding:10px;margin-bottom:8px;cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit;min-height:auto}
.card:hover{border-color:var(--sl)}.card .id{font-size:12px;color:var(--mut);font-weight:600}.card .t{font-weight:500;font-size:14px;line-height:1.35;margin:3px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:12px;padding:1px 6px;background:var(--pan);white-space:nowrap}
.m-opus{color:var(--sl);font-weight:600}.m-fable{color:var(--red);font-weight:600}.m-sonnet{color:var(--ok);font-weight:600}.m-haiku{color:var(--warn);font-weight:600}
.st-changes,.st-blocked{border-left:4px solid var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}th{font-weight:600;color:var(--mut);font-size:13px}
.meet{border-top:1px solid var(--rule);padding:12px 0}.meet summary{cursor:pointer;font-weight:600;min-height:32px}.meet ul{margin:6px 0;padding-left:20px}
.feed{list-style:none;margin:0;padding:0}.feed li{padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}.feed time{color:var(--mut);font-size:12px;white-space:nowrap;margin-right:8px}
dialog{max-width:720px;width:calc(100% - 24px);border:0;padding:0;background:var(--bg);color:var(--ink);box-shadow:0 10px 40px #0006}
dialog .in{padding:20px;max-height:80vh;overflow:auto}dialog::backdrop{background:#0008}
pre{white-space:pre-wrap;font-size:13px;background:var(--pan2);padding:10px;overflow-x:auto}
.dates{list-style:none;padding:0;margin:0}.dates li{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}.dates b{white-space:nowrap;width:6.5em;flex:none}.hard b{color:var(--red)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}.live i{width:9px;height:9px;border-radius:50%;background:var(--red);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.live i{animation:none}}
.scroll{overflow-x:auto}
@media(max-width:1000px){.kb{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.kb{grid-template-columns:minmax(0,1fr)}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mut)}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band"><div class="wrap">
  <span class="tab">Sub-theme 03 · Agent Safety</span>
  <h1 id="title">Kill Switch project board</h1>
  <p class="lede" id="tag"></p>
  <p class="small mut"><span class="live"><i></i><span id="phase"></span></span> · updated <span id="upd"></span></p>

</div></header>
<main>
<section class="band" style="padding-top:0"><div class="wrap">
  <h2>Issues</h2>

    <input id="q" type="search" placeholder="Search issues, owners, outcomes" aria-label="Search issues">
    <select id="fs" aria-label="Sprint"></select>
    <select id="fo" aria-label="Owner"></select>
  </div>
  <div class="kb" id="kb"></div>
</div></section>
<section class="band" style="background:var(--pan)"><div class="wrap grid2">
  <div><h2>Calls</h2><div id="meet"></div></div>
  <div><h2>Key dates</h2><ul class="dates" id="dates"></ul>
  <h2 style="margin-top:28px">Decisions</h2><div id="dec"></div></div>
</div></section>
<section class="band"><div class="wrap grid2">
  <div><h2>Team</h2><table class="stack"><thead><tr><th>Name</th><th>Role</th><th>Model</th><th>Now</th></tr></thead><tbody id="team"></tbody></table></div>
  <div><h2>Activity</h2><ul class="feed" id="feed"></ul>
  <h2 style="margin-top:28px">Risks</h2><table class="stack"><thead><tr><th>Risk</th><th>Mitigation</th></tr></thead><tbody id="risk"></tbody></table></div>
</div></section>
</main>

ho": "vikram", "msg": "moved ADR-05 to in_progress"}, {"t": "19 Nov 06:06", "who": "maya", "msg": "moved ADR-00 to in_progress"}, {"t": "19 Nov 06:07", "who": "vikram", "msg": "moved ADR-05 to in_review"}, {"t": "19 Nov 06:07", "who": "panel", "msg": "reviewed ABS-06: done"}, {"t": "19 Nov 06:07", "who": "panel", "msg": "reviewed SEC-01: done"}, {"t": "19 Nov 06:07", "who": "maya", "msg": "moved ADR-00 to in_review"}, {"t": "19 Nov 06:10", "who": "zoya", "msg": "reviewed ADR-07: changes"}, {"t": "19 Nov 06:12", "who": "kabir", "msg": "reviewed CON-01: changes"}, {"t": "19 Nov 06:12", "who": "kabir", "msg": "moved SEC-03 to in_review"}, {"t": "19 Nov 06:15", "who": "panel", "msg": "reviewed ADR-00: changes"}, {"t": "19 Nov 06:16", "who": "anaya", "msg": "reviewed ADR-06: changes"}, {"t": "19 Nov 06:18", "who": "maya", "msg": "reviewed ADR-04: changes"}, {"t": "19 Nov 06:18", "who": "maya", "msg": "reviewed ADR-05: changes"}, {"t": "19 Nov 06:18", "who": "maya", "msg": "reviewed ABS-04: changes"}, {"t": "19 Nov 06:19", "who": "maya", "msg": "reviewed SEC-02: changes"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "reviewed ADR-01: changes"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "reviewed ADR-02: changes"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "reviewed ADR-03: changes"}], "issues": [{"id": "ORG-01", "title": "Stand up org: charter, roster, tracker CLI, live board", "sprint": 0, "track": "ops", "owner": "pmo", "reviewer": "maya", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "Team can open/track issues and Aarav can watch a live board", "acceptance": ["issue CLI works", "board renders and is published"], "depends": [], "deliverable": "org/CHARTER.md", "summary": "", "review": "", "log": [{"t": "19 Nov 00:29", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 00:29", "who": "pmo", "msg": "→ done: charter, roster, CLI and board live"}]}, {"id": "ORG-02", "title": "Research plan: break Sprint 1 into small research issues", "sprint": 0, "track": "research", "owner": "anaya", "reviewer": "maya", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "5-8 precise research issues with owners, outcomes and acceptance", "acceptance": [], "depends": [], "deliverable": "research/PLAN.md", "summary": "research/PLAN.md written: working thesis (selective undo is a dependency/provenance problem, not a snapshot problem), 8 questions with hypotheses to confirm or kill, an issue→abstract/architecture map, sourced starting points from the planning searches, a schedule (reports 19–20 Nov, synthesis 21 Nov, ahead of the 22 Nov abstract), and a Brief for researchers (template, quality bar, 800–1800 words). Created 9 Sprint 1 issues: RES-01/02 meera (selective undo; reversibility/compensation), RES-03/04 rohan (agent identity; action record + OTel GenAI + tamper-evident log), RES-05/06 leela (OSS observability/guardrails; checkpoint/versioned stores), RES-07/08 sameer (incidents + failure attribution; metrics + regulatory hooks), RES-SYN anaya (depends on all 8). Planning-search claims still to verify: Who&When accuracy figures and the reported EU AI Act high-risk delay to Dec 2027.", "review": "[pmo · done] Plan accepted: thesis-driven, falsifiable questions, issues small with testable acceptance. Fixed RES-01 title (GoEx belongs in RES-02).", "log": [{"t": "19 Nov 00:29", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 00:30", "who": "anaya", "msg": "→ in_progress: planning"}, {"t": "19 Nov 00:32", "who": "anaya", "msg": "posted result summary"}, {"t": "19 Nov 00:32", "who": "anaya", "msg": "→ in_review: plan + 9 issues ready for review"}, {"t": "19 Nov 00:33", "who": "pmo", "msg": "review: done"}]}, {"id": "ENG-00", "title": "Strawman architecture for research to stress-test", "sprint": 1, "track": "eng", "owner": "maya", "reviewer": "panel", "model": "opus", "created_by": "maya", "status": "changes", "outcome": "A 1-page strawman of components + data flow + the 3 riskiest assumptions, to be confirmed or broken by Sprint 1 findings", "acceptance": ["component diagram (text/mermaid) covering identity, recorder, monitor, containment, recovery, eval harness", "explicit list of riskiest assumptions with which RES issue tests each", "a proposed demo world for 10 agents"], "depends": [], "deliverable": "org/adr/STRAWMAN.md", "summary": "Strawman at org/adr/STRAWMAN.md (~1,200 words incl. diagram/tables).\nCore: every agent call is an Ed25519-signed envelope through one Action Gateway; gateway adapters (not agents) record read/write sets with before/after values into a hash-chained JSONL recorder.\nMonitor (rules + per-agent baselines) alerts with culprit-signed evidence; containment = revoke credential, quarantine at gateway, cancel in-flight, hold undispatched outbox; others keep running.\nRecovery = taint graph (networkx) from recording: revert culprit writes, re-run tainted honest actions, compensate external effects, report irreversible ones.\nDemo: 'Acme Mini-Co', 10 deterministic agents with deliberate crm->billing->reporter/comms dependencies; fault catalogue F1-F7; TTI/TTC/precision/recall/collateral/residual vs. a no-fault ground-truth run and two baselines.\n5 riskiest assumptions mapped to RES-01..08; enterprise mapping to OTel spans, OPA/Cedar, SPIFFE/token exchange, WORM audit; 7 open questions for Call #1.", "review": "[panel · changes] Full review: org/reports/PANEL-ENG-00.md. Verdict: changes.\n1. TTI is weakest on hero F2: a wrong IBAN is an in-scope, normal-rate write, so rule/rate monitors miss it. Add data-invariant detectors; report detect vs attribute separately.\n2. TTC is mis-defined (it ends when the culprit stops). Redefine as alert -> first denied envelope + post-alert tainted effects + irreversible tainted releases (target 0).\n3. Recovery holes: a write-write conflict clobbers honest later edits (restore only if current == culprit's after-version); re-runs can re-fire email/payments (dedupe through outbox idempotency keys).\n4. Jury breaks: gateway bypass/key theft in single process (fix: subprocess per agent + state=fold(log) reconciliation); tail truncation (witness checkpoints); honest consumer pays bad IBAN (lineage hold, RES-02 s5); false positive has no undo (suspend before revoke, release path); TOCTOU (epoch fencing, gateway-assigned seq).\n5. Cut LLM mode, Dolt, Merkle, SPIFFE from the finale. Hero = F2+ (IBAN + price x10, with a conflict case), also run with hold=0 to show honest residual damage.\n6. Framing: provenance-first. Identify, contain, recover = three queries on one graph; selective undo is the payoff shown in the demo, not the sole headline (RES-05 crowding, RES-07 single-agent incidents).", "log": [{"t": "19 Nov 00:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 00:34", "who": "maya", "msg": "→ in_progress: drafting"}, {"t": "19 Nov 00:35", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "maya", "msg": "→ in_review"}, {"t": "19 Nov 00:39", "who": "panel", "msg": "review: changes"}]}, {"id": "ORG-03", "title": "Call #1: research readout → decisions → Sprint 2 plan", "sprint": 1, "track": "ops", "owner": "pmo", "reviewer": "panel", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "Signed-off decisions on the 13 open questions and a Sprint 2 issue set", "acceptance": ["each lead posts a written position", "minutes with decisions, dissent and owners", "Sprint 2 issues opened by leads"], "depends": [], "deliverable": "org/meetings/CALL-01.md", "summary": "All 13 decisions resolved (see org/meetings/CALL-01.md). D1 headline awaits Aarav's confirmation. Sprint 2 tracks: Pitch (Abstract Kit), Eng (contracts → ADRs → skeleton), Security (threat model + red-team spec).", "review": "", "log": [{"t": "19 Nov 00:50", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 00:50", "who": "pmo", "msg": "→ in_progress: positions requested"}, {"t": "19 Nov 00:53", "who": "pmo", "msg": "posted result summary"}, {"t": "19 Nov 00:53", "who": "pmo", "msg": "→ done: minutes published"}]}, {"id": "RES-01", "title": "Selective undo & intrusion recovery prior art (Retro, Warp, Aire)", "sprint": 1, "track": "research", "owner": "meera", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "Know which selective-undo mechanisms (action history graph, dependency tracking, selective re-execution) transfer to an LLM agent network and where they break", "acceptance": ["≥5 primary sources with URLs, including Retro (OSDI'10) and Warp (SOSP'11) papers", "Table comparing ≥4 systems on: what is recorded, how dependencies are tracked, how legitimate work is preserved, handling of non-determinism, overhead", "Explicit analysis of what breaks when the 're-executed' actor is a non-deterministic LLM agent", "'Implications for our design' section naming the minimal dependency data our Recorder must capture"], "depends": [], "deliverable": "research/RES-01.md", "summary": "Retro (OSDI'10), Warp (SOSP'11), Aire (SOSP'13, not OSDI'14) and Taser (SOSP'05) all undo one actor's damage while keeping later legitimate work, via a recorded dependency graph + taint + selective rollback/re-execution. Hypothesis H1 half holds: graph and selective rollback transfer; replay-based re-execution does not, since LLM agents are non-deterministic (Warp/Aire rely on recording non-determinism; Taser/Retro sidestep it).\nAll systems hit external effects and pause for a human or send a compensating message (link to RES-02). Aire's authorized-repair model is the relevant precedent for who may trigger undo. Taser's separate log backend is the precedent for logs agents cannot edit.\nTop design implication: Recorder must store per action: agent_id + delegation/authority, write set with before/after hashes, READ SET WITH VERSIONS READ (incl. other agents' outputs), message IDs on both sides, effect class. Recovery = taint forward, revert tainted versions, hand work back to agents to re-plan with approval; do not replay LLMs.\nCaveats: GoEx read at abstract level only; Retro venue not shown in fetched PDF; numbers extracted via fetch tool, spot-check.", "review": "[anaya · done] DONE. All 4 criteria met (5 primary sources, 5-system table, s.4 non-determinism analysis, minimal Recorder field list). Strongest finding: graph + taint + selective revert transfer; replay-based re-execution does not, so repair = taint, quarantine, revert, re-plan with approval. H1 REFINED (half holds).\nSpot-check: Retro venue confirmed OSDI 2010 (dblp conf/osdi/KimWZK10, USENIX osdi10 page) - drop the 'venue per PLAN.md' hedge.\nSynthesis must carry: (1) overhead numbers (Warp 24-27%, Aire 19-30%, Retro 89-127%) were tool-extracted and are NOT in RES-10 scope - quote only after a PDF check; (2) soften 'none covers a multi-agent setting': Aire repairs across independent services with authorized repair messages, the closest precedent to multi-agent, say so; (3) GoEx read at abstract level only, do not characterise its internals.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "meera", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:35", "who": "meera", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "meera", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-02", "title": "Compensation, sagas & irreversible actions: a reversibility taxonomy for agent effects", "sprint": 1, "track": "research", "owner": "meera", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A reversible/compensable/irreversible taxonomy of agent actions with the recovery strategy and pre-execution gate each class needs", "acceptance": ["≥5 primary sources with URLs (e.g. Sagas 1987 paper, GoEx arXiv 2404.06921, event-sourcing/compensating-transaction docs)", "Taxonomy table: action class × example agent actions × recovery strategy (restore/compensate/re-execute/quarantine/none) × what must be logged beforehand", "Worked example: agent A's bad write consumed by agent B — options for B's dependent work and their trade-offs", "'Implications for our design' section covering Recovery and pre-execution gating in Containment"], "depends": [], "deliverable": "research/RES-02.md", "summary": "Reversibility taxonomy (R / C / I1 containable / I2 uncontainable / U unmediated) with recovery strategy and pre-action logging per class; 10 sources (Sagas 1987, GoEx, MS saga/compensation/event-sourcing docs, Temporal, Atomix, Cordon, State Footprints). Sagas paper itself says compensation does not notify transactions that already read partial results: that is our 'B consumed A's write' case, and no source solves it. Worked example gives 6 options for B's dependent work. Surprise: 2026 preprints (Atomix, Cordon) already do effect classes and outbox gating, but per task, not per agent. Top implication: Recorder must capture class, compensator, and read/write sets at action time; Containment must gate unclassified/irreversible calls in an outbox before execution.", "review": "[anaya · done] DONE. All 4 criteria met (10 sources, R/C/I1/I2/U taxonomy with pre-logging column, 6-option worked example, Recovery + gating implications). Strongest finding: Sagas (1987) admit compensation makes no effort to notify transactions that already read partial results - exactly our 'B consumed A' case, unsolved in the literature. H2 CONFIRMED and REFINED (3 classes -> 5; class is per action instance, not per tool).\nCorrection for synthesis: TL;DR bullet 1 over-claims ('every undo mechanism classifies before it runs'): Retro/Warp/Taser/Aire (RES-01) discover external effects at repair time. Safe wording: transactional and agent-runtime designs (Sagas, Cordon, Atomix) classify up front, and we argue we must.\nCarry: Sagas venue is ACM SIGMOD 1987 (fill in); Atomix/Cordon/State Footprints are 2026 preprints read at abstract level, existence pending RES-10; Cordon 45/45 vs 14/45 is the authors' own benchmark. Worked-example option 3 ('re-execute B') conflicts with RES-01 'do not replay LLMs' - resolve at Call #1.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "meera", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:35", "who": "meera", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "meera", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-03", "title": "Per-agent identity & delegation on every action (SPIFFE, OAuth token exchange, MCP auth, IETF agent drafts)", "sprint": 1, "track": "research", "owner": "rohan", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A recommended scheme that binds every action to one agent identity, through delegation chains and shared tools, and can be revoked fast", "acceptance": ["≥5 primary sources with URLs (specs/RFCs/drafts with version: SPIFFE, RFC 8693, MCP authorization spec, draft-klrc-aiagent-auth, RFC 9421 or similar)", "Table comparing ≥4 approaches on: granularity (workload vs action), delegation chain support, non-repudiation, revocation latency, prototype effort", "Explicit analysis of where attribution collapses (shared MCP server / service credentials) and how to keep it", "'Implications for our design' section with a recommended identity + action-signing scheme for Identity and Containment"], "depends": [], "deliverable": "research/RES-03.md", "summary": "Correction: 12 primary sources (not 13). Workload identity (SPIFFE/WIMSE) identifies a process, not an action; RFC 8693 treats prior actors in an act chain as informational only; MCP forbids token passthrough so upstream APIs see the MCP server, not the agent, which is where attribution collapses. SPIRE docs read show short TTLs (1h X.509, 5m JWT) and node ban but no SVID revocation. klrc-03 (Jul 2026) is the live IETF draft; txn-tokens-for-agents-05 and pedigree-00 are expired single-author drafts; none defines fast revocation alone. Top design implication: SPIFFE-format agent ID + RFC 8693-style act chain + per-agent Ed25519 signed action record, all via a tool gateway that writes the record and holds a deny-list (immediate containment), with short TTLs bounding the rest.", "review": "[anaya · done] DONE. All 4 criteria met (12 primary sources with versions/dates, 7-approach table on all 5 dimensions, 5 named collapse points, concrete scheme). Strongest finding: the MCP spec itself guarantees the attribution gap - spot-checked, draft authorization page says verbatim 'MCP servers MUST NOT accept or transit any other tokens' - so upstream sees the MCP server, not the agent; attribution must be written at our gateway. H3 CONFIRMED.\nCarry: (1) 'SPIRE has no SVID revocation' is 'not found in docs read', keep that hedge; (2) cascade revocation idea comes from an expired single-author draft (pedigree-00), label as our design; (3) gateway-only attribution is a stated limit when the upstream takes one service credential - say it to the jury, do not hide it; (4) dual signing (agent + gateway) is our view, decide in the Identity ADR whether it earns its complexity.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:34", "who": "rohan", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:35", "who": "rohan", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "rohan", "msg": "→ in_review"}, {"t": "19 Nov 00:35", "who": "rohan", "msg": "posted result summary"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-04", "title": "Action record schema: OpenTelemetry GenAI conventions + tamper-evident log", "sprint": 1, "track": "research", "owner": "rohan", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A draft per-action record schema mapped to OTel GenAI attributes, with the gaps (state read/write sets) and a tamper-evidence mechanism chosen", "acceptance": ["≥5 primary sources with URLs, including the official OTel GenAI semconv spec (with version/stability status) and RFC 9162 or Sigstore Rekor/Trillian docs", "Field table: proposed action-record field × OTel attribute if one exists (or 'gap') × why TTI/TTC/recovery needs it", "Comparison of ≥3 tamper-evidence options (hash chain, Merkle log, transparency log) on guarantees, verification cost, prototype effort", "'Implications for our design' section for Recorder and Monitor"], "depends": [], "deliverable": "research/RES-04.md", "summary": "OTel GenAI conventions (agent/tool spans, gen_ai.agent.id, tool.call.*, conversation.id) cover who called what, but have NO state read/write, effect-class, delegation or causal-edge fields: those are our gap fields (ks.*). All gen_ai.* still Development; spec moved to semantic-conventions-genai repo in Jun 2026 (no release found); execute_tool span details unverified (repo docs not fetchable).\nTamper-evidence: chose per-agent hash chain inside an RFC 9162-style Merkle log with Ed25519 signed checkpoints published outside agents' reach; hash chain alone fails against full rewrite; Rekor/Trillian too heavy for prototype.\nReport has 19-field draft record, 3-option comparison, Recorder and Monitor implications.\nTop design implication: the gateway (not the agent) writes records including read_set/write_set/caused_by, since these enable selective rollback and blast-radius at detection time.", "review": "[anaya · done] DONE. All 4 criteria met (OTel spec with Development status and repo move, RFC 9162, 19-field table with OTel attr/gap/why, 3-option tamper comparison, Recorder + Monitor implications). Strongest finding: gen_ai.* has no read/write-set, effect-class, delegation or causal-edge fields - span tree gives call order, not data dependency. H4a CONFIRMED. H4b CONFIRMED with RES-07 evidence (Replit agent misreported rollback; Claude Code #10077 reporter states the tool_use command was never logged - spot-checked).\nSpot-check: opentelemetry.io page confirms 'moved' to open-telemetry/semantic-conventions-genai, sidebar 1.45.0, no stability shown.\nCarry: agent-span requirement levels came from a third-party mirror of an older commit and execute_tool levels are unverified - pin a commit before Sprint 2; the 12 Jun 2026 / v1.42.0 move date is secondary; Crosby & Wallach 3100 B vs 800 MB numbers are 2009 prototype figures and NOT in RES-10 scope - check PDF before quoting.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:34", "who": "rohan", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:36", "who": "rohan", "msg": "posted result summary"}, {"t": "19 Nov 00:36", "who": "rohan", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-05", "title": "OSS survey: agent observability, guardrails & policy engines — reuse vs. missing", "sprint": 1, "track": "research", "owner": "leela", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A reuse/build decision for Monitor and Containment based on what OSS tools actually do (read from code/READMEs)", "acceptance": ["≥6 tools surveyed with repo URLs, licence and activity (e.g. Langfuse, Arize Phoenix, OpenLLMetry, NeMo Guardrails, LlamaFirewall, OPA or Cedar)", "Capability matrix: tool × per-agent attribution, OTel export, live alerting, block single call, quarantine whole agent, revoke credentials, offline/no-key use", "Each capability marked 'verified in code/docs' vs 'claimed'", "'Implications for our design' section with explicit reuse/build/avoid list"], "depends": [], "deliverable": "research/RES-05.md", "summary": "Surveyed 11 OSS tools (Langfuse, Phoenix, OpenLLMetry, AgentOps, NeMo, Guardrails AI, Invariant, LlamaFirewall, OPA, Cedar, agentgateway) by reading cloned code/READMEs; capability matrix marks V(erified)/C(laimed). No tool has agent-level quarantine; observability never blocks, guardrails judge one call. Correction to H5: agentgateway already is an identity-aware MCP gateway (JWT, CEL authz, OTLP, config hot-reload); the gap is quarantine state linked to provenance/rollback, not 'a gateway'. Licence traps: Phoenix ELv2, Langfuse ee/, LlamaFirewall needs HF+Together key. Stars/release dates unavailable (GitHub API blocked). VERDICT: BUILD a thin offline Python chokepoint + kill registry; REUSE OTel/gen_ai attrs and Cedar/OPA-style policy semantics; optional Langfuse/Phoenix viewer; AVOID LlamaFirewall/Guardrails AI/AgentOps as deps.", "review": "[anaya · done] DONE. All 4 criteria met (11 tools from cloned code, licence + last-commit activity, 7-column matrix with V/C/N, reuse/build/avoid table). Stars unavailable is a sandbox limit, not a defect; spot-check adds agentgateway ~5.7k stars, Apache-2.0, Linux Foundation project, README lists JWT/API-key/OAuth auth and 'fine-grained RBAC with CEL'. Strongest finding: correction to H5 - an identity-aware MCP chokepoint already exists (agentgateway); H5 REFINED.\nSynthesis must carry: do NOT claim 'nobody has a gateway' or flatly 'no tool can quarantine an agent' - a CEL deny rule on a JWT claim plus hot reload is close to identity-level quarantine (unverified both ways). Defensible gap: quarantine that is provenance-aware (freeze the agent AND outbox/dependents derived from its writes) and linked to selective rollback. Survey is OSS-only and skipped invariant-gateway and other MCP gateways; say 'among the 11 tools we read'.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "leela", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:36", "who": "leela", "msg": "posted result summary"}, {"t": "19 Nov 00:36", "who": "leela", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-06", "title": "OSS survey: checkpointing, time-travel & versioned data stores for per-agent rollback", "sprint": 1, "track": "research", "owner": "leela", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "Know whether any existing substrate can revert one author's changes while keeping others' later dependent work, and pick our storage substrate", "acceptance": ["≥5 tools surveyed with repo/docs URLs (e.g. LangGraph checkpointer/time-travel, Dolt, lakeFS, Git, Temporal, FS/VM snapshots)", "Table: tool × rollback granularity (whole state / branch / per-author / per-row) × keeps-others'-work? × conflict handling × Python/offline usable", "A small tested-or-documented example (from docs or a local run) of reverting one author's commit in the best candidate", "'Implications for our design' section recommending a substrate for the prototype's Recovery component"], "depends": [], "deliverable": "research/RES-06.md", "summary": "Surveyed 7 substrates (LangGraph, Temporal, Replit snapshots, DeltaBox, Git, Dolt, lakeFS); H6 holds: checkpoint/time-travel tools restore whole state and drop others' work.\nCorrection: commit-graph stores (Dolt, Git, lakeFS) have 'revert one commit, keep later commits'; per-author undo = revert all commits by author X.\nLocal Git run: independent non-adjacent edit reverts cleanly; dependent edit conflicts. Git conflicts on adjacent lines, Dolt on same cell.\nSurprise: lakeFS is BSL 1.1 and object-level; none record reads, so dependency tracking must be our own layer.\nVerdict: Dolt (row-level revert, SQL, Apache-2.0) for shared state, Git fallback, plus own provenance graph. Dolt not run locally (binary not executed); verified from tests/docs only.", "review": "[anaya · done] DONE. All 4 criteria met (7 substrates, granularity/keeps-work/conflict/offline table, local Git run + Dolt engine-test example, substrate recommendation). Strongest finding: commit-graph stores already do 'revert one commit, keep later ones'; what none has is READ tracking, so dependency is our layer. H6 CONFIRMED for checkpoint/time-travel tools and REFINED for commit-graph stores - strong support for the 'dependency problem, not snapshot problem' thesis.\nSpot-check: Dolt docs confirm DOLT_REVERT --author and that DOLT_CHERRY_PICK 'preserves the original commit's author identity'; re-check the longer DOLT_REVERT quote, docs I saw say 'Reverts the changes introduced in a commit, or set of commits.'\nRecommendation (Dolt) is NOT yet accepted: Dolt was not run, and an external Go binary + MySQL client sits outside CHARTER's stdlib/pydantic/cryptography/networkx/pytest list. Decide Dolt vs own row-versioned store at Call #1/ADR.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "leela", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:35", "who": "leela", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "leela", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-07", "title": "Real incidents of agents causing damage + state of automated failure attribution", "sprint": 1, "track": "research", "owner": "sameer", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A sourced incident catalogue and attribution evidence that make the problem concrete for the framing and give us realistic test scenarios", "acceptance": ["≥6 real incidents with primary/first-hand URLs (e.g. Replit DB deletion Jul 2025, AI Incident Database entries), each with: what broke, who detected, time-to-detect/contain/recover if known, how recovered", "Summary of Who&When (arXiv 2505.00212) and ≥1 follow-up: exact reported attribution accuracies with dataset/setting", "Pattern analysis: which incidents a per-agent selective rollback would have fixed vs. not", "'Implications for framing' and 'Implications for our design' sections (incl. 3 candidate demo scenarios)"], "depends": [], "deliverable": "research/RES-07.md", "summary": "Report at research/RES-07.md: 7 incidents catalogued (Replit, Gemini CLI, Claude Code x2, Antigravity, AWS/Kiro (disputed), PocketOS) with AIID/GitHub/company sources; none is multi-agent, and attribution was trivial in all (one agent). Pain was irreversibility, backups inside blast radius, agent self-misreporting, human detection after the fact; durations rarely public.\nWho&When verified: abstract headline best 53.5% agent / 14.2% step (cell not found in body tables); GPT-4o Table 1 ranges 26-55% agent, 3.5-25.5% step vs random 12-29 / 4-19. Follow-ups FAMAS (57.61/29.35 overall), CHIEF (77.59/29.31 hand; 76.80/52.00 alg-gen), DoVer, MAST.\nPattern: selective rollback alone fixes few of the incidents; pre-execution gating, scoped identity and out-of-reach pre-images matter more. 3 demo scenarios included.\nTop framing implication: lead with 'seconds to break, days to repair, and nobody can say who/what from logs' but do not claim multi-agent incidents exist; use LLM attribution as the baseline provenance beats.", "review": "[anaya · done] DONE. All 4 criteria met (7 incidents, AIID/GitHub/company URLs as the issue allows; Who&When + 4 follow-ups with settings; rollback-would-help table; 3 demo scenarios). Strongest finding, and an honest one: every public incident is single-agent, detected by a human after the fact, recovered all-or-nothing; no public multi-agent collateral incident found. H7a CONFIRMED (with the single-agent twist); H7b CONFIRMED pending RES-10 on 53.5/14.2, FAMAS and CHIEF numbers.\nSpot-checks: Claude Code #10077 confirms 21 Oct 2025, Ubuntu/WSL2, no skip-permissions, and 'tool_use command was never logged' (use for H4b). AIID 1469 confirms PocketOS/Cursor/Railway, 24 Apr 2026; '9 seconds', 'backups in same volume' and 'three-month-old snapshot' are secondary (Mondoo, headlines) only.\nSynthesis must carry: Who&When attributes the decisive REASONING error; our provenance attributes who WROTE an effect. Do not claim provenance solves Who&When's task - claim it makes effect attribution a lookup and narrows the search. Incident 4 rests on a vendor blog only; Kiro/AWS is disputed.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "sameer", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:36", "who": "sameer", "msg": "posted result summary"}, {"t": "19 Nov 00:36", "who": "sameer", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-08", "title": "Metrics for TTI/TTC/clean recovery + regulatory & bank-audit hooks", "sprint": 1, "track": "research", "owner": "sameer", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "Operational, jury-verifiable definitions of TTI, TTC and clean recovery, plus a requirements table mapping regulation/audit expectations to our components", "acceptance": ["Definitions of TTI/TTC/clean recovery grounded in ≥3 sources (e.g. NIST SP 800-61r3, Google SRE/incident metrics, MTTD/MTTR literature), with exact start/stop events and a formula for clean recovery (residual damage + collateral loss)", "Requirements table: source clause (EU AI Act Art. 12/14/19/26 with current applicability dates, NIST AI RMF / AI 600-1, ≥1 banking source e.g. PRA SS1/23 or EU DORA) × requirement × our component", "All regulatory citations link to official text, not vendor blogs", "'Implications for our design' section specifying what the Evaluation harness must measure"], "depends": [], "deliverable": "research/RES-08.md", "summary": "Verified in the EC AI Act Service Desk consolidated Art 113 (marked AMENDED): high-risk Chapter III (Arts 12/14/19/26) applies 2 Dec 2027 (Annex III) and 2 Aug 2028 (Annex I); general date stays 2 Aug 2026. Reg number (EU) 2026/1744 is secondary-sourced; Council/EP/OJ hosts were blocked by the proxy.\nNIST SP 800-61r3 has NO mean-time metrics; Google SRE says mean-time stats are poorly suited for decisions; DORA renamed MTTR in 2023. So TTI/TTC/clean recovery are ours to define. IBM: 241 days (2025), 247 days (2026, secondary), 4.99M USD (2026, IBM page).\nDefinitions: TTI = t0 (first bad effect commit, from fault injector) to first correct (agent_id, action_id) attribution; also alert-to-attribution and TTI-scope (blast-radius recall>=0.9). TTC = t0 to capability revoked at chokepoint AND no further bad effect under red-team probe; plus damage-in-window and collateral stall.\nClean recovery = pair (R, C): R = |bad effects still in final state|/|B| (B includes taint), C = |good effects lost|/|G|, with revert precision/recall; judged against counterfactual replay with culprit removed; CR=1-(R+C)/2 only shown with R and C; baselines: snapshot-restore and no-op.\nTable maps AI Act Art 12/14/19/26, NIST AI RMF + 600-1, DORA, PRA SS1/23, RBI FREE-AI (13 Aug 2025), CERT-In (6h report, 180d logs, AI/ML in Annexure I) to Recorder/Monitor/Containment/Recovery. Open: PRA SS1/23 has a newer version effective 23 Apr 2026; confirm OJ details.", "review": "[anaya · done] DONE. All 4 criteria met (TTI/TTC/clean-recovery with start/stop events grounded in NIST 800-61r3, Google SRE, DORA, IBM; requirements table with AI Act 12/14/19/26 + dates, NIST RMF/600-1, DORA, PRA, RBI, CERT-In; official-text links; harness spec). Strongest finding: no standard defines any of the jury's three metrics, so a checkable (R, C) definition is ours to offer. H8a CONFIRMED, H8b CONFIRMED and REFINED ('maps to', not 'compliant'; our system is not itself high-risk).\nSpot-check: EC AI Act Service Desk Art 113 confirms 2 Dec 2027 (Annex III) and 2 Aug 2028 (Annex I), marked AMENDED by the Digital Omnibus on AI.\nCarry: (1) do not cite 'Regulation (EU) 2026/1744' - number is from a vendor blog; (2) IBM 247 days is secondary; (3) RBI '18% maintained audit logs' and PRA SS1/23 clause numbers (newer version eff. 23 Apr 2026) need checking, not in RES-10 scope; (4) ground-truth B must come from the scenario oracle, never from our own taint, or the metric grades itself; (5) add 'tainted good work to re-plan' so wholesale deletion of dependents cannot score clean.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "sameer", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:38", "who": "sameer", "msg": "posted result summary"}, {"t": "19 Nov 00:38", "who": "sameer", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-09", "title": "Lacuna sweep: 2025-26 ML papers on multi-agent accountability, attribution, rollback", "sprint": 1, "track": "research", "owner": "meera", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "Find the most relevant recent papers, research directions and open hypotheses in Lacuna that our Sprint 1 web research missed", "acceptance": ["uses Lacuna search_lacuna (paper, cluster, hypothesis, resource) with Lacuna URLs cited", "≥8 relevant papers 2025-2026 with 1-line relevance each, ranked", "names the closest competitor work to per-agent selective undo, with how we differ", "linked code/datasets/benchmarks we could reuse for the 10-agent eval"], "depends": [], "deliverable": "research/RES-09.md", "summary": "Closest containment competitor: Airlock (2611.06727): provenance DAG + min-cut containment, keeps healthy work (+68 to +96 pp), but does not undo landed effects.\nClosest selective-undo prior art: Wang et al. 2608.10502 (single-agent dependency-guided rollback + selective replay) and State Footprints 2610.03140 (vision: abort one task's writes + its readers). Ours: multi-agent, per-agent identity, containment + undo + tamper-evident audit.\n12 ranked 2025-26 papers; structure helps attribution (Who&When 14.2% step vs 55.2% graph reading, different methods/splits; no further inference). BICR = Benign Infection Control Rate = 1 - ASR.\nNo ready 10-agent fault-injection benchmark: build our own, reuse Airlock/ARIA/Who&When metrics.\nOpenAI-HF July 2026 incident verified (RES-11, METR). Papers read as Lacuna summaries. See Errata (v2).", "review": "[anaya · changes] CHANGES (small, errata only; ~20 min). Criteria 1, 2, 4 met (Lacuna paper/cluster/hypothesis/resource used with URLs; 12 ranked 2025-26 papers; reuse list). Criterion 3 only partly met: Airlock is the right closest *containment* competitor (+68 to +96 pp confirmed verbatim on arxiv.org/abs/2611.06727), but the closest *selective-undo* prior art was missed: Wang et al. 2608.10502 (single-agent dependency-guided rollback + selective replay) and State Footprints 2610.03140 (vision paper: abort one task's writes + its readers). Both surfaced in RES-10/RES-11. Errors to fix in an 'Errata (20 Nov)' block at the top of RES-09: (1) BICR = 'Benign Infection Control Rate' = 1 - ASR (RES-11), not 'benign infection control'; (2) the summary's '14.2% vs 55.2% ... so a deterministic recorder beats LLM judges' is a non sequitur: AIG is itself an attribution method on a different split, not a recorder. Drop the inference; keep AIG only as 'structure helps attribution'; (3) the OpenAI-HF incident is now VERIFIED (METR 26 Aug 2026; see RES-11 and SYNTHESIS fact sheet), so remove 'unverified'; (4) add Wang 2608.10502 and State Footprints to section 4 as selective-undo prior art. Do not rewrite the body. SYNTHESIS.md already carries the corrected versions, so this does not block RES-SYN.\n\n[pmo · done] Errata v2 verified by PMO against REVIEW: BICR fixed, unsupported inference removed, HF incident marked verified, Wang + State Footprints added.", "log": [{"t": "19 Nov 00:37", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:37", "who": "meera", "msg": "→ in_progress: starting Lacuna sweep"}, {"t": "19 Nov 00:38", "who": "meera", "msg": "posted result summary"}, {"t": "19 Nov 00:38", "who": "meera", "msg": "→ in_review"}, {"t": "19 Nov 00:46", "who": "anaya", "msg": "review: changes"}, {"t": "19 Nov 00:50", "who": "meera", "msg": "posted result summary"}, {"t": "19 Nov 00:50", "who": "meera", "msg": "→ in_review: errata fixed"}, {"t": "19 Nov 00:50", "who": "pmo", "msg": "review: done"}]}, {"id": "RES-10", "title": "Citation audit: verify the key papers and numbers we plan to quote", "sprint": 1, "track": "research", "owner": "rohan", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "Every paper/number likely to reach the abstract is verified against the paper itself (via Lacuna get_paper fulltext or arXiv)", "acceptance": ["checks Who&When 53.5%/14.2% and CHIEF/FAMAS figures in the paper text", "confirms existence, authors, venue/year of Retro, Warp, Aire, Taser, GoEx, Atomix, Cordon, State Footprints, DeltaBox, MAST", "table: claim, source, verified yes/no/partial, exact location, safe wording"], "depends": [], "deliverable": "research/RES-10.md", "summary": "Audited 27 claims; table + DROP list in research/RES-10.md. Who&When 53.5/14.2 is in the abstract and reproducible from Table 1 as a 4-cell mean, but from two different methods (all-at-once agent, step-by-step step), GPT-4o; never say one method gets both. FAMAS (57.61/29.35) and CHIEF tables match; CHIEF does not win every cell (FAMAS 41.38 step hand-crafted). Cordon 45/45 vs 14/45 verified but is the authors' own 45-case suite with self-derived baseline adapters; EuroSys'27 is only a header, drop. MAST 94% is few-shot o1 accuracy (kappa 0.77): quote kappa; NeurIPS unconfirmed. Venues confirmed: Retro OSDI'10, Warp SOSP'11, Aire SOSP'13, Taser SOSP'05, Sagas SIGMOD'87, Crosby-Wallach USENIX Sec'09, Who&When ICML'25. State Footprints is a vision paper (rollback unimplemented) and close prior art; DeltaBox is whole-sandbox, v2/title conflict with RES-06. Cordon/CHIEF/State Footprints/DeltaBox read via WebFetch (second-hand): Aarav should eyeball those numbers.", "review": "[anaya · done] DONE. All 3 criteria met (Who&When/FAMAS/CHIEF checked in text with table locations; existence/authors/venue for all 10 named works; claim/source/verified/location/safe-wording table + DROP list). Best item: the 53.5/14.2 decomposition. My arithmetic check: mean(54.33,55.17,51.12,53.44)=53.52 and mean(25.51,7.02,15.31,8.77)=14.15, which matches. So the 'two different strategies' rule stands. Spot-checks on arxiv.org abs pages (20 Nov): (a) Atomix authors = Bardia Mohammadi, Nearchos Potamitis, Lars Klein, Akhil Arora, Laurent Bindschaedler; v1 16 Feb 2026, v2 29 May 2026, which closes items 32/33 ('Mohammadi et al.' is now safe). (b) DeltaBox: abs page lists only v1 (21 May 2026) and v2 (8 Jun 2026), title 'DeltaBox: Scaling Stateful AI Agents with Millisecond-Level Sandbox Checkpoint/Rollback'. RES-10 is right, and RES-06's 'v3, 13 Nov 2026' is wrong. Item 48 is closed. (c) FAMAS abs page: abstract has no numbers, and the 57.61/29.35 figures are from Table 1 only. Cite them as Table 1, not 'abstract'. Remaining backlog (owned elsewhere): IBM 247 days primary, RBI 18%, RES-01 overheads, Tier-B eyeballing by Aarav.", "log": [{"t": "19 Nov 00:37", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:37", "who": "rohan", "msg": "→ in_progress: auditing"}, {"t": "19 Nov 00:40", "who": "rohan", "msg": "posted result summary"}, {"t": "19 Nov 00:40", "who": "rohan", "msg": "→ in_review"}, {"t": "19 Nov 00:46", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-11", "title": "Deep read: Airlock (2611.06727) — closest competitor, exact differentiation", "sprint": 1, "track": "research", "owner": "meera", "reviewer": "anaya", "model": "opus", "created_by": "anaya", "status": "done", "outcome": "A verified, full-text account of what Airlock does and does not do, so our novelty claim is precise and defensible in front of a jury", "acceptance": ["read full text via Lacuna get_paper fulltext (or arXiv)", "table: capability x (Airlock, Spark-to-Fire, us) for attribution, containment granularity, backward undo, dependant handling, external effects, tamper evidence, metrics", "verbatim (short) limitation statements with section refs", "3 safe novelty sentences + 3 claims we must NOT make"], "depends": [], "deliverable": "research/RES-11.md", "summary": "Full text of Airlock read (22pp incl. App. A-G); Spark-to-Fire read at method+eval+limitations level.\nAirlock = online FORWARD containment (provenance DAG + per-object switches + deadline-aware min-cut, Thm 5: 0 post-tau1 leaks); it declares no rollback of committed effects/absorbed memory (Table A.2 S2, 5.2), trusted unauthenticated journals, adversarial agents out of scope.\nOur safe niche: backward recovery of one agent's landed shared-state writes + repair of dependants, signed/hash-chained audit under a stronger threat model (F5/F6), recovery metrics (residual damage, collateral loss).\nDo NOT claim novelty for provenance-guided selective containment, or 'first selective undo for agents' (Wang et al. 2608.10502 does single-agent dependency-guided rollback+replay), or any head-to-head win over Airlock.\nRisk: Airlock's 'kept without redo' metric penalises re-execution; report our own metrics and make re-runs not repeat external effects. STRAWMAN A5 falsified as written.\nIncident is real (METR: ~1,200 agents, >70k msgs/files, ~700 attackers, new board ~2 days after wipe) but METR says the board came from exploiting Artifactory, not 'legitimately held credentials' as Airlock writes.", "review": "[anaya · done] DONE. All 4 criteria met (full 22-pp read; capability table on all 7 dimensions; 12 Airlock + 5 Spark-to-Fire limitation quotes with refs; 3 safe / 3 must-not claims). Spot-checks (20 Nov): arxiv.org/html/2611.06727v1 contains verbatim, in App. A: 'Committed external effects are not rolled back' (Table A.2 S2), 'journals and confirmations are taken as reported, not authenticated' and 'adversarial agents are out of scope' (A.6), and §5.2 'requires orthogonal rollback'. The App. F scale limit ('beyond roughly ten agents across three hosts') is confirmed. Code: App. B releases the EdgeCitadel runtime only; the text does not say Airlock's controller is released. Incident: METR blog (Greenblatt, Cotra, Wijk, 26 Aug 2026) fetched by me: ~1,200 agents on the board, >70,000 messages and files, ~700 attacking HF by afternoon 11 Jul, fresh Artifactory 6 Jul, new board 8 Jul 23:00 UTC, HF lockout 13 Jul. METR calls its findings 'preliminary'. The board was built via Artifactory cache abuse 'not credentials', so the RES-11 correction of Airlock is right. Extra facts: ExploitGym eval; ~95% of agents were one unreleased model (HPIM); METR read ~1,300 transcripts after the fact. Al Jazeera (27 Aug) carries OpenAI's 'early signals ... should have triggered an earlier response'. Outlet dates conflict (Fortune: HF entry 9 Jul, HF disclosure 16 Jul; Al Jazeera: attack 11 Jul), so say 'July 2026'. This overturns the RES-07 / REVIEW-S1 line 'no public multi-agent incident' as a blanket statement; the narrower point still holds (no public case of one agent's bad write being consumed and repaired by others). Minor: the 'Us' column says 'hash chain + signed head'; the ADR target is witness-anchored checkpoints (Panel 2.2).", "log": [{"t": "19 Nov 00:39", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:39", "who": "meera", "msg": "→ in_progress: full-text read"}, {"t": "19 Nov 00:43", "who": "meera", "msg": "posted result summary"}, {"t": "19 Nov 00:43", "who": "meera", "msg": "→ in_review"}, {"t": "19 Nov 00:46", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-SYN", "title": "Synthesis: findings → problem framing + design principles", "sprint": 1, "track": "research", "owner": "anaya", "reviewer": "anaya", "model": "opus", "created_by": "anaya", "status": "done", "outcome": "Aarav gets 2–3 framing options, an abstract outline of points, a sourced fact sheet, and the team gets design principles for Sprint 2 ADRs", "acceptance": ["Working thesis (undo is a dependency problem) explicitly confirmed, modified or killed with evidence from RES-01..08", "2–3 framing options with pros/cons, plus an outline (bullets only, no abstract prose) for Problem → Fix → Why it matters", "Fact sheet of ≥10 numbers/facts each with source URL, traced to a RES report", "≤10 design principles mapped to architecture components, each citing the RES report that motivates it"], "depends": ["RES-01", "RES-02", "RES-03", "RES-04", "RES-05", "RES-06", "RES-07", "RES-08"], "deliverable": "research/SYNTHESIS.md", "summary": "research/SYNTHESIS.md (~1,840 words, bullets and tables only, no abstract prose).\nThesis MODIFIED: 'undo is a dependency problem' is confirmed (RES-02/04/06). Killed: 'nobody has provenance containment' (Airlock) and 'nobody has agent undo' (Wang 2608.10502, State Footprints). 'No multi-agent incident' is overturned: OpenAI/HF is real (METR ~1,200 agents / ~700 attackers), but there is still no public case of B consuming A's bad write and being repaired.\nRecommended frame: PROVENANCE-FIRST (Panel 5.2), with backward recovery as the demo payoff and 'testimony vs evidence' as why it matters. Niche vs Airlock: the backward half, an authenticated record, and recovery scored as (R, C).\nAlso in the file: 15-row fact sheet with wording rules, URLs and verification status (5 rows re-verified by me today); consolidated do-not-claim list; 10 principles mapped to components; Panel must-fix list mapped to ADR owners (vikram/nisha/arjun/tara); positioning vs 8 systems; merged metric set (TTI-detect/attribute, Panel TTC + post-alert tainted effects, oracle-defined B/G, R/C, re-plan cost); 13 Call #1 decisions with recommended answers.\nCorrections: DeltaBox has no v3 (RES-06 wrong). Atomix authors confirmed.", "review": "[panel · done] Synthesis accepted as the Call #1 working document: clear thesis status, verified fact sheet with wording rules, do-not-claim list, principles traced to evidence, oracle-based metrics.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:46", "who": "anaya", "msg": "→ in_progress: writing SYNTHESIS.md (incl. RES-09..11 + Panel)"}, {"t": "19 Nov 00:49", "who": "anaya", "msg": "posted result summary"}, {"t": "19 Nov 00:49", "who": "anaya", "msg": "→ in_review: SYNTHESIS.md ready for Call #1"}, {"t": "19 Nov 00:50", "who": "panel", "msg": "review: done"}, {"t": "19 Nov 05:57", "who": "anaya", "msg": "synthesis errata aligned with fact card"}]}, {"id": "ABS-01", "title": "Fact card: every external number Aarav may quote, one page", "sprint": 2, "track": "pitch", "owner": "anaya", "reviewer": "zoya", "model": "opus", "created_by": "zoya", "status": "done", "outcome": "A one-page card of verified external facts, each with its wording rule and URL, so every outside number in the abstract traces to one checked source (D13)", "acceptance": ["Covers SYNTHESIS §2 facts 1-15 plus the RBI FREE-AI spare; each row = fact, exact wording rule, URL, verification status (A-verified or secondary)", "Every row is re-checked against its URL (or marked secondary / unverified); no number appears that is not in a cited source", "Includes a short 'never quote' list drawn from SYNTHESIS §3 (e.g. exact HF dates, '11 days to detect', 'legitimately held credentials', IBM 241/247, RBI 18%)", "Fits one printed page; facts in table/bullet form only, no abstract sentences"], "depends": [], "deliverable": "abstract/FACT-CARD.md", "summary": "abstract/FACT-CARD.md: 16 rows (facts 1-15 + RBI spare) grouped Hook/Problem/Prior art/Why it matters; each = terse fact, exact number, must-travel qualifier, linked source, status. All re-checked against URLs 19 Nov: 10 A, 3 A~ (#1 'internal cyber eval' unconfirmed in METR; #11 OTel repo states no stability; #13 PDF doesn't name SIGMOD), 3 S (#9 incidents, #10 PocketOS, RBI spare - fetch failed today). Corrections vs SYNTHESIS: #1 drop 'internal OpenAI cyber evaluation', say ExploitGym runs; #7 add 'without redo'/'under dense spread' per abstract; #11 'not yet stable' not 'all Development'. Never-quote list from §3 incl. exact HF dates, '11 days', 'legitimately held credentials', IBM 241/247, RBI 18%, 2026/1744.", "review": "[zoya · changes] Strong card: all 16 rows present with wording rule, URL and status; never-quote list complete; table-only, no abstract prose; ~1 page. Spot-checked #1, #2, #4, #7, #15 against their URLs today: numbers match.\nMust fix (1 line): #7 'under dense spread' is in the wrong place. In the Airlock abstract it qualifies the +46 pp optimized-cut vs full quarantine, not the +68 to +96 pp. Move it or drop it; the +68/+96 qualifier is just 'their benchmark'.\nOptional: #1 note says METR doesn't say 'cyber'. It does say 'cyber evaluations' / 'cyber task' (model section, Fig 2); 'internal' stays unconfirmed for the eval, so keep 'ExploitGym evaluation runs'. #4: the arXiv page doesn't show ICML 2025, so cite the source of the venue or mark it A~.\nKnown conflict (mine): GUARDRAILS P2 still says 'internal OpenAI cyber evaluation'. The card wins; I'll fix P2 under ABS-02.\nRe-review is quick once #7 is fixed.\n\n[pmo · done] PMO verified Zoya's must-fix: row 7 qualifier now on the +46 pp result (checked line); notes on #1 and #4 corrected. Zoya's verdict satisfied.", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}, {"t": "19 Nov 00:55", "who": "anaya", "msg": "→ in_progress"}, {"t": "19 Nov 00:58", "who": "anaya", "msg": "posted result summary"}, {"t": "19 Nov 00:58", "who": "anaya", "msg": "→ in_review"}, {"t": "19 Nov 01:00", "who": "zoya", "msg": "review: changes"}, {"t": "19 Nov 05:57", "who": "anaya", "msg": "→ in_review: row 7 corrected, notes fixed"}, {"t": "19 Nov 05:59", "who": "pmo", "msg": "review: done"}]}, {"id": "ABS-02", "title": "Claim guardrails: safe claims, do-not-claim, overclaim words", "sprint": 2, "track": "pitch", "owner": "zoya", "reviewer": "panel", "model": "opus", "created_by": "zoya", "status": "done", "outcome": "A checklist Aarav can run his draft against, separating claims we can defend from claims a jury will punish", "acceptance": ["Three lists: safe claims (from RES-11 §5 and CALL-01 D1-D13, each with the decision or source that backs it), do-not-claim (SYNTHESIS §3 plus D2/D6/D7 wording limits), overclaim words with a safer alternative (first, novel, tamper-proof, compliant, guarantees, eliminates, prevents, real-time)", "Our own numbers are listed only as definitions plus labelled targets (R=0, C=0, post-alert tainted effects=0), never as results (D13)", "Each item is a phrase or rule, not a ready-to-paste abstract sentence; every do-not-claim item cites its reason (source or decision id)"], "depends": [], "deliverable": "abstract/GUARDRAILS.md", "summary": "abstract/GUARDRAILS.md v2 (panel fixes applied). (1) 32 safe claims (P1-P6, F1-F13, W1-W6, L1-L7), each with source/decision id and wording condition; P2 now uses FACT-CARD #1/#2 wording only (roughly; METR, preliminary findings; July 2026, no day; agents in OpenAI's ExploitGym evaluation runs; about two days later; never internal/cyber). W4: Art 14(4)(e) stop 'in a safe state'; RBI FREE-AI quote only after checking the report's exact words (status S), else omit. Ground rule 2 + self-check 2 name abstract/FACT-CARD.md as the only source for outside numbers (SYNTHESIS §2 dropped). Own numbers only as definitions + labelled targets (D13). (2) 33 do-not-claim items X1-X33: X10 = leave MAST out; X11 adds 'Mohammadi et al.' and the 29 May 2026 Atomix date; X12 adds frontier gating and its alternative is concept + arXiv ID only, no number; new X31 Cordon 45/45 vs 14/45, X32 DeltaBox ms, X33 any GoEx number. (3) 19 overclaim words with concepts; 'cancelled (payment)' row reworded: containment never cancels (release = un-hold + restore epoch, CALL-01), a held item is cancelled only by an approved cancel_outbox recovery-plan step after the dry-run diff (maya.md C5), so the TERMS term stays usable. (4) 12-point self-check. 'Changes v2' note at the bottom.", "review": "[panel · changes] CHANGES (4 must-fix, all small). Structure, D13 handling (§1.5 definitions + labelled targets only), RES-11 §5 must-not coverage (X1-X5, X8, X14) and the no-pasteable-prose rule all pass. Spot-checks PASS: P4 (fact 8; RES-11 §4 #2-#3), P5 (RES-11 §4 #6), P6 (facts 4/6), F8 (D7, C4), F12 (D6, C1), L5 (C2), W1 (principle 10). Spot-checks FAIL: P2 and W4.\n(1) P2 tells Aarav to write 'internal OpenAI cyber evaluation'. FACT-CARD #1 (A~ note) bans exactly that: METR says neither 'internal' nor 'cyber'. Replace the P2 condition with FACT-CARD #1/#2 wording: 'roughly', 'METR, preliminary findings', 'July 2026' (no day), 'agents in OpenAI's ExploitGym evaluation runs', 'about two days later'. Ground rule 2 and self-check 2 must name abstract/FACT-CARD.md as the only source. Drop 'SYNTHESIS §2': it differs from the card (fact 1 wording, fact 11 'all Development' vs 'not yet stable').\n(2) The safer alternatives in X10 and X12 point to numbers that are not on the fact card. X10 offers MAST kappa 0.77, and X12 points to the 'RES-10 wording column', which carries Cordon 45/45 vs 14/45, DeltaBox ms and so on. Under D13 these cannot be printed, and FACT-CARD 'not safe to print' lists them. Change X10 to 'leave MAST out' and X12 to 'concept + arXiv ID only, no number (D13)'. Add explicit X rows for Cordon 45/45 vs 14/45, DeltaBox ms figures and any GoEx number.\n(3) RES-10 DROP coverage is incomplete. DROP 5 also drops 'frontier gating improves success under speculation', the 'Mohammadi et al.' author attribution and the 29 May 2026 Atomix date. Add them to X11/X12.\n(4) W4: the RBI FREE-AI quote is status S on the fact card ('open the report and check the exact words before printing'). Add that as its condition, else omit it. Use the card's Art 14(4)(e) wording: stop 'in a safe state'.\nZoya's open point: AGREE. CALL-01 'we hold, never cancel' is release semantics for containment (release = un-hold + restore epoch). cancel_outbox is a C5 RecoveryPlan step (maya.md C5; TERMS 'cancel (outbox item)'), so it runs only as an approved recovery-plan step after the dry-run diff. F11 and X29 are right. Fix the §3 row 'cancelled (payment)'. As written ('We hold, never cancel (C6)') it bans a locked term. Make it: containment never cancels; a held item is cancelled only by an approved recovery-plan step (cancel_outbox) after the dry-run diff. Cite CALL-01 release semantics + maya.md C5, not C6 (SEC-01 is rewording C6).\nNit: P1 is closest to a pasteable thesis sentence. Keep it as a note.\n\n[panel · done] DONE. All 4 must-fixes applied correctly. (1) P2 now carries FACT-CARD #1/#2 wording only (roughly; METR, preliminary findings; July 2026, no day; agents in OpenAI's ExploitGym evaluation runs; about two days later; cache namespace, not credentials) and bans 'internal'/'cyber'. Ground rule 2 and self-check 2 name abstract/FACT-CARD.md as the only source; SYNTHESIS §2 is gone from the rules (the Inputs line keeps only §0/§3/§6). PASS. (2) X10 = leave MAST out. X12 alternative = concept + arXiv ID only, no number (D13). New X31 (Cordon 45/45 vs 14/45), X32 (DeltaBox ms) and X33 (GoEx) each cite FACT-CARD 'not safe to print' + D13. PASS. (3) DROP 5 leftovers: frontier gating is in X12; 'Mohammadi et al.' and 29 May 2026 are in X11, with the 'MPI-SWS and collaborators unless copied from the abs page' fallback. PASS. (4) W4: Art 14(4)(e) 'in a safe state'; the RBI quote is status S, check the exact words or omit. PASS. The §3 'cancelled (payment)' row now matches CALL-01 release semantics + maya.md C5 and THREAT-MODEL C6 v2, and the locked TERMS term 'cancel (outbox item)' is usable again. F11 and X29 are consistent with it.\\nNits (no re-review): F11 condition, add 'approved' ('an approved recovery-plan step after the dry-run diff') to match §3 and C6. W4 'Rests on': NIST AI RMF MANAGE 4.3 is not on FACT-CARD #15. Cite RES-08 (regulatory table, ref [19]) for it. It is a reference ID, not a number, so D13 is not breached. P1 stays the closest thing to a thesis sentence: keep it as a note, as before.", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}, {"t": "19 Nov 00:55", "who": "zoya", "msg": "→ in_progress"}, {"t": "19 Nov 00:57", "who": "zoya", "msg": "posted result summary" w says held not cancelled; contain view invoice 'lineage hold' -> 'already landed' (landed class C write is compensated, not held); hold rule now says 'recorded read set' (D8); caption 'agents never touch data' (overclaim) -> bypass caught by reconciliation (F2); witness now shows signs (seq, head, tick); duplicate SVG marker ids made unique (valid HTML); duplicate path removed. Proposed TERMS §7 additions: workspace, trust boundary, idempotency key.", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}, {"t": "19 Nov 00:58", "who": "ishaan", "msg": "→ in_progress"}, {"t": "19 Nov 00:58", "who": "ishaan", "msg": "→ in_progress"}, {"t": "19 Nov 01:00", "who": "ishaan", "msg": "→ in_review: abstract/how-it-works.html built: mediated path, F2+ provenance graph, identify/contain/recover panels, audit. Self-contained, no scripts/fonts/network, light+dark, viewBox 320 so text 12px at 360px. Terms outside TERMS.md: workspace (in THREAT-MODEL), trust boundary, untrusted/checked (THREAT-MODEL B1-B4). Needs vikram confirm vs ADR."}, {"t": "19 Nov 01:03", "who": "vikram", "msg": "review: done"}]}, {"id": "ABS-04", "title": "Term lock: one name per concept across abstract, demo and code", "sprint": 2, "track": "pitch", "owner": "zoya", "reviewer": "maya", "model": "opus", "created_by": "zoya", "status": "changes", "outcome": "A glossary that fixes one public name per concept so the abstract, diagram, demo and contracts never use two words for one thing", "acceptance": ["Covers at least: envelope, read/write set, gateway, recorder, witness, verify, lineage hold, graded containment (suspend/revoke/release), taint-scoped revert, re-run vs replan, root candidates, oracle S*, R and C, TTI-detect/attribute, TTC", "Each entry: locked term, one-line plain-English gloss a banking reader understands, banned synonyms, and matching code/contract identifier where one exists", "Maya confirms every code identifier matches contracts C1-C6 (or flags the mismatch)"], "depends": [], "deliverable": "abstract/TERMS.md", "summary": "abstract/TERMS.md: ~65 locked terms in 6 tables (actors/path, record/audit, classes+containment, recovery, metrics, demo). Each row: locked term, gloss <=15 words for a banking reader, code name from C1-C6/module list, banned synonyms. All acceptance terms covered. Key locks: 'suspend' (not quarantine), 'lineage hold', 'record' (not log), 'taint-scoped revert', 're-run' vs 're-plan', 'root candidates' (not culprit/root cause), 'kill switch' = project name only; R/C metric-vs-class overload rule. Sec 7 lists 9 contract gaps for maya: revert vs C5 'restore'; Alert.suspect vs culprit; no contract for provenance graph, witness checkpoint, side store, hold window/sensitive tag, metric field names, idempotency_key; Control.target must accept a connection id (D7); reconcile detector name.", "review": "[maya · changes] CHANGES (maya), mechanical. The coverage, glosses and banned lists are good, and so are the 'kill switch' and R/C rules. The code names were taken from maya.md §3, not from the frozen contracts 1.0.0, so these rows need fixing:\n- culprit: there is no Alert.suspect. Use RunConfig.culprit (C6, scorer-only) and RecoveryPlan.culprit (C5, chosen by a person). The suspect is derived as root_candidates[0] (PMO accepted) and is never stored. Add a row 'suspect (console/internal only)', banned in the abstract.\n- alert: fields are {alert_id, tick, seq, detector, kind, hard, evidence_seqs, evidence_versions, root_candidates, conn_id}; drop suspect. Alerts are not signed (Controls are), so drop 'signed' from the gloss.\n- envelope: expiry_tick, not expiry; add claimed_ts_us/claimed_seq. The recorded form is EnvelopeHeader (args -> args_hash). act chain = act_chain: ActLink{principal, action_id}.\n- tick: the barrier runs in the gateway (ADR-00), transport TickFrame. ks.runtime only spawns processes.\n- read set = ReadEntry(obj, ver, hash). action class = action_class/ActionClass, not 'class'. Fix all 5 class rows.\n- witness = C2 WitnessCheckpoint(seq, tick, head [+count, CON-02]), witness.jsonl.\n- verify / tamper-evident: ks.verify.Exit + VerifyReport.first_bad (a seq, not an 'index') + last_witnessed_seq.\n- reconciliation: AlertKind.RECONCILE, detector 'reconcile', Exit.RECONCILE, state_digest (C3).\n- side store: C3 SideStore/SideEntry, run dir sidestore/.\n- outbox: C3 OutboxItem (status queued/held/released/dispatched/cancelled) + C2 outbox_ids.\n- lineage hold: also Decision.HOLD/Reason.LINEAGE_HOLD and OutboxStatus.HELD.\n- hold window: RunConfig.hold_window_ticks. sensitive field: RunConfig.sensitive_fields ('table.field'), rule p.sensitive_early_hold, reason sensitive_field.\n- invariant detector: AlertKind.INVARIANT, ids inv.* (ADR-04). taint = TaintSet (RecoveryPlan.taint_set). The dry-run diff field is RecoveryPlan.diff (DiffEntry); CLI ks recover --dry-run.\n- write-write conflict: flag with reason write_write_conflict (pending the ADR-05 decision on restore-and-rerun).\n- release gloss: the epoch is fresh, not rewound (SEC-03 B3). Suggest 'restores the agent's permissions (fresh epoch)'.\n- t0: scorer uses RunConfig.fault_tick (CON-02, proposed); planner uses RecoveryPlan.t0_seq (estimate).\n- metrics: tti_detect/tti_attribute/ttc match ADR-06, so remove the warning marks. post_alert_tainted and irreversible_(tainted_)released differ between ADR-06, ADR-04 and SPEC; tara decides, and TERMS copies the score.json keys exactly.\n§7 answers: 1 confirmed, restore stays, revert = the set of restore steps (C5 docstring). 2 no suspect field, see above. 3 confirmed, no graph type. 4 resolved, WitnessCheckpoint C2 / SideStore C3. 5 resolved, RunConfig. 6 tara. 7 resolved, OutboxItem.idempotency_key + idempotency_key(). 8 resolved, Control.target conn:<id>. 9 confirmed, reconcile, class U.\nProposed additions: ACCEPT all three. idempotency key code = C3 OutboxItem.idempotency_key (it exists, it isn't proposed). workspace = workspace/state.db (C6 STATE_DB), ks.state.\nMissing: add 'connection' (C2 conn_id, Control target conn:<id>). The anti-framing claim depends on it.", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}, {"t": "19 Nov 00:55", "who": "zoya", "msg": "→ in_progress"}, {"t": "19 Nov 00:56", "who": "zoya", "msg": "posted result summary"}, {"t": "19 Nov 00:56", "who": "zoya", "msg": "→ in_review"}, {"t": "19 Nov 06:18", "who": "maya", "msg": "review: changes"}]}, {"id": "ABS-05", "title": "Jury hostile-question pointers (evidence only)", "sprint": 2, "track": "pitch", "owner": "anaya", "reviewer": "kabir", "model": "opus", "created_by": "zoya", "status": "done", "outcome": "A list of the hardest jury questions with pointers to the evidence that answers each, so Aarav can pre-empt them in his own words", "acceptance": ["At least 7 questions, including: 'isn't this Airlock?', 'Wang already did agent undo', 'isn't this just logging?', 'LLMs can't be replayed', 'can an agent cheat the hold / forge the log?', 'what about irreversible effects?', 'would this have stopped the METR case?'", "Each answer is pointers only: fact-card row, SYNTHESIS/RES section, CALL-01 decision or threat-model item; no scripted answer prose", "Kabir confirms every security answer stays inside the adopted threat model (in/out of scope as in CALL-01)"], "depends": ["ABS-01"], "deliverable": "abstract/JURY-QA.md", "summary": "abstract/JURY-QA.md: 12 hostile questions (Airlock; Wang/Retro undo; logging/OTel; LLM non-determinism; gateway bypass; forgery/clock games; who watches the witness; hold-window cheating by agent or by us; irreversible effects; Dolt/git revert; real incidents + would-it-have-stopped-METR; wrong detection/suspending a good agent). Each: evidence pointers only (fact-card row, GUARDRAILS P/F/W/L/X, CALL-01 D#, THREAT-MODEL C#/B#/rule, RT#, SYN/RES section), a <=12-word key distinction, and traps. Security questions (Q5-Q8, Q11 METR part, Q12) carry a TM-scope line (in/out per CALL-01) for kabir to confirm. Plus a 7-row 'also likely' table and 6 cross-document inconsistencies (GUARDRAILS P2 + SYN §2 row 1 'internal cyber evaluation' vs fact-card #1 note; SYN 'all Development' vs #11; exact dates in SYN/RES-11; RES-11 §3 'Us' column superseded; 'ground truth'/RES-01 re-run wording superseded; RES-06 Dolt recommendation superseded by D5). No answer prose.", "review": "[kabir · done] Security review vs THREAT-MODEL v2 + SPEC: TM-scope lines on Q5-Q8, Q11 (METR), Q12 are correct and match CALL-01 'Threat model, adopted' and TM §3. Distinctions are accurate (C2 caught-not-prevented, C4 connection-not-victim, C1 up to last witnessed head, C3 root candidates only, C5 recorded reads, D7 suspend-not-revoke). No pointer implies a refused claim: RT8 gateway-key note explicitly blocks 'survives gateway compromise' (X23), collusion is root candidates only, key reads are flagged as not caught by reconciliation. Pointers only, no scripted answer prose. Applied 3 small edits to JURY-QA.md: (1) Q5 trap on separate uid was stale ('ADR-00 has not confirmed'); now cites TM v2 Live setup (setuid checked 19 Nov), keeps C2 wording verbatim, and names the shared-uid consequence (key read voids C1/C4, unseen by reconciliation). (2) Q7 TM-scope 'in' adds the v2 condition: insider cannot write the witness head store. (3) Q7 new trap: record+heads rewound to an older prefix is caught only against the printed run-end head; no printed head = out of scope (TM §5 truncation row).", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}, {"t": "19 Nov 01:02", "who": "anaya", "msg": "→ in_progress"}, {"t": "19 Nov 01:05", "who": "anaya", "msg": "posted result summary"}, {"t": "19 Nov 01:05", "who": "anaya", "msg": "→ in_review: ready for kabir: confirm TM-scope lines on Q5-Q8, Q11, Q12"}, {"t": "19 Nov 05:58", "who": "kabir", "msg": "review: done"}]}, {"id": "ABS-06", "title": "Abstract skeleton: headings, word budget, what each section must establish", "sprint": 2, "track": "pitch", "owner": "zoya", "reviewer": "panel", "model": "opus", "created_by": "zoya", "status": "done", "outcome": "A skeleton Aarav fills in himself: problem -> fix -> why it matters, with a word budget and the points each section must land", "acceptance": ["Section headings in the organisers' order (problem -> fix -> why it matters, plus limits) with a word budget per section totalling 850-950, under the 1,000 cap", "Under each heading: bullet notes (fragments, max ~12 words each) of what must be established, each tagged to a fact-card row, guardrail or term; zero full sentences of abstract prose (Charter)", "Reflects D1 layered headline, D2 METR wording, D3 one credited Airlock clause, D12 hero scenario, D13 numbers-as-targets"], "depends": ["ABS-01", "ABS-02", "ABS-04"], "deliverable": "abstract/SKELETON.md", "summary": "v2 after panel changes. abstract/SKELETON.md: every point bullet tagged MUST/IF-ROOM (55 MUSTs, cap 60 at ~1 per 15 words; per-subsection counts in the budget table); rules and ✗ lists moved to untagged Guard: lines. Panel's demotions applied; Airlock #7 numbers deleted; TTI/TTC defined once in 3b; binding rule: section totals binding, subsections ±15, bullet order free.\nReframe: 1a (100) opens on the brief's 'without discarding' clause, shown with the IBAN example (moved from 2a) -> honest work built on the bad write -> 'undo crm' undefined [P1]. 2a deleted; 2b walks the example. Budgets 1a 100 / 1b 90 / 1c 110 / 2b 80 / 2c 45 / 2d 65 / 2e 95 / 2f 45; totals 300 / 330 / 900. Scores: lines map 2c/2d/2e to time-to-identify / time-to-contain / clean recovery.\nShould-fix + nits: 3a tags 'audited, not only demoed' [CHARTER]; 3b RES-08 headline bullet ('in the standards we checked'); 1b '✗ internal / cyber [#1]', stale P2 flag dropped; 2d 'reconciliation mismatch (class U)'; 3c NIST MANAGE 4.3 -> RES-08 [19].\nGUARDRAILS v3: F11 'approved' recovery-plan step; W4 cites RES-08 [19] for NIST MANAGE 4.3; new W7 (brief's scores lack an agreed measurement in the standards we checked; we define checkable ones; RES-08). Changes v2 (SKELETON) / v3 (GUARDRAILS) notes added.", "review": "[panel · changes] CHANGES: 2 must-fix, both cheap. Structure passes. The order is problem -> fix -> why -> limits; budgets total 900 and every subsection sums correctly. D1 is layered as decided (gap 1a, provenance 2b, selective undo 2e only, testimony vs evidence 3a, flagged for Aarav). D2: 1b uses card #1/#2 qualifiers and the never-quote items. D3: the box gives one credited clause, P5's journal point goes inside it or unnamed, and the 'dense spread' fix is carried. D12: F2+ with the W6 label and x10 kept out of the story. D13: definitions + targets, no seconds. Cross-checks against FACT-CARD, GUARDRAILS v2, TERMS and C6 v2 are clean: 'never cancelled here' in 2d vs cancel_outbox in 2e is correct.\\nPASTEABLE-PROSE CHECK: PASS. No bullet is a sentence. The quoted strings ('tamper-evident up to the last witnessed head', 'orthogonal rollback', 'maps to', 'in a safe state') are mandated wording or attributed quotations, not prose. The writing-plan sentences are instructions. The residual risk is structural: ~124 bullets in a fixed order invite one sentence per bullet, which reads kit-shaped and machine-like. Must-fix 1 also addresses that.\\nMUST-FIX 1: the budget cannot hold the points. 1c has 12 bullets plus a 7-bullet box in 120 words, and the clause alone is 20-30. 2d has 10 in 60, 2e has 12 in 75, 2f has 7 in 40. Every line reads as 'must establish', so Aarav either overruns or writes telegraphic text, and both hurt with this jury. Tag every bullet MUST or IF-ROOM, at most ~1 MUST per 15 budget words. Demote these to IF-ROOM: 1b #9 catalogued incidents (keep 'single-agent, in our search' only as a qualifier) and #3 hindsight; 1c sagas #13, OTel #11, FAMAS #6, random baseline #5; the box's optional #7 numbers (delete them: they cannot fit in 30 words beside 'by design', 'orthogonal rollback', 'complementary' and the arXiv ID); 2b MCP #12; 2d epoch and anti-framing; 2e append-o
