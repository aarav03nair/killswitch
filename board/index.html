s-document inconsistencies (GUARDRAILS P2 + SYN §2 row 1 'internal cyber evaluation' vs fact-card #1 note; SYN 'all Development' vs #11; exact dates in SYN/RES-11; RES-11 §3 'Us' column superseded; 'ground truth'/RES-01 re-run wording superseded; RES-06 Dolt recommendation superseded by D5). No answer prose.", "review": "[kabir · done] Security review vs THREAT-MODEL v2 + SPEC: TM-scope lines on Q5-Q8, Q11 (METR), Q12 are correct and match CALL-01 'Threat model, adopted' and TM §3. Distinctions are accurate (C2 caught-not-prevented, C4 connection-not-victim, C1 up to last witnessed head, C3 root candidates only, C5 recorded reads, D7 suspend-not-revoke). No pointer implies a refused claim: RT8 gateway-key note explicitly blocks 'survives gateway compromise' (X23), collusion is root candidates only, key reads are flagged as not caught by reconciliation. Pointers only, no scripted answer prose. Applied 3 small edits to JURY-QA.md: (1) Q5 trap on separate uid was stale ('ADR-00 has not confirmed'); now cites TM v2 Live setup (setuid checked 19 Nov), keeps C2 wording verbatim, and names the shared-uid consequence (key read voids C1/C4, unseen by reconciliation). (2) Q7 TM-scope 'in' adds the v2 condition: insider cannot write the witness head store. (3) Q7 new trap: record+heads rewound to an older prefix is caught only against the printed run-end head; no printed head = out of scope (TM §5 truncation row).", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}, {"t": "19 Nov 01:02", "who": "anaya", "msg": "→ in_progress"}, {"t": "19 Nov 01:05", "who": "anaya", "msg": "posted result summary"}, {"t": "19 Nov 01:05", "who": "anaya", "msg": "→ in_review: ready for kabir: confirm TM-scope lines on Q5-Q8, Q11, Q12"}, {"t": "19 Nov 05:58", "who": "kabir", "msg": "review: done"}, {"t": "19 Nov 11:00", "who": "pmo", "msg": "PMO: 3 stale post-freeze references fixed (suspect, idempotency_key, release)"}]}, {"id": "ABS-06", "title": "Abstract skeleton: headings, word budget, what each section must establish", "sprint": 2, "track": "pitch", "owner": "zoya", "reviewer": "panel", "model": "opus", "created_by": "zoya", "status": "done", "outcome": "A skeleton Aarav fills in himself: problem -> fix -> why it matters, with a word budget and the points each section must land", "acceptance": ["Section headings in the organisers' order (problem -> fix -> why it matters, plus limits) with a word budget per section totalling 850-950, under the 1,000 cap", "Under each heading: bullet notes (fragments, max ~12 words each) of what must be established, each tagged to a fact-card row, guardrail or term; zero full sentences of abstract prose (Charter)", "Reflects D1 layered headline, D2 METR wording, D3 one credited Airlock clause, D12 hero scenario, D13 numbers-as-targets"], "depends": ["ABS-01", "ABS-02", "ABS-04"], "deliverable": "abstract/SKELETON.md", "summary": "v2 after panel changes. abstract/SKELETON.md: every point bullet tagged MUST/IF-ROOM (55 MUSTs, cap 60 at ~1 per 15 words; per-subsection counts in the budget table); rules and ✗ lists moved to untagged Guard: lines. Panel's demotions applied; Airlock #7 numbers deleted; TTI/TTC defined once in 3b; binding rule: section totals binding, subsections ±15, bullet order free.\nReframe: 1a (100) opens on the brief's 'without discarding' clause, shown with the IBAN example (moved from 2a) -> honest work built on the bad write -> 'undo crm' undefined [P1]. 2a deleted; 2b walks the example. Budgets 1a 100 / 1b 90 / 1c 110 / 2b 80 / 2c 45 / 2d 65 / 2e 95 / 2f 45; totals 300 / 330 / 900. Scores: lines map 2c/2d/2e to time-to-identify / time-to-contain / clean recovery.\nShould-fix + nits: 3a tags 'audited, not only demoed' [CHARTER]; 3b RES-08 headline bullet ('in the standards we checked'); 1b '✗ internal / cyber [#1]', stale P2 flag dropped; 2d 'reconciliation mismatch (class U)'; 3c NIST MANAGE 4.3 -> RES-08 [19].\nGUARDRAILS v3: F11 'approved' recovery-plan step; W4 cites RES-08 [19] for NIST MANAGE 4.3; new W7 (brief's scores lack an agreed measurement in the standards we checked; we define checkable ones; RES-08). Changes v2 (SKELETON) / v3 (GUARDRAILS) notes added.", "review": "[panel · changes] CHANGES: 2 must-fix, both cheap. Structure passes. The order is problem -> fix -> why -> limits; budgets total 900 and every subsection sums correctly. D1 is layered as decided (gap 1a, provenance 2b, selective undo 2e only, testimony vs evidence 3a, flagged for Aarav). D2: 1b uses card #1/#2 qualifiers and the never-quote items. D3: the box gives one credited clause, P5's journal point goes inside it or unnamed, and the 'dense spread' fix is carried. D12: F2+ with the W6 label and x10 kept out of the story. D13: definitions + targets, no seconds. Cross-checks against FACT-CARD, GUARDRAILS v2, TERMS and C6 v2 are clean: 'never cancelled here' in 2d vs cancel_outbox in 2e is correct.\\nPASTEABLE-PROSE CHECK: PASS. No bullet is a sentence. The quoted strings ('tamper-evident up to the last witnessed head', 'orthogonal rollback', 'maps to', 'in a safe state') are mandated wording or attributed quotations, not prose. The writing-plan sentences are instructions. The residual risk is structural: ~124 bullets in a fixed order invite one sentence per bullet, which reads kit-shaped and machine-like. Must-fix 1 also addresses that.\\nMUST-FIX 1: the budget cannot hold the points. 1c has 12 bullets plus a 7-bullet box in 120 words, and the clause alone is 20-30. 2d has 10 in 60, 2e has 12 in 75, 2f has 7 in 40. Every line reads as 'must establish', so Aarav either overruns or writes telegraphic text, and both hurt with this jury. Tag every bullet MUST or IF-ROOM, at most ~1 MUST per 15 budget words. Demote these to IF-ROOM: 1b #9 catalogued incidents (keep 'single-agent, in our search' only as a qualifier) and #3 hindsight; 1c sagas #13, OTel #11, FAMAS #6, random baseline #5; the box's optional #7 numbers (delete them: they cannot fit in 30 words beside 'by design', 'orthogonal rollback', 'complementary' and the arXiv ID); 2b MCP #12; 2d epoch and anti-framing; 2e append-only, over-taint (L2 covers it) and the dry-run chain (keep 'approved plan'); 2f tamper-alert freeze. Define TTI/TTC once, in 3b: delete the duplicates in 2c/2d. Add one line under the budget table: section totals are binding; subsections are +/-15 and bullet order inside a subsection is free. ABS-07 reviewers then enforce totals, not micro-budgets.\\nMUST-FIX 2: the framing can be sharper. The jury 'rewards the team that frames the problem best'. Our strongest frame is that the brief's own requirement ('reverses one agent's damage WITHOUT discarding the other agents' work') is undefined once honest agents have read the bad write. 1a states that abstractly, and the IBAN example only arrives in 2a, inside the fix. Move the example into 1a so the gap is shown, not told. 1a bullets: brief's frame + brief's 'without discarding' clause [CHARTER] -> crm swaps IBAN; billing/payments/comms acted on it; inventory/docs untouched [D12 · W6 label] -> their work is honest AND built on the bad write -> 'undo crm' undefined [P1]. Rebudget: 1a 70->100, 1b 110->90, 1c 120->110 (problem stays 300). Delete 2a: 2b opens by walking the example. Then 2b 70->80, 2d 60->65, 2e 75->95, 2f 40->45 (fix stays 330, total 900). Also show in 2c/2d/2e that they map 1:1 to the brief's three scores (time-to-identify / time-to-contain / clean recovery). That is already the structure; one tag line per heading makes it explicit.\\nSHOULD-FIX: 3a, tag the brief's 'an agent that can be audited, not only demoed' [CHARTER]; testimony vs evidence answers it directly. 3b, add a bullet: the brief's three scores have no agreed measurement in the standards we checked -> we define checkable ones, scored against the oracle [RES-08 headline; qualifier 'in the standards we checked']. Ask zoya to add it to GUARDRAILS as W7 if adopted.\\nNits: 1b, '✗ internal / cyber [#1]' is enough; the 'card #1 overrides P2' flag is stale because P2 is fixed in ABS-02 v2. 2d, write 'reconciliation mismatch (class U)', not bare 'class U' (D7). 3c, NIST MANAGE 4.3 is sourced in RES-08 [19], not on the card; tag it there. Re-review is quick once the tags and the 1a move are in.\n\n[panel · done] DONE. v2 resolves both must-fixes, and the should-fixes and nits are in.\nMUST-FIX 1 (budget vs points): PASS. Every point bullet is tagged. 55 MUST and 33 IF-ROOM. I counted MUSTs per subsection and they match the table: 1a 6, 1b 6, 1c 3 + box 4, 2b 5, 2c 3, 2d 4, 2e 6, 2f 3, 3a 4, 3b 4, 3c 2, Limits 3, Show 2. No subsection goes above about 1 MUST per 15 budget words. All the demotions I listed are applied. The #7 numbers and their 'dense spread' line are gone, and a Guard bars them from the clause. TTI/TTC is defined only in 3b, and 2c/2d point there. The binding rule sits under the table: section totals binding, subsections ±15, bullet order free. Guard: lines carry no tag and cost no words, which is the right split.\nMUST-FIX 2 (framing): PASS. 1a opens on the brief's 'without discarding' clause, which matches CHARTER line 10. It then shows the gap with the IBAN example: crm swaps, billing/payments/comms act on it, inventory/docs untouched, their work is honest AND built on the bad write, so 'undo crm' is undefined [P1]. The ×10 Guard moved with it. 2a is deleted and 2b opens by walking the example. Budgets: 1a 100, 1b 90, 1c 110, 2b 80, 2c 45, 2d 65, 2e 95, 2f 45. Totals 300 / 330 / 170 / 85 = 900 plus the 15-word title. Scores: lines tie 2c/2d/2e 1:1 to time-to-identify / time-to-contain / clean recovery.\nSHOULD-FIX + NITS: PASS. 3a quotes 'audited, not only demoed' verbatim (CHARTER line 14). The 3b W7 bullet keeps 'in the standards we checked', and GUARDRAILS v3 W7 matches it. F11 has the 'approved' recovery-plan step and agrees with 2d ('never cancelled here') and 2e (cancel as an approved plan step). 1b now reads '✗ internal / cyber [#1]'. 2d now reads 'reconciliation mismatch (class U)'. 3c tags NIST to RES-08 [19].\nPASTEABLE-PROSE CHECK: PASS again. Every bullet is a fragment of arrows, colons and middots. The only full sentences are the key, the binding rule, the writing plan and the Changes notes, and all of those are instructions. Writing-plan step 5 still requires own words typed in an editor, nothing pasted. Fewer MUSTs also removes the one-sentence-per-bullet risk I raised in v1.\nOptional nits (no re-review): (a) some bullets run 13-17 tokens counting symbols (3b TTI line, W7 bullet, 2e triage). About 12 real words, fine as notes. (b) Section 2 now starts at 2b. Keep the labels, since ABS-07 comments and this log cite them, or add '(2a merged into 1a)' beside the heading. (c) 1b is the densest section (6 MUSTs, mostly qualifiers, in 90 words). Tell Aarav the qualifiers can be a parenthetical, not separate clauses.", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}, {"t": "19 Nov 01:00", "who": "zoya", "msg": "→ in_progress: started skeleton"}, {"t": "19 Nov 01:02", "who": "zoya", "msg": "posted result summary"}, {"t": "19 Nov 01:02", "who": "zoya", "msg": "→ in_review: skeleton ready for panel"}, {"t": "19 Nov 06:00", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 06:04", "who": "zoya", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "zoya", "msg": "→ in_review: panel fixes applied"}, {"t": "19 Nov 06:07", "who": "panel", "msg": "review: done"}]}, {"id": "ABS-07", "title": "Review Aarav's abstract draft: comments only, two rounds", "sprint": 2, "track": "pitch", "owner": "zoya", "reviewer": "anaya", "model": "opus", "created_by": "zoya", "status": "todo", "outcome": "Two comment-only review passes on Aarav's own draft (round 1 and round 2), each returned within 4 h, so he can submit by 22 Nov", "acceptance": ["Starts only when Aarav submits a draft; each round's comments are located (section/line) and tagged: fact (vs FACT-CARD), claim (vs GUARDRAILS), term (vs TERMS), structure/word count (vs SKELETON)", "Comments only: no rewritten or suggested replacement sentences anywhere (Charter); anaya checks every fact comment", "Round 2 records which round-1 comments Aarav resolved, which remain, and the final word count"], "depends": ["ABS-01", "ABS-02", "ABS-04", "ABS-06"], "deliverable": "abstract/REVIEW-R1.md (round 2: abstract/REVIEW-R2.md)", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}]}, {"id": "ABS-08", "title": "Update abstract kit for the design freeze (D13, hero, S*)", "sprint": 2, "track": "pitch", "owner": "zoya", "reviewer": "anaya", "model": "opus", "created_by": "zoya", "status": "done", "outcome": "Kit files consistent with CALL-02: new D13 meaning, triage kept, S* definition", "acceptance": ["TERMS, GUARDRAILS, SKELETON, JURY-QA updated per CALL-02 follow-ups", "no pasteable prose introduced", "Changes notes added"], "depends": [], "deliverable": "abstract/", "summary": "Kit aligned to CALL-02 freeze, notes and rules only (no pasteable prose); Changes notes in each file. TERMS v2: all of Maya's ABS-04 code-name fixes applied (culprit = RunConfig/RecoveryPlan.culprit, suspect row (console only), alert fields (not signed), envelope/act chain/tick/read set/ActionClass/witness/verify first_bad seq/reconcile/side store/outbox/holds/RunConfig fields/TaintSet/diff); accepted additions merged; new rows connection, operator (ks.operator replaces ks.console), field object, kept, culprit-window loss (c_culprit_window), collateral stall, oracle-assisted, F2+x, F2+c. S* = same seed, fault off, culprit stops from its suspension tick; B/G frozen at t_rec; R counts held/flagged; hero triage kept; write-write conflict field-or-row; release = fresh epoch; metric keys post_alert_tainted_effects / irreversible_tainted_released; s7 closed except collateral-stall key (tara). GUARDRAILS v4: F3, F9, W1, W6, F11/X29/s3 release wording, new L8 (F2+c) and L9 (F2+x) honesty notes, s1.5 D13-meaning row (six elements, Aarav words it, flag) + updated defs. SKELETON v3: 1a, 2b, 2e (triage kept, no flag), 3b (S*, D13 elements; MUSTs 55->56), baselines oracle-assisted. JURY-QA Q10 conflict line (kept; honest conflict in F2+x); stale Q4/Q5/Q12 pointers listed for anaya, not edited. SYNTHESIS s6 rewritten (S*, B/G at t_rec, held-at-T, collateral stall, c_culprit_window, oracle-assisted) + errata line. how-it-works 3c not touched (not in brief).", "review": "[anaya · done] Checked TERMS, GUARDRAILS, SKELETON, JURY-QA and SYNTHESIS s6 against CALL-02 and my anaya.md s3-4. Hero = field objects with triage kept (no flag); S* = same seed, fault off, culprit stops from its suspension tick; F2+x and F2+c present; baselines oracle-assisted; c_culprit_window present; revised D13 meaning is carried as six elements with no pasteable sentence, so Aarav words it himself. No new outside numbers, so FACT-CARD still holds. Greps for flagged / triage / suspect / restore epoch / bare post_alert_tainted show no contradictions: every hit is either the kept-triage rule, the F2+x conflict case, an honest 'suspect = root_candidates[0], console only', or a changelog line. Nits, none blocking: (1) TERMS s7 item 6 says ADR-06 still has the old metric names, but ADR-06-metrics.md now uses the new ones, so drop that note. (2) Collateral stall key: ADR-06-metrics s2 defines 'stall' only as prose, not a score.json key. Name it collateral_stall, shaped {n,d} like R and C, and keep it apart from fp_cost.stall_ticks (honest-suspension ticks). Its formula S0_T vs S*_T compares the two oracles and so measures the culprit mirror, not stall imposed on honest work. It should compare the system run's final_T against the unmirrored S0 for non-culprit keys, as CALL-02 anaya.md s2.1 says. tara to fix in ADR-06, then TERMS s7 item 10 copies the key. how-it-works 3c is untouched, as scoped.", "log": [{"t": "19 Nov 06:33", "who": "zoya", "msg": "opened"}, {"t": "19 Nov 10:59", "who": "zoya", "msg": "→ in_progress"}, {"t": "19 Nov 10:59", "who": "zoya", "msg": "posted result summary"}, {"t": "19 Nov 10:59", "who": "zoya", "msg": "→ in_review"}, {"t": "19 Nov 11:08", "who": "anaya", "msg": "review: done"}]}, {"id": "ADR-00", "title": "ADR-00 Topology, tick barrier and determinism", "sprint": 2, "track": "eng", "owner": "maya", "reviewer": "panel", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Process topology (gateway, witness, one subprocess per agent, signer handles, sockets) and the gateway-as-scheduler tick barrier that makes seeded runs reproducible; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Decision specifies the tick barrier: one envelope or no-op per agent per tick, executed in agent_id order, gateway assigns seq/ts/record_id", "Names the determinism tests: same seed twice → byte-identical records; faulty run == S* before t0", "States the key-isolation claim verbatim: enforced in production (uid/container), detected here by reconciliation"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-00-topology-determinism.md", "summary": "Verified ADR-00 against Panel M1-M7/S1-S6, maya's assignment-table items (A1,A3,C1-C5,C7,D3,E4,F6,I1,J1,K1-K4,M1,M2) and X1-X9: all present, no contradictions found (run-dir modes, MAX_SIGN_PER_TICK, c-0, ks.operator consistent with CON-02/ADR-02). Fixes: trimmed 1619 to ~1390 words, referencing contracts/other ADRs; condensed Amendments changelog so every applied id is listed (incl. X3b-d, S1-S6 mapping).", "review": "[panel · changes] PANEL review of ADR-00 (19 Nov). Verdict: CHANGES. All four acceptance criteria are met (899 words, all five sections, barrier and test names present, key-isolation wording verbatim). The design is right: the gateway is the scheduler, it alone assigns seq/ts/id, and wall clock goes only to timing.jsonl. Seeded bench runs with scripted decisions and no rogue will reproduce. Live demo runs and rogue runs will not reproduce as written, and the stall claim has gaps at the I/O level.\n\nMUST-FIX\nM1 Human decisions land at a wall-clock tick. The tick at which an approval/suspend/release/revoke lands depends on how fast the human clicks. That tick moves post_alert_tainted, irreversible_released, R and C, so a live demo run cannot be re-run. Ticks are also not paced: an N-tick run can end, and its keys die, before anyone approves the plan. Fix: decision points block the barrier. When a plan or anomaly awaits a human, the gateway does not open tick plan_tick+L (L = RunConfig.decision_latency_ticks) until the decision arrives. A click that arrives early is held until that tick. Bench scripts the same L. A re-run replays the ks.console/ks.recovery Controls from record.jsonl at their recorded ticks. Live clicks then stop breaking determinism, and the Consequences line should change to say so.\nM2 S*/t0 disagree across ADRs, so T2 fails by construction. ADR-00 says S* = a clean run with the same seed. ADR-06 says S* = the culprit slot emits no-ops for the WHOLE run. Under ADR-06's definition, crm's legitimate pre-t0 writes are missing from S*, so \"faulty == S* before t0\" fails and B is polluted. Pick one: culprit no-ops for tick >= fault_tick. t0 is defined three ways: RunConfig.fault_tick (ADR-00), first injected effect (ADR-06), and t0_seq (ADR-05, an estimate). Rename ADR-05's to t0_seq_est. Mark fault_tick like culprit: scorer-only, never read by ks.monitor/ks.recovery. Test: blank fault_tick in config and the record stays identical.\nM3 Late and extra frames make records nondeterministic. Collect closes as soon as every agent has answered, so whether a flooder's 2nd/3rd frame lands in tick n or n+1 depends on timing, which shifts seq/ts_us/hash for everyone. Fix: per connection, read exactly ONE frame per tick in FIFO order. A frame tagged <n is recorded as deny/late_frame (not 'expired', which ADR-01/03 use for expiry_tick) and the slot is a no-op. Define future-tick frames (deny). Record them at a fixed position (that agent's slot in the execute phase). A flooder then fills its own socket buffer and only delays itself. Add T3b: a rogue that floods and pre-sends frames still gives T1-identical records.\nM4 The barrier is safe but the I/O is not. (a) If a rogue stops reading, its socket buffer fills and a blocking gateway send of TickFrame/ReplyFrame/SignReply stalls the whole barrier. All agent-facing sockets must be non-blocking, with a bounded outbound queue and EOF on overflow. (b) The reader must be non-blocking, bounded by MAX_FRAME_BYTES, and must never wait for an LF (slowloris). (c) Set a per-tick SignRequest quota on the in-gateway signer (ADR-01 mentions rate limits but gives no number). (d) Witness: 'tick n+1 waits for the ack' and 'no ack raises witness_stall' conflict. Say: wait up to the deadline, then proceed and raise witness_stall. Otherwise a hung witness hangs the run, and ADR-02's W-tick detector can never fire.\nM5 Stall cost and teardown. (a) A sleep-forever rogue costs 2 s per tick, so 100 ticks take 200 s and the 5-minute demo is gone. Add deterministic eviction: after K consecutive misses, close the connection (EOF, no epoch bump, not a suspend, plus an anomaly). Or state the cost and use a short --tick-deadline-ms on the demo machine. T4 should assert a wall-time bound. (b) Forked children survive the SIGKILL of the agent, keep the reused uid 60001+i, and can break the next run: RLIMIT_NPROC on spawn, CPU contention. Kill by uid or cgroup at teardown, and refuse to start if any process with uid 60000..6000N exists. (c) Set oom_score_adj -1000 on gateway/witness and +1000 on agents, so a memory bomb kills the rogue and not the TCB. (d) Run the --rogue slot at nice 19 / SCHED_IDLE with RLIMIT_CPU, so CPU spin cannot make honest agents miss deadlines. T4 should add CPU-spin and memory-bomb variants and assert 0 honest misses.\nM6 Fresh-key projection. Maya's gap is acceptable as stated, because a signature we can reproduce is a signature an attacker can forge. Conditions: (a) the projection is a function in ks.contracts, not an ad-hoc jq, and it must also strip keys.json, which ADR-00 omits although keys.json is in DETERMINISTIC_FILES. (b) T1b must assert that the key-independent artefacts are byte-identical WITHOUT stripping: config, alerts, plans/**, sidestore/**, effects.jsonl, oracle/**, score.json. By contract they do not depend on keys: envelope_hash excludes sig, and idempotency_key is derived from (agent, action, sink, n). (c) DETERMINISTIC_FILES lacks effects.jsonl, oracle/ and score.json, which are exactly the scorer's inputs. Add them through CON-02 or name them in T1. (d) Add RunConfig.key_mode = fresh|repro, so the run dir alone shows that a run is 'not a security run'. (e) In fresh mode the witness generates its own key and the gateway never holds it. Otherwise THREAT-MODEL B3's 'own key' is false and ADR-02 contradicts ADR-00. (f) The repro secret file is 0600 uid 0. --repro-secret is forbidden for D11 live attacks, because a key root on disk voids C1/C4.\nM7 The topology omits the operator channel. ks contain / ks recover --apply / ks console --live need to reach the live gateway, and ADR-00 has only path-less agent socketpairs. Specify a socket in a 0700 uid-0 dir with an SO_PEERCRED uid==0 check. Otherwise a rogue uid could forge ks.console Controls, which breaks the THREAT-MODEL target '0 forged Control actions'.\n\nSHOULD-FIX\nS1 Use one RNG derivation with ADR-06 (ADR-00 uses sha256(seed||name) streams, ADR-06 uses sha256(seed|agent|tick)). Encode it canonically and length-safe: sha256(canonical([seed,name,tick])). Per-tick derivation means a dropped or late step shifts no later draws.\nS2 Make the ts_us slot bound computable. Cap per tick the control-phase records (including recovery steps, with deterministic carry-over), dispatch records and capped late frames, and check that tick_us is larger than the sum.\nS3 State in-tick visibility: execution is sequential, so payments sees crm's same-tick write, which matches ADR-05(c). ADR-06's 'reader sees writes from earlier ticks' is wrong for adapter reads.\nS4 T4 'other agents' records unchanged' must mean a per-agent projection (tick, tool, args_hash, decision, read/write sets), because seq/ts/hash shift. T1 should run the gateway under different PYTHONHASHSEEDs. Rogue byte-identity (ADR-07 test 6) holds only for rogue code that draws only from its stream seed.\nS5 C4: the barrier.deadline anomaly cannot name its connection, because Alert.conn_id is signature-only (validator) and ADR-04 says detectors never name anyone. Add a conn_id allowance to the CON-02 request, and ADR-04 adds barrier.deadline (never hard) to its catalogue.\nS6 A post-run 'ks recover --dry-run' writes into plans/ of an evidence dir that T1 compares. Write it outside the run dir.\nWord budget: the fixes will not fit in 900 words. Trim lifecycle steps 1-2 (already in ADR-02/contracts) and push details into test names.\n\nDEMO, fresh keys: never say 'byte-identical' for a live run. Beat: run F2+ twice with fresh keys; ks verify OK on both, each under its own keys; sha256(score.json) is identical; 'ks repro A B' (ADR-07 to add) reports 0 differences outside {sig, hash, prev_hash, gw_sig, head, pub}. Line: 'Reproducible behaviour, unrepeatable signatures: a signature we could reproduce, an attacker could forge.' Byte-identical claims are reserved for the >=20-seed bench under --repro-secret, labelled 'not a security run'. Never publish the secret of a run presented as evidence.\n\n[panel · changes] PANEL RE-REVIEW (19 Nov, Call #2 amendments), read against CALL-02/resolutions.md and CALL-02.md. Verdict: CHANGES, small; the design is resolved, three loose ends remain.\nMUST-FIX: M1 resolved (gate C1, L = decision_latency_ticks, early click waits, --decisions replay, bench same L; other live Controls land at the next control phase per resolutions C1, accepted since they are recorded and replayed). M2 resolved (S* = fault disabled per A1, which supersedes my 'culprit no-ops >= fault_tick' fix; fault_tick/culprit blanked by tcb_view(); t0_seq_est in ADR-04/05; test_tcb_blind). M3 resolved (one frame per conn per tick FIFO, deny/late_frame in the agent slot, surplus queued, T3b). M4 resolved (non-blocking sockets, 64 KiB cap, bounded reader, MAX_SIGN_PER_TICK=2, witness waits to deadline then witness_stall). M5 resolved (EOF after 3 misses, kill by uid, refuse to start, oom_score_adj, nice/SCHED_IDLE/RLIMIT_CPU, T4 variants and wall-time bound). M6 resolved (determinism_view, keys.json dropped from DETERMINISTIC_FILES per C4, T1b unstripped equality, key_mode, witness own key, repro secret 0600 uid 0, banned for D11/RT2/RT8). M7 resolved (operator.sock, 0700 uid 0, SO_PEERCRED, test_operator_sock_rejects_agent).\nSHOULD-FIX: S1 resolved (sha256(canonical([seed,name,tick]))). S2 resolved (caps 32/32/agents, startup assert). S3 resolved (sequential visibility, test_same_tick_visibility; ADR-06 matches). S4 resolved (3 PYTHONHASHSEEDs, per-agent projection) except the rogue-identity claim, see C1 below. S5 PARTIAL: barrier.deadline is in ADR-04's soft list, but no conn_id allowance for it exists in CON-02-requests or the CALL-02 checklist, and ADR-00 puts the agent in root_candidates for an alert with empty evidence_seqs while ADR-04 says detectors never name anyone. S6 resolved (dry-run writes outside run dir).\nCROSS-ADR: spot-checked ADR-01..07 and THREAT-MODEL for the contradictions. Resolved: S* definition (ADR-06 x2), t0 (t0_seq_est, no 'injected'), RNG derivation, late_frame vs expired, in-tick visibility, ks.console to ks.operator (grep clean in ADR-01..07), witness wait/stall (ADR-02 matches), key modes and witness key (ADR-01/02), keyring completeness, keys.json handling, operator socket (ADR-07), ks repro and DIVERGED (ADR-07), c-0/system id rules (ADR-01/03), epoch/expiry. UNRESOLVED: C1 ADR-07 line 26 and test 6 say 'ks run --rogue twice, same seed gives byte-identical records', but ADR-00 forces fresh keys for --rogue (repro refused), so signatures differ; must say identical under determinism_view() (or equal per-agent projection). C2 (S5 above). C3 THREAT-MODEL still lists 4 key classes (agent, gateway, witness, recovery) and says the gateway signs Control actions; it omits ks.monitor/ks.operator (E2/E3).\nOTHER: ADR-00 is ~1389 words against the binding 900-word limit (resolutions header, acceptance criterion 1); trim or get a PMO waiver, as every ADR is over. Two ADR-06 files exist (ADR-06-metrics.md, ADR-06-world-faults-oracle.md); keep one.\n\n[panel · done] PMO-verified close-out of Panel re-review: S5 resolved in integration pass (barrier.deadline names conn only); C1 fixed (ADR-07 determinism_view wording, lines 26/35); C3 delegated to Kabir's THREAT-MODEL v4; length waived by D-14.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:06", "who": "maya", "msg": "→ in_progress: drafting ADR-00 from CALL-01, THREAT-MODEL v3, contracts 1.0.0, PANEL-ENG-00"}, {"t": "19 Nov 06:07", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 06:07", "who": "maya", "msg": "→ in_review: ready for panel"}, {"t": "19 Nov 06:15", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 06:19", "who": "maya", "msg": "ADR-00: surplus frames in the current tick now give deny/over_quota, aligning with ADR-03 and SEC-02 RT5; earlier-tick frames stay deny/expired. Contracts README key-isolation paragraph aligned to THREAT-MODEL v3. CON-02 requests M1-M3 filed in org/reports/CON-02-requests.md"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "From the kabir review of ADR-01/02/03 (consistency): (1) reserve conn c-0 for system principals; ADR-03 assigns seq at step 9, but StateWriter needs it inside the txn, so assign it at execute (T5). (2) Witness topology: ADR-02 says the witness reads record.jsonl; keep your version, where the gateway sends (seq, head, tick), and in fresh mode the witness generates its own key (Panel M6e). (3) Name witness-heads/ in the RunDir layout (CON-02 K7). Details: CON-02-requests.md, kabir section."}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "Call #2 freeze adopted — apply your items from CALL-02/resolutions.md assignment table + amendments X1–X9 as an 'Amendments (Call #2)' section"}, {"t": "19 Nov 10:56", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 10:56", "who": "maya", "msg": "→ in_review: freeze applied and verified"}, {"t": "19 Nov 10:58", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 10:59", "who": "pmo", "msg": "PMO D-14: 900-word cap waived (≤1,500). Length-only findings closed; substantive items go to the integration pass."}, {"t": "19 Nov 10:59", "who": "maya", "msg": "integration pass: barrier.deadline carries conn_id, empty root_candidates; record.jsonl 0600 gateway-only"}, {"t": "19 Nov 11:00", "who": "panel", "msg": "review: done"}]}, {"id": "ADR-01", "title": "ADR-01 Identity and envelope signing", "sprint": 2, "track": "eng", "owner": "arjun", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "How agents sign C1 envelopes without holding keys (signer handle), what the gateway verifies (sig, nonce, expiry, epoch, act chain), and what happens on failure; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Decision: keys never enter the agent process; agent signs via a signer handle; agent + gateway signatures over the shared canonical serializer", "Decision: a bad signature suspends the submitting connection, never the claimed agent_id; replayed/expired envelopes are denied and recorded", "Tests listed map to RT2 (key theft), RT3 (forgery), RT4 (replay), RT6 (clock games)"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-01-identity-envelope.md", "summary": "Freeze applied (<=1,300 words): monotonic epochs, MAX_EXPIRY_TICKS=8, conn deny-list, c-0 system envelopes, ks.operator rename, keyring/key_mode fresh|repro, signer refusals and MAX_SIGN_PER_TICK, nonce_reused for action_id reuse, X6/X7; tests rewritten incl. RT3c. Amendments (Call #2) listed.", "review": "[kabir · changes] Verdict: CHANGES. The design is right and all four acceptance criteria are met on paper: 850 words, all five sections; keys stay out of the agent behind a signer handle; commit-then-sign over the shared canonical serializer; a bad sig suspends the connection, never the claimed agent; replayed and expired envelopes are denied and recorded; tests map to RT2/3/4/6 plus RT3b. Six material holes remain. Three of them are already blockers in SEC-03 (B2, B3, F2), and ADR-01 is where they have to be closed.\n\nMUST-FIX\nM1 Epochs and expiry (SEC-03 B3; contradicts ADR-04 §6). \"Current epoch\" is never defined, and ADR-04 restores the pre-suspend epoch on release. A rogue presigns at epoch e with expiry_tick = 2^53-1 (accepted today); after a release, every one of those envelopes is valid again (RT4 stale_epoch and RT5 presigned flood both fail). Fix in Decision 4: (a) per-principal epochs are strictly monotonic. Start at 0; every agent suspend/revoke/release sets a value above every earlier one; an epoch is never reused. (\"release restores the agent's ability to act\", not \"restores the epoch\".) (b) MAX_EXPIRY_TICKS (proposed 8): expiry_tick > tick + MAX_EXPIRY_TICKS gives deny/expired, and the nonce store keeps exactly that window. This makes \"pruned by the expiry window\" safe. (c) Say how an honest agent learns its new epoch after a release, or RT11's \"release restores work\" fails because the agent keeps sending stale_epoch: TickFrame gains `epoch` (CON-02; ADR-07 lists this as open).\nM2 Connection suspension is not enforced anywhere. Step 5 checks only the agent's status. After RT3 suspends conn:c-R, the rogue's own validly signed envelopes (agent docs, which is still active) pass every step and execute. Fix: step 5 first checks the conn deny-list (conn suspended or revoked gives deny/suspended or deny/revoked) and then the agent. The ADR-03 step-8 in-txn re-check must also read the conn deny-list. State it: conns are 1:1 with agent processes (path-less socketpair), there is no reconnect, and conn release is a ks.console Control. RT3 pass then adds: 0 exec records with conn_id == c-R and seq > the suspend seq.\nM3 System principals and Controls (SEC-03 F2, N2, N7). Decision 1 lists gateway, witness and recovery keys. SYSTEM_PRINCIPALS also has ks.monitor and ks.console, and Controls are signed by the issuing principal (control.issued_by). Fix: (a) keys.json holds one key for each of ks.gateway, ks.witness, ks.monitor, ks.console, ks.recovery and each agent, and verify fails closed if any is missing. (b) System envelopes are signed in-gateway and enter only on the internal connection c-0, never on c-1..; the operator channel follows the Panel's ADR-00 M7. (c) On an agent connection (c-1..), a system agent_id is never verified: it gets deny/bad_sig, so sig_ok=false holds and the conn is suspended. An agent-signed envelope with a tool starting \"ks.\" gets deny/out_of_scope immediately after step 5. (d) The signer refuses a header whose agent_id is not its bound principal, a ks.* tool, a non-null sig, a stale epoch, or a suspended principal. It also has a numeric quota, e.g. at most 2 signatures per tick per principal (Panel ADR-00 M4c). The Consequences line \"rate limits bound that\" is otherwise untestable.\nM4 Key generation contradicts ADR-00 and leaves a hole in RT2 (SEC-03 B2; Panel ADR-00 M6). ADR-01 says \"generated in memory\"; ADR-00 derives keys with HKDF(key_secret, seed) and adds --repro-secret FILE. Fix: adopt ADR-00's derivation by reference, and state: (a) private keys are never a function of the seed alone; (b) in fresh mode the witness generates its own key and the gateway never holds it; (c) the repro-secret file is 0600 uid 0, never under the run dir, and forbidden for D11 live runs and for RT2; (d) RT2 runs in fresh mode and counts key_secret among the bytes it scans for; (e) a new unit test checks that two same-seed fresh runs produce different keys.json.\nM5 Tests that cannot pass as written. (a) RT4 \"pre-suspend epoch\": an envelope that already executed has a consumed nonce, so step 4 answers nonce_reused before step 5 can say stale_epoch. Use a presigned, never-sent envelope with the old epoch and expiry within MAX_EXPIRY_TICKS. (b) RT6 \"records equal the claim-free run\" is false: claimed_* sit in the signed header, and extra keys give deny/schema, so the bytes and decisions differ. Use instead: every record's (seq, tick, ts_us, record_id) follows the ADR-00 T5 formulas; the honest agents' records are identical between the two runs in the determinism projection; claimed_* appear only inside envelope. (c) RT3 spliced args: name the outcome. An args_hash mismatch gives deny/bad_sig, which suspends the conn. (d) Add a test for the THREAT-MODEL row \"forges suspend/release/revoke/recover\", which has none today. An agent submits ks.control claiming ks.console (bad_sig), and one under its own id (out_of_scope); 0 Controls are applied.\nM6 action_id uniqueness. idempotency_key and the scorer's \"first bad action_id\" both assume (agent_id, action_id) is unique, but nothing enforces it. Fix: the gateway denies a reused (agent_id, action_id) as deny/nonce_reused (or a new reason, CON-02), checked with the nonce at step 4.\n\nNITS\n- Say which deny reason a SubmitFrame.tick that does not match the barrier tick gets: late_frame per the Panel's ADR-00 M3, not \"expired\", which this ADR keeps for expiry_tick.\n- act_chain is self-declared, so a rogue child can omit it. Add one Consequences line: ancestor denial binds honest descendants only, and a rogue child is contained by its own suspension. RT12 also needs a world mechanism (ADR-06) that gives an honest child its parent's action_id.\n- \"SPIRE documents no revocation\": write \"SPIFFE relies on short-lived SVIDs rather than revocation (RES-03)\".\n- Word budget: the fixes will not fit in 900 words. Cut §9 to two lines and move test detail into test names.\nRe-review needs: M1-M6 in the text, the RT4/RT6 rows rewritten, and the forged-Control test added. Contract asks: org/reports/CON-02-requests.md (kabir section).\n\n[kabir · done] M1 epochs strictly monotonic, MAX_EXPIRY_TICKS=8 with matching nonce window, TickFrame.epoch: resolved (D1/D2/D3). M2 conn deny-list at step 5 and in step-8 txn, 1:1 conns, RT3 0 exec after suspend: resolved. M3 keyring of 6 principal kinds fail-closed, c-0 only for system envelopes, system id on c-1.. is bad_sig, agent ks.* out_of_scope, signer refusals plus MAX_SIGN_PER_TICK=2: resolved. M4 fresh/repro key modes, witness own key, repro 0600 uid0 outside run dir and banned for D11/RT2/RT8, RT2 scans key_secret, test_fresh_keys_differ: resolved. M5 RT4 presigned unsent, RT6 projection rewrite, spliced args bad_sig, forged-Control RT3c: resolved. M6 (agent_id, action_id) reuse is nonce_reused at step 4: resolved. Nits (late_frame, act_chain consequence, SPIFFE wording, trimmed s13) also applied. Note: ADR is ~1200 words vs the 900 cap in resolutions; not a security matter.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "→ in_progress: drafting ADR"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "→ in_review: ready for kabir"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "review: changes"}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "Call #2 freeze adopted — apply your items from CALL-02/resolutions.md assignment table + amendments X1–X9 as an 'Amendments (Call #2)' section"}, {"t": "19 Nov 06:35", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 06:35", "who": "arjun", "msg": "→ in_review: freeze applied"}, {"t": "19 Nov 10:58", "who": "kabir", "msg": "review: done"}]}, {"id": "ADR-02", "title": "ADR-02 Recorder, witness, verify and PII side store", "sprint": 2, "track": "eng", "owner": "arjun", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Hash-chained C2 record written only by the gateway, a separate witness process taking a signed (seq, head, tick) every tick, ks verify, and a redactable side store for values; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "verify checks chain, agent+gateway signatures, witness heads, seq gaps and reconciliation (state = fold(log)), prints first bad index, exits non-zero", "Log holds hashes only, values live in the side store; witness-head stall raises an alert; claim limited to 'tamper-evident up to the last witnessed head' (no Merkle)", "Tests listed map to RT7 (line edit), RT8 (full rewrite) and a tail-truncation case"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-02-recorder-witness-verify.md", "summary": "Freeze applied (<=1,300 words): RunAnchor/--head, count chain, strict-parse split (TAMPER parse_error), truncation first_bad n+1, freeze trigger from chained ks.alert, F4 dispatch-window check, F6 TTI from chained alerts, witness topology/stall, RT8(g,h). Amendments (Call #2) listed.", "review": "[kabir · changes] Verdict: CHANGES. The structure is right and the acceptance criteria are met on paper: 897 words, all five sections; verify checks chain, both signatures, witness heads, seq gaps and reconciliation, prints first_bad and exits non-zero; values live in the side store; there is a stall alert; the claim stays \"tamper-evident up to the last witnessed head\" with no Merkle trees; tests map to RT7, RT8 and tail truncation. A jury can still beat verify, though, and several pass criteria contradict the decision text. PMO has already decided `count` (contracts v1.1).\n\nMUST-FIX\nM1 Keyring swap defeats verify (SEC-03 B1). keys.json is an editable run-dir file, and verify takes every public key from it. An insider who holds no key rewrites the chain, generates their own gateway and witness keypairs, rewrites keys.json, and re-signs every record and checkpoint, and verify returns OK. That is RT8 without the witness key, which the THREAT-MODEL says is detected. Fix: the console prints keyring_hash and config_hash at start, and at the end prints a RunAnchor {seq, head, tick, count, keyring_hash, config_hash} (CON-02). `ks verify --head` takes that anchor line and checks the hashes before any signature. VerifyReport gains `anchored`. The C1 claim holds only for anchored verification; unanchored it is \"consistent, not anchored\". ADR-07's `ks verify RUN [--json]` has no --head flag, so add it there too. SPEC RT8 gains variant (h), a keyring swap: WITNESS when anchored, documented as outside the claim when unanchored.\nM2 count (PMO decision). Delete the \"Contract gap … Fallback\" paragraph. Specify: count starts at 1 and goes +1 per checkpoint line; verify checks w[i].count == i. The anchor's count must equal the last line's count, and its head must equal that line's head. Checkpoints: tick strictly increasing, seq non-decreasing (no-op ticks repeat seq/head, per ADR-00), seq <= n.\nM3 Strict parse sends tamper to IO. Step 1 maps every parse failure to Exit.IO. (a) A tampered side entry fails SideEntry validation at parse (checked: ValidationError), so RT7(b) yields IO, not TAMPER. (b) A juror who edits record.jsonl in an editor and types an uppercase hex digit, adds a space or adds a blank line fails strict parse, so the LIVE RT7 beat prints IO with no first_bad. (c) RunDir.validate requires witness.jsonl, so RT8(f) \"deleted witness.jsonl\" is IO before your \"fails closed with WITNESS\" rule can run. Fix: Exit.IO only when config.json, keys.json or record.jsonl is missing or unreadable. A record line that fails to parse or validate gives TAMPER, first_bad = that line's number, reason parse_error. A witness line that fails gives WITNESS. A missing or empty witness.jsonl gives WITNESS, first_bad = 1. A side entry is parsed without its validator and re-hashed; a mismatch gives TAMPER, first_bad = the lowest seq that references the hash, reason side_entry_mismatch. Put the side-store pass in the ordered list (after the record pass, before the witness pass).\nM4 Truncation first_bad. The decision gives first_bad = checkpoint.seq for a checkpoint with seq > n, while test (d) expects last_kept_seq + 1. Checkpoints cover several records each, so the two differ. Fix: a checkpoint with seq > n gives WITNESS, first_bad = n + 1, reason truncated. An anchor mismatch gives WITNESS, reason head_mismatch, first_bad = min(anchor.seq, n) + 1. Test (d) must truncate below the last checkpoint; otherwise the cut is past the claim boundary and OK is correct.\nM5 The tamper freeze has no trigger. Nothing specifies who runs verify on a live run or how often, and an edit made after the run leaves no tamper alert in alerts.jsonl. So `ks recover --dry-run` on the RT7 copy cannot return FROZEN as your test requires. Fix: (a) `ks recover` (including --dry-run) runs verify first and exits FROZEN on any non-OK result. (b) Live: each tick, the monitor re-reads record.jsonl and compares it with the gateway's in-memory running head; a mismatch raises tamper. (c) The freeze is derived from records (SEC-03 F6: alerts submitted as chained ks.alert envelopes), never from the unsigned alerts.jsonl alone. (d) Say what ends a freeze. I propose nothing does: it lasts until run end.\nM6 Witness topology and key. (a) \"It reads the record read-only\" contradicts ADR-00, where the gateway sends (seq, head, tick), and record.jsonl is gateway-only. Pick ADR-00's version. The witness signs what it is sent; it adds anchoring, not re-verification. (b) \"Own in-memory key\": ADR-00 has the gateway derive the witness key and send it over. In fresh mode the witness must generate its own key and send only the public key (Panel ADR-00 M6e). Without that, \"insider holds no witness key\" rests on the gateway alone. (c) Name the head store path `<run>/witness-heads/` (0700, witness uid; RunDir layout, CON-02), and file modes per SEC-03 F1 (witness.jsonl created and owned by the witness uid).\nM7 Stall semantics. ADR-02 uses \"W ticks\"; ADR-00 has the tick wait for the ack. Adopt the Panel's ADR-00 M4d: wait up to the deadline, then proceed and raise witness_stall. W is a named constant (1 under that rule). Settle hard: ADR-02 says never hard; ADR-04 and HARD_ALLOWED say yes, with a recovery freeze (SEC-03 N4). I propose hard=false, with the freeze tied to the kind.\nM8 RT8(g) is vacuous. ADR-00 takes a final checkpoint at run end, so a completed run has no unwitnessed tail and g tests nothing. Fix: g uses a run dir snapshotted between flush and checkpoint (hook `GatewayHooks.skip_checkpoint` at tick k), and the anchor test shows the same edit is caught once the final anchor exists.\n\nSHOULD-FIX\n- Reconcile is exact only if every state change is a record. Outbox status changes and dispatch (SEC-03 F4, ADR-03) and recovery writes must carry write_sets, or every clean run fails RECONCILE. Add that dependency and a clean-run test (verify OK including reconcile). Default --state: <run>/workspace/state.db if present; otherwise skip and report reason no_state, ok=true, so no silent pass.\n- Add per-record checks to verify: an exec ks.control/ks.recover.* record must be by a system principal, with issued_by == envelope.agent_id and conn_id c-0 (F2); epochs fold monotonically (B3); expiry_tick >= tick on exec/hold (F3); ts_us formula (N5).\n- More reasons: witness_sig_invalid, witness_missing, count_mismatch, truncated, parse_error, side_entry_mismatch, agent_sig_mismatch, keyring_mismatch.\n- Add the header line (Owner, Reviewer, Binding); fix the typo \"0600,.\".\nRe-review needs: M1-M8 in the text, and tests (b), (d), (f) and (g) rewritten to match. Contract asks are in CON-02-requests.md.\n\n[kabir · done] M1 RunAnchor + keyring_hash/config_hash checked before signatures, anchored flag, RT8(h): resolved (ADR-07 --head flag is ADR-07's item). M2 count from 1 with chain, anchor count/head match, tick/seq monotonic rules, fallback paragraph deleted: resolved. M3 IO only for missing config/keys/record; parse_error and side_entry_mismatch are TAMPER; missing witness is WITNESS witness_missing first_bad=1; side pass ordered after record pass: resolved. M4 truncated first_bad=n+1, head_mismatch first_bad=min(anchor.seq,n)+1, test (d) truncates below last checkpoint: resolved. M5 recover runs verify first, live monitor head compare, freeze from chained ks.alert records, lasts to run end: resolved. M6 gateway sends (seq,head,tick), witness own key in fresh mode, witness-heads 0700 and file modes: resolved. M7 wait to deadline then alert, W=1, witness_stall/tamper never hard with freeze by kind: resolved. M8 RT8(g) via GatewayHooks.skip_checkpoint, caught once anchor exists: resolved. Should-fixes (write_sets for dispatch/recovery, no_state skip, per-record checks, reasons, header) also applied. Nit: record.jsonl is 0640 group=witness gid, which sits oddly with ADR-00 gateway-only record; not a hole since the witness signs only what it is sent.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "→ in_progress: started"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "→ in_review: ready for review"}, {"t": "19 Nov 06:06", "who": "pmo", "msg": "PMO decision: WitnessCheckpoint gains a monotonic 'count' field in contracts v1.1 (maya, after SEC-03)"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "review: changes"}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "Call #2 freeze adopted — apply your items from CALL-02/resolutions.md assignment table + amendments X1–X9 as an 'Amendments (Call #2)' section"}, {"t": "19 Nov 06:35", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 06:35", "who": "arjun", "msg": "→ in_review: freeze applied"}, {"t": "19 Nov 10:58", "who": "kabir", "msg": "review: done"}, {"t": "19 Nov 10:59", "who": "arjun", "msg": "integration pass: record.jsonl 0600 gateway-only, witness pushed not reading"}]}, {"id": "ADR-03", "title": "ADR-03 Gateway, action classes R/C/I1/I2/U, policy and epoch fencing", "sprint": 2, "track": "eng", "owner": "nisha", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "The single mediated path: per-instance classification R/C/I1/I2/U (U denied, fail-closed), policy incl. early hold on sensitive-tagged fields, outbox for I-class, epoch + deny-list checked inside the write txn; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Classification is per action instance, unknown → U → deny; every denial is a recorded action", "Epoch and deny-list checked inside the execution transaction, holds re-checked at outbox dispatch; early hold is a generic rule on sensitive-tagged fields, not IBAN code", "Tests listed map to RT1 (DB bypass → reconcile U-alert), RT5 (TOCTOU: 0 culprit writes after quarantine seq)"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-03-gateway-classes-fencing.md", "summary": "Call #2 freeze applied: complete catalogue (crm customer writes/deletes, ledger, compliance, risk_note, ks.*, ks.dispatch), role->tool+field scope table, email=I1, early hold at creation by lineage (off at H=0), seq inside the BEGIN IMMEDIATE txn, connection deny-list, field-object adapter rules (X1/X2), fresh-epoch release. Amendments changelog added; Kabir M1-M8 addressed.", "review": "[kabir · changes] Verdict: CHANGES. On paper the acceptance criteria are met: 893 words, all five sections; classification is per instance and fails closed to U; every denial is recorded; epoch and deny-list are re-checked inside the txn; holds are re-checked at dispatch; the early hold is generic; RT1 and RT5 are mapped. Nisha's names (tools, roles, p.* ids) are hers to set, and every p.* id fits the Token pattern; ADR-04/05/06 use none of them. Checking them against ADR-06, though, the catalogue does not cover the world, and the early-hold rule as written does not catch the hero. \"No contract field changes are needed\" is also not true.\n\nMUST-FIX\nM1 Catalogue vs ADR-06 world. Under fail-closed, a tool missing from the catalogue is U, so these ADR-06 writes are denied: crm writes and deletes `customers` (F1 can never be injected), ledger writes by billing and payments, compliance `findings`, and triage's edit of `suppliers.risk_note` (no tool named). ADR-06 marks comms email as I2 while ADR-03 says I1. With I2, every email needs approval, which breaks the hero flow; ADR-06 should change to I1 (tell tara). Fix: one catalogue row per ADR-06 write, plus a role→tools scope table, which p.scope needs and which no artefact has today. Decide whether scope is per tool or per field. SPEC RT11 assumes triage can set suppliers.iban; with per-field scope (safer: triage gets risk_note only), RT11 has to move, which I will do in SEC-02. `*.read/list/search` covers only registered adapters, so an unregistered `payments.read` is U. Drop \"marks suppliers.iban sensitive\" from crm.update_supplier, because sensitivity comes only from RunConfig.sensitive_fields (that is the genericity claim). ks.control is \"signed by the issuing system principal\", not gateway-signed.\nM2 The early hold misses the hero, and hold=0 is undefined. \"changed after the item's creation\" never matches F2+: payments reads the already-swapped IBAN, then creates the payment. The swap came before the item, so only the lineage hold can stop it, and that waits for an alert. Fix, p.sensitive_early_hold: (a) at creation, an I-class item whose lineage holds a version of a sensitive field written within the last hold_window_ticks ticks starts held. (b) The dispatcher holds any item whose lineage object's sensitive field changed after created_seq. (c) At hold_window_ticks = 0 the early hold is off. Otherwise D10 and ADR-06's \"hold=0 → irreversible_released=1\" contradict the ADR. Also say where the reason goes. An exec record cannot carry sensitive_field (REASONS_FOR), so an item hold is its own record: Control{op: hold, target: outbox:<id>, issued_by: ks.gateway, auto: true, reason: sensitive_field}.\nM3 Outbox transitions and dispatch must be records (SEC-03 F4). queued→held→released→dispatched change outbox:<id> objects in state.db. Unless each change is a record with a write_set, fold(record) differs from state on every clean run, so verify gives RECONCILE and the reconcile detector suspends nobody but fires hard every tick. dispatched_seq also points at a record nobody defines. Fix: dispatch is a ks.gateway envelope with tool ks.dispatch on conn c-0: read_set = lineage ∪ {outbox:<id>@ver}, write_set = the status change. Holds and unholds are Control records. RT5 and RT10 assert on these records.\nM4 Connection deny-list. Step 5 and the step-8 re-check name only agents and ancestors. Add conn:<id> (see ADR-01 M2), or the RT3 conn suspension does nothing against the rogue's own validly signed envelopes.\nM5 Release semantics (SEC-03 B3; ADR-04 §6). \"release un-holds and restores the epoch\" would release the RT11 victim's tainted payment, and the old epoch revives presigned envelopes. Fix: release lifts holds caused by the suspension only; lineage_hold and sensitive_field holds survive and are re-checked at dispatch; the epoch is fresh, never the old one.\nM6 RT5 cannot be built as written. Under ADR-00 the gateway is a single-threaded scheduler, and Controls land only in the control phase, so \"applied from another thread\" never happens. A second SQLite writer inside an open BEGIN IMMEDIATE txn would simply block. The real window is between the step-5 fast path and the step-8 txn (plus any future concurrency). Fix: the hook `GatewayHooks.between_check_and_txn` commits the suspend Control there. Expect deny/stale_epoch or deny/suspended at step 8 and 0 exec with seq > q. Say that txns are BEGIN IMMEDIATE.\nM7 seq is assigned too late. Step 9 assigns seq after execution, but StateWriter.put(…, seq=…) needs it inside the txn (HistoryEntry.seq, ADR-05 (c)). Fix: assign seq at the start of the step-8 txn in execute order (ADR-00 T5), and append the record line after commit. Say what happens on a crash between commit and append: the run aborts and verify reports RECONCILE; neither is ever silent.\nM8 ks.* from agents and order. Add before classification: an agent-signed envelope with a ks.* tool gives deny/out_of_scope, and a system agent_id on c-1.. gives deny/bad_sig without verification (SEC-03 F2), with a unit test (\"0 forged Control actions\"). Step 4: expiry before nonce, and the nonce is consumed only after sig and expiry pass (as in ADR-01). Late frames get deny/late_frame per the Panel's ADR-00 M3. over_quota is for the per-connection flood budget (F8), not for extra frames.\n\nSHOULD-FIX\n- I2 approval: approval is `unhold action:<record_id>` by ks.console. Re-execution re-runs steps 5-8 (epoch, deny-list, lineage, in-txn) without expiry or nonce, and writes a new record citing the hold record (F5).\n- p.scope ↔ ADR-04: a sig_ok deny/out_of_scope record (policy_rule p.scope) is the evidence for ADR-04's hard `scope` detector. Say so, or that detector never fires once the gateway denies first.\n- §7: Alert has no `suspect`. Write root_candidates=(). A brand-new off-log object has no earlier seq, and evidence_seqs must be non-empty; use (alert.seq,) by convention, or relax it (CON-02, which ADR-00 also asks for barrier.deadline).\n- §7: state.db 0700 → workspace/ 0700 and state.db 0600, matching the THREAT-MODEL.\n- No ADR-03 rule stops F3 (an in-scope agent emailing PII externally). F3 needs a detector (ADR-04) or a sink rule. Flag to tara: ADR-06 makes crm the F3 culprit, which p.scope denies at once.\nRe-review needs: M1-M8, the catalogue/scope table checked against ADR-06, and the Interface section listing the CON-02 asks.\n\n[kabir · done] M1 catalogue covers ADR-06 writes (customers, ledger, findings, risk_note), email=I1, role-to-tool-and-field scope table, unregistered read is U, IBAN marking dropped, ks.control signed by issuing principal: resolved. M2 early hold by lineage at creation (release_tick=max(tick+H,v+2H) per G3), dispatcher hold on post-creation change as Control{hold,reason=sensitive_field}, off at H=0: resolved. M3 dispatch is ks.dispatch on c-0 with read/write sets, holds/unholds are Controls: resolved. M4 conn:<id> in step-5 and step-8 deny-list: resolved. M5 release = fresh epoch, lifts suspension holds only, lineage/sensitive holds survive: resolved. M6 between_check_and_txn hook, BEGIN IMMEDIATE, expect stale_epoch/suspended at step 8, 0 exec seq>q: resolved. M7 seq taken at start of txn, record appended after commit, crash means abort + RECONCILE: resolved. M8 agent ks.* is out_of_scope, system id on c-1.. is bad_sig unverified, expiry before nonce, nonce consumed after sig+expiry, late_frame: resolved. Should-fixes also applied. Nit: step 9 enqueues outbox items after commit; make sure the enqueue is covered by the exec record write_set so reconcile stays clean. ADR is ~1390 words vs the 900 cap.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "→ in_progress: started"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "→ in_review: ready for review"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "review: changes"}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "Call #2 freeze adopted — apply your items from CALL-02/resolutions.md assignment table + amendments X1–X9 as an 'Amendments (Call #2)' section"}, {"t": "19 Nov 06:36", "who": "nisha", "msg": "posted result summary"}, {"t": "19 Nov 06:36", "who": "nisha", "msg": "→ in_review: freeze applied"}, {"t": "19 Nov 10:58", "who": "kabir", "msg": "review: done"}, {"t": "19 Nov 10:59", "who": "nisha", "msg": "integration pass: outbox enqueue covered by exec write_set"}]}, {"id": "ADR-04", "title": "ADR-04 Monitor detectors, graded containment and lineage hold", "sprint": 2, "track": "eng", "owner": "nisha", "reviewer": "maya", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Data-invariant detectors (IBAN checksum, price delta vs frozen baseline, ledger balance, beneficiary-changed-then-paid), attribution by write_set lookup, suspend→revoke/release, per-action lineage hold from recorded read sets; due 24 Nov (tara consults on detectors)", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Detect and attribute are separate steps emitting C4 Alert{detector, evidence_seqs, suspect, root_candidates, hard}; auto-suspend only on hard evidence (scope breach, I-class invariant breach, class U); tamper alert freezes recovery, suspends nobody", "Lineage hold is per action using recorded read sets only (agent-declared lineage never trusted); release = un-hold + restore epoch; hold window is one config value", "Tests listed map to RT9 (laundering: A in top-3), RT10 (0 irreversible tainted released), RT11 (framing DoS), RT12 (persistence)"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-04-monitor-containment-hold.md", "summary": "Call #2 freeze applied: root_candidates[0]=writer of evidence_versions, read-reached never auto-suspended, hard/soft table tied to D7 (tamper/stall never hard, freeze by kind), inv.pii_egress for F3, beneficiary evidence = payee field object, release = fresh epoch lifting suspension holds only, unhold semantics. Amendments changelog added; Maya 1-9 addressed.", "review": "[maya · changes] CHANGES (maya). Structure, the D7 hard/soft table, connection-only signature suspends, the tamper freeze, per-action hold from recorded read sets, console-only revoke and the RT9-RT12 mapping are all good. Accepted: suspect = root_candidates[0] (derived, never stored). Fix these before build:\n1. ATTRIBUTION RANK (blocker, anti-framing). Ranking by \"earliest causal write\" over the backward walk lets a rogue frame any honest upstream agent. Example: rogue triage reads intake's ticket, then writes EVIL; intake has the earlier write, ranks first and gets auto-suspended. Define root_candidates[0] as the attributed writer of evidence_versions (write_set lookup, as in the issue outcome and PANEL 3.3 \"crm suspended\"). Upstream agents reached only through read sets rank after it and are never auto-suspended. More than one distinct writer, or none, means no suspend (escalate). RT9 still passes: intake at [1] is in the top 3. State honestly that a laundered honest writer (crm in RT9) is auto-suspended and counted in false_accusations. Contract docstring: CON-02 M9.\n2. evidence_versions for beneficiary_changed_then_paid is the payee-field version only. The payment (outbox object) goes in evidence_seqs, so the payer is never a writer of evidence.\n3. §6 RELEASE: \"restoring the pre-suspend epoch\" revives presigned envelopes (RT4/RT5). Release sets a fresh, strictly monotonic epoch (SEC-03 B3, CON-02 M4). Agents learn it through TickFrame.epoch (M5).\n4. Unhold semantics are missing. Say that a policy-time hold IS the hold/lineage_hold record (ADR-03 p.lineage_hold), and that Control{hold} is only for items already queued when the alert lands. unhold action:<rid> re-executes the same envelope through epoch, deny-list, class, policy and taint, without re-checking nonce or expiry, giving a new record linked by envelope_hash (M10). Otherwise held actions die nonce_reused/expired. An unheld outbox item goes back to queued with a dispatcher re-check.\n5. witness_stall/tamper: make them not hard, with the freeze automatic by kind (SEC-03 N4, M7). Define \"resolved\": v1 freezes for the rest of the run (M12).\n6. Say which INVARIANT detectors are hard and tie them to D7 \"I-class invariant\". iban_checksum fires on an R-class write; either justify it (it guards the I1 payee) or make it soft.\n7. Same owner, ADR-03 §7: \"Alert.suspect null\" should read root_candidates empty. Also ADR-03 has comms.send_email as I1 while ADR-06 has it as I2; agree one with tara.\n8. RT11 conflict: SPEC asserts payments IS suspended and false_accusations>=1, but this ADR says it is not and ==0. The ADR is right. I've asked kabir to rewrite RT11 (SEC-02 review).\n9. Metric names: you use irreversible_tainted_released, ADR-06 uses irreversible_released. Tara picks; I recommend ADR-06 adopts yours.\nKeep it ≤900 words (currently 888): trim Consequences.\n\n[maya · changes] Re-review vs CALL-02 resolutions. Must-fix 1 (rank = writer of evidence_versions, bounded walk, 2+/none no suspend, laundered writer counted, RT9 crm[0]/intake top 3; H1/H2): resolved. 2 (payee field object only, suppliers:S-17.iban per X1/H4): resolved. 3 (release = fresh strictly monotonic epoch, TickFrame.epoch): resolved. 4 (unhold, policy-time hold = hold/lineage_hold, no nonce/expiry, envelope_hash): resolved. 5 (tamper/stall not hard, freeze by kind to run end): resolved. 6 (hard table tied to D7, iban_checksum justified): resolved. 7 (suspect derived / root_candidates empty; comms I1 per G1, pii_egress I1): resolved in this ADR; ADR-03 s7 wording is nisha's other file, not re-checked. 8 (RT11a false_accusations==0): resolved. 9 (metric irreversible_tainted_released): resolved. NOT RESOLVED: word limit. File is ~1235 words by wc (limit 900 per review and Call #2 rule 'ADRs <=900 words, detail into test names'); trim Consequences/Tests. Also fix s2 line 'The walk's seed is the earliest t0_seq_est': contradicts ADR-05 s4/X3 where the walk seeds from alert evidence_versions and t0_seq_est is its OUTPUT. Agreement with ADR-05: root_candidates ranking matches (writer [0], then bounded walk; RT9 [crm, intake]). Agent-view read rule: not contradicted (hold uses 'recorded read set'), but ADR-04 should add one clause that the recorded read set includes the tick's TickFrame.view entries (X2/I1), since lineage hold depends on it.\n\n[maya · done] PMO-verified close-out of Maya's re-review: walk seed/t0_seq_est fixed; TickFrame.view read-set clause added (integration pass); length waived by D-14.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "→ in_progress"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "→ in_review"}, {"t": "19 Nov 06:06", "who": "pmo", "msg": "PMO: accepted — 'suspect' is derived as root_candidates[0]; no contract field"}, {"t": "19 Nov 06:18", "who": "maya", "msg": "review: changes"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "From the kabir review of ADR-01/03: §6 'restoring the pre-suspend epoch' revives presigned envelopes (SEC-03 B3; CON-02 maya M4). Release must set a fresh epoch and lift only suspension holds, with lineage/sensitive holds surviving (CON-02 K15). Also: a sig_ok deny/out_of_scope (p.scope, ADR-03) is your scope detector's evidence. Without that, it never fires, because the gateway denies first."}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "Call #2 freeze adopted — apply your items from CALL-02/resolutions.md assignment table + amendments X1–X9 as an 'Amendments (Call #2)' section"}, {"t": "19 Nov 06:36", "who": "nisha", "msg": "posted result summary"}, {"t": "19 Nov 06:36", "who": "nisha", "msg": "→ in_review: freeze applied"}, {"t": "19 Nov 10:58", "who": "maya", "msg": "review: changes"}, {"t": "19 Nov 10:59", "who": "pmo", "msg": "PMO D-14: 900-word cap waived (≤1,500). Length-only findings closed; substantive items go to the integration pass."}, {"t": "19 Nov 10:59", "who": "nisha", "msg": "integration pass: walk seeds from evidence_versions, t0_seq_est is output; read set includes TickFrame.view"}, {"t": "19 Nov 11:00", "who": "maya", "msg": "review: done"}, {"t": "19 Nov 11:38", "who": "pmo", "msg": "Erratum (B3-02 renumbering): conn deny-list = ADR-03 step 7, txn = step 13"}]}, {"id": "ADR-05", "title": "ADR-05 Versioned state, taint, write-write conflict rule, deduped re-run (FIRST PRIORITY)", "sprint": 2, "track": "eng", "owner": "vikram", "reviewer": "maya", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Own row-versioned SQLite (obj=table:pk, get→(value, ver, author), history), conservative forward/backward taint, recovery plan C5 with dry-run diff; due 23 Nov so build starts day 1", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Write-write rule: restore only if current ver == culprit's after-version, else re-run or flag; recovery appends compensating records, never edits history", "Re-runs of deterministic steps go through the outbox deduped by idempotency key (re-emitted effects = 0); LLM steps become a replan item for console approval; coarse/aggregate reads over-taint", "Tests listed cover the F2+ triage conflict row, a re-run that would re-fire payment/email, and backward taint naming root candidates"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-05-state-taint-recovery.md", "summary": "Call #2 freeze applied to ADR-05 (~1,450 wc words incl. 'Amendments (Call #2)' changelog). Field-level objects for sensitive fields end to end (X1/B1: ids/pk-dot reject, store invariant, field-only edits don't bump row, taint, per-object restore, per-object revert-culprit-only baseline). Read rule (X2/I1): TickFrame.view joins read_set; whole-row reads include field objects; triage's view excludes .iban. Seed (A8/X3): culprit writes in [t0_seq_est, suspend]; t0_seq_est from bounded backward walk over alert evidence, tcb_view only. Ranking (H1/M9): [0] = evidence writer, MAX_HOPS=3 bounded walk; RT9 -> [crm, intake]. Planner: B6 expect = culprit after-version, M13 dropped; M14 rerun mechanics (original tool/args/keys/author, re-hold semantics); dry-run savepoint simulation; apply halts at first stale step (hold/stale_plan); ks.recover.<op> catalogue + ks.approve binding (G6); FROZEN on verify != OK or open tamper/stall alert, run-long. Tests: hero F2+ golden (triage kept, R=0/C=0 under X3b guard), F2+x conflict flag, F2+c culprit-window C>0, root_candidates + bounded, t0 tcb-blind, field/read tests. X4/X5 noted in Consequences.", "review": "[maya · changes] CHANGES (maya). The store (§1-2) is approved, so build of ks.state can start day 1. Amendments (a)-(c) are accepted and fit the WriteEntry validator; I fold them into the C3 docs (CON-02 M11). The write-write rule, append-only recovery, idempotency-key dedupe, conservative taint, the FROZEN re-check and the golden plan all meet the acceptance criteria. stale_plan is ACCEPTED: Reason.STALE_PLAN under HOLD (M8). Use hold/stale_plan, not needs_approval. Fix these by 23 Nov:\n1. AGENT VIEW (blocker, shared with me). Agents decide on data that never enters a read set. Example: crm applies ticket T-3, but its crm.update_supplier record reads only suppliers:SUP. Forward taint then under-taints and RT9 backward taint never reaches intake. I'm proposing a gateway-captured TickFrame.view whose entries join that tick's record read_set (CON-02 M6). Your §3 must state the rule, and a test must prove crm's record carries tickets:T-3.\n2. §4 ranking must match ADR-04: rank 0 = the writer of evidence_versions (write_set lookup), then backward-taint candidates. Bound the walk, or give a secondary order, so the oldest ancestor (seed data) doesn't rank first. Add a test where crm's read set also holds an older supplier version written by a third agent, and intake is still in the top 3.\n3. test_root_candidates contradicts ADR-06/SPEC RT9: comms doesn't write suppliers. Use intake plants T-3, crm writes the IBAN, expected [crm, intake], inventory and docs absent.\n4. HERO R (decide explicitly). The object is a row, so the flagged S-17 v3 still carries the swapped IBAN, and F2+ scores R>0 against the D13 target R=0. Either (A) keep the flag and state that the hero R covers flagged rows only (tell zoya/tara), or (B), my recommendation and allowed by \"else re-run\": when every version above `to` is tainted and every writer above the culprit is a deterministic honest action, restore with expect = the current tainted head and re-run triage. Flag only when the head writer is an LLM or non-deterministic. Untainted heads are kept, as now (M13).\n5. Rerun mechanics: it re-executes the original tool and args (side store) for ActionRef.agent_id/action_id. Keys derive from those, OutboxItem.author stays the original agent, and redacted args become a flag (M14). \"Re-enters the hold\" means: status queued, release_tick = tick + hold_window_ticks, lineage = the rerun's recorded read set.\n6. Dry-run: the diff for re-runs needs simulation in a rolled-back savepoint. replan objects get no DiffEntry. dispatched_tainted is decided from the simulated payload hash.\n7. Apply halts at the first stale step. Steps already applied stay (append-only), and the console gets a new plan with as_of_seq = now.\n8. ks.recover.<op> must be in the ADR-03 catalogue for principal ks.recovery, or it is denied as class U (with nisha; SEC-03 F2). Say which ops create envelopes: flag and replan create none, they are report/console only. Bind steps to an approval record (SEC-03 F5).\n9. FROZEN also when verify != OK, so a dead-dir edit freezes too (RT7); it lasts for the rest of the run (M12).\n10. t0_seq is the planner's estimate and must never read RunConfig.fault_tick/culprit (scorer-only).\nKeep it ≤900 words (currently 898): move test detail to the test file.\n\n[maya · changes] Re-review vs CALL-02 resolutions. Must-fix 1 (agent view joins read set, rule in s3, test_crm_record_reads_T3): resolved. 2 (rank 0 = evidence writer, bounded MAX_HOPS=3, test_root_candidates_bounded with intake top 3): resolved, matches ADR-04. 3 (RT9 test = [crm, intake], inventory/docs absent): resolved. 4 (hero R): resolved per Call #2 B/X1/X2 option 3 field objects: triage kept, no flag, M13 dropped, test_hero_f2plus_golden. 5 (rerun mechanics M14): resolved. 6 (dry-run savepoint, replan no DiffEntry, dispatched_tainted from simulated hash): resolved. 7 (halt at first stale step, hold/stale_plan): resolved. 8 (ks.recover.<op> catalogue, flag/replan no envelope, ks.approve binding): resolved. 9 (FROZEN on verify!=OK, run-long): resolved. 10 (t0 never reads RunConfig, tcb_view, AST guard): resolved. X1/X2/X3 (seed window [t0_seq_est, suspend], F2+c, c_culprit_window, X3a/b), X4, X5: consistent with resolutions. NOT RESOLVED: word limit. File is ~1455 words by wc (limit 900 per review and Call #2 rule); move the long test list and detail into test names/test file. No other changes needed.\n\n[maya · done] PMO close-out: Maya's re-review found all must-fixes resolved; only length remained, waived by D-14.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:06", "who": "vikram", "msg": "→ in_progress: drafting ADR-05"}, {"t": "19 Nov 06:07", "who": "vikram", "msg": "posted result summary"}, {"t": "19 Nov 06:07", "who": "vikram", "msg": "→ in_review: ready for maya"}, {"t": "19 Nov 06:18", "who": "maya", "msg": "review: changes"}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "Call #2 freeze adopted — apply your items from CALL-02/resolutions.md assignment table + amendments X1–X9 as an 'Amendments (Call #2)' section"}, {"t": "19 Nov 10:55", "who": "vikram", "msg": "posted result summary"}, {"t": "19 Nov 10:55", "who": "vikram", "msg": "→ in_review: freeze applied"}, {"t": "19 Nov 10:58", "who": "maya", "msg": "review: changes"}, {"t": "19 Nov 10:59", "who": "pmo", "msg": "PMO D-14: 900-word cap waived (≤1,500). Length-only findings closed; substantive items go to the integration pass."}, {"t": "19 Nov 11:00", "who": "maya", "msg": "review: done"}]}, {"id": "ADR-06", "title": "ADR-06 World (10 agents), fault catalogue F1–F7 + F2+, oracle and metrics", "sprint": 2, "track": "eng", "owner": "tara", "reviewer": "anaya", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Deterministic 10-agent demo world, fault injectors F1–F7 plus hero F2+ (IBAN swap, price ×10, triage conflict), oracle S* and the scorer reading only the C6 run dir; due 24 Nov (sameer consults on metrics)", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Oracle defined per SYNTHESIS §6: t0, S*, B, G on the effect ledger + invariants, never on our taint graph; metrics TTI-detect, TTI-attribute, TTC (Panel) + post-alert tainted effects + irreversible tainted released, R, C, re-plan cost", "Fault catalogue says per fault whether it runs live or as pytest (F5/F6 live, F3 pytest) and the F2+ dependency graph (billing/payments/comms consume; inventory/docs independent)", "Protocol: ≥20 seeded runs, median/p95/max, baselines snapshot / revert-culprit-only / no-op, hold 0 vs >0"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-06-world-faults-oracle.md", "summary": "Call #2 freeze applied: S* = fault disabled (culprit stops at suspension), harness-side per-field ledger, B/G frozen at t_rec and compared at T, ledger-defined taint metrics (PMO names), import-lint, world-side registry, T=120/H=6 bench approver, integer median/p95, F2+/F2+c/F2+x, F3 rogue comms, F7 honest failure, baselines oracle-assisted. Formulas in org/adr/ADR-06-metrics.md.", "review": "[anaya · changes] CHANGES. World, live/pytest split, baselines and hold toggle have the right shape. Acceptance 1 and 3 are met (884 words). The oracle is not sound yet, and several metrics cannot be computed as written.\nMUST-FIX\n1 S* contradicts ADR-00 (\"clean run, same seed\") and the C6 RunConfig docstring (fault=None is the oracle run). \"Culprit slot emits no-ops\" from tick 1 breaks your own tests 1-2, because crm writes before t0. From t0 onward it makes crm's honest post-t0 writes, and everything that read them, part of B. Taint-scoped recovery never reverts those, so R>0 by construction and revert-culprit-only beats us. Fix: for ks inject faults, S* = same seed and config with the fault disabled (the culprit runs its honest step every tick). Use slot no-ops only for rogue-slot runs (SPEC fixture). Run S* as the pure world: monitor, containment and recovery off, outbox dispatches at release_tick. Otherwise a false suspend or an early hold corrupts S*. List the faulty ticks per fault. Use the ADR-00 RNG streams sha256(seed||name), not seed|agent|tick.\n2 t0. Keep t_inject (RunConfig fault_tick, as ADR-00 asked, derived from the seed) separate from oracle t0 = min tick over B (SYNTHESIS 6). Drop `injected` from effects.jsonl: it puts a ground-truth label in a live run dir. The scorer asserts t0 >= t_inject.\n3 Ledger. effects.jsonl must come from the harness (ks.world: a per-tick state.db diff per (table,pk,field) plus sink deliveries), never from the recorder. Otherwise a bypass write (RT1) never enters B. The key is per field: with row hashes, triage's risk_note edit on S-17 lands in B and test 3 fails. Add seq (null for a bypass), author and idempotency_key. Align with SPEC run.effects() and the C3 states (queued/held/released/dispatched/cancelled). final(k) = fold of the ledger.\n4 B/G/R/C. \"final-run\" and \"B left\" are ambiguous. Fix B and G at t_rec (recovery start, the same tick for us and the baselines), then score the state at T: R=|{k in keys(B): final(k)!=S*(k)}|/|keys(B)| and C=|{k in keys(G): final(k)!=S*(k)}|/|keys(G)|. As written, deleting the bad invoice without re-running billing scores R=0 C=0, a clean recovery with no repair. A dispatched B item always counts as left (report compensated separately). Hel
