executed: docker daemon unavailable (build/run/smoke untested). Note: no 'ks' console script in pyproject, Dockerfile adds /usr/local/bin/ks wrapper (python -m ks). Smoke-test AC (CI) not added; demo.sh run+verify serves as it."}, {"t": "19 Nov 16:03", "who": "pmo", "msg": "Docker not available in sandbox: build/make demo/make test untested — first real run on Aarav's Mac"}, {"t": "19 Nov 16:19", "who": "kabir", "msg": "review: changes"}, {"t": "19 Nov 16:20", "who": "ishaan", "msg": "→ in_progress: fixing kabir's findings"}, {"t": "19 Nov 16:21", "who": "ishaan", "msg": "posted result summary"}, {"t": "19 Nov 16:21", "who": "ishaan", "msg": "→ in_review: kabir findings addressed"}, {"t": "19 Nov 16:41", "who": "pmo", "msg": "→ in_review: make smoke executed on Aarav's Mac (OrbStack, arm64, docker 29.8.2): smoke OK, isolation=per_agent_uid, exit 0; bind-mount chown to 60000 worked. Note verify ran without --head (anchored:false)."}, {"t": "19 Nov 17:25", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-40", "title": "B3-37 follow-ups: view provider, Execution.outbox, sets checked against txn, indirect-import test", "sprint": 3, "track": "eng", "owner": "maya", "reviewer": "panel", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "Wave-3 owners build against a stable dispatch/gateway seam without editing dispatch.py themselves", "acceptance": ["ToolDispatcher (or a sibling protocol) exposes a view provider; Gateway.open fills TickFrame.view from it, not view=() (test)", "Execution has outbox=() for I1 enqueue requests (test)", "Docstring and code agree on who owns read/write sets; gateway cross-checks Execution sets against the txn once StateTxn is wired (TODO linked to B3-11 if not wireable yet)", "Test fails if importing ks.world loads ks.runtime transitively; unused TickFrame import in barrier.py removed"], "depends": ["B3-37"], "deliverable": "src/ks/gateway/dispatch.py", "summary": "dispatch.py: new ViewProvider protocol view(agent_id, tick, state: StateSnapshot) -> tuple[ViewEntry,...]; OutboxRequest(sink, action_class: ActionClass I1/I2, payload) and Execution.outbox=(); docstring now says sets are the gateway's (from txn). stub.py: Gateway(..., views=None) defaults to dispatcher if it is a ViewProvider; open() fills TickFrame.view and stores Gateway.delivered; admit() routes sets through Gateway._sets (rejects writes without a txn; txn cross-check TODO(B3-11)); non-empty outbox raises NotImplementedError until B3-11 (never silently dropped). barrier.py: unused TickFrame import removed; AST test now also checks imported names. tests/skeleton/test_boundaries.py: +3 tests (subprocess sys.modules transitive check over every ks.world module, view provider, outbox). SkeletonDispatcher.view returns (). Verified in a scratch copy (tara's WIP tools.py currently fails to import: missing dataclass/Store imports): 460 pass; 1 unrelated fail in test_contracts_12 witness test from uncommitted src/ks/witness edits (not mine). Sequencing for Gateway.admit (item 4): B3-04 txn -> B3-11 sets/outbox -> B3-09 hooks.", "review": "[panel · changes] Good: ViewProvider fills TickFrame.view (tested); Execution.outbox=() and a non-empty outbox raises NotImplementedError (tested, not dropped); barrier TickFrame import removed and AST test covers imported names; transitive test verified: a temp ks.world module importing ks.runtime via a third module made it FAIL, reverted, passes. Full suite 492 pass. Changes (small): (1) write-without-txn refusal in Gateway._sets has no test; add one. (2) TODO(B3-11) is a dangling link: B3-11 acceptance (admission pipeline) says nothing about taking sets from the txn, the mismatch refusal, or creating OutboxItems. Add those as B3-11 acceptance lines (ask pmo) or open a linked issue, so the B3-37 set-ownership concern has an owner. (3) Note: both raises happen after execute, so the envelope goes unrecorded (rule 11). Fine as fail-stop for now; B3-11 must turn them into recorded denials. Read sets are still self-reported while txn is None; the docstring says so honestly.\n\n[panel · done] Re-review: (1) test_sets_refuses_write_without_txn covers _sets directly and via admit with a writing dispatcher, plus the empty no-txn case. (2) Every TODO in stub.py and dispatch.py now points at B3-41, whose acceptance owns txn-sourced sets, lying-adapter mismatch deny, recorded denials for no-txn write and outbox, and gateway-built OutboxItems. (3) Post-execute raise accepted as fail-stop until B3-41. Suite 515 pass, 8 skip.", "log": [{"t": "19 Nov 16:20", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 16:21", "who": "maya", "msg": "→ in_progress: starting: view provider, outbox, txn cross-check TODO, transitive import test"}, {"t": "19 Nov 16:22", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 16:22", "who": "maya", "msg": "→ in_review: ready for panel"}, {"t": "19 Nov 16:24", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 16:26", "who": "maya", "msg": "→ in_review: Panel changes: (1) added test_sets_refuses_write_without_txn (direct _sets + via admit); (2) TODO(B3-11) repointed to B3-41 (pmo opened it, gateway authority on sets/outbox, recorded denials) in stub.py and dispatch.py; (3) the recorded-deny point is B3-41 acceptance line 2."}, {"t": "19 Nov 16:32", "who": "panel", "msg": "review: done"}]}, {"id": "B3-41", "title": "Gateway is the authority on read/write sets and outbox (B3-40 TODO)", "sprint": 3, "track": "eng", "owner": "nisha", "reviewer": "panel", "model": "sonnet", "created_by": "pmo", "status": "done", "outcome": "Read/write sets come from the state txn, not tool self-reports; mismatches and refusals become recorded denials, never unrecorded raises", "acceptance": ["Gateway takes read_set/write_set from the StateTxn; an Execution whose sets disagree with the txn is a recorded deny (test with a lying adapter)", "Write without txn and non-empty outbox before B3-23 become recorded denials, not raises after the tool ran (rule 11: every envelope recorded)", "Outbox items are created by the gateway from Execution.outbox with derived idempotency_key and lineage (with B3-23)"], "depends": ["B3-40", "B3-11"], "deliverable": "src/ks/gateway/", "summary": "Done: run.py wires store (workspace/state.db), seq-1 seed, WorldPolicy; 1-tick cap lifted. Gateway takes write_set from writes_at and verifies reads vs store; lying sets, dispatcher COMMIT (authorizer + post-check), outbox before B3-23, unhashable result are recorded TOOL_ERROR denies. View joins read_set (view_reads/tool_reads kept apart; same obj twice: tool read wins). Seed db-lock releases seq 1. Policy denies '.'/':' ids (p.object_id). Spy allowlist + AST check; gateway crash test; world repro past hero_tick (40 ticks) with equal anchors. Left: gateway-built OutboxItems (B3-23). 716 local, 724 container, make smoke OK.", "review": "[panel · done] PASS. Probes: adapter writing 2 rows reporting 1 -> deny/tool_error, nothing landed; raise -> recorded TOOL_ERROR; executescript COMMIT blocked by authorizer, dispatcher COMMIT refused; outbox -> deny. 40-tick world repro past hero_tick, non-empty record, equal anchors; seed lock releases seq 1; p.object_id denies '.'/':'. Local 734 passed/8 skipped, container 742 passed. FINDING (non-blocking): a reported read is checked for existence only; an adapter reading suppliers:S-17.iban via raw txn.store.conn SQL and not reporting it is EXEC ok with no iban in read_set. Runtime cannot see omitted reads; mitigated by THREAT-MODEL rule 7 (adapters emit read sets) plus the new AST guard on ks.world. Follow-up: add this as a THREAT-MODEL known limit; fix stale TODO(B3-41) lines in dispatch.py docstring and stub.py delivered comment. RULING (same obj, view vs tool at different versions): keep BOTH. Dropping the view version can lose taint (CALL-02 A8 conservative) and breaks B3-45 C. read_set is unique by obj (record.py _sorted_unique), so this needs the contracts 1.4 change: do it in B3-46, add to its acceptance with a test. Until then tool-read-wins stands, pinned by a TODO(B3-46).", "log": [{"t": "19 Nov 16:24", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 16:30", "who": "pmo", "msg": "→ todo: From B3-09 review: once the gateway uses the recorder txn, rerun test_crash_commit_append through the gateway path."}, {"t": "19 Nov 16:33", "who": "pmo", "msg": "→ todo: From maya's B3-06 re-review: test spy still misses reads via a closure over a module Store, raw SQL on store.conn, and store.state_digest (no adapter does these today). Make the spy an allowlist and add an AST check on world adapters."}, {"t": "19 Nov 16:33", "who": "pmo", "msg": "→ todo: From kabir's B3-10 review: when the 1-tick cap is lifted, extend test_world_repro_same_seed_byte_identical past hero_tick with a non-empty record and equal RunAnchors (B3-10 repro item carried forward)."}, {"t": "19 Nov 17:51", "who": "pmo", "msg": "→ todo: From kabir's final B3-11 review (non-blocking): (1) a db lock while writing the seq-1 seed record leaves seq 1 reserved; next admit fails closed with no records. Release it like other txn failures. (2) a dispatcher that COMMITs itself then raises leaves a write behind a TOOL_ERROR deny (verify catches it as reconcile_mismatch per B3-43 review); gateway should forbid dispatcher-side commit."}, {"t": "19 Nov 21:01", "who": "pmo", "msg": "→ todo: From kabir's B3-14 review (non-blocking): wire WorldPolicy into src/ks/runtime/run.py alongside the store/seed (runtime still defaults to AllowAll; nothing else tracks it). Policy itself must deny object ids containing '.' or ':' rather than relying on the tool raising (probe: set_risk_note supplier='S-17.iban')."}, {"t": "19 Nov 21:03", "who": "nisha", "msg": "→ in_progress: start"}, {"t": "19 Nov 21:10", "who": "nisha", "msg": "posted result summary"}, {"t": "19 Nov 21:10", "who": "nisha", "msg": "→ in_review: ready"}, {"t": "19 Nov 21:13", "who": "panel", "msg": "review: done"}]}, {"id": "B3-42", "title": "Kabir follow-ups on B3-08/B3-36: witness seq-head equivocation, signer drip, unbound-connection S3", "sprint": 3, "track": "eng", "owner": "arjun", "reviewer": "kabir", "model": "sonnet", "created_by": "pmo", "status": "done", "outcome": "Witness refuses to sign a second head for a seq it already signed; signer drip and unbound connections can't evade M2/S3", "acceptance": ["push(2,H2,4) then push(2,H3,5): witness refuses the second, no ack, no line (test)", "A signer line with no newline counts against the per-tick budget and closes the connection at the cap; tick time bounded under a drip (test)", "An envelope on a connection with no bound agent is denied, never admitted unchecked (test)"], "depends": ["B3-08", "B3-36"], "deliverable": "src/ks/witness/", "summary": "Witness refuses a second head for an already-signed seq; signer drip (unterminated reads) charges the per-tick budget via SignerService.charge and closes at cap, tick bounded; Gateway.bind added, unbound non-c-0 connection is bad_sig (stub.py: _sig_ok + bind only; nisha's tests bind c-1 in fixtures). Tests in tests/witness and tests/panel.", "review": "[kabir · done] Re-ran my probes. Witness: push(2,H2,4) then push(2,H3,5) -> None, no line; and after seq 3, push(2,H4,7) -> None; 2 lines total. Unbound c-1 -> sig_ok False deny bad_sig; bound to billing with a crm-signed frame -> bad_sig. Binding comes from the barrier's own conn table (c.agent_id), not frame contents. Drip: charge() runs on every read that leaves a partial line and closes at MAX_SIGNER_LINES_PER_TICK; panel test bounds the tick under 0.9 s. Native 692, container 700 green.", "log": [{"t": "19 Nov 16:30", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 17:59", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 17:59", "who": "arjun", "msg": "→ in_review: ready"}, {"t": "19 Nov 21:01", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-43", "title": "Contracts 1.3: ks.seed system tool (D-15) + deny reason for a dispatcher that raises", "sprint": 3, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "Seed record has its own system tool (Aarav's D-15, amends CALL-02 G1); every envelope is recorded even when a tool raises (rule 11)", "acceptance": ["ks.seed in SYSTEM_TOOLS; schema regenerated; contracts README + version 1.3.0; canonical/roundtrip tests green", "verify rule: ks.seed valid only at seq 1, tick 0, author ks.gateway, write_set == seed_state; any other ks.seed record is a verify failure (tests)", "Deny reason for a dispatcher that raises (kabir's B3-11 finding 3), or a written decision for Aarav if it conflicts with the freeze", "CALL-02 amendment note citing D-15"], "depends": ["B3-11"], "deliverable": "src/ks/contracts/", "summary": "Contracts 1.3.0 (additive). (1) ks.seed: SEED_TOOL in SYSTEM_TOOLS, signer ks.gateway only. (2) Record.seed_problems(): an admitted ks.seed must be exec at seq 1, tick 0, a verified ks.gateway envelope on c-0, with empty read_set/outbox and no reexec_of. ks verify also checks write_set == seed_state at seq 1 on an empty store (ks.verify.core.expected_seed_writes). Any failure is the new verify reason seed_invalid (TAMPER). A denied ks.seed, e.g. from an agent, is an ordinary denial, so an agent cannot use it to break verify. (3) Kabir's B3-11 finding 3: the CALL-02 freeze does not close the Reason enum, and adding a reason is a minor bump (1.2 precedent), so I added the deny reason tool_error. The envelope was admitted (sig_ok true) and the tool raised; the txn is rolled back and the record carries no read/write set, outbox ids or result. No D-16 needed. (4) Schemas regenerated; README table + changelog; doc:run_config golden re-pinned; tests in tests/contracts/test_contracts_13.py, which cover the seed roundtrip/schema, the structural rule, tool_error validators and 5 verify cases. (5) CALL-02 resolutions get amendment G1-a citing D-15. ARCHITECTURE D-SEQ1 updated; the interim ks.dispatch skip rule is marked for deletion once nisha switches stub.py. Native 577 passed / 8 skipped; container 585 passed.", "review": "[kabir · done] Attacked: agent/ks.monitor exec ks.seed, ks.gateway on c-3, seq 2, tick 1, second seed, hold, read_set: all rejected by Record validators or seed_invalid (TAMPER). write_set is checked against seed_state rebuilt from scenario code on an empty store, not against the record, so no tautology. tool_error: validators forbid read/write set, outbox and result_hash; a write committed behind it fails the reconcile pass. Additive: record/envelope goldens unchanged, only run_config re-pinned; a HEAD (1.2) run dir verifies OK under 1.3. G1-a cites D-15 and stays within it. Native 606 passed, container 634 passed. Non-blocking follow-ups: (1) verify does not require seq 1 to be ks.seed. Once B3-11 switches, a 1.3 run with state writes should fail if its seed is ks.dispatch or missing. (2) expected_seed_writes ignores config.scenario and the seed args; key it on the scenario once a second one exists.", "log": [{"t": "19 Nov 17:41", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 17:46", "who": "maya", "msg": "→ in_progress: contracts 1.3.0 in progress"}, {"t": "19 Nov 17:46", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 17:46", "who": "maya", "msg": "→ in_review: contracts 1.3.0 landed; nisha to switch seed tool + tool_error in stub.py"}, {"t": "19 Nov 17:50", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-44", "title": "World conforms to CALL-02 B2/B3 on a real F2+ run: triage kept, docs independent", "sprint": 3, "track": "eng", "owner": "tara", "reviewer": "maya", "model": "sonnet", "created_by": "pmo", "status": "done", "outcome": "On real world records, taint matches the frozen hero story: triage untainted (kept without redo), docs and inventory independent", "acceptance": ["tests/taint/test_world_f2plus.py::test_world_triage_kept passes with its strict xfail removed (triage's view no longer delivers a tainted version when it edits S-17's risk_note)", "test_world_docs_independent passes with its strict xfail removed (docs does not read reporter's tainted RPT docs, per the B3 independent lane)", "ks.inject tests (T2 pre-fault byte-identical to S*, hero guard, F2+c/F2+x) and tests/world stay green"], "depends": ["B3-18"], "deliverable": "src/ks/world/agents.py", "summary": "Review follow-up: renamed test_triage_view_excludes_iban -> test_triage_view_has_no_suppliers (tests/world/test_world.py); added 'suppliers:S-17.iban not in read_set' assertion to test_world_triage_reads_s17_row_untainted (tests/taint/test_world_f2plus.py). Suite 692 passed, 8 skipped. ADR-06 amendment left to ADR owner per review (b).", "review": "[maya · changes] Code accepted; suite green (631 passed, 8 skipped). (a) B2 stays honest: triage edits S-17 with no iban in its view (now no supplier rows at all), and the field-object rule (B3-04) is still shown on the real world, more strongly than before, by the recorded adapter read: test_world.py asserts triage's h+2 read_set has no suppliers:S-17.iban, and test_world_triage_reads_s17_row_untainted asserts the S-17 row read is recorded and untainted. The view-level test has lost its iban purpose: rename it test_triage_view_has_no_suppliers, and add an explicit 'suppliers:S-17.iban not in read_set' to the taint world test so the field-object claim is pinned where taint is computed. (b) The reports: table is accepted: it makes CALL-02 B3's independent docs lane true with no accounting change. Required, because ADRs are binding and must not silently diverge: amend ADR-06 World para ('Triage's view lists suppliers:S-17, not .iban' -> tickets only; S-17 row read via the adapter, recorded, without .iban) and the Dependencies line (reporter writes reports:RPT-*, outside docs' scope). The demo line in B3 still holds. (c) Not weakened: the strict xfails now pass as plain tests, and the replaced s22-only cause test asserted a bug that no longer exists. Note: the GatewayTxn/visible_to edits in tools.py are not part of this issue.\n\n[maya · done] All items verified. (a) Renamed to test_triage_view_has_no_suppliers (asserts no suppliers: rows in triage's view; billing still sees S-17.iban); test_world_triage_reads_s17_row_untainted now also asserts suppliers:S-17.iban not in triage's read_set, so the field-object rule is pinned where taint is computed. (b) ADR-06 World para and Dependencies line amended to match the code (tickets-only view, adapter S-17 row read without .iban, reports:RPT-* outside docs' scope). (c) No strict xfails left in test_world_f2plus.py. tests/world+taint+inject green; full suite 692 passed, 8 skipped.", "log": [{"t": "19 Nov 17:50", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 17:50", "who": "tara", "msg": "→ in_progress: start"}, {"t": "19 Nov 17:52", "who": "tara", "msg": "posted result summary"}, {"t": "19 Nov 17:52", "who": "tara", "msg": "→ in_review: ready"}, {"t": "19 Nov 17:53", "who": "maya", "msg": "review: changes"}, {"t": "19 Nov 18:48", "who": "tara", "msg": "posted result summary"}, {"t": "19 Nov 18:48", "who": "tara", "msg": "→ in_review: ADR amended"}, {"t": "19 Nov 21:01", "who": "tara", "msg": "posted result summary"}, {"t": "19 Nov 21:01", "who": "tara", "msg": "→ in_review: review follow-ups done"}, {"t": "19 Nov 21:02", "who": "maya", "msg": "review: done"}]}, {"id": "B3-45", "title": "Decision: t0_seq_est walk and the suspect's self-reads (A8 conservative vs B2 hero C=0)", "sprint": 3, "track": "decision", "owner": "aarav", "reviewer": "maya", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Aarav picks the t0 rule. Facts: under I1 every view row is a read, so the literal ADR-05 walk follows crm's reads of its own earlier writes and puts t0 at crm's honest tick-3 S-31 edit; seed then covers all crm work from tick 3 and the B2 hero golden (R=0, C=0) cannot hold. B3-18's default skips suspect self-reads: hero holds, but if a culprit chains its own writes (bad W1, reads it, writes W2) and only W2 is alerted, W1 is not seeded and stays (checked on the B3-18 fixture: t0 default=W2, literal=W1). Options: A literal walk (safe, breaks B2); B skip self-reads (B2 holds, under-taint gap, a jury-pickable attack); C tag each read entry as view or tool (additive contract, with B3-41) and follow self-reads only through tool reads (keeps both). maya recommends C, with B as interim default and the gap reported in dry-run.", "acceptance": ["Aarav records A, B or C in the issue; ADR-05 section 4 amended to match; B3-18 default and tests follow"], "depends": [], "deliverable": "org/adr/ADR-05-state-taint-recovery.md", "summary": "DECIDED by Aarav 19 Nov: option C. Each read entry is tagged view|tool (additive contract, built with B3-41); the t0 walk follows the suspect's self-reads only through tool reads. Interim default stays B (skip self-reads) with the gap reported in the dry-run (t0_seq_est_literal beside t0_seq_est). ADR-05 section 4 to be amended to match (B3-46).", "review": "", "log": [{"t": "19 Nov 17:52", "who": "maya", "msg": "opened"}, {"t": "19 Nov 18:45", "who": "pmo", "msg": "posted result summary"}, {"t": "19 Nov 18:45", "who": "pmo", "msg": "→ done: Aarav chose C"}]}, {"id": "B3-46", "title": "B3-45 option C: read entries tagged view|tool; t0 follows suspect self-reads through tool reads only", "sprint": 3, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "Closes the self-chained-write under-taint gap while keeping the B2 hero result (Aarav's B3-45 decision C)", "acceptance": ["Contract: each read-set entry carries source view|tool (additive, contracts 1.4); gateway tags view deliveries vs adapter reads (with B3-41)", "ks.taint t0 walk follows the suspect's self-reads through tool reads only; B3-18 self-chain fixture (bad W1, crm tool-reads W1, writes W2, alert on W2) seeds W1; F2+ hero seed unchanged {S-17.iban v2, S-22 v2}", "ADR-05 section 4 amended citing B3-45; CALL-02 amendment note for A8/B2"], "depends": ["B3-18", "B3-41"], "deliverable": "src/ks/contracts/", "summary": "Contracts 1.4.0 (additive, fixed per kabir's blocker): ReadEntry.source view|tool (default tool); read_set/lineage keyed (obj,ver) + one per (obj,source); merge_read_set(view, tool) re-tags by position; RestoreStep.to may be None (to_absent); RecoveryPlan.t0_seq_est_literal + t0_delta. ADDITIVITY FIX: one rule in ks.contracts._base: fields declared additive(default) are omitted from the canonical form when equal to their default (wrap model_serializer on Value, applies nested); schema_gen marks them optional. source='view' and integer t0_seq_est_literal serialize and round-trip; explicit default bytes are rejected as NonCanonicalError. Goldens: 7 reverted to 1.3 values; only doc:run_config moved (version string). Regression: tests/contracts/test_additive_13_run.py verifies a checked-in 1.3 world run (tests/contracts/fixtures/run-1.3-world-s0, built from 5c711d3, ticks 8 seed 0, 23 non-empty read_sets) under 1.4: exit 0; fails if omission is disabled. Kabir's 40-tick repro run from 5c711d3 also verifies exit 0 under 1.4. ks.taint t0 walk follows suspect self-reads via tool entries only (self-chain seeds W1; hero seed unchanged {S-17.iban v2, S-22 v2}). RESIDUAL for kabir to record in THREAT-MODEL.md / RT: a rogue can steer into the view-only residual by computing W2 from its view instead of a tool read; a self-read seen only via the view is not followed by the t0 walk, so those earlier writes fall outside the seed; only t0_delta (t0_seq_est - t0_seq_est_literal) reports it. Host suite 789 passed, 8 skipped.", "review": "[kabir · changes] BLOCKER (not additive): 1.4 changes the canonical bytes of existing documents. Value.to_obj dumps every field, so ReadEntry.source=\"tool\" (default) and RecoveryPlan.t0_seq_est_literal=null are now serialized into every read_set, lineage and plan. 7 of the 8 re-pinned goldens moved for that reason: record_exec/control/forged/garbage (read_set + prev_hash chain), witness (chains record hash), outbox_item (lineage), plan (new null field). Only run_config (contracts_version string) is a legitimate change, as in 1.3. Repro: a world run built with HEAD 1.3 in a git worktree (ks run --scenario world --ticks 40 --seed 0) verifies exit 0 under 1.3 and fails under the 1.4 tree: exit 2 parse_error \"Record: bytes are not this object's canonical form\", first_bad=2. Skeleton runs pass only because their read_sets are empty. Fix: leave default-valued new fields (source==\"tool\", t0_seq_est_literal None) out of the canonical form, make them optional in the schemas, revert those 7 goldens to the 1.3 hashes, and add a test that verifies a committed 1.3 world run dir. Otherwise do a real major bump with a migration note. Attacks found no other problem: source is assigned by the gateway, since merge_read_set re-tags by position and ignores what the dispatcher says; a tool read of the same (obj,ver) as a view entry collapses to tool, so it cannot hide as view; a duplicate tool obj is denied as tool_error. The self-chain fixture really does seed W1 via a tool read. The hero seed is {S-17.iban v2, S-22 v2} on the world-agents test (merge_read_set mimics the gateway); there is no real F2+ gateway run yet because the runtime does not serve faults. Residual to record in THREAT-MODEL/RT: a rogue can choose to compute W2 from its view and not by a tool read, so it picks the view-only residual; only t0_delta reports it. Tested in a copy of the working tree with nisha's B3-23 stub.py indent fixed: 781 passed, 8 skipped.\n\n[kabir · done] PASS. Blocker fixed. (1) Fixture genuine: regenerated world s0 t8 from git archive HEAD (1.3); same record shape as the fixture modulo keys/sigs; HEAD 1.3 runs (t8 s0, t40 s1) and the fixture verify exit 0 under the 1.4 tree; schema c2 validates them. Disabling the omission fails both additive tests. (2) No producer emits an explicit default: every read entry/plan goes through Value.to_obj (wrap serializer); 1.4 world run t40 s0 verifies exit 0 (197 source:view, 0 source:tool in bytes); explicit source:tool rejected NonCanonicalError. Recovery/oracle use to_obj/model_validate. (3) No hand-built canonical contract dicts found (oracle ledger, timing, store values are not contracts). Not end-to-end: inject/recover CLI not implemented yet. Pre-existing, not B3-46: ks verify with a relative run path gives reconcile_mismatch (state.db file URI). THREAT-MODEL errata: view-only self-read residual + B3-41 unreported raw-SQL read limit added. Host 792 passed/8 skipped; container 804 passed.", "log": [{"t": "19 Nov 18:45", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 21:13", "who": "pmo", "msg": "→ todo: Panel ruling (B3-41 review): when a tool read and a view entry name the same object at different versions, keep BOTH. read_set allows one entry per object, so this lands here with contracts 1.4; until then tool-read-wins stays."}, {"t": "19 Nov 21:15", "who": "pmo", "msg": "→ todo: From maya's B3-21 review: contracts 1.4 also carries (a) RestoreStep.to able to express a culprit-created object (replace vikram's tombstone marker) and (b) a t0-literal field on the plan (replace Planned.t0_delta) for B3-45's dry-run delta."}, {"t": "19 Nov 21:15", "who": "maya", "msg": "→ in_progress: starting contracts 1.4"}, {"t": "19 Nov 21:24", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 21:24", "who": "maya", "msg": "→ in_review: contracts 1.4 + taint option C + gateway tagging landed; host 763 passed, container 785 passed"}, {"t": "19 Nov 21:27", "who": "kabir", "msg": "review: changes"}, {"t": "19 Nov 21:31", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 21:31", "who": "maya", "msg": "→ in_review: Additivity fixed: default-valued additive fields omitted from canonical form; 7 goldens reverted; 1.3 world-run fixture verifies under 1.4."}, {"t": "19 Nov 21:37", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-47", "title": "Contracts 1.5: replay_mismatch verify reason (B3-20)", "sprint": 3, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "Decisions-replay mismatches are reported as replay_mismatch, not the misleading hash_mismatch (kabir's B3-20 ruling)", "acceptance": ["replay_mismatch in VERIFY_REASONS (TAMPER), additive minor bump 1.5.0 per the canonical-default rule; 1.3/1.4 runs still verify", "ks.verify.decisions uses replay_mismatch for replay and decisions_from mismatches (coordinate with arjun)"], "depends": ["B3-20"], "deliverable": "src/ks/contracts/", "summary": "Accepted kabir's ruling: VERIFY_REASONS['replay_mismatch'] = Exit.DIVERGED (6), not TAMPER. A replay mismatch means the re-derived decisions differ from the anchored source; it is not evidence of tampering, and exit 2 would tell a jury it was. Exit.DIVERGED comment widened to 're-derived result differs from its source: ks repro A B or a decisions replay'. rundir.py docstring, README 1.5.0 changelog, test_contracts_15 (test_replay_mismatch_is_diverged_not_tamper; TAMPER and WITNESS exits both rejected) updated; decisions.py docstring 'exit TAMPER' -> 'exit DIVERGED' (doc only, code uses VERIFY_REASONS). Still additive (no field, schema or golden change from this). The acceptance line saying TAMPER was my error and is superseded. tests/contracts+verify+cli 469 passed.", "review": "[kabir · changes] Additive bump is clean: reason added, schemas only $id, golden only run_config, and 1.3/1.4 fixtures still verify. ONE CHANGE: my B3-20 ruling said replay_mismatch gets its own exit, NOT TAMPER. Exit.TAMPER is documented as 'chain, hash or signature mismatch'. A jury that sees exit 2 on an honest but divergent replay reads it as tampering, which is the exact problem the new reason exists to avoid. The acceptance line was written as TAMPER, contradicting the ruling. Fix: VERIFY_REASONS['replay_mismatch'] = Exit.DIVERGED (6). That is an existing exit meaning 'the re-derivation differs from its source', so no new exit code is needed. Then widen the Exit.DIVERGED comment to 'ks repro A B or a decisions replay: re-derived result differs' and update test_contracts_15 plus the rundir/README text. If maya/PMO want TAMPER anyway, raise it as a decision. Don't override the ruling silently.\n\n[kabir · done] Re-review: fix accepted. VERIFY_REASONS['replay_mismatch'] = Exit.DIVERGED (6); test_contracts_15 rejects TAMPER and WITNESS; hash_mismatch still maps to TAMPER; decisions.py emits replay_mismatch for both the replay check and the decisions_from check. 1.3/1.4 runs still verify (test_additive_13_run, fixtures/run-1.4-world-s0). tests/contracts+verify: 435 passed, 1 skipped (root). The acceptance line that says TAMPER is superseded by the summary. Doc gap, not blocking: ADR-02 and THREAT-MODEL do not mention replay_mismatch or exit 6 at all. They are silent, not contradictory. Follow-up: add 'replay_mismatch -> DIVERGED (6), not tampering' to ADR-02 §6 and to the THREAT-MODEL RT13 row, via THREAT-MODEL-CHANGES.md.", "log": [{"t": "20 Nov 06:00", "who": "pmo", "msg": "opened"}, {"t": "20 Nov 06:11", "who": "maya", "msg": "posted result summary"}, {"t": "20 Nov 06:11", "who": "maya", "msg": "→ in_review: 1.5.0 contracts side done; decisions.py switch pending arjun (B3-20)"}, {"t": "20 Nov 06:14", "who": "kabir", "msg": "review: changes"}, {"t": "20 Nov 06:20", "who": "maya", "msg": "posted result summary"}, {"t": "20 Nov 06:20", "who": "maya", "msg": "→ in_review: replay_mismatch -> DIVERGED per kabir's ruling; ready for re-review"}, {"t": "20 Nov 06:27", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-48", "title": "ks.recovery: rider/replan/flagged outbox items stay held, not cancelled (ADR-05 §6.1 amended)", "sprint": 3, "track": "eng", "owner": "vikram", "reviewer": "maya", "model": "opus", "created_by": "maya", "status": "done", "outcome": "cancel_outbox only for the suspect's own seed-action items and released items of non-re-run actions; other tainted items stay held and are listed", "acceptance": ["F2+x plan has 0 cancel_outbox for rider/replan/flagged items; Planned.held lists each (outbox_id, blocking flag or replan) and render prints one held line each", "test_outbox_dispatched_is_flag_and_queued_is_cancelled updated: replanned comms item stays held; a culprit-created queued item is still cancelled; a released rider item is still cancelled", "Hero F2+ golden unchanged; test_triage_conflict still exactly one write_write_conflict flag"], "depends": [], "deliverable": "src/ks/recovery/planner.py", "summary": "ADR-05 §6.1 amended: cancel_outbox only for suspect's own window items (queued/held/released) and released items of non-re-run actions. Other tainted queued/held items (rider, replan, no_compensator, tainted_i2, compensate, no creating record) get no step and stay held. New Planned.held: tuple[Held(outbox_id, status, action, blocked_by)] (default ()). DryRun.held = planned.held + held_extra (items of re-runs the dry-run drops: rider/redacted_args; a released one there gets cancel_outbox via _refine). render prints one 'held outbox:<id> <status> <agent> seq N  no step, waits for <blocker>' line each. Plan shape unchanged (same step types/order; F2+x simply has 10 fewer cancel_outbox steps, now 5 steps: restore, 2 rerun, 2 flag). F2+x: 0 cancels, 10 held each blocked by flag(write_write_conflict suppliers:S-22), exactly 1 conflict flag; hero: 0 cancels, held=(), 0 flags, golden unchanged. Tests: test_planner::test_outbox_dispatched_is_flag_and_queued_is_cancelled rewritten (culprit queued item and released rider item cancelled; replanned comms item and held rider item held); test_conflict::test_f2plus_x_rider_items_stay_held_not_cancelled; test_rerun redacted-args test checks rider items held. Env 919 passed, 8 skipped.", "review": "[maya · done] Accepted. planner.py: cancel_outbox only for the suspect's own window items (queued/held/released) and released items of non-re-run actions; every other tainted queued/held item gets no step and is listed in Planned.held with its blocker (rider/replan/flag/compensate/no_creating_record); re-run items are skipped (M14 re-hold). dryrun.py: items of dropped re-runs go to DryRun.held (released ones cancelled via _refine); render prints one held line each. Matches ADR-05 §6.1 as amended. Integration-checked against B3-30 apply (tests/runtime/test_recover.py::test_bench_never_releases_rider_items_f2plus_x): F2+x plan applied through c-0, rider items stay HELD under lineage_hold, bench_releasable never lists them, verify OK. Non-blocking: a held entry may carry status queued (not yet due); it is held by the release phase's lineage_hold when due, so 'stays held' is true in effect, but the render word 'held' for a queued item could confuse a juror; consider printing 'queued (held when due)'.", "log": [{"t": "20 Nov 06:22", "who": "maya", "msg": "opened"}, {"t": "20 Nov 06:39", "who": "vikram", "msg": "posted result summary"}, {"t": "20 Nov 06:40", "who": "vikram", "msg": "→ in_review: Riders' outbox items now stay held, not cancelled. Planned.held and DryRun.held added. Env 919 passed, 8 skipped; container 927 passed"}, {"t": "20 Nov 06:45", "who": "maya", "msg": "review: done"}]}, {"id": "B3-49", "title": "ks.verify: epoch-fence check on every record (kabir, B3-25 review)", "sprint": 3, "track": "eng", "owner": "arjun", "reviewer": "kabir", "model": "sonnet", "created_by": "pmo", "status": "done", "outcome": "Verify proves no agent record was admitted under a stale epoch after its suspend, so containment is checkable from the record alone", "acceptance": ["Every admitted agent record's epoch equals the agent's current epoch folded from prior ks.control records; a record admitted after suspend (or under an old epoch) fails verify (TAMPER, first_bad) (tests incl. re-exec records)", "Honest containment runs (B3-19) and the hero path still verify OK"], "depends": ["B3-25"], "deliverable": "src/ks/verify/", "summary": "verify/core.py _record_pass: every EXEC agent record (reexec incl.) must carry env.epoch == EpochFold epoch; suspended/revoked => none; else TAMPER epoch_regression with first_bad (existing reason). tests/verify/test_epoch_fence.py: forged post-suspend admit, old epoch, re-exec stale, honest suspend/release. Container 5 failures in others' in-flight work (monitor alerts, run_options), none verify; make smoke anchored OK.", "review": "[kabir · done] Fence correct: EXEC agent record (reexec incl.) must equal EpochFold epoch, else epoch_regression first_bad. Matches gateway _control_denial and _reexec_plan. My attacks all TAMPER at the right seq: same-tick after suspend (new and old epoch), release then re-suspend (old and new epoch), revoke (old and new epoch), future epoch (no controls, and after release); other agent unaffected. Env verify+containment 67 passed; container verify/containment/runtime/redteam 145 passed, 3 failed only in tests/runtime/test_run_options.py (maya B3-27); world/containment runs verify OK. Non-blocking follow-ups: (1) a HOLD decision for a suspended/stale agent is not fenced (gateway denies at steps 7-9 before policy, so a HOLD there is also gateway misbehaviour; fence decision in (EXEC, HOLD)); (2) add the revoke / future-epoch / re-suspend cases to test_epoch_fence.py; (3) revoked-ancestor in act_chain is still not checked by verify.", "log": [{"t": "20 Nov 08:54", "who": "pmo", "msg": "opened"}, {"t": "20 Nov 08:54", "who": "arjun", "msg": "→ in_progress: start"}, {"t": "20 Nov 09:07", "who": "arjun", "msg": "posted result summary"}, {"t": "20 Nov 09:07", "who": "arjun", "msg": "→ in_review: ready"}, {"t": "20 Nov 09:13", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-54", "title": "F3 rogue comms PII egress never detected in bench (0/20)", "sprint": 3, "track": "eng", "owner": "nisha", "reviewer": "kabir", "model": "sonnet", "created_by": "pmo", "status": "done", "outcome": "inv.pii_egress catches the ADR ineage-hold now sets the config field (Outbox reads config; no in-process flag). window_pass skips ONLY the taint flag when lineage_hold is false (unrecorded, double dispatch, release tick, holds, suspensions still enforced). verify, console and ks score print the banner; score.json schema unchanged. (4) RT10: contrast run verifies exit 0 anchored with banner, irreversible_tainted_released>=1, R.n>0; same records relabelled lineage_hold=true -> window_violation (TAMPER); anchored relabel -> config_mismatch. Unit test in tests/verify/test_window.py, console banner test. Open: tests/redteam/SPEC.md RT10 lines (384-407, 585 'xfail B3-51') still say H=0 alone scores damage; left for the B3-35 session.", "review": "[kabir · changes] Suites green: env 1047 passed/12 skipped; container 1058 passed/1 skipped (hero golden tests/integration/test_hero_f2plus.py passes in both). (1) The code is right and ADR-04 s7 is wrong. The lineage hold (s5) is containment driven by the alert and does not depend on H; H only sets the window and the sensitive-field early hold. That makes this a design ADR edit, maya's and kabir's call, and it must be done openly, not silently. Amend s7 and the RT10 line in s8 to say: H=0 drops the window and the early hold, but the lineage hold still applies to any item whose lineage is tainted when it is released; residual damage at H=0 means effects dispatched before the alert. (2) The flag is not safe as built. no_lineage_hold lives only in RunOptions and an Outbox attribute. It is not in RunConfig/config_hash, so the record cannot show that this was a no-hold run, and s7 says H is the only knob. Agents cannot reach it (only the CLI sets it, in the parent process), and that part is fine. (3) Verify reporting window_violation is wrong for this run: it exits 2 (Exit.TAMPER), so the D10 contrast run would look like tampering to the jury. Fix: add a RunConfig field through the CON process (contracts bump), e.g. lineage_hold: bool = True, with a validator that verable": "abstract/FACT-CARD.md", "summary": "F2+x before/after in FACT-CARD (O5 before, O6 with resolver ww_rebase/1, opt-in), ALLOWED-NUMBERS §3a N15 / §3b N18 (+conditions: D-17 releases 5 = 3 honest + 2 tainted; T=40, H=6, 20 seeds, container; 19/20 resolved, s7 no conflict; verify OK 40/40; hero unchanged), JURY-QA Q10 (+2 traps). States refusals (suspect, root_candidates[0], evidence/seed writers, LLM/system/suspended; failing checks wait for a human) and THREAT-MODEL limits (collusion; verify trusts recorded value). Source BENCH-S3 §S4-13. Facts only, no abstract prose. Not committed.", "review": "[zoya · done] PASS. Every N15/N18 and O5/O6 cell matches BENCH-S3 (F2+x H=6 system column; S4-13 before/after columns, resolver table, Verify and Hero F2+ paragraphs): R 1/5->0, C 21/254->0, held honest 29->3, unholds 3[1..7]->5[1..9] (3+0 -> 3+2), 19/20 resolved (s7 no conflict), verify OK 40/40 per_agent_uid, hero identical off/on. Conditions travel with both rows: T=40, H=6, 20 seeds, container; opt-in with the label 'resolver: ww_rebase/1 (on)'; D-17 release clause on R=0; both rows quoted together. The refusals match ADR-05a 2a rev 3. Both limits match THREAT-MODEL line 90 (verify trusts the recorded value / TCB; collusion C3, no prevention claim). No abstract prose: all notes, tables and Q&A. Non-blocking nits: (1) JURY-QA trap says 'the suspect'. TERMS allows it only internally, so when speaking to the jury say 'top root candidate'. (2) 'taint-origin (seed) writers' can be misread as the random seed; 'A8 seed writes' is clearer. (3) Follow-up for zoya, not anaya: the TERMS F2+x and write-write conflict rows still say 'unresolved / a person must decide'. I will add the with-resolver line and a resolver/resolution term.", "log": [{"t": "20 Nov 17:06", "who": "pmo", "msg": "opened"}, {"t": "21 Nov 06:10", "who": "anaya", "msg": "→ in_review: FACT-CARD O5/O6, ALLOWED N15/N18, JURY-QA Q10 updated"}, {"t": "21 Nov 06:10", "who": "anaya", "msg": "posted result summary"}, {"t": "21 Nov 06:23", "who": "zoya", "msg": "review: done"}]}, {"id": "S4-12", "title": "D-18 resolver design: auditable, reversible conflict resolution", "sprint": 4, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "A design vikram can build in <=2 days that a jury can audit", "acceptance": ["Design note in org/adr/ (ADR-05 amendment): resolution is a signed c-0 record (rule id, key, versions, released items, rationale, plan_hash link); verify rule; console line; undo path through ks.recover with its own trace; additive contract change if needed", "Names exactly which flags the rule may resolve and which always wait for a human"], "depends": [], "deliverable": "org/adr/", "summary": "Rev 2 (kabir's 5 changes): (1) new check no_tainted_view_reads, because args are replayed; vikram asserts triage's h+2 record has no tainted view read. (2) verify rejects a replayed resolve per (plan_id,n) and any resolve after an unresolve of the same (O,H). (3) verify does not re-run the tool: named as a TCB residual, with a THREAT-MODEL row proposed for kabir. (4) undo-of-undo is a person's job; bench unresolve after release gives unresolve_blocked, with a test. (5) ks run --resolver ww_rebase/1; demo and bench after-row on, labelled 'resolver: ww_rebase/1 (on)'. B5-a updated.", "review": "[kabir · changes] Strong design: one record and one version, a recheck on the head, verify recomputes the rule, refusal lines name the failed check. Five changes needed before Aarav signs. (1) LEAK: seed_reads_only allows VIEW reads of seed versions, and sim_clean re-runs H's tool with the ORIGINAL args. Some deterministic agents take values from their view and put them in args (crm does this: price*10 read from the view). Such an agent would carry the culprit's value into the rebased write, and every check would pass. Fix: add check no_tainted_view_reads (H has no view-source read of any tainted version). Vikram must confirm that triage's F2+x record has none, which _triage suggests (its args are seed-only). (2) Replay: verify step 4 must also require at most one executed resolve per (plan_id, n), and resolve must not come after an unresolve of the same (O, H). (3) Verify only matches rebased_hash to the plan and never re-runs the tool. Either re-run ToolRerunner in resolution_pass or name this as a TCB residual for THREAT-MODEL. (4) Undoing an undo is a person's job (not_undone blocks the rule forever). Say so in section 5. Also: the bench approver releases rerun_reheld items, so on bench runs unresolve will almost always hit unresolve_blocked. Say so and test it. (5) Off-by-default vs D-18: add a ks run --resolver ww_rebase/1 flag to the build list. The demo and the bench after-row run with it on. Console and score show 'resolver: ww_rebase/1 (on)', and abstract numbers say 'with resolver on'. Two days for vikram is tight but works with the cut line. WHAT AARAV IS ASKED TO APPROVE (B5-a, plain words): when a bad agent's edit is buried under exactly one honest agent's later edit, and every safety check passes, the system may remove the bad edit and redo the honest edit on clean data by itself. It does this as part of the plan you approve, and it writes a signed entry that verify checks. You can undo it with one command, and that undo is also recorded. Anything that fails a check still waits for you. It is off unless the run turns it on, and the demo and bench turn it on and label it.\n\n[kabir · done] Rev 2 closes all five. (1) no_tainted_view_reads in §2 + vikram asserts it in test_f2x_resolved, test_refuse_view_copied_arg. (2) §6 step 4 rejects a replayed (plan_id,n) and a resolve after an unresolve of (O,H). (3) TCB residual named in §6; I added the THREAT-MODEL known limit (D-18, ADR-05a §6). (4) §5: undo-of-undo is a person's job; bench gives unresolve_blocked, with a test. (5) --resolver flag, label on in demo/bench. Attack retried on paper: view copy -> no_tainted_view_reads; tool read of a derived tainted version -> seed_reads_only; tool read of the seed -> recomputed on clean state by sim_clean and checked at apply. Residual: a colluding non-root-candidate agent carrying the value in process memory (built-in agents are stateless); written into the THREAT-MODEL limit, C3 no prevention claim. WHAT AARAV IS ASKED TO APPROVE (B5-a, plain words): when a bad agent's edit sits under exactly one honest agent's later edit, and every check passes, the system may remove the bad edit and redo the honest edit on clean data by itself, as part of the plan you approve. It writes a signed entry that verify checks. One command undoes it, and the undo is recorded too. Anything that fails a check waits for you. It is off unless the run turns it on; the demo and bench turn it on and say so. Verify checks the inputs, not the recomputed value.", "log": [{"t": "20 Nov 17:06", "who": "pmo", "msg": "opened"}, {"t": "20 Nov 17:12", "who": "maya", "msg": "→ in_progress: designing ADR-05a"}, {"t": "20 Nov 17:12", "who": "maya", "msg": "posted result summary"}, {"t": "20 Nov 17:12", "who": "maya", "msg": "→ in_review: ADR-05a ready for kabir"}, {"t": "21 Nov 00:01", "who": "kabir", "msg": "review: changes"}, {"t": "21 Nov 00:02", "who": "maya", "msg": "posted result summary"}, {"t": "21 Nov 00:02", "who": "maya", "msg": "→ in_review: rev 2: kabir changes 1-5 applied"}, {"t": "21 Nov 00:06", "who": "kabir", "msg": "review: done"}, {"t": "21 Nov 00:15", "who": "pmo", "msg": "→ done: Aarav approved CALL-02 amendment B5-a on 21 Nov (D-18 resolver design; kabir passed). S4-13 unblocked."}]}, {"id": "S4-13", "title": "D-18 resolver build + F2+x rerun (before and after rows)", "sprint": 4, "track": "eng", "owner": "vikram", "reviewer": "kabir", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "F2+x conflicts resolved auditably; every resolution traceable and reversible", "acceptance": ["Each resolution is a recorded signed decision; verify passes and fails on a forged/altered resolution; undo restores the pre-resolution state and is itself recorded", "Bench F2+x reported before and after side by side; hero F2+ unchanged"], "depends": ["S4-12"], "deliverable": "src/ks/recovery/", "summary": "Built ADR-05a (rev 3 refused_agents by maya). Bench F2+x 20 seeds H=6 T=40 (BENCH-S3 S4-13 table, native macOS): resolver off -> on: R 1/5 [0..1/5] -> 0 [0..0]; C 21/254 -> 0; held honest 29 [0..35] -> 3 [0..7]; unholds 3 -> 5 (2 tainted re-held). 19/20 seeds resolved (s7 has no conflict); ks verify OK on all 20 (no resolution_invalid). Hero F2+ seeds 1-5: score.json identical resolver off vs on. Resolver-off path does not change hero (plan bytes, score identical; native hero C 0/265 on s2).", "review": "[kabir · done] PASS. Container rerun (killswitch:kabir, per_agent_uid; ks bench --seeds 1-20 --faults F2+x --hold 6 --baselines system --ticks 40 --resolver-faults F2+x): same table cell for cell as native. Resolver off->on: R 1/5 [0..1/5] -> 0 [0..0]; C 21/254 [0..44/243] -> 0; held honest 29 [0..35] -> 3 [0..7]; unholds 3 -> 5 (2 tainted re-held). 19/20 resolved (s7 no ww conflict). Separate container pass: verify OK + per_agent_uid on all 40 runs (off and on), no resolution_invalid. Hero F2+ s1-5 off vs on: score (minus resolver keys) and plan bytes identical, verify OK. BENCH-S3 S4-13 provenance text now names the container run (raw runs/bench-s4-13-ctr/). Attacks: culprit-write-never-survives property re-run over seeds 1-20 (in-process world, scratch, not committed): all pass, every resolved object == S*, rebased agent never the suspect. candidates[1] with seed writes refused, suspect choice/evidence writer refused, forged rule / altered rebased_hash / claimed field / replayed / out-of-order / resolve-after-undo / double undo -> resolution_invalid, gateway skipping the hash check -> TAMPER, unresolve round trip restores versions and re-holds exactly, 1.3-1.6 fixtures verify, resolver off plan bytes identical: all cove ": "20 Nov 17:06", "who": "pmo", "msg": "opened"}, {"t": "21 Nov 05:37", "who": "pmo", "msg": "→ todo: From panel (S4-26 finding): under heavy host load agents miss tick deadlines (10 misses, run ended seq 194) and the hero scores C 3/144 instead of 0/265. Finale preflight must: run with nothing else loading the laptop, fail or warn loudly if any deadline was missed (timing.jsonl), and the console/score must show the miss count so a degraded run is never presented as the headline."}, {"t": "21 Nov 06:15", "who": "maya", "msg": "→ in_progress: building ks.validity + scripts/finale.sh + make finale"}, {"t": "21 Nov 06:27", "who": "maya", "msg": "posted result summary"}, {"t": "21 Nov 06:27", "who": "maya", "msg": "→ in_review: ready for kabir"}, {"t": "21 Nov 06:43", "who": "kabir", "msg": "review: done"}]}, {"id": "S4-23", "title": "Claim audit of README, demo-sim, console", "sprint": 4, "track": "eng", "owner": "kabir", "reviewer": "panel", "model": "opus", "created_by": "pmo", "status": "todo", "outcome": "No overclaim survives to the finale", "acceptance": ["Every number traces to a BENCH-S3 row; every R=0 has the operator-release clause; grep for never/proof/first/guarantee finds no unrefuted use; report in REDTEAM-S4.md"], "depends": ["S4-10"], "deliverable": "org/reports/", "summary": "", "review": "", "log": [{"t": "20 Nov 17:06", "who": "pmo", "msg": "opened"}]}, {"id": "S4-24", "title": "F2+c C=0 vs GUARDRAILS L8 (predicted C>0)", "sprint": 4, "track": "eng", "owner": "anaya", "reviewer": "vikram", "model": "opus", "created_by": "pmo", "status": "todo", "outcome": "Fixture or guardrail corrected", "acceptance": ["Written finding: why bench F2+c gives C=0; either the F2+c fixture or GUARDRAILS L8 is corrected"], "depends": [], "deliverable": "abstract/GUARDRAILS.md", "summary": "", "review": "", "log": [{"t": "20 Nov 17:06", "who": "pmo", "msg": "opened"}]}, {"id": "S4-25", "title": "ABS-07 comment-only review of Aarav's abstract", "sprint": 4, "track": "eng" tion-gate containers plus 2 full suites; record ended at seq 194 (normal 223). Same image rerun at low load (panel-rr-s4b): 0 deadline misses, seq 223, R 0/9, C 0/265, anchored. RISK [Our view]: the hero outcome depends on timing. Under host load agents miss tick deadlines, the run diverges and the score shows C>0. A juror's loaded laptop could hit this. Suggest: demo.sh/score print the deadline-miss count and label the run degraded when it is >0, or the bench reports C against its own miss count."}]}, {"id": "S4-27", "title": "make demo bind mount (virtiofs) ignores perms: rogue uid writes state.db/record/heads and reads all side stores", "sprint": 4, "track": "eng", "owner": "ishaan", "reviewer": "kabir", "model": "sonnet", "created_by": "panel", "status": "done", "outcome": "Per-agent uid isolation of the run dir holds on the README demo path", "acceptance": ["Live runs write the run dir on container-internal fs (e.g. /run/ks) and copy it to ./runs after the run, or an equivalent that a rogue uid cannot read or write", "RT1a extended: rogue on the make-demo path gets EACCES on state.db, record.jsonl, witness-heads and other runs' sidestore (test added)", "PANEL-JURY-01 #13 rerun shows run anchored, per_agent_uid"], "depends": [], "deliverable": "scripts/demo.sh", "summary": "Review fixes: RT16 now runs under /work/runs, adds witness-heads append and another run's sidestore read, plus a host static check that demo.sh/make smoke use --out /work/runs with no -v; RT1a walk includes /work; Dockerfile comment fixed. Passes in container.", "review": "[panel · changes] Panel gates this (listed reviewer kabir busy). FIX HOLDS: fresh copy, killswitch:panel. Repeated M2 rogue (docs uid 60005) on /work/runs/r1 with a second run /work/runs/other in the same container: state.db sqlite rw + append, record.jsonl read/append, witness-heads append, keys.json, sidestore, listing /work, /work/runs, run dirs, creating files in /work/runs and /app/runs: all PermissionError/OperationalError; run anchored. Only mount in the demo container is Docker's anonymous /app/runs volume (empty, not writable by the rogue); host ./runs is not mounted during the run. scripts/demo.sh end to end: verify OK seq 223 anchored, per_agent_uid, score R 0/9 C 0/265. Host-native ks verify --head on the docker-cp'd copy: exit 0 anchored; witness files present; controls: edited line -> TAMPER seq 100, witness removed -> WITNESS. RT16+RT1 pass in the image. CHANGES (small, test-only): (1) RT16 runs under /tmp (base fixture), not /work/runs, so reverting demo.sh/Makefile to the bind mount keeps it green; run it under /work/runs and add a static check that demo.sh and Makefile smoke use --out /work/runs and no -v on the ks run line. (2) Acceptance 2 names witness-heads and other runs' side store; RT16 tests neither; add both (my rogue at scratch atk/rogue.py shows the two lines). (3) RT1a walk list still omits /work. Nit: Dockerfile comment says run dir is root 0700; it is 0711 (children are 0600/0700, so no leak).\n\n[panel · done] Re-review after fixes, image killswitch:panel, tree has nisha/vikram WIP. RT16 now runs under /work/runs (asserts non-virtiofs fstype); rogue denied state.db, record, side store, keys, witness-heads append, other run's side store; files exist; anchored per_agent_uid. RT16+RT1 pass in container (3 passed, static check skips in image). make smoke: smoke OK anchored per_agent_uid. scripts/demo.sh (seed 2, resolver on): demo OK anchored, isolation=per_agent_uid (acceptance 3). Scratch-copy mutations of the static check: revert demo.sh to RUN=/app/runs + -v bind -> FAIL; -v runs:/work/runs on run line -> FAIL; Makefile smoke reverted to -v + /app/runs -> FAIL; smoke -v /work/runs -> FAIL. NIT (not blocking, open follow-up if wanted): a '--mount type=bind,...' on the demo run line passes the static check; also reject '--mount'. Full suites: host 1135 passed 14 skipped; container 1146 passed 1 FAILED tests/bench/test_bench.py::test_baselines_scored_by_same_scorer (baseline cells differ up to recovery). Not in S4-27 files: attribute to bench/runner + resolver WIP (nisha/vikram); passes on host. Also noted: demo score now C 3/144 vs demo-sim 0/265, same WIP, not S4-27.", "log": [{"t": "21 Nov 00:52", "who": "panel", "msg": "opened"}, {"t": "21 Nov 01:01", "who": "ishaan", "msg": "→ in_progress: start"}, {"t": "21 Nov 01:17", "who": "ishaan", "msg": "posted result summary"}, {"t": "21 Nov 01:17", "who": "ishaan", "msg": "→ in_review: done"}, {"t": "21 Nov 01:21", "who": "panel", "msg": "review: changes"}, {"t": "21 Nov 01:24", "who": "ishaan", "msg": "posted result summary"}, {"t": "21 Nov 01:24", "who": "ishaan", "msg": "→ in_review: fixes"}, {"t": "21 Nov 05:01", "who": "panel", "msg": "review: done"}, {"t": "21 Nov 05:01", "who": "panel", "msg": "→ done: panel gate passed"}]}, {"id": "S4-28", "title": "Off-gateway mid-run state edit crashes the gateway (ViewEntry) instead of a class-U alert", "sprint": 4, "track": "eng", "owner": "nisha", "reviewer": "kabir", "model": "sonnet", "created_by": "panel", "status": "done", "outcome": "An unmediated state write is flagged within 1 tick and the run ends anchored", "acceptance": ["Live test: a state value edited off-gateway mid-run gives a reconcile alert naming nobody, suspends nobody, run completes with a RunAnchor", "No traceback exit from ks run on a state.db value/hash mismatch"], "depends": [], "deliverable": "src/ks/gateway", "summary": "Kabir blocker fixed: Store.get verifies head value vs hash and raises StateCorrupt (ValueError); tool reads become recorded tool_error denies (no effect), build_view skips; outbox provenance uses verify=False so its own unrecorded_item hold still works. RT1c now also asserts no EVIL in side store/record/other objects (5 tool_error denies seen). Container tests redteam+integration+bench+gateway+state: 207 passed; native gateway/state/world/monitor/runtime green. Not done: SPEC note that verify ends OK once an honest write overwrites the edited head (alert is the only evidence).", "review": "[kabir · changes] Crash fixed, and the suites are green: native 1132 passed/14 skipped, container killswitch:kabir2 1145 passed/1 skipped. A/B bench with and without the AlertTaint lines (F2+,F2+c,F3,F4, seeds 1-20, H=6, T=40, system): bench.md identical between the two; all 66 shared system cells match BENCH-S3. Hero test passes. AlertTaint is needed and stays. Concern 1: skipping view entries is OK. The skipped object does not appear in that read_set, the reconcile alert names it, and a rogue needs off-gateway write access to cause a skip, which raises a hard alert. BLOCKER, found with Panel's exact attack (root docker exec, live run, seed 2 F2+, IBAN of S-17 edited at seq 4): the reconcile alert came at tick 2 and the run ended anchored. But TOOL reads (StateTxn.read -> Store.get, src/ks/state/store.py:296-375) never check the value against its hash. billing/comms/payments/crm read the edited value 'DE00EVIL000001' from tick 13 to 24 (seq 61,68,72,116,122,124), and the record logged the honest hash 751189.. for those reads. So the record misstates what the agent consumed. The edited value went into 3 held outbox payloads (PAY-0014, EM-0014, EM-0024; the AlertTaint change held them) and was laundered into state as invoices:INV-0013 remit_iban, authored by honest billing with a valid hash. There was no suspect and no plan, so nothing recovers it. Before this change the run crashed (fail closed). Now tool reads fail open. Fix: Store.get (head path) raises a typed StateCorrupt when value_hash(value) != head_hash. The gateway turns that into a deny (or not_found), and build_view keeps skipping. Extend RT1c to assert that no side-store payload and no state write contains the edited value after the edit. Minor: verify ends OK, not RECONCILE, once an honest gateway write overwrites the edited head (crm v2 in my run). That is expected, but the alert is the only evidence, so say so in SPEC.\n\n[kabir · done] Blocker fixed. Live root attack (killswitch:kabir2, seed 2 F2+, S-17 IBAN edited while paused before tick 2): hard reconcile alert at tick 2 naming nobody, nobody suspended, run anchored, verify RECONCILE. 6 tool_error denies. DE00EVIL appears nowhere except the edited head: not in the record, side store or any other object. The F2+ fault never fires because its read is denied. score shows 8 irreversible effects that differ from the fault-off oracle; none carries the edited value (a scoring artefact). Hero bisect, demo.sh seed 2 in the container: HEAD 5449aae, HEAD+S4-28 only, HEAD+resolver only (resolver off/ww_rebase/1) and the full tree (off/on) all give R 0/9, C 0/265, ttc 1, anchored. I could NOT reproduce C=3/144. S4-28 does not move C. Suites: native 1137 passed/14 skipped, container 1149 passed/2 skipped. Gap ruling: the reconcile alert is a chained, witnessed ks.alert (verify cross-checks it against alerts.jsonl), so it is tamper-evident evidence. But verify checks only the final state: once a blind gateway put replaces the edited head, verify ends OK, and score does not count reconcile alerts in ttc. I stated this limit in the THREAT-MODEL RT1 row and a new SPEC RT1c row. Not committed.", "log": [{"t": "21 Nov 00:52", "who": "panel", "msg": "opened"}, {"t": "21 Nov 01:01", "who": "nisha", "msg": "→ in_progress: start"}, {"t": "21 Nov 01:09", "who": "nisha", "msg": "posted result summary"}, {"t": "21 Nov 01:09", "who": "nisha", "msg": "→ in_review: ready"}, {"t": "21 Nov 05:01", "who": "kabir", "msg": "review: changes"}, {"t": "21 Nov 05:02", "who": "nisha", "msg": "→ in_progress: kabir blocker"}, {"t": "21 Nov 05:16", "who": "nisha", "msg": "posted result summary"}, {"t": "21 Nov 05:16", "who": "nisha", "msg": "→ in_review: kabir blocker fixed"}, {"t": "21 Nov 05:36", "who": "kabir", "msg": "review: done"}]}, {"id": "S4-29", "title": "ks blame advertised in ks --help and demo-sim but prints 'not yet implemented'", "sprint": 4, "track": "eng", "owner": "ishaan", "reviewer": "panel", "model": "sonnet", "created_by": "panel", "status": "done", "outcome": "Every command a juror can see either works or is not shown", "acceptance": ["ks blame RUN [--alert ID] prints ranked root candidates from the signed alert records (or the command and the demo-sim beat are removed)", "Test added; demo-sim Identify beat matches real output"], "depends": [], "deliverable": "src/ks/cli/__init__.py", "summary": "Review fixes: blame runs verify first and refuses (UNVERIFIED RECORD, verify exit code) on failure; hero test (crm first) and tampered-copy test added; demo-sim beat now shows real blame output.", "review": "[panel · changes] Hero run (seed 2, resolver on, copy of current tree): ks blame RUN and --alert a-000001 print 1. crm 2. intake 3. triage plus taint (suspect crm, t0 45, suspended 66, 6 versions, 6 actions, 2 outbox), exit 0; unknown alert exits IO. Read-only confirmed: audit hook shows only record.jsonl and one side-store file opened; file hashes and ls unchanged; no keys.json, state.db or socket. CHANGES: (1) MUST, framing attack: on a copy I changed agent_id crm->intake at seq 45 (verify: TAMPER hash_mismatch first_bad 45, exit 2). ks blame on that copy prints '1. intake 2. crm', exit 0, no warning. It recomputes from an unverified record and ignores the signed alert's root_candidates. Run verify first and refuse or print a VOID/TAMPER banner on non-OK, or at least print the alert's recorded root_candidates and flag any mismatch. (2) Acceptance 2 unmet: tests/cli covers only the not-a-run-dir path; add a hero-run test asserting crm first and a tampered copy failing. (3) demo-sim Identify beat does not match real output: it shows 'culprit hit in top 3: true', 'readers reached: billing, payments, comms (never auto-suspended)' and a time-to-identify line, which blame does not print; real output lists crm among 'agents with tainted actions'. Fix one side.\n\n[panel · done] Re-review after fixes. On the copied demo run (seed 2, resolver on) ks blame prints alert, 1. crm 2. intake 3. triage, suspect crm t0 45 suspended 66, taint line; exit 0. Framing attack repeated (agent_id crm->intake at seq 9): 'UNVERIFIED RECORD: verify hash_mismatch at seq 9', exit 2, no candidates. Tail truncation (30 lines dropped): UNVERIFIED RECORD truncated at seq 165, exit 3. Tests: hero crm-first and tampered-copy refusal added; tests/cli 36 passed. demo-sim Identify beat now matches real blame output line for line and says blame verifies first. Nit: blame checks consistency, not --head anchoring (no --head option); fine for the claim as worded, do not describe blame as anchored. Full-suite container failure (tests/bench baselines) is not in S4-29 files; see S4-27 review.", "log": [{"t": "21 Nov 00:52", "who": "panel", "msg": "opened"}, {"t": "21 Nov 01:01", "who": "ishaan", "msg": "→ in_progress: start"}, {"t": "21 Nov 01:17", "who": "ishaan", "msg": "posted result summary"}, {"t": "21 Nov 01:17", "who": "ishaan", "msg": "→ in_review: done"}, {"t": "21 Nov 01:21", "who": "panel", "msg": "review: changes"}, {"t": "21 Nov 01:24", "who": "ishaan", "msg": "posted result summary"}, {"t": "21 Nov 01:24", "who": "ishaan", "msg": "→ in_review: fixes"}, {"t": "21 Nov 05:01", "who": "panel", "msg": "review: done"}, {"t": "21 Nov 05:01", "who": "panel", "msg": "→ done: panel gate passed"}]}], "daysToAbstract": 1}</script>
<script>{
const D=JSON.parse(document.getElementById('data').textContent);
const P=D.project,I=D.issues||[],T=D.team||[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=[['todo','To do'],['in_progress','In progress'],['in_review','In review'],['changes','Changes asked'],['done','Done']];
const norm=s=>s==='backlog'?'todo':s==='blocked'?'changes':s;
const who=id=>T.find(t=>t.id===id)||{name:id||'—',model:''};
document.getElementById('title').textContent=P.name+' project board';
document.getElementById('tag').textContent=P.tagline;
document.getElementById('phase').textContent=D.phase;
document.getElementById('upd').textContent=P.updated;
const cnt=s=>I.filter(i=>norm(i.status)===s).length,done=cnt('done');
const figs=[[I.length,'issues opened'],[done,'done'],[cnt('in_progress')+cnt('in_review'),'in flight'],[(D.meetings||[]).length,'team calls'],[(D.decisions||[]).length,'decisions logged'],[D.daysToAbstract,'days to abstract']];
document.getElementById('figs').innerHTML=figs.map(([n,l])=>`<div class="fig1"><b>${esc(n)}</b><span>${l}</span></div>`).join('');
document.getElementById('strip').innerHTML=D.sprints.map(s=>{const si=I.filter(i=>i.sprint===s.n),d=si.filter(i=>norm(i.status)==='done').length,pc=si.length?Math.round(100*d/si.length):(s.status==='done'?100:0);return `<div class="sp ${s.status}"><h3>Sprint ${s.n} · ${esc(s.name)}</h3><p>${esc(s.goal)}</p><div class="meter" role="img" aria-label="${pc}% done"><i style="width:${pc}%"></i></div><p class="small" style="margin:6px 0 0">${d}/${si.length} issues · ${esc(s.status)}</p></div>`}).join('');
const fs=document.getElementById('fs'),fo=document.getElementById('fo'),q=document.getElementById('q');
fs.innerHTML='<option value="">All sprints</option>'+D.sprints.map(s=>`<option value="${s.n}">Sprint ${s.n}</option>`).join('');
const owners=[...new Set(I.map(i=>i.owner))];
fo.innerHTML='<option value="">Everyone</option>'+owners.map(o=>`<option value="${esc(o)}">${esc(who(o).name)}</option>`).join('');
try{const v=JSON.parse(localStorage.getItem('ksf')||'{}');fs.value=v.s||'';fo.value=v.o||''}catch(e){}
const card=i=>{const o=who(i.owner);return `<button class="card st-${esc(i.status)}" data-id="${esc(i.id)}"><div class="id">${esc(i.id)} · S${i.sprint}</div><div class="t">${esc(i.title)}</div><div class="chips"><span class="chip">${esc(o.name)}</span><span class="chip m-${esc(i.model)}">${esc(i.model)}</span>${i.reviewer?`<span class="chip">review: ${esc(who(i.reviewer).name)}</span>`:''}</div></button>`};
function draw(){const s=fs.value,o=fo.value,t=q.value.toLowerCase();try{localStorage.setItem('ksf',JSON.stringify({s,o}))}catch(e){}
const L=I.filter(i=>(!s||String(i.sprint)===s)&&(!o||i.owner===o)&&(!t||JSON.stringify(i).toLowerCase().includes(t)));
document.getElementById('kb').innerHTML=COLS.map(([k,n])=>{const c=L.filter(i=>norm(i.status)===k);return `<div class="col"><h3><span>${n}</span><span class="mut">${c.length}</span></h3>${c.map(card).join('')||'<p class="small mut">Nothing here</p>'}</div>`}).join('')}
[fs,fo].forEach(e=>e.addEventListener('change',draw));q.addEventListener('input',draw);draw();
const dlg=document.getElementById('dlg');
document.getElementById('kb').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b)return;const i=I.find(x=>x.id===b.dataset.id),o=who(i.owner);
document.getElementById('dlgin').innerHTML=`<p class="small mut">${esc(i.id)} · Sprint ${i.sprint} · ${esc(i.track||'')} · opened by ${esc(who(i.created_by).name)}</p><h2>${esc(i.title)}</h2>
<table><tr><th>Owner</th><td>${esc(o.name)} (<span class="m-${esc(i.model)}">${esc(i.model)}</span>)</td></tr><tr><th>Reviewer</th><td>${esc(who(i.reviewer).name)}</td></tr><tr><th>Status</th><td>${esc(i.status)}</td></tr><tr><th>Outcome</th><td>${esc(i.outcome)}</td></tr><tr><th>Deliverable</th><td><code>${esc(i.deliverable||'')}</code></td></tr></table>
${(i.acceptance||[]).length?`<h3>Acceptance</h3><ul>${i.acceptance.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}
${i.summary?`<h3>Result</h3><pre>${esc(i.summary)}</pre>`:''}
${i.review?`<h3>Review</h3><pre>${esc(i.review)}</pre>`:''}
${(i.log||[]).length?`<h3>Log</h3><ul class="feed">${i.log.map(l=>`<li><time>${esc(l.t)}</time><b>${esc(who(l.who).name)}</b> ${esc(l.msg)}</li>`).join('')}</ul>`:''}
<p><button id="cl">Close</button></p>`;dlg.showModal();document.getElementById('cl').onclick=()=>dlg.close()});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
document.getElementById('meet').innerHTML=(D.meetings||[]).slice().reverse().map((m,k)=>`<details class="meet" ${k?'':'open'}><summary>${esc(m.title)} <span class="small mut">· ${esc(m.date)}</span></summary><p>${esc(m.summary)}</p>${(m.decisions||[]).length?`<b class="small">Decided</b><ul>${m.decisions.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}${(m.next||[]).length?`<b class="small">Next</b><ul>${m.next.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}<p class="small mut">Attendees: ${esc((m.attendees||[]).map(a=>who(a).name).join(', '))}</p></details>`).join('')||'<p class="mut">First call happens when Sprint 1 research lands.</p>';
document.getElementById('dates').innerHTML=D.dates.map(d=>`<li class="${d.hard?'hard':''}"><b>${esc(new Date(d.d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}))}</b><span>${esc(d.what)}</span></li>`).join('');
document.getElementById('dec').innerHTML=(D.decisions||[]).length?`<table class="stack"><thead><tr><th>ID</th><th>Decision</th><th>Status</th></tr></thead><tbody>${D.decisions.map(d=>`<tr><td>${esc(d.id)}</td><td><b>${esc(d.title)}</b><br><span class="small mut">${esc(d.summary)}</span></td><td>${esc(d.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="mut">No decisions yet.</p>';
document.getElementById('team').innerHTML=T.map(t=>{const a=I.find(i=>i.owner===t.id&&['in_progress','in_review','changes'].includes(i.status));return `<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.role)}</td><td class="m-${esc(t.model)}">${esc(t.model)}</td><td>${a?esc(a.id+' '+a.title):'<span class="mut">'+esc(t.focus)+'</span>'}</td></tr>`}).join('');
document.getElementById('feed').innerHTML=(D.activity||[]).slice(-14).reverse().map(a=>`<li><time>${esc(a.t)}</time><b>${esc(who(a.who).name)}</b> ${esc(a.msg)}</li>`).join('');
document.getElementById('risk').innerHTML=(D.risks||[]).map(r=>`<tr><td>${esc(r.r)}</td><td>${esc(r.mit)}</td></tr>`).join('');
}</script>
