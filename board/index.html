WORM for runs without one. (4) The stall/fork/memory-bomb row is present: per-tick deadline, missing envelope = no-op + anomaly, rlimits, container limits out of scope. (5) The Control-action/recovery-key row is present and the operator is trusted. Nits fixed: no 'quarantine'/'log' left, side store mapped to F3.\\nMUST-FIX: sibling-agent hijack (framing with a valid signature). The Live setup puts ALL agents on 'a separate unprivileged uid', one uid shared by every agent, and the out-of-scope table lists 'separate uid/container per agent' as production-only. Under the sanctioned D11 attack (arbitrary Python in the rogue), a same-uid process can ptrace an honest sibling, or use pidfd_getfd / process_vm_readv on it, and take its gateway socket and signer handle. This sandbox has no Yama (/proc/sys/kernel/yama/ptrace_scope is absent), so the classic same-uid ptrace rule applies. The rogue then submits envelopes signed by crm's key through crm's handle. By C4's own wording that is a valid signature attributing the action to crm, so D7 anti-framing, F4 identity and RT11 are defeated without a key read, and no RT exercises this. A hostile jury will try it once they see one shared agent uid. Fix: (a) Live setup: 'agents: one unprivileged uid per agent (numeric, e.g. 20000+index; root can setuid to any uid without a passwd entry), and the agent template sets PR_SET_DUMPABLE=0 before agent code runs'. Per-agent uids also make RLIMIT_NPROC per-agent, which helps the fork-bomb row. (b) Add a §5 row: Rogue | RT3 (variant) | ptrace/pidfd_getfd on a sibling agent to use its socket and signer handle | per-agent uid + non-dumpable agent processes; rule 2 | 0 envelopes accepted through another agent's handle. (c) If per-agent uids fail in an environment, say so in the Live setup sentence beside the C1/C4 one: attribution to a specific honest agent is void for that run. Kabir/Maya: add sibling-hijack to the RT2/RT3 test.\\nLENGTH (~1,630 words, criterion '2 pages'): ACCEPTABLE. It is table-dense, every row answers a jury attack, and the jury reads it before the live break, where completeness matters more than brevity. Before publishing, keep it to 2 rendered pages: (i) drop the 'Changes v2 (panel)' line from the jury copy (it is internal process; the issue log keeps it); (ii) drop the 'Detect, not exclude' paragraph, because the record+heads row already says it (fold 'a run with no printed head is out of scope (WORM)' into that row's control cell). That saves ~90 words. Do not cut §6: §5 cites the rules by number.\\nNit: the insider definition says 'no write access to the witness head store', but the record is gateway-owned (uid 0, 0600), so anyone able to edit it is effectively root and can also write the 0700 store. The printed head is the real anchor and the store is defence in depth. Word the insider as 'edits record files; holds no witness key; cannot alter the head printed at run end'. Re-review is quick: one row and two Live-setup clauses.\n\n[panel · done] DONE. Signed off for the jury. v3 fixes the sibling-hijack must-fix, applies the trims and fixes the nit.\n(1) PER-AGENT UID + NON-DUMPABLE: PASS, independently re-run. I ran /tmp/kabir_uidtest/uidtest.py with python3 -I from /tmp as uid 0, today. subprocess user=60001/60002 gives those uids with no passwd entry, and preexec setuid gives 60003. With the attacker as uid 60002 and the victim as uid 60001, ptrace and pidfd_getfd both return EPERM, whether the victim is dumpable or not. With the same uid and a dumpable victim, both succeed (ptrace OK, pidfd_getfd fd 4), which confirms the original finding. With the same uid and a non-dumpable victim, both return EPERM. Yama is absent. process_vm_readv and /proc/pid/mem go through the same ptrace-attach check, and RT3b also probes vm_read. The Live setup states it correctly: numeric uid 60001 + index, PR_SET_DUMPABLE=0 set in the template before agent code (after exec, which is right), per-uid rlimits (helps the fork-bomb row). Per-agent uids also stop cross-agent kill(), a small availability bonus.\n(2) RT3b ROW: PASS. The §5 row has the attack, the control (per-agent uid + non-dumpable; rule 2) and a boolean target. §7 now lists 'attaching to sibling agents' as sanctioned. SPEC.md has the catalogue row and a section with the precondition, the NOT_ENFORCEABLE fallback, ptrace/getfd/vm_read probes, a pass check that compares attribution to the oracle, and a documented control run that is not asserted.\n(3) VOID-ATTRIBUTION FALLBACK: PASS. The Live setup sentence sits beside the C1/C4 one. The out-of-scope shared-uid row covers both cases (agent = gateway user voids C1/C4; agents sharing a uid void per-agent attribution). C4's refuse cell ('which key signed through which handle') agrees.\n(4) TRIMS: PASS. The 'Detect, not exclude' paragraph is dropped. The WORM no-printed-head clause is folded into the truncation row. The Changes note moved to THREAT-MODEL-CHANGES.md. §6 is kept. Length is about 1,630 words against about 1,600 in v2, and the table density is the same, so it is still 2 rendered pages.\n(5) INSIDER WORDING: PASS, verbatim as requested.\nNo 'quarantine' or 'log' in the jury copy. Targets are labelled D13. C1-C6 are unchanged.\nNits (no re-review): (a) §5 RT3b target, '0 actions attributed to the victim', reads literally as crm doing nothing. Make it '0 rogue actions attributed to the victim', matching SPEC's 'beyond its own'. (b) SPEC.md line 77, RT5 'TOCTOU at quarantine': TERMS bans the word, use 'suspension'. This is in SPEC, not the jury copy. (c) 'Checked here 19 Nov' is a measured fact, not a target, so D13 is fine. Keep the script in the repo (tests/redteam) so the claim is reproducible, not only in /tmp.", "log": [{"t": "19 Nov 00:54", "who": "kabir", "msg": "opened"}, {"t": "19 Nov 00:54", "who": "kabir", "msg": "→ in_progress"}, {"t": "19 Nov 00:56", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 00:56", "who": "kabir", "msg": "→ in_review"}, {"t": "19 Nov 01:01", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 01:04", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 01:04", "who": "kabir", "msg": "→ in_review: panel fixes applied"}, {"t": "19 Nov 05:59", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 06:02", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 06:02", "who": "kabir", "msg": "→ in_review: per-agent uid + RT3b"}, {"t": "19 Nov 06:07", "who": "panel", "msg": "review: done"}, {"t": "19 Nov 06:08", "who": "pmo", "msg": "uid test moved to tests/redteam/uid_isolation_check.py for reproducibility"}]}, {"id": "SEC-02", "title": "Red-team spec RT1-RT12 as executable test plan", "sprint": 2, "track": "security", "owner": "kabir", "reviewer": "maya", "model": "opus", "created_by": "kabir", "status": "changes", "outcome": "Sprint 4 test spec: each of RT1-RT12 written so an engineer can turn it into a pytest or live demo script without asking", "acceptance": ["Each RT has: setup (seed, agents, preconditions), script outline (steps the rogue code runs), observable signal, binary pass criterion, owner module", "Pass criteria are machine-checkable (exit code, record field, count == 0), not prose", "Marks which run live at finale (F5/F6, ks inject, DB bypass, line edit, full rewrite) vs pytest-only (F3), per D11", "RT11 scores false-positive cost; RT3 asserts the claimed agent is NOT suspended (D7 anti-framing)", "Owner modules exist in Maya's C1-C6 / ADR names; maya confirms each is buildable"], "depends": [], "deliverable": "tests/redteam/SPEC.md", "summary": "tests/redteam/SPEC.md: RT1-RT12 each with setup, rogue script outline, signal, binary pass expression over the C6 run dir / ks verify exit enum / counts, owner modules + ADR. LIVE at finale: RT1 DB bypass, RT3 forgery (F5), RT7 line edit and RT8 full rewrite (F6), RT10 F2+ via ks inject with hold 0 vs >0; F3 is a pytest-only variant of RT10; the rest are pytest and the jury may try them through the template. RT3 asserts billing stays active and only conn:R is suspended; RT11 asserts suspend-not-revoke, release restores the victim, and fp_cost is recomputed independently. Section 3 defines the jury rogue template (ctx.send/raw_send/sign_envelope/reconnect/report/dump, ks run --rogue). 10 contract requests Q1-Q10 for CON-01/SEC-03, the big one being Q9: C2 has no agent_id/act_chain. Open D7 point: an unattributable DB bypass suspends nobody. RT2 note: the container is uid 0, so agents can be dropped to a separate uid, which may make key isolation enforceable here.", "review": "[maya · changes] CHANGES (maya). A strong spec. Every RT has setup, script, signal and a machine-checkable pass. LIVE vs pytest follows D11. RT3 asserts the anti-framing property and RT11 recomputes fp_cost. I ticked §4 in SPEC.md: 7 buildable (RT1, RT2, RT3, RT3b, RT5, RT6, RT7, RT8 and the harness, after the renames), 4 waiting on a named change (RT4, RT9, RT10, RT12), 1 not buildable (RT11). Owner modules all exist in C1-C6 and the ADRs.\nMust fix:\n1. RT11 contradicts ADR-04. Suspension follows the origin, so payments is NOT suspended and false_accusations==0. Split it: 11a, the ADR-04 path (triage = root_candidates[0] suspended, payments' tainted payment held, its clean work flows, fp_cost recomputed); 11b, the operator/harness suspends payments, then release at a fresh epoch, held items go out unless tainted, lost honest effects 0, false_accusations>=1. Also state triage's write scope on suppliers.iban (ADR-03/06).\n2. Renames from SEC-03 §4: attributed_agent, envelope.act_chain[*].principal, root_candidates[0] (no suspect), status, lineage hashes, Control.op (the seq comes from the carrying record), expiry_tick.\n3. RT6: the projection compares deny/schema in run A against exec in run B, so it fails by construction. Project over conn_id != rogue, and send one envelope per tick.\n4. RT12: there is no delegation path in ADR-03/06; tara or nisha must add one, or drop the act_chain leg. ctx.reconnect is impossible with path-less socketpairs (ADR-00). release_at is not an envelope field. Effects have no seq/act_chain.\n5. RT9/RT10: use ADR-06 effects fields (value_hash, agent; no beneficiary_iban or to). Score keys as tara decides (post_alert_tainted vs _effects, irreversible_released vs irreversible_tainted_released). Under the amended ADR-04, RT9 expects crm at [0], auto-suspended and counted in false_accusations, and intake in the top 3; fix the 'operator click' note.\n6. RT8 g needs a run killed between flush and checkpoint, because ADR-00 takes a final checkpoint. Add (h) keys.json swap (SEC-03 B1).\n7. RT2 runs in fresh-key mode (SEC-03 B2). RT3(a): the signer may refuse a foreign agent_id (N2), so accept either outcome.\n8. RT7: record the redaction boundary. Setting redacted=true passes verify by design.\nDependencies on me: monotonic epoch plus TickFrame.epoch (RT4, RT11b; CON-02 M4/M5), the agent view in read sets (RT9; M6), verify!=OK => FROZEN (RT7; M12). RT5: I'm changing ADR-00 so surplus frames get over_quota. Your §2 note on RT2 is resolved: ADR-00 drops agents to per-agent uids.", "log": [{"t": "19 Nov 00:54", "who": "kabir", "msg": "opened"}, {"t": "19 Nov 00:54", "who": "kabir", "msg": "→ in_progress"}, {"t": "19 Nov 00:59", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 00:59", "who": "kabir", "msg": "→ in_review: spec ready; maya to tick section 4 buildability and answer Q1-Q10 + RT1 D7 point"}, {"t": "19 Nov 06:19", "who": "maya", "msg": "review: changes"}]}, {"id": "SEC-03", "title": "Security review of contracts C1-C6 against the 11 day-one rules", "sprint": 2, "track": "security", "owner": "kabir", "reviewer": "maya", "model": "opus", "created_by": "kabir", "status": "in_review", "outcome": "Rule-by-contract verdict table so C1-C6 freeze with no security gaps", "acceptance": ["11x6 matrix: each day-one rule (CALL-01/kabir.md s4) vs each contract C1-C6 marked pass / gap / n.a. with a one-line reason", "Every gap has a concrete proposed contract change (field, check or invariant) and severity (blocker / fix-before-S4 / note)", "Explicitly checks: one canonical serializer (rule 4), epoch+deny-list inside write txn and hold re-check at dispatch (rule 5), fail-closed U (rule 6), denials recorded (rule 11)", "Blockers resolved or accepted by maya before contracts freeze"], "depends": ["CON-01"], "deliverable": "org/reports/SEC-03.md", "summary": "org/reports/SEC-03.md: 11x6 grid (35 pass / 16 n.a. / 15 gap cells, 12 distinct gaps), backed by 64 probes in /tmp/sec03. 4 blockers: B1 witness count plus anchoring of keys.json; B2 determinism forces seed-derived private keys; B3 release reuses the pre-suspend epoch and expiry is uncapped; B4 RecursionError on a 6 KB nested frame. 8 fix-before-S4 items (F1 run-dir perms expose the side store, F2 agent-signed ks.control validates, F3-F8) and 10 notes. Rules 4/5/6/11 checked explicitly; Q1-Q10 met except Q6 (deferred). Pseudonymised hashes accepted with conditions; global-only chain accepted. CON-01 verdict: changes (B1-B4).", "review": "", "log": [{"t": "19 Nov 00:54", "who": "kabir", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "kabir", "msg": "→ in_progress"}, {"t": "19 Nov 06:12", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 06:12", "who": "kabir", "msg": "→ in_review: report posted; CON-01 marked changes with B1-B4"}]}, {"id": "SKEL-01", "title": "Walking skeleton: 2 agents → gateway stub → recorder → verify + determinism test", "sprint": 2, "track": "eng", "owner": "maya", "reviewer": "panel", "model": "opus", "created_by": "maya", "status": "todo", "outcome": "Thinnest end-to-end path on the frozen contracts before 25 Nov: two agent subprocesses send signed envelopes over Unix sockets, gateway stub runs the tick barrier, recorder writes C2, ks verify passes", "acceptance": ["2 agent subprocesses (no keys in-process, signer handle) → gateway stub → hash-chained record; ks verify exits 0 on the clean record and non-zero with first bad index after a one-line edit", "Determinism test in pytest: same seed run twice gives byte-identical record files", "Uses only src/ks/contracts/ types and the canonical serializer (no ad-hoc JSON); runs in CI-style one command"], "depends": ["CON-01"], "deliverable": "src/ks/", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}]}], "daysToAbstract": 3}</script>
<script>{
const D=JSON.parse(document.getElementById('data').textContent);
const P=D.project,I=D.issues||[],T=D.team||[];

const COLS=[['todo','To do'],['in_progress','In progress'],['in_review','In review'],['changes','Changes asked'],['done','Done']];

const who=id=>T.find(t=>t.id===id)||{name:id||'—',model:''};
document.getElementById('title').textContent=P.name+' project board';
document.getElementById('tag').textContent=P.tagline;
document.getElementById('phase').textContent=D.phase;
document.getElementById('upd').textContent=P.updated;

const figs=[[I.length,'issues opened'],[done,'done'],[cnt('in_progress')+cnt('in_review'),'in flight'],[(D.meetings||[]).length,'team calls'],[(D.decisions||[]).length,'decisions logged'],[D.daysToAbstract,'days to abstract']];
document.getElementById('figs').innerHTML=figs.map(([n,l])=>`<div class="fig1"><b>${esc(n)}</b><span>${l}</span></div>`).join('');
document.getElementById('strip').innerHTML=D.sprints.map(s=>{const si=I.filter(i=>i.sprint===s.n),d=si.filter(i=>norm(i.status)==='done').length,pc=si.length?Math.round(100*d/si.length):(s.status==='done'?100:0);return `<div class="sp ${s.status}"><h3>Sprint ${s.n} · ${esc(s.name)}</h3><p>${esc(s.goal)}</p><div class="meter" role="img" aria-label="${pc}% done"><i style="width:${pc}%"></i></div><p class="small" style="margin:6px 0 0">${d}/${si.length} issues · ${esc(s.status)}</p></div>`}).join('');
const fs=document.getElementById('fs'),fo=document.getElementById('fo'),q=document.getElementById('q');
fs.innerHTML='<option value="">All sprints</option>'+D.sprints.map(s=>`<option value="${s.n}">Sprint ${s.n}</option>`).join('');
const owners=[...new Set(I.map(i=>i.owner))];
fo.innerHTML='<option value="">Everyone</option>'+owners.map(o=>`<option value="${esc(o)}">${esc(who(o).name)}</option>`).join('');
try{const v=JSON.parse(localStorage.getItem('ksf')||'{}');fs.value=v.s||'';fo.value=v.o||''}catch(e){}
const card=i=>{const o=who(i.owner);return `<button class="card st-${esc(i.status)}" data-id="${esc(i.id)}"><div class="id">${esc(i.id)} · S${i.sprint}</div><div class="t">${esc(i.title)}</div><div class="chips"><span class="chip">${esc(o.name)}</span><span class="chip m-${esc(i.model)}">${esc(i.model)}</span>${i.reviewer?`<span class="chip">review: ${esc(who(i.reviewer).name)}</span>`:''}</div></button>`};
function draw(){const s=fs.value,o=fo.value,t=q.value.toLowerCase();try{localStorage.setItem('ksf',JSON.stringify({s,o}))}catch(e){}

<table><tr><th>Owner</th><td>${esc(o.name)} (<span class="m-${esc(i.model)}">${esc(i.model)}</span>)</td></tr><tr><th>Reviewer</th><td>${esc(who(i.reviewer).name)}</td></tr><tr><th>Status</th><td>${esc(i.status)}</td></tr><tr><th>Outcome</th><td>${esc(i.outcome)}</td></tr><tr><th>Deliverable</th><td><code>${esc(i.deliverable||'')}</code></td></tr></table>
${(i.acceptance||[]).length?`<h3>Acceptance</h3><ul>${i.acceptance.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}

document.getElementById('meet').innerHTML=(D.meetings||[]).slice().reverse().map((m,k)=>`<details class="meet" ${k?'':'open'}><summary>${esc(m.title)} <span class="small mut">· ${esc(m.date)}</span></summary><p>${esc(m.summary)}</p>${(m.decisions||[]).length?`<b class="small">Decided</b><ul>${m.decisions.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}${(m.next||[]).length?`<b class="small">Next</b><ul>${m.next.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}<p class="small mut">Attendees: ${esc((m.attendees||[]).map(a=>who(a).name).join(', '))}</p></details>`).join('')||'<p class="mut">First call happens when Sprint 1 research lands.</p>';
document.getElementById('dates').innerHTML=D.dates.map(d=>`<li class="${d.hard?'hard':''}"><b>${esc(new Date(d.d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}))}</b><span>${esc(d.what)}</span></li>`).join('');
document.getElementById('dec').innerHTML=(D.decisions||[]).length?`<table class="stack"><thead><tr><th>ID</th><th>Decision</th><th>Status</th></tr></thead><tbody>${D.decisions.map(d=>`<tr><td>${esc(d.id)}</td><td><b>${esc(d.title)}</b><br><span class="small mut">${esc(d.summary)}</span></td><td>${esc(d.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="mut">No decisions yet.</p>';
document.getElementById('team').innerHTML=T.map(t=>{const a=I.find(i=>i.owner===t.id&&['in_progress','in_review','changes'].includes(i.status));return `<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.role)}</td><td class="m-${esc(t.model)}">${esc(t.model)}</td><td>${a?esc(a.id+' '+a.title):'<span class="mut">'+esc(t.focus)+'</span>'}</td></tr>`}).join('');
document.getElementById('feed').innerHTML=(D.activity||[]).slice(-14).reverse().map(a=>`<li><time>${esc(a.t)}</time><b>${esc(who(a.who).name)}</b> ${esc(a.msg)}</li>`).join('');
document.getElementById('risk').innerHTML=(D.risks||[]).map(r=>`<tr><td>${esc(r.r)}</td><td>${esc(r.mit)}</td></tr>`).join('');
}</script>
</body>
</html>
