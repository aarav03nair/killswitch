nly, over-taint (L2 covers it) and the dry-run chain (keep 'approved plan'); 2f tamper-alert freeze. Define TTI/TTC once, in 3b: delete the duplicates in 2c/2d. Add one line under the budget table: section totals are binding; subsections are +/-15 and bullet order inside a subsection is free. ABS-07 reviewers then enforce totals, not micro-budgets.\\nMUST-FIX 2: the framing can be sharper. The jury 'rewards the team that frames the problem best'. Our strongest frame is that the brief's own requirement ('reverses one agent's damage WITHOUT discarding the other agents' work') is undefined once honest agents have read the bad write. 1a states that abstractly, and the IBAN example only arrives in 2a, inside the fix. Move the example into 1a so the gap is shown, not told. 1a bullets: brief's frame + brief's 'without discarding' clause [CHARTER] -> crm swaps IBAN; billing/payments/comms acted on it; inventory/docs untouched [D12 · W6 label] -> their work is honest AND built on the bad write -> 'undo crm' undefined [P1]. Rebudget: 1a 70->100, 1b 110->90, 1c 120->110 (problem stays 300). Delete 2a: 2b opens by walking the example. Then 2b 70->80, 2d 60->65, 2e 75->95, 2f 40->45 (fix stays 330, total 900). Also show in 2c/2d/2e that they map 1:1 to the brief's three scores (time-to-identify / time-to-contain / clean recovery). That is already the structure; one tag line per heading makes it explicit.\\nSHOULD-FIX: 3a, tag the brief's 'an agent that can be audited, not only demoed' [CHARTER]; testimony vs evidence answers it directly. 3b, add a bullet: the brief's three scores have no agreed measurement in the standards we checked -> we define checkable ones, scored against the oracle [RES-08 headline; qualifier 'in the standards we checked']. Ask zoya to add it to GUARDRAILS as W7 if adopted.\\nNits: 1b, '✗ internal / cyber [#1]' is enough; the 'card #1 overrides P2' flag is stale because P2 is fixed in ABS-02 v2. 2d, write 'reconciliation mismatch (class U)', not bare 'class U' (D7). 3c, NIST MANAGE 4.3 is sourced in RES-08 [19], not on the card; tag it there. Re-review is quick once the tags and the 1a move are in.\n\n[panel · done] DONE. v2 resolves both must-fixes, and the should-fixes and nits are in.\nMUST-FIX 1 (budget vs points): PASS. Every point bullet is tagged. 55 MUST and 33 IF-ROOM. I counted MUSTs per subsection and they match the table: 1a 6, 1b 6, 1c 3 + box 4, 2b 5, 2c 3, 2d 4, 2e 6, 2f 3, 3a 4, 3b 4, 3c 2, Limits 3, Show 2. No subsection goes above about 1 MUST per 15 budget words. All the demotions I listed are applied. The #7 numbers and their 'dense spread' line are gone, and a Guard bars them from the clause. TTI/TTC is defined only in 3b, and 2c/2d point there. The binding rule sits under the table: section totals binding, subsections ±15, bullet order free. Guard: lines carry no tag and cost no words, which is the right split.\nMUST-FIX 2 (framing): PASS. 1a opens on the brief's 'without discarding' clause, which matches CHARTER line 10. It then shows the gap with the IBAN example: crm swaps, billing/payments/comms act on it, inventory/docs untouched, their work is honest AND built on the bad write, so 'undo crm' is undefined [P1]. The ×10 Guard moved with it. 2a is deleted and 2b opens by walking the example. Budgets: 1a 100, 1b 90, 1c 110, 2b 80, 2c 45, 2d 65, 2e 95, 2f 45. Totals 300 / 330 / 170 / 85 = 900 plus the 15-word title. Scores: lines tie 2c/2d/2e 1:1 to time-to-identify / time-to-contain / clean recovery.\nSHOULD-FIX + NITS: PASS. 3a quotes 'audited, not only demoed' verbatim (CHARTER line 14). The 3b W7 bullet keeps 'in the standards we checked', and GUARDRAILS v3 W7 matches it. F11 has the 'approved' recovery-plan step and agrees with 2d ('never cancelled here') and 2e (cancel as an approved plan step). 1b now reads '✗ internal / cyber [#1]'. 2d now reads 'reconciliation mismatch (class U)'. 3c tags NIST to RES-08 [19].\nPASTEABLE-PROSE CHECK: PASS again. Every bullet is a fragment of arrows, colons and middots. The only full sentences are the key, the binding rule, the writing plan and the Changes notes, and all of those are instructions. Writing-plan step 5 still requires own words typed in an editor, nothing pasted. Fewer MUSTs also removes the one-sentence-per-bullet risk I raised in v1.\nOptional nits (no re-review): (a) some bullets run 13-17 tokens counting symbols (3b TTI line, W7 bullet, 2e triage). About 12 real words, fine as notes. (b) Section 2 now starts at 2b. Keep the labels, since ABS-07 comments and this log cite them, or add '(2a merged into 1a)' beside the heading. (c) 1b is the densest section (6 MUSTs, mostly qualifiers, in 90 words). Tell Aarav the qualifiers can be a parenthetical, not separate clauses.", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}, {"t": "19 Nov 01:00", "who": "zoya", "msg": "→ in_progress: started skeleton"}, {"t": "19 Nov 01:02", "who": "zoya", "msg": "posted result summary"}, {"t": "19 Nov 01:02", "who": "zoya", "msg": "→ in_review: skeleton ready for panel"}, {"t": "19 Nov 06:00", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 06:04", "who": "zoya", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "zoya", "msg": "→ in_review: panel fixes applied"}, {"t": "19 Nov 06:07", "who": "panel", "msg": "review: done"}]}, {"id": "ABS-07", "title": "Review Aarav's abstract draft: comments only, two rounds", "sprint": 2, "track": "pitch", "owner": "zoya", "reviewer": "anaya", "model": "opus", "created_by": "zoya", "status": "todo", "outcome": "Two comment-only review passes on Aarav's own draft (round 1 and round 2), each returned within 4 h, so he can submit by 22 Nov", "acceptance": ["Starts only when Aarav submits a draft; each round's comments are located (section/line) and tagged: fact (vs FACT-CARD), claim (vs GUARDRAILS), term (vs TERMS), structure/word count (vs SKELETON)", "Comments only: no rewritten or suggested replacement sentences anywhere (Charter); anaya checks every fact comment", "Round 2 records which round-1 comments Aarav resolved, which remain, and the final word count"], "depends": ["ABS-01", "ABS-02", "ABS-04", "ABS-06"], "deliverable": "abstract/REVIEW-R1.md (round 2: abstract/REVIEW-R2.md)", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "zoya", "msg": "opened"}]}, {"id": "ADR-00", "title": "ADR-00 Topology, tick barrier and determinism", "sprint": 2, "track": "eng", "owner": "maya", "reviewer": "panel", "model": "opus", "created_by": "maya", "status": "changes", "outcome": "Process topology (gateway, witness, one subprocess per agent, signer handles, sockets) and the gateway-as-scheduler tick barrier that makes seeded runs reproducible; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Decision specifies the tick barrier: one envelope or no-op per agent per tick, executed in agent_id order, gateway assigns seq/ts/record_id", "Names the determinism tests: same seed twice → byte-identical records; faulty run == S* before t0", "States the key-isolation claim verbatim: enforced in production (uid/container), detected here by reconciliation"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-00-topology-determinism.md", "summary": "ADR-00 written (899 words). Gateway (uid 0) spawns witness (uid 60000) and one agent per RunConfig.agents (uid 60001+i, conn c-(i+1), socketpairs, clean env, non-dumpable). Tick barrier: control phase -> TickFrame -> one Submit/Noop per agent until deadline (miss = no-op + anomaly) -> execute in agent_id order -> dispatch/monitor -> flush -> witness ack. Gateway sole assigner of seq (1.., no gaps), record_id_for(seq), ts_us = start+tick*tick_us+slot, conn_id. Determinism: tick clock only, per-consumer RNG streams, HKDF keys from a repro secret in tests (fresh in live). Tests T1 (same seed byte-identical), T2 (faulty == S* before t0), T3-T5. Key-isolation claim stated verbatim. Change requests (CON-02): C2 WitnessCheckpoint.count, C6 RunConfig.fault_tick, C4 empty evidence for barrier.deadline; contracts README key-isolation wording to align.", "review": "[panel · changes] PANEL review of ADR-00 (19 Nov). Verdict: CHANGES. All four acceptance criteria are met (899 words, all five sections, barrier and test names present, key-isolation wording verbatim). The design is right: the gateway is the scheduler, it alone assigns seq/ts/id, and wall clock goes only to timing.jsonl. Seeded bench runs with scripted decisions and no rogue will reproduce. Live demo runs and rogue runs will not reproduce as written, and the stall claim has gaps at the I/O level.\n\nMUST-FIX\nM1 Human decisions land at a wall-clock tick. The tick at which an approval/suspend/release/revoke lands depends on how fast the human clicks. That tick moves post_alert_tainted, irreversible_released, R and C, so a live demo run cannot be re-run. Ticks are also not paced: an N-tick run can end, and its keys die, before anyone approves the plan. Fix: decision points block the barrier. When a plan or anomaly awaits a human, the gateway does not open tick plan_tick+L (L = RunConfig.decision_latency_ticks) until the decision arrives. A click that arrives early is held until that tick. Bench scripts the same L. A re-run replays the ks.console/ks.recovery Controls from record.jsonl at their recorded ticks. Live clicks then stop breaking determinism, and the Consequences line should change to say so.\nM2 S*/t0 disagree across ADRs, so T2 fails by construction. ADR-00 says S* = a clean run with the same seed. ADR-06 says S* = the culprit slot emits no-ops for the WHOLE run. Under ADR-06's definition, crm's legitimate pre-t0 writes are missing from S*, so \"faulty == S* before t0\" fails and B is polluted. Pick one: culprit no-ops for tick >= fault_tick. t0 is defined three ways: RunConfig.fault_tick (ADR-00), first injected effect (ADR-06), and t0_seq (ADR-05, an estimate). Rename ADR-05's to t0_seq_est. Mark fault_tick like culprit: scorer-only, never read by ks.monitor/ks.recovery. Test: blank fault_tick in config and the record stays identical.\nM3 Late and extra frames make records nondeterministic. Collect closes as soon as every agent has answered, so whether a flooder's 2nd/3rd frame lands in tick n or n+1 depends on timing, which shifts seq/ts_us/hash for everyone. Fix: per connection, read exactly ONE frame per tick in FIFO order. A frame tagged <n is recorded as deny/late_frame (not 'expired', which ADR-01/03 use for expiry_tick) and the slot is a no-op. Define future-tick frames (deny). Record them at a fixed position (that agent's slot in the execute phase). A flooder then fills its own socket buffer and only delays itself. Add T3b: a rogue that floods and pre-sends frames still gives T1-identical records.\nM4 The barrier is safe but the I/O is not. (a) If a rogue stops reading, its socket buffer fills and a blocking gateway send of TickFrame/ReplyFrame/SignReply stalls the whole barrier. All agent-facing sockets must be non-blocking, with a bounded outbound queue and EOF on overflow. (b) The reader must be non-blocking, bounded by MAX_FRAME_BYTES, and must never wait for an LF (slowloris). (c) Set a per-tick SignRequest quota on the in-gateway signer (ADR-01 mentions rate limits but gives no number). (d) Witness: 'tick n+1 waits for the ack' and 'no ack raises witness_stall' conflict. Say: wait up to the deadline, then proceed and raise witness_stall. Otherwise a hung witness hangs the run, and ADR-02's W-tick detector can never fire.\nM5 Stall cost and teardown. (a) A sleep-forever rogue costs 2 s per tick, so 100 ticks take 200 s and the 5-minute demo is gone. Add deterministic eviction: after K consecutive misses, close the connection (EOF, no epoch bump, not a suspend, plus an anomaly). Or state the cost and use a short --tick-deadline-ms on the demo machine. T4 should assert a wall-time bound. (b) Forked children survive the SIGKILL of the agent, keep the reused uid 60001+i, and can break the next run: RLIMIT_NPROC on spawn, CPU contention. Kill by uid or cgroup at teardown, and refuse to start if any process with uid 60000..6000N exists. (c) Set oom_score_adj -1000 on gateway/witness and +1000 on agents, so a memory bomb kills the rogue and not the TCB. (d) Run the --rogue slot at nice 19 / SCHED_IDLE with RLIMIT_CPU, so CPU spin cannot make honest agents miss deadlines. T4 should add CPU-spin and memory-bomb variants and assert 0 honest misses.\nM6 Fresh-key projection. Maya's gap is acceptable as stated, because a signature we can reproduce is a signature an attacker can forge. Conditions: (a) the projection is a function in ks.contracts, not an ad-hoc jq, and it must also strip keys.json, which ADR-00 omits although keys.json is in DETERMINISTIC_FILES. (b) T1b must assert that the key-independent artefacts are byte-identical WITHOUT stripping: config, alerts, plans/**, sidestore/**, effects.jsonl, oracle/**, score.json. By contract they do not depend on keys: envelope_hash excludes sig, and idempotency_key is derived from (agent, action, sink, n). (c) DETERMINISTIC_FILES lacks effects.jsonl, oracle/ and score.json, which are exactly the scorer's inputs. Add them through CON-02 or name them in T1. (d) Add RunConfig.key_mode = fresh|repro, so the run dir alone shows that a run is 'not a security run'. (e) In fresh mode the witness generates its own key and the gateway never holds it. Otherwise THREAT-MODEL B3's 'own key' is false and ADR-02 contradicts ADR-00. (f) The repro secret file is 0600 uid 0. --repro-secret is forbidden for D11 live attacks, because a key root on disk voids C1/C4.\nM7 The topology omits the operator channel. ks contain / ks recover --apply / ks console --live need to reach the live gateway, and ADR-00 has only path-less agent socketpairs. Specify a socket in a 0700 uid-0 dir with an SO_PEERCRED uid==0 check. Otherwise a rogue uid could forge ks.console Controls, which breaks the THREAT-MODEL target '0 forged Control actions'.\n\nSHOULD-FIX\nS1 Use one RNG derivation with ADR-06 (ADR-00 uses sha256(seed||name) streams, ADR-06 uses sha256(seed|agent|tick)). Encode it canonically and length-safe: sha256(canonical([seed,name,tick])). Per-tick derivation means a dropped or late step shifts no later draws.\nS2 Make the ts_us slot bound computable. Cap per tick the control-phase records (including recovery steps, with deterministic carry-over), dispatch records and capped late frames, and check that tick_us is larger than the sum.\nS3 State in-tick visibility: execution is sequential, so payments sees crm's same-tick write, which matches ADR-05(c). ADR-06's 'reader sees writes from earlier ticks' is wrong for adapter reads.\nS4 T4 'other agents' records unchanged' must mean a per-agent projection (tick, tool, args_hash, decision, read/write sets), because seq/ts/hash shift. T1 should run the gateway under different PYTHONHASHSEEDs. Rogue byte-identity (ADR-07 test 6) holds only for rogue code that draws only from its stream seed.\nS5 C4: the barrier.deadline anomaly cannot name its connection, because Alert.conn_id is signature-only (validator) and ADR-04 says detectors never name anyone. Add a conn_id allowance to the CON-02 request, and ADR-04 adds barrier.deadline (never hard) to its catalogue.\nS6 A post-run 'ks recover --dry-run' writes into plans/ of an evidence dir that T1 compares. Write it outside the run dir.\nWord budget: the fixes will not fit in 900 words. Trim lifecycle steps 1-2 (already in ADR-02/contracts) and push details into test names.\n\nDEMO, fresh keys: never say 'byte-identical' for a live run. Beat: run F2+ twice with fresh keys; ks verify OK on both, each under its own keys; sha256(score.json) is identical; 'ks repro A B' (ADR-07 to add) reports 0 differences outside {sig, hash, prev_hash, gw_sig, head, pub}. Line: 'Reproducible behaviour, unrepeatable signatures: a signature we could reproduce, an attacker could forge.' Byte-identical claims are reserved for the >=20-seed bench under --repro-secret, labelled 'not a security run'. Never publish the secret of a run presented as evidence.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:06", "who": "maya", "msg": "→ in_progress: drafting ADR-00 from CALL-01, THREAT-MODEL v3, contracts 1.0.0, PANEL-ENG-00"}, {"t": "19 Nov 06:07", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 06:07", "who": "maya", "msg": "→ in_review: ready for panel"}, {"t": "19 Nov 06:15", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 06:19", "who": "maya", "msg": "ADR-00: surplus frames in the current tick now give deny/over_quota, aligning with ADR-03 and SEC-02 RT5; earlier-tick frames stay deny/expired. Contracts README key-isolation paragraph aligned to THREAT-MODEL v3. CON-02 requests M1-M3 filed in org/reports/CON-02-requests.md"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "From the kabir review of ADR-01/02/03 (consistency): (1) reserve conn c-0 for system principals; ADR-03 assigns seq at step 9, but StateWriter needs it inside the txn, so assign it at execute (T5). (2) Witness topology: ADR-02 says the witness reads record.jsonl; keep your version, where the gateway sends (seq, head, tick), and in fresh mode the witness generates its own key (Panel M6e). (3) Name witness-heads/ in the RunDir layout (CON-02 K7). Details: CON-02-requests.md, kabir section."}]}, {"id": "ADR-01", "title": "ADR-01 Identity and envelope signing", "sprint": 2, "track": "eng", "owner": "arjun", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "changes", "outcome": "How agents sign C1 envelopes without holding keys (signer handle), what the gateway verifies (sig, nonce, expiry, epoch, act chain), and what happens on failure; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Decision: keys never enter the agent process; agent signs via a signer handle; agent + gateway signatures over the shared canonical serializer", "Decision: a bad signature suspends the submitting connection, never the claimed agent_id; replayed/expired envelopes are denied and recorded", "Tests listed map to RT2 (key theft), RT3 (forgery), RT4 (replay), RT6 (clock games)"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-01-identity-envelope.md", "summary": "ADR-01 written (850 words): in-memory Ed25519 keys, signer handle over socketpair signing headers only, commit-then-sign with args_hash and shared canonical serializer, nonce/expiry_tick/epoch replay checks, act_chain with MAX_ACT_DEPTH used only for ancestor denial, 7-step verification order, bad sig suspends conn never claimed agent, SPIFFE ids as production mapping. Tests map to RT2, RT3, RT3b, RT4, RT6.", "review": "[kabir · changes] Verdict: CHANGES. The design is right and all four acceptance criteria are met on paper: 850 words, all five sections; keys stay out of the agent behind a signer handle; commit-then-sign over the shared canonical serializer; a bad sig suspends the connection, never the claimed agent; replayed and expired envelopes are denied and recorded; tests map to RT2/3/4/6 plus RT3b. Six material holes remain. Three of them are already blockers in SEC-03 (B2, B3, F2), and ADR-01 is where they have to be closed.\n\nMUST-FIX\nM1 Epochs and expiry (SEC-03 B3; contradicts ADR-04 §6). \"Current epoch\" is never defined, and ADR-04 restores the pre-suspend epoch on release. A rogue presigns at epoch e with expiry_tick = 2^53-1 (accepted today); after a release, every one of those envelopes is valid again (RT4 stale_epoch and RT5 presigned flood both fail). Fix in Decision 4: (a) per-principal epochs are strictly monotonic. Start at 0; every agent suspend/revoke/release sets a value above every earlier one; an epoch is never reused. (\"release restores the agent's ability to act\", not \"restores the epoch\".) (b) MAX_EXPIRY_TICKS (proposed 8): expiry_tick > tick + MAX_EXPIRY_TICKS gives deny/expired, and the nonce store keeps exactly that window. This makes \"pruned by the expiry window\" safe. (c) Say how an honest agent learns its new epoch after a release, or RT11's \"release restores work\" fails because the agent keeps sending stale_epoch: TickFrame gains `epoch` (CON-02; ADR-07 lists this as open).\nM2 Connection suspension is not enforced anywhere. Step 5 checks only the agent's status. After RT3 suspends conn:c-R, the rogue's own validly signed envelopes (agent docs, which is still active) pass every step and execute. Fix: step 5 first checks the conn deny-list (conn suspended or revoked gives deny/suspended or deny/revoked) and then the agent. The ADR-03 step-8 in-txn re-check must also read the conn deny-list. State it: conns are 1:1 with agent processes (path-less socketpair), there is no reconnect, and conn release is a ks.console Control. RT3 pass then adds: 0 exec records with conn_id == c-R and seq > the suspend seq.\nM3 System principals and Controls (SEC-03 F2, N2, N7). Decision 1 lists gateway, witness and recovery keys. SYSTEM_PRINCIPALS also has ks.monitor and ks.console, and Controls are signed by the issuing principal (control.issued_by). Fix: (a) keys.json holds one key for each of ks.gateway, ks.witness, ks.monitor, ks.console, ks.recovery and each agent, and verify fails closed if any is missing. (b) System envelopes are signed in-gateway and enter only on the internal connection c-0, never on c-1..; the operator channel follows the Panel's ADR-00 M7. (c) On an agent connection (c-1..), a system agent_id is never verified: it gets deny/bad_sig, so sig_ok=false holds and the conn is suspended. An agent-signed envelope with a tool starting \"ks.\" gets deny/out_of_scope immediately after step 5. (d) The signer refuses a header whose agent_id is not its bound principal, a ks.* tool, a non-null sig, a stale epoch, or a suspended principal. It also has a numeric quota, e.g. at most 2 signatures per tick per principal (Panel ADR-00 M4c). The Consequences line \"rate limits bound that\" is otherwise untestable.\nM4 Key generation contradicts ADR-00 and leaves a hole in RT2 (SEC-03 B2; Panel ADR-00 M6). ADR-01 says \"generated in memory\"; ADR-00 derives keys with HKDF(key_secret, seed) and adds --repro-secret FILE. Fix: adopt ADR-00's derivation by reference, and state: (a) private keys are never a function of the seed alone; (b) in fresh mode the witness generates its own key and the gateway never holds it; (c) the repro-secret file is 0600 uid 0, never under the run dir, and forbidden for D11 live runs and for RT2; (d) RT2 runs in fresh mode and counts key_secret among the bytes it scans for; (e) a new unit test checks that two same-seed fresh runs produce different keys.json.\nM5 Tests that cannot pass as written. (a) RT4 \"pre-suspend epoch\": an envelope that already executed has a consumed nonce, so step 4 answers nonce_reused before step 5 can say stale_epoch. Use a presigned, never-sent envelope with the old epoch and expiry within MAX_EXPIRY_TICKS. (b) RT6 \"records equal the claim-free run\" is false: claimed_* sit in the signed header, and extra keys give deny/schema, so the bytes and decisions differ. Use instead: every record's (seq, tick, ts_us, record_id) follows the ADR-00 T5 formulas; the honest agents' records are identical between the two runs in the determinism projection; claimed_* appear only inside envelope. (c) RT3 spliced args: name the outcome. An args_hash mismatch gives deny/bad_sig, which suspends the conn. (d) Add a test for the THREAT-MODEL row \"forges suspend/release/revoke/recover\", which has none today. An agent submits ks.control claiming ks.console (bad_sig), and one under its own id (out_of_scope); 0 Controls are applied.\nM6 action_id uniqueness. idempotency_key and the scorer's \"first bad action_id\" both assume (agent_id, action_id) is unique, but nothing enforces it. Fix: the gateway denies a reused (agent_id, action_id) as deny/nonce_reused (or a new reason, CON-02), checked with the nonce at step 4.\n\nNITS\n- Say which deny reason a SubmitFrame.tick that does not match the barrier tick gets: late_frame per the Panel's ADR-00 M3, not \"expired\", which this ADR keeps for expiry_tick.\n- act_chain is self-declared, so a rogue child can omit it. Add one Consequences line: ancestor denial binds honest descendants only, and a rogue child is contained by its own suspension. RT12 also needs a world mechanism (ADR-06) that gives an honest child its parent's action_id.\n- \"SPIRE documents no revocation\": write \"SPIFFE relies on short-lived SVIDs rather than revocation (RES-03)\".\n- Word budget: the fixes will not fit in 900 words. Cut §9 to two lines and move test detail into test names.\nRe-review needs: M1-M6 in the text, the RT4/RT6 rows rewritten, and the forged-Control test added. Contract asks: org/reports/CON-02-requests.md (kabir section).", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "→ in_progress: drafting ADR"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "→ in_review: ready for kabir"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "review: changes"}]}, {"id": "ADR-02", "title": "ADR-02 Recorder, witness, verify and PII side store", "sprint": 2, "track": "eng", "owner": "arjun", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "changes", "outcome": "Hash-chained C2 record written only by the gateway, a separate witness process taking a signed (seq, head, tick) every tick, ks verify, and a redactable side store for values; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "verify checks chain, agent+gateway signatures, witness heads, seq gaps and reconciliation (state = fold(log)), prints first bad index, exits non-zero", "Log holds hashes only, values live in the side store; witness-head stall raises an alert; claim limited to 'tamper-evident up to the last witnessed head' (no Merkle)", "Tests listed map to RT7 (line edit), RT8 (full rewrite) and a tail-truncation case"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-02-recorder-witness-verify.md", "summary": "ADR-02 written (<=900 words): gateway-only append-only JSONL chain with gw sig; separate-uid witness signing (seq,head,tick) per tick plus stall alert; ks verify order (IO, chain/sigs/gaps=TAMPER, witness=WITNESS, printed head, reconcile=RECONCILE) with first_bad; redactable side store; claim 'tamper-evident up to last witnessed head', no Merkle. Tests map to RT7 a-d, RT8 e-g, tail truncation. Open: WitnessCheckpoint lacks the 'count' field THREAT-MODEL v3 relies on.", "review": "[kabir · changes] Verdict: CHANGES. The structure is right and the acceptance criteria are met on paper: 897 words, all five sections; verify checks chain, both signatures, witness heads, seq gaps and reconciliation, prints first_bad and exits non-zero; values live in the side store; there is a stall alert; the claim stays \"tamper-evident up to the last witnessed head\" with no Merkle trees; tests map to RT7, RT8 and tail truncation. A jury can still beat verify, though, and several pass criteria contradict the decision text. PMO has already decided `count` (contracts v1.1).\n\nMUST-FIX\nM1 Keyring swap defeats verify (SEC-03 B1). keys.json is an editable run-dir file, and verify takes every public key from it. An insider who holds no key rewrites the chain, generates their own gateway and witness keypairs, rewrites keys.json, and re-signs every record and checkpoint, and verify returns OK. That is RT8 without the witness key, which the THREAT-MODEL says is detected. Fix: the console prints keyring_hash and config_hash at start, and at the end prints a RunAnchor {seq, head, tick, count, keyring_hash, config_hash} (CON-02). `ks verify --head` takes that anchor line and checks the hashes before any signature. VerifyReport gains `anchored`. The C1 claim holds only for anchored verification; unanchored it is \"consistent, not anchored\". ADR-07's `ks verify RUN [--json]` has no --head flag, so add it there too. SPEC RT8 gains variant (h), a keyring swap: WITNESS when anchored, documented as outside the claim when unanchored.\nM2 count (PMO decision). Delete the \"Contract gap … Fallback\" paragraph. Specify: count starts at 1 and goes +1 per checkpoint line; verify checks w[i].count == i. The anchor's count must equal the last line's count, and its head must equal that line's head. Checkpoints: tick strictly increasing, seq non-decreasing (no-op ticks repeat seq/head, per ADR-00), seq <= n.\nM3 Strict parse sends tamper to IO. Step 1 maps every parse failure to Exit.IO. (a) A tampered side entry fails SideEntry validation at parse (checked: ValidationError), so RT7(b) yields IO, not TAMPER. (b) A juror who edits record.jsonl in an editor and types an uppercase hex digit, adds a space or adds a blank line fails strict parse, so the LIVE RT7 beat prints IO with no first_bad. (c) RunDir.validate requires witness.jsonl, so RT8(f) \"deleted witness.jsonl\" is IO before your \"fails closed with WITNESS\" rule can run. Fix: Exit.IO only when config.json, keys.json or record.jsonl is missing or unreadable. A record line that fails to parse or validate gives TAMPER, first_bad = that line's number, reason parse_error. A witness line that fails gives WITNESS. A missing or empty witness.jsonl gives WITNESS, first_bad = 1. A side entry is parsed without its validator and re-hashed; a mismatch gives TAMPER, first_bad = the lowest seq that references the hash, reason side_entry_mismatch. Put the side-store pass in the ordered list (after the record pass, before the witness pass).\nM4 Truncation first_bad. The decision gives first_bad = checkpoint.seq for a checkpoint with seq > n, while test (d) expects last_kept_seq + 1. Checkpoints cover several records each, so the two differ. Fix: a checkpoint with seq > n gives WITNESS, first_bad = n + 1, reason truncated. An anchor mismatch gives WITNESS, reason head_mismatch, first_bad = min(anchor.seq, n) + 1. Test (d) must truncate below the last checkpoint; otherwise the cut is past the claim boundary and OK is correct.\nM5 The tamper freeze has no trigger. Nothing specifies who runs verify on a live run or how often, and an edit made after the run leaves no tamper alert in alerts.jsonl. So `ks recover --dry-run` on the RT7 copy cannot return FROZEN as your test requires. Fix: (a) `ks recover` (including --dry-run) runs verify first and exits FROZEN on any non-OK result. (b) Live: each tick, the monitor re-reads record.jsonl and compares it with the gateway's in-memory running head; a mismatch raises tamper. (c) The freeze is derived from records (SEC-03 F6: alerts submitted as chained ks.alert envelopes), never from the unsigned alerts.jsonl alone. (d) Say what ends a freeze. I propose nothing does: it lasts until run end.\nM6 Witness topology and key. (a) \"It reads the record read-only\" contradicts ADR-00, where the gateway sends (seq, head, tick), and record.jsonl is gateway-only. Pick ADR-00's version. The witness signs what it is sent; it adds anchoring, not re-verification. (b) \"Own in-memory key\": ADR-00 has the gateway derive the witness key and send it over. In fresh mode the witness must generate its own key and send only the public key (Panel ADR-00 M6e). Without that, \"insider holds no witness key\" rests on the gateway alone. (c) Name the head store path `<run>/witness-heads/` (0700, witness uid; RunDir layout, CON-02), and file modes per SEC-03 F1 (witness.jsonl created and owned by the witness uid).\nM7 Stall semantics. ADR-02 uses \"W ticks\"; ADR-00 has the tick wait for the ack. Adopt the Panel's ADR-00 M4d: wait up to the deadline, then proceed and raise witness_stall. W is a named constant (1 under that rule). Settle hard: ADR-02 says never hard; ADR-04 and HARD_ALLOWED say yes, with a recovery freeze (SEC-03 N4). I propose hard=false, with the freeze tied to the kind.\nM8 RT8(g) is vacuous. ADR-00 takes a final checkpoint at run end, so a completed run has no unwitnessed tail and g tests nothing. Fix: g uses a run dir snapshotted between flush and checkpoint (hook `GatewayHooks.skip_checkpoint` at tick k), and the anchor test shows the same edit is caught once the final anchor exists.\n\nSHOULD-FIX\n- Reconcile is exact only if every state change is a record. Outbox status changes and dispatch (SEC-03 F4, ADR-03) and recovery writes must carry write_sets, or every clean run fails RECONCILE. Add that dependency and a clean-run test (verify OK including reconcile). Default --state: <run>/workspace/state.db if present; otherwise skip and report reason no_state, ok=true, so no silent pass.\n- Add per-record checks to verify: an exec ks.control/ks.recover.* record must be by a system principal, with issued_by == envelope.agent_id and conn_id c-0 (F2); epochs fold monotonically (B3); expiry_tick >= tick on exec/hold (F3); ts_us formula (N5).\n- More reasons: witness_sig_invalid, witness_missing, count_mismatch, truncated, parse_error, side_entry_mismatch, agent_sig_mismatch, keyring_mismatch.\n- Add the header line (Owner, Reviewer, Binding); fix the typo \"0600,.\".\nRe-review needs: M1-M8 in the text, and tests (b), (d), (f) and (g) rewritten to match. Contract asks are in CON-02-requests.md.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "→ in_progress: started"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "arjun", "msg": "→ in_review: ready for review"}, {"t": "19 Nov 06:06", "who": "pmo", "msg": "PMO decision: WitnessCheckpoint gains a monotonic 'count' field in contracts v1.1 (maya, after SEC-03)"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "review: changes"}]}, {"id": "ADR-03", "title": "ADR-03 Gateway, action classes R/C/I1/I2/U, policy and epoch fencing", "sprint": 2, "track": "eng", "owner": "nisha", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "changes", "outcome": "The single mediated path: per-instance classification R/C/I1/I2/U (U denied, fail-closed), policy incl. early hold on sensitive-tagged fields, outbox for I-class, epoch + deny-list checked inside the write txn; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Classification is per action instance, unknown → U → deny; every denial is a recorded action", "Epoch and deny-list checked inside the execution transaction, holds re-checked at outbox dispatch; early hold is a generic rule on sensitive-tagged fields, not IBAN code", "Tests listed map to RT1 (DB bypass → reconcile U-alert), RT5 (TOCTOU: 0 culprit writes after quarantine seq)"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-03-gateway-classes-fencing.md", "summary": "ADR-03 written: 9-step gateway pipeline with in-txn epoch/deny-list re-check; per-instance classification, catalogue of demo tools by class, unknown -> U -> deny; I1 via outbox, I2 needs approval; generic early hold on RunConfig.sensitive_fields; dispatcher re-checks holds; all denials recorded with Reason; adapters emit read/write sets. Tests map to RT1 and RT5. No contract changes.", "review": "[kabir · changes] Verdict: CHANGES. On paper the acceptance criteria are met: 893 words, all five sections; classification is per instance and fails closed to U; every denial is recorded; epoch and deny-list are re-checked inside the txn; holds are re-checked at dispatch; the early hold is generic; RT1 and RT5 are mapped. Nisha's names (tools, roles, p.* ids) are hers to set, and every p.* id fits the Token pattern; ADR-04/05/06 use none of them. Checking them against ADR-06, though, the catalogue does not cover the world, and the early-hold rule as written does not catch the hero. \"No contract field changes are needed\" is also not true.\n\nMUST-FIX\nM1 Catalogue vs ADR-06 world. Under fail-closed, a tool missing from the catalogue is U, so these ADR-06 writes are denied: crm writes and deletes `customers` (F1 can never be injected), ledger writes by billing and payments, compliance `findings`, and triage's edit of `suppliers.risk_note` (no tool named). ADR-06 marks comms email as I2 while ADR-03 says I1. With I2, every email needs approval, which breaks the hero flow; ADR-06 should change to I1 (tell tara). Fix: one catalogue row per ADR-06 write, plus a role→tools scope table, which p.scope needs and which no artefact has today. Decide whether scope is per tool or per field. SPEC RT11 assumes triage can set suppliers.iban; with per-field scope (safer: triage gets risk_note only), RT11 has to move, which I will do in SEC-02. `*.read/list/search` covers only registered adapters, so an unregistered `payments.read` is U. Drop \"marks suppliers.iban sensitive\" from crm.update_supplier, because sensitivity comes only from RunConfig.sensitive_fields (that is the genericity claim). ks.control is \"signed by the issuing system principal\", not gateway-signed.\nM2 The early hold misses the hero, and hold=0 is undefined. \"changed after the item's creation\" never matches F2+: payments reads the already-swapped IBAN, then creates the payment. The swap came before the item, so only the lineage hold can stop it, and that waits for an alert. Fix, p.sensitive_early_hold: (a) at creation, an I-class item whose lineage holds a version of a sensitive field written within the last hold_window_ticks ticks starts held. (b) The dispatcher holds any item whose lineage object's sensitive field changed after created_seq. (c) At hold_window_ticks = 0 the early hold is off. Otherwise D10 and ADR-06's \"hold=0 → irreversible_released=1\" contradict the ADR. Also say where the reason goes. An exec record cannot carry sensitive_field (REASONS_FOR), so an item hold is its own record: Control{op: hold, target: outbox:<id>, issued_by: ks.gateway, auto: true, reason: sensitive_field}.\nM3 Outbox transitions and dispatch must be records (SEC-03 F4). queued→held→released→dispatched change outbox:<id> objects in state.db. Unless each change is a record with a write_set, fold(record) differs from state on every clean run, so verify gives RECONCILE and the reconcile detector suspends nobody but fires hard every tick. dispatched_seq also points at a record nobody defines. Fix: dispatch is a ks.gateway envelope with tool ks.dispatch on conn c-0: read_set = lineage ∪ {outbox:<id>@ver}, write_set = the status change. Holds and unholds are Control records. RT5 and RT10 assert on these records.\nM4 Connection deny-list. Step 5 and the step-8 re-check name only agents and ancestors. Add conn:<id> (see ADR-01 M2), or the RT3 conn suspension does nothing against the rogue's own validly signed envelopes.\nM5 Release semantics (SEC-03 B3; ADR-04 §6). \"release un-holds and restores the epoch\" would release the RT11 victim's tainted payment, and the old epoch revives presigned envelopes. Fix: release lifts holds caused by the suspension only; lineage_hold and sensitive_field holds survive and are re-checked at dispatch; the epoch is fresh, never the old one.\nM6 RT5 cannot be built as written. Under ADR-00 the gateway is a single-threaded scheduler, and Controls land only in the control phase, so \"applied from another thread\" never happens. A second SQLite writer inside an open BEGIN IMMEDIATE txn would simply block. The real window is between the step-5 fast path and the step-8 txn (plus any future concurrency). Fix: the hook `GatewayHooks.between_check_and_txn` commits the suspend Control there. Expect deny/stale_epoch or deny/suspended at step 8 and 0 exec with seq > q. Say that txns are BEGIN IMMEDIATE.\nM7 seq is assigned too late. Step 9 assigns seq after execution, but StateWriter.put(…, seq=…) needs it inside the txn (HistoryEntry.seq, ADR-05 (c)). Fix: assign seq at the start of the step-8 txn in execute order (ADR-00 T5), and append the record line after commit. Say what happens on a crash between commit and append: the run aborts and verify reports RECONCILE; neither is ever silent.\nM8 ks.* from agents and order. Add before classification: an agent-signed envelope with a ks.* tool gives deny/out_of_scope, and a system agent_id on c-1.. gives deny/bad_sig without verification (SEC-03 F2), with a unit test (\"0 forged Control actions\"). Step 4: expiry before nonce, and the nonce is consumed only after sig and expiry pass (as in ADR-01). Late frames get deny/late_frame per the Panel's ADR-00 M3. over_quota is for the per-connection flood budget (F8), not for extra frames.\n\nSHOULD-FIX\n- I2 approval: approval is `unhold action:<record_id>` by ks.console. Re-execution re-runs steps 5-8 (epoch, deny-list, lineage, in-txn) without expiry or nonce, and writes a new record citing the hold record (F5).\n- p.scope ↔ ADR-04: a sig_ok deny/out_of_scope record (policy_rule p.scope) is the evidence for ADR-04's hard `scope` detector. Say so, or that detector never fires once the gateway denies first.\n- §7: Alert has no `suspect`. Write root_candidates=(). A brand-new off-log object has no earlier seq, and evidence_seqs must be non-empty; use (alert.seq,) by convention, or relax it (CON-02, which ADR-00 also asks for barrier.deadline).\n- §7: state.db 0700 → workspace/ 0700 and state.db 0600, matching the THREAT-MODEL.\n- No ADR-03 rule stops F3 (an in-scope agent emailing PII externally). F3 needs a detector (ADR-04) or a sink rule. Flag to tara: ADR-06 makes crm the F3 culprit, which p.scope denies at once.\nRe-review needs: M1-M8, the catalogue/scope table checked against ADR-06, and the Interface section listing the CON-02 asks.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "→ in_progress: started"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "→ in_review: ready for review"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "review: changes"}]}, {"id": "ADR-04", "title": "ADR-04 Monitor detectors, graded containment and lineage hold", "sprint": 2, "track": "eng", "owner": "nisha", "reviewer": "maya", "model": "sonnet", "created_by": "maya", "status": "changes", "outcome": "Data-invariant detectors (IBAN checksum, price delta vs frozen baseline, ledger balance, beneficiary-changed-then-paid), attribution by write_set lookup, suspend→revoke/release, per-action lineage hold from recorded read sets; due 24 Nov (tara consults on detectors)", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Detect and attribute are separate steps emitting C4 Alert{detector, evidence_seqs, suspect, root_candidates, hard}; auto-suspend only on hard evidence (scope breach, I-class invariant breach, class U); tamper alert freezes recovery, suspends nobody", "Lineage hold is per action using recorded read sets only (agent-declared lineage never trusted); release = un-hold + restore epoch; hold window is one config value", "Tests listed map to RT9 (laundering: A in top-3), RT10 (0 irreversible tainted released), RT11 (framing DoS), RT12 (persistence)"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-04-monitor-containment-hold.md", "summary": "ADR-04 written (888 words): 7-detector catalogue, detect-then-attribute via backward taint, hard/soft policy (bad sig->conn only, tamper->freeze, no suspend), suspend->new epoch, per-action lineage hold from recorded read sets, release=unhold+epoch restore, revoke console-only, hold_window_ticks. Note: contract Alert has no suspect field; suspect = root_candidates[0]. Tests map RT9-RT12.", "review": "[maya · changes] CHANGES (maya). Structure, the D7 hard/soft table, connection-only signature suspends, the tamper freeze, per-action hold from recorded read sets, console-only revoke and the RT9-RT12 mapping are all good. Accepted: suspect = root_candidates[0] (derived, never stored). Fix these before build:\n1. ATTRIBUTION RANK (blocker, anti-framing). Ranking by \"earliest causal write\" over the backward walk lets a rogue frame any honest upstream agent. Example: rogue triage reads intake's ticket, then writes EVIL; intake has the earlier write, ranks first and gets auto-suspended. Define root_candidates[0] as the attributed writer of evidence_versions (write_set lookup, as in the issue outcome and PANEL 3.3 \"crm suspended\"). Upstream agents reached only through read sets rank after it and are never auto-suspended. More than one distinct writer, or none, means no suspend (escalate). RT9 still passes: intake at [1] is in the top 3. State honestly that a laundered honest writer (crm in RT9) is auto-suspended and counted in false_accusations. Contract docstring: CON-02 M9.\n2. evidence_versions for beneficiary_changed_then_paid is the payee-field version only. The payment (outbox object) goes in evidence_seqs, so the payer is never a writer of evidence.\n3. §6 RELEASE: \"restoring the pre-suspend epoch\" revives presigned envelopes (RT4/RT5). Release sets a fresh, strictly monotonic epoch (SEC-03 B3, CON-02 M4). Agents learn it through TickFrame.epoch (M5).\n4. Unhold semantics are missing. Say that a policy-time hold IS the hold/lineage_hold record (ADR-03 p.lineage_hold), and that Control{hold} is only for items already queued when the alert lands. unhold action:<rid> re-executes the same envelope through epoch, deny-list, class, policy and taint, without re-checking nonce or expiry, giving a new record linked by envelope_hash (M10). Otherwise held actions die nonce_reused/expired. An unheld outbox item goes back to queued with a dispatcher re-check.\n5. witness_stall/tamper: make them not hard, with the freeze automatic by kind (SEC-03 N4, M7). Define \"resolved\": v1 freezes for the rest of the run (M12).\n6. Say which INVARIANT detectors are hard and tie them to D7 \"I-class invariant\". iban_checksum fires on an R-class write; either justify it (it guards the I1 payee) or make it soft.\n7. Same owner, ADR-03 §7: \"Alert.suspect null\" should read root_candidates empty. Also ADR-03 has comms.send_email as I1 while ADR-06 has it as I2; agree one with tara.\n8. RT11 conflict: SPEC asserts payments IS suspended and false_accusations>=1, but this ADR says it is not and ==0. The ADR is right. I've asked kabir to rewrite RT11 (SEC-02 review).\n9. Metric names: you use irreversible_tainted_released, ADR-06 uses irreversible_released. Tara picks; I recommend ADR-06 adopts yours.\nKeep it ≤900 words (currently 888): trim Consequences.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "→ in_progress"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "nisha", "msg": "→ in_review"}, {"t": "19 Nov 06:06", "who": "pmo", "msg": "PMO: accepted — 'suspect' is derived as root_candidates[0]; no contract field"}, {"t": "19 Nov 06:18", "who": "maya", "msg": "review: changes"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "From the kabir review of ADR-01/03: §6 'restoring the pre-suspend epoch' revives presigned envelopes (SEC-03 B3; CON-02 maya M4). Release must set a fresh epoch and lift only suspension holds, with lineage/sensitive holds surviving (CON-02 K15). Also: a sig_ok deny/out_of_scope (p.scope, ADR-03) is your scope detector's evidence. Without that, it never fires, because the gateway denies first."}]}, {"id": "ADR-05", "title": "ADR-05 Versioned state, taint, write-write conflict rule, deduped re-run (FIRST PRIORITY)", "sprint": 2, "track": "eng", "owner": "vikram", "reviewer": "maya", "model": "opus", "created_by": "maya", "status": "changes", "outcome": "Own row-versioned SQLite (obj=table:pk, get→(value, ver, author), history), conservative forward/backward taint, recovery plan C5 with dry-run diff; due 23 Nov so build starts day 1", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Write-write rule: restore only if current ver == culprit's after-version, else re-run or flag; recovery appends compensating records, never edits history", "Re-runs of deterministic steps go through the outbox deduped by idempotency key (re-emitted effects = 0); LLM steps become a replan item for console approval; coarse/aggregate reads over-taint", "Tests listed cover the F2+ triage conflict row, a re-run that would re-fire payment/email, and backward taint naming root candidates"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-05-state-taint-recovery.md", "summary": "ADR-05 written (898 words). Own SQLite: objects (live heads) plus append-only versions (obj, ver, hash, author, seq, action_id), with history values kept in the side store. Maya's ver and seq conventions are confirmed, with three amendments: tombstones continue the counter; a restore creates a new version and taint keys on (obj, ver) not hash; a version is visible only after its seq. Forward taint comes from recorded read sets only. The default is conservative: aggregate reads over-taint and an LLM agent stays tainted after it reads a tainted version. Backward taint ranks root candidates by earliest causal write, then by descendants. Plan order: cancel_outbox, then restore only if the head is still the culprit's after-version (otherwise flag write_write_conflict), then a deterministic rerun through the outbox. The rerun dedupes on idempotency_key: a held item is superseded in place; a dispatched item emits nothing and is flagged. Then compensate (C), replan (LLM), and I2/dispatched effects go to the report. Each step is a signed ks.recover envelope and is re-checked in the transaction: tamper gives FROZEN; a stale expect gives hold/needs_approval. Tests: triage conflict, no double payment (hold 0 and >0, double apply), root candidates (RT9), conservative taint, append-only/fold, frozen, golden plan. No contract field change. Optional ask: a stale_plan hold reason.", "review": "[maya · changes] CHANGES (maya). The store (§1-2) is approved, so build of ks.state can start day 1. Amendments (a)-(c) are accepted and fit the WriteEntry validator; I fold them into the C3 docs (CON-02 M11). The write-write rule, append-only recovery, idempotency-key dedupe, conservative taint, the FROZEN re-check and the golden plan all meet the acceptance criteria. stale_plan is ACCEPTED: Reason.STALE_PLAN under HOLD (M8). Use hold/stale_plan, not needs_approval. Fix these by 23 Nov:\n1. AGENT VIEW (blocker, shared with me). Agents decide on data that never enters a read set. Example: crm applies ticket T-3, but its crm.update_supplier record reads only suppliers:SUP. Forward taint then under-taints and RT9 backward taint never reaches intake. I'm proposing a gateway-captured TickFrame.view whose entries join that tick's record read_set (CON-02 M6). Your §3 must state the rule, and a test must prove crm's record carries tickets:T-3.\n2. §4 ranking must match ADR-04: rank 0 = the writer of evidence_versions (write_set lookup), then backward-taint candidates. Bound the walk, or give a secondary order, so the oldest ancestor (seed data) doesn't rank first. Add a test where crm's read set also holds an older supplier version written by a third agent, and intake is still in the top 3.\n3. test_root_candidates contradicts ADR-06/SPEC RT9: comms doesn't write suppliers. Use intake plants T-3, crm writes the IBAN, expected [crm, intake], inventory and docs absent.\n4. HERO R (decide explicitly). The object is a row, so the flagged S-17 v3 still carries the swapped IBAN, and F2+ scores R>0 against the D13 target R=0. Either (A) keep the flag and state that the hero R covers flagged rows only (tell zoya/tara), or (B), my recommendation and allowed by \"else re-run\": when every version above `to` is tainted and every writer above the culprit is a deterministic honest action, restore with expect = the current tainted head and re-run triage. Flag only when the head writer is an LLM or non-deterministic. Untainted heads are kept, as now (M13).\n5. Rerun mechanics: it re-executes the original tool and args (side store) for ActionRef.agent_id/action_id. Keys derive from those, OutboxItem.author stays the original agent, and redacted args become a flag (M14). \"Re-enters the hold\" means: status queued, release_tick = tick + hold_window_ticks, lineage = the rerun's recorded read set.\n6. Dry-run: the diff for re-runs needs simulation in a rolled-back savepoint. replan objects get no DiffEntry. dispatched_tainted is decided from the simulated payload hash.\n7. Apply halts at the first stale step. Steps already applied stay (append-only), and the console gets a new plan with as_of_seq = now.\n8. ks.recover.<op> must be in the ADR-03 catalogue for principal ks.recovery, or it is denied as class U (with nisha; SEC-03 F2). Say which ops create envelopes: flag and replan create none, they are report/console only. Bind steps to an approval record (SEC-03 F5).\n9. FROZEN also when verify != OK, so a dead-dir edit freezes too (RT7); it lasts for the rest of the run (M12).\n10. t0_seq is the planner's estimate and must never read RunConfig.fault_tick/culprit (scorer-only).\nKeep it ≤900 words (currently 898): move test detail to the test file.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:06", "who": "vikram", "msg": "→ in_progress: drafting ADR-05"}, {"t": "19 Nov 06:07", "who": "vikram", "msg": "posted result summary"}, {"t": "19 Nov 06:07", "who": "vikram", "msg": "→ in_review: ready for maya"}, {"t": "19 Nov 06:18", "who": "maya", "msg": "review: changes"}]}, {"id": "ADR-06", "title": "ADR-06 World (10 agents), fault catalogue F1–F7 + F2+, oracle and metrics", "sprint": 2, "track": "eng", "owner": "tara", "reviewer": "anaya", "model": "sonnet", "created_by": "maya", "status": "changes", "outcome": "Deterministic 10-agent demo world, fault injectors F1–F7 plus hero F2+ (IBAN swap, price ×10, triage conflict), oracle S* and the scorer reading only the C6 run dir; due 24 Nov (sameer consults on metrics)", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Oracle defined per SYNTHESIS §6: t0, S*, B, G on the effect ledger + invariants, never on our taint graph; metrics TTI-detect, TTI-attribute, TTC (Panel) + post-alert tainted effects + irreversible tainted released, R, C, re-plan cost", "Fault catalogue says per fault whether it runs live or as pytest (F5/F6 live, F3 pytest) and the F2+ dependency graph (billing/payments/comms consume; inventory/docs independent)", "Protocol: ≥20 seeded runs, median/p95/max, baselines snapshot / revert-culprit-only / no-op, hold 0 vs >0"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-06-world-faults-oracle.md", "summary": "ADR-06 written (<=900 words): 10-agent dependency world, F1-F7+F2+ with injection points and live/pytest split, oracle S* on effect ledger+invariants, score.json field names, 3 baselines, hold 0 vs >0, >=20-seed protocol. Flag: SPEC Q6/TERMS use post_alert_tainted_effects / irreversible_tainted_released; ADR uses issue names post_alert_tainted / irreversible_released.", "review": "[anaya · changes] CHANGES. World, live/pytest split, baselines and hold toggle have the right shape. Acceptance 1 and 3 are met (884 words). The oracle is not sound yet, and several metrics cannot be computed as written.\nMUST-FIX\n1 S* contradicts ADR-00 (\"clean run, same seed\") and the C6 RunConfig docstring (fault=None is the oracle run). \"Culprit slot emits no-ops\" from tick 1 breaks your own tests 1-2, because crm writes before t0. From t0 onward it makes crm's honest post-t0 writes, and everything that read them, part of B. Taint-scoped recovery never reverts those, so R>0 by construction and revert-culprit-only beats us. Fix: for ks inject faults, S* = same seed and config with the fault disabled (the culprit runs its honest step every tick). Use slot no-ops only for rogue-slot runs (SPEC fixture). Run S* as the pure world: monitor, containment and recovery off, outbox dispatches at release_tick. Otherwise a false suspend or an early hold corrupts S*. List the faulty ticks per fault. Use the ADR-00 RNG streams sha256(seed||name), not seed|agent|tick.\n2 t0. Keep t_inject (RunConfig fault_tick, as ADR-00 asked, derived from the seed) separate from oracle t0 = min tick over B (SYNTHESIS 6). Drop `injected` from effects.jsonl: it puts a ground-truth label in a live run dir. The scorer asserts t0 >= t_inject.\n3 Ledger. effects.jsonl must come from the harness (ks.world: a per-tick state.db diff per (table,pk,field) plus sink deliveries), never from the recorder. Otherwise a bypass write (RT1) never enters B. The key is per field: with row hashes, triage's risk_note edit on S-17 lands in B and test 3 fails. Add seq (null for a bypass), author and idempotency_key. Align with SPEC run.effects() and the C3 states (queued/held/released/dispatched/cancelled). final(k) = fold of the ledger.\n4 B/G/R/C. \"final-run\" and \"B left\" are ambiguous. Fix B and G at t_rec (recovery start, the same tick for us and the baselines), then score the state at T: R=|{k in keys(B): final(k)!=S*(k)}|/|keys(B)| and C=|{k in keys(G): final(k)!=S*(k)}|/|keys(G)|. As written, deleting the bad invoice without re-running billing scores R=0 C=0, a clean recovery with no repair. A dispatched B item always counts as left (report compensated separately). Held at T counts as left (held_unresolved, which is what gives no-op R=1). An unresolved flag counts as left. If d=0, report {0,0} and flag B as empty. Clean also requires every invariant to hold at T.\n5 Self-grading. post_alert_tainted_effects = |{e in B: tick>t_alert, state in present/dispatched}|. Do not use \"recorded read set touches B\": that is our own recorder, so it undercounts exactly when we miss a read, and it compares (obj,ver) with effects. irreversible_tainted_released = dispatched payment/email sink effects that are in B, never the gateway's class I1/I2. ks.score and ks.oracle must not import ks.taint, ks.monitor, ks.policy or ks.recovery, and must not reuse detector code. Add an import-lint test.\n6 Invariants. The registry IBAN has to be a world-side seeded supplier master, because workspace suppliers.iban is what crm writes and the check is vacuous against it. Define \"2x history\", for example as the price at tick 0. Write invariants_ok to score.json.\n7 Definitions.\n tti_detect: the first alert with tick>=t0 whose evidence_seqs include a record that produced a B effect. Other alerts go to fp_cost.\n tti_attribute: root_candidates[0]==culprit (ADR-04 has no suspect field) and action_id equal to the producer of the earliest B effect. Also report the top-3 hit (RT9).\n ttc: the first culprit (attributed_agent) envelope denied with reason suspended/revoked/revoked_ancestor/stale_epoch, minus t_alert. Specify the probe: one culprit write per tick from t_alert.\n P/Rc: X = keys touched by executed (not dry-run) restore/compensate/cancel_outbox steps. P=|X n B|/|X|, Rc=|X n keys(B)|/|keys(B)|. Note that Rc != 1-R.\n kept_without_redo: |{k in G: the original eff survives, untouched by rerun/replan, and equals S*}|/|G|. Use Airlock's term, but no number comparison (SYNTHESIS 3).\n replan_cost: from executed steps and approval Controls, with (rerun+replan)/|G| as {n,d}.\n reemitted: dispatched effects that share an idempotency_key, beyond the first.\n false_accusations: distinct non-culprit agents or conns that were root_candidates[0] or got suspend/revoke. The launderer crm counts in RT9.\n fp_cost: take the SPEC Q6 subfields.\n damage_in_window: |B in [t0, t_contain]|. Add exposure = t_contain - t0, or drop it explicitly.\n8 Names: post_alert_tainted_effects and irreversible_tainted_released (PMO). Delete the mismatch bullet. Email is I1 (ADR-03, TERMS), not I2.\n9 Protocol. State T, H, t_rec and the deterministic bench approver: plan latency, release of re-run held items, flag resolution. All faults enter the 20-seed bench except F6, which is scored by the ks verify exit and first_bad. With no floats, the median is nearest-rank lower (10th of 20) and p95 is the 19th. Order ratios as rationals. Treat null as +inf and report k/20 non-null. Baselines change only the recovery step, at the same t_rec with the same alerts and holds. Snapshot: restore to t_inject-1, cancel held items, no re-execution; it is given oracle t0, so it is the best case, and say so. Revert-culprit-only: restore culprit writes with tick>=t_inject to their pre-images, with no reader repair, no conflict check and the outbox untouched. No-op: holds stay.\n10 Cross-ADR. ADR-05 flags S-17 instead of restoring it (\"no field merge\", flags \"count in R\"). So F2+ has R>0 unless a scripted bench operator resolves the flag, counted in approvals. Decide this with vikram and maya and write the expected F2+ outcome. Otherwise the R=0 hero target (D13) is out of reach.\n11 Hold. ADR-03 sensitive_early_hold only catches items created before the change. The payment for the swapped supplier is caught by beneficiary_changed_then_paid plus the lineage hold inside H. Reword this and require H > detection latency for every seed. For each seed, the world must guarantee a payment to the swapped supplier before T-H, a x10 invoice at t_inject+1 and triage's edit of that row. Test 5: >=1 (SPEC), not =1.\n12 Tests. Reword test 1 as \"a clean run scored against itself gives B empty\". Add: the import-lint; revert without rerun gives R>0; held at T counts; probe TTC; F7 null.\n13 F3: the ADR has a crm culprit, SPEC RT10 has a rogue comms. Pick one.\nASSUMPTIONS\nLive set: partly accepted. Scripted live: F2+, F5, F6 (D11). F1/F2/F4 are jury-optional live via ks inject. F7 goes to bench and pytest only and is reported as the honest failure: at +1%/tick it needs about 70 ticks to cross 2x, so with T<~140 it is never detected live. Expected result: tti_detect null, R=1.\nt0 in [T/4,T/2]: accepted on four conditions. Derive it from the seed and store it as fault_tick. State T. Guarantee the hero preconditions (11). Leave at least T/2 ticks after t0 for detect, approve, rerun, release and probe.\nWords: trim Context and the world table, or move the formulas into the score.json schema docstrings that the ADR references.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "tara", "msg": "→ in_progress: drafting"}, {"t": "19 Nov 06:04", "who": "tara", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "tara", "msg": "→ in_review: ready"}, {"t": "19 Nov 06:06", "who": "pmo", "msg": "PMO decision: use TERMS/SPEC names post_alert_tainted_effects and irreversible_tainted_released in score.json"}, {"t": "19 Nov 06:16", "who": "anaya", "msg": "review: changes"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "From the kabir review of ADR-03: the catalogue has no tools for crm customers write/delete (F1 would be class U), ledger writes or compliance findings. Comms email is I2 here but I1 in ADR-03, and I1 is needed for the hero flow. F3 culprit crm is denied at once by p.scope, and no rule stops an in-scope agent from emailing PII. RT9/RT12 need a world mechanism that carries a parent action_id (ticket origin)."}]}, {"id": "ADR-07", "title": "ADR-07 CLI and incident console/timeline", "sprint": 2, "track": "eng", "owner": "ishaan", "reviewer": "zoya", "model": "sonnet", "created_by": "maya", "status": "changes", "outcome": "ks CLI surface (run, inject, verify, suspend/release/revoke, recover --dry-run, score) and the console/timeline the demo and jury use; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Lists every command with args and exit codes; control commands emit signed, recorded C4 Controls; console reads only the record/run dir", "Timeline shows alert → suspend → held items → recovery dry-run diff → approval (incl. replan queue) for the F2+ hero path in banking-legible terms"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-07-cli-console.md", "summary": "ADR-07 written (org/adr/ADR-07-cli-console.md, under 900 words). Defines 9 ks commands with args and Exit codes (no new codes), contain via signed ks.console Controls (revoke needs --confirm), recover dry-run/apply with replan approval queue, and a static single-file HTML incident console plus --live terminal view, both read-only on the run dir. Timeline follows the 5 F2+ beats. Open: release epoch reply field (maya), score pass/fail exit (tara).", "review": "[zoya · changes] Verdict: changes (4 must-fix, rest minor). Structure is right: five beats map 1:1 to console sections and TERMS wording is mostly used (suspend, lineage hold, record, dry-run diff, residual damage R / collateral loss C, root candidates). MUST-FIX: (1) Pacing: nothing lets the presenter hold beats 1-3 live. 'ks run' is a seeded batch; 'ks contain' needs a live gateway but a finished run gives IO; --hold is the hold window, not a pause. Add a tick pacing/step option (e.g. --tick-ms or --pause-at SEQ) or state that Break/Identify/Contain are shown from a completed run via 'ks console --html', and pick one. (2) Terms: ADR splits 'inject' (fault only) from '--rogue', but TERMS defines inject as fault OR arbitrary code in the rogue agent, and SEC-02 §3 shows 'ks run --rogue ... [--inject F2+]' while ADR uses '--fault F2+'. Align TERMS and SEC-02 §3 to the ADR flags (I will update TERMS inject row) so jury docs match the CLI. (3) 'console' means two things: a read-only page that never imports signer code, and the 'ks.console' signer that is the only one allowed to revoke. Jury will ask 'so the console can revoke?'. Rename the signer identity (e.g. ks.operator) or add one sentence. (4) Beat 4 promises scorecard vs snapshot and revert-culprit-only baselines, but the console reads only the run dir and score.json (ADR-06 keys); say where baseline numbers live in the run dir or that 'ks bench' output is embedded, else we cannot show them. MINOR: 'escaped payment' (beat 4) is a banned synonym; use 'irreversible tainted effect released' / 'released payment'. 'independents' -> 'independent agents'. 'ks blame' introduces an unlocked word (TERMS bans 'blame result'); keep the command but on screen and in narration say 'root candidates', add 'blame' as command alias in TERMS. 'incident console' not in TERMS; I will add it. Audit beat: console embeds a build-time verify, so after the jury edits a record line the page is stale until 'ks console --html' is rerun; say so, and show 'ks verify RUN' (exit TAMPER, first bad seq) as the live proof. TERMS uses 'first bad index'; pick seq or index once. Rehearse editing a line before the last witnessed seq, since edits after it are not detected. Typing risk in Recover: 'ks recover --apply PLAN_ID --approve ITEM' needs ids copied from output; make --dry-run print the exact apply command ready to paste. Time budget otherwise fits: about 9 commands across 5 min is workable if scripted. Word count 899 of 900, so edits must be swaps, not additions.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "ishaan", "msg": "→ in_progress: started"}, {"t": "19 Nov 06:05", "who": "ishaan", "msg": "posted result summary"}, {"t": "19 Nov 06:05", "who": "ishaan", "msg": "→ in_review: ready for review"}, {"t": "19 Nov 06:10", "who": "zoya", "msg": "review: changes"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "From the kabir review of ADR-02: 'ks verify RUN [--json]' needs --head <RunAnchor line> (CON-02 K1). Without it, the record+witness truncation and keyring-swap defences cannot be invoked. The release-epoch reply is CON-02 maya M5 (TickFrame.epoch)."}]}, {"id": "CON-01", "title": "Freeze contracts C1–C6 as Python modules + JSON Schema", "sprint": 2, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "maya", "status": "changes", "outcome": "C1 Envelope, C2 Record, C3 State, C4 Alert/Control, C5 RecoveryPlan, C6 Run dir frozen by 22 Nov as typed modules + JSON Schema, one canonical serializer, JSON-lines-over-Unix-socket transport; every ADR builds on these", "acceptance": ["src/ks/contracts/ has one module + one JSON Schema per C1–C6 with the fields in CALL-01/maya.md §3 (C1 incl. nonce, expiry, epoch, full act chain; C2 incl. read_set, write_set before/after ver+hash, prev_hash, gw_sig; C2 values as hashes only)", "pytest round-trip: for each contract, obj → canonical bytes → obj is identity, and the canonical bytes are stable across two runs (byte-equal) and validate against the schema", "a single canonical serializer (sorted keys, fixed encoding) is the only one exported and is the one signer, gateway and verify must import", "kabir signs off that the contracts satisfy all 11 day-one rules (CALL-01/kabir.md §4), checklist in the review note"], "depends": [], "deliverable": "src/ks/contracts/", "summary": "Contracts 1.0.0 frozen in src/ks/contracts/ (pydantic v2 frozen models, extra=forbid, field docstrings with OTel gen_ai.*/ks.* mapping) + 14 JSON Schema files (draft 2020-12, all fields required; >=1 per C1-C6) + README. C1 Envelope/EnvelopeHeader (commit-then-sign: agent signs header with args_hash, so verify works after args redaction; nonce, expiry_tick, epoch, full act_chain, claimed_ts_us/claimed_seq evidence-only). C2 Record (seq from 1, tick, logical ts_us, conn_id, embedded signed header = claimed agent_id+act_chain, sig_ok, decision exec|deny|hold, closed Reason enum, action_class R/C/I1/I2/U, read_set (obj,ver,hash), write_set before/after ver+hash, outbox_ids, result_hash, Control in clear, prev_hash, hash, gw_sig; attributed_agent is None unless sig_ok) + WitnessCheckpoint. C3 StateView/StateWriter/SideStore protocols, OutboxItem (author, class, idempotency_key gateway-derived, lineage from recorded read set, status queued|held|released|dispatched|cancelled, dispatched_seq), SideEntry. C4 Alert (no suspect; ranked root_candidates; signature alerts name conn only; tamper names nobody) and Control (target agent:/conn:/action:/outbox:; revoke never auto). C5 RecoveryPlan (taint_set, discriminated steps restore|rerun|replan|cancel_outbox|compensate|flag, hash-only dry-run diff; taint-scoped revert = the restore steps). C6 RunConfig (seed, hold_window_ticks, sensitive_fields), Keyring (public only), RunDir create/validate, verify Exit enum (OK/IO/TAMPER/WITNESS/RECONCILE/FROZEN/USAGE) + VerifyReport. Transport frames for JSON lines over Unix sockets. ONE serializer ks.contracts.canonical (JCS-identical: sorted keys, UTF-8, ints within 2^53, no floats, no bytes, strict loads). Folded in TERMS section 7 and redteam SPEC Q1-Q5, Q7, Q9, Q10; Q6 (score keys) left to ADR-06; Q8 = Exit.FROZEN. pytest: 231 passed (round-trip identity, byte-stable across 2 processes with different hash seeds, schema validation, golden hashes, rule invariants, single-serializer guard).", "review": "[kabir · changes] SEC-03 (org/reports/SEC-03.md): 4 blockers before the 22 Nov freeze. B1: WitnessCheckpoint lacks the signed count (THREAT-MODEL v3, ADR-02), and keys.json is unanchored (swapping the keyring defeats verify without --head). Add count, a RunAnchor {seq,head,tick,count,keyring_hash,config_hash} and VerifyReport.anchored. B2: DETERMINISTIC_FILES includes keys.json and signed records, which forces seed-derived private keys (seed is public). Drop keys.json, add a determinism_view() without sig/hash fields, and add an ADR-01 test that keys differ across runs. B3: RELEASE 'restores the epoch' (ADR-04 6: pre-suspend epoch) revives presigned envelopes, and expiry_tick is uncapped. Make epochs strictly monotonic per agent and add MAX_EXPIRY_TICKS. B4: canonical.loads/decode_frame raise RecursionError on a 6 KB nested frame (not a ValueError, so no deny/schema record and a possible barrier crash) and a plain ValueError on huge ints. Add MAX_DEPTH=32 and wrap every exception in CanonicalError. 8 fix-before-S4 items (F1 run-dir perms 0644 expose the side store to agent uids; F2 an agent-signed ks.control/ks.recover record validates; F3 expiry-vs-tick invariant; F4 dispatch record; F5 plan approval record; F6 alerts outside the chain; F7 coarse reads; F8 frame/flood budget) and 10 notes. Rules 3 and 6 (apart from B4) pass. Q1-Q10 met except Q6 (deferred). Pseudonymised hashes: accepted with conditions. Global-only chain: accepted. I sign off once B1-B4 land with tests.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 00:54", "who": "maya", "msg": "Kabir sign-off criterion is satisfied by SEC-03 (security review of C1-C6 vs 11 day-one rules); ADR-05 is the first ADR to start once C3/C5 are drafted"}, {"t": "19 Nov 00:55", "who": "pmo", "msg": "PMO: accepted — SEC-03 satisfies CON-01's security sign-off; faulty-run≡S* test stays in ADR-00"}, {"t": "19 Nov 00:55", "who": "maya", "msg": "→ in_progress"}, {"t": "19 Nov 06:01", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 06:01", "who": "maya", "msg": "→ in_review: 231 tests green; ready for kabir (SEC-03) review"}, {"t": "19 Nov 06:12", "who": "kabir", "msg": "review: changes"}]}, {"id": "SEC-01", "title": "Threat model document published for the jury", "sprint": 2, "track": "security", "owner": "kabir", "reviewer": "panel", "model": "opus", "created_by": "kabir", "status": "done", "outcome": "One-page threat model the jury reads before D11 live attacks: assets, trust boundaries, in/out of scope, claims we make and refuse", "acceptance": ["Lists assets (state, outbox, record+witness heads, 4 key classes, containment state, PII side store) and the 4 trust boundaries", "In scope: buggy, rogue (arbitrary Python in its subprocess), colluding (root candidates only), insider log tamper without keys; out of scope listed with production mitigation (HSM, WORM, uid/container)", "Claims match CALL-01 wording exactly: 'tamper-evident up to the last witnessed head'; key isolation 'enforced in production, detected here by reconciliation'; no prevention claim for collusion", "Maps every in-scope adversary to the RT# attacks that exercise it and the control that answers it (D6/D7/D8, rules 1-11)", "Fits on 2 pages, no unmeasured numbers (D13); panel signs off"], "depends": [], "deliverable": "org/adr/THREAT-MODEL.md", "summary": "v3 of org/adr/THREAT-MODEL.md applies the panel's must-fix, the length trims and the nit.\n(1) Sibling hijack: the Live setup now gives each agent its own numeric uid (60001 + index, no passwd entry needed), and the agent template sets PR_SET_DUMPABLE=0 before agent code runs. rlimits are per uid. I checked this in the container on 19 Nov (/tmp/kabir_uidtest/uidtest.py). subprocess user=int and preexec setuid both give children distinct uids. Cross-uid ptrace and pidfd_getfd return EPERM, whether the victim is dumpable or not. Under one shared uid, both calls succeed on a dumpable sibling, which confirms the finding. They return EPERM again once the sibling is non-dumpable.\n(2) New §5 row. Rogue | RT3b | ptrace/pidfd_getfd on a sibling to use its socket and signer handle | per-agent uid + non-dumpable agents; rule 2 | attach gets EPERM; 0 actions attributed to the victim.\n(3) The Live setup states that if per-agent uids fail, per-agent attribution is void for that run. The out-of-scope shared-uid row is updated to match.\n(4) RT3b is added to tests/redteam/SPEC.md: a catalogue row and a short section with the precondition, NOT_ENFORCEABLE fallback, script outline and boolean pass.\nLength: dropped the 'Detect, not exclude' paragraph and folded 'no printed head = out of scope (WORM)' into the record+heads row. Moved the Changes note out of the jury copy into org/adr/THREAT-MODEL-CHANGES.md. §6 is kept.\nNit: the insider now 'edits record files; holds no witness key; cannot alter the head printed at run end (the head store is defence in depth)'.", "review": "[panel · changes] CHANGES (4 must-fix, 1 should-fix; this still fits on 2 pages). Assets, B1-B4, in/out of scope with HSM/WORM/uid mitigations, the RT1-RT12 mapping (all 12 present, every in-scope adversary covered) and D13 target labelling all pass. C1-C5 are CALL-01 wording verbatim.\n(1) C6 misplaces CALL-01 wording. 'We hold, never cancel' is CALL-01's release semantics for containment, not a recovery claim. As written, C6 says recovery never cancels, which contradicts the C5 RecoveryPlan step cancel_outbox and the demo, where the held payment is discarded in recovery. A jury watching the demo will catch it. Reword C6: 'Containment holds, never cancels (release = un-hold + restore epoch). Recovery appends compensating records; a held outbox item is cancelled only by an approved recovery-plan step (cancel_outbox) after the dry-run diff.'\n(2) The key-read gap is acceptable only if its consequence is stated. Under the shared-uid fallback, the jury's sanctioned live attack (arbitrary Python in the rogue subprocess, D11) can read gateway and witness keys. That is the out-of-scope 'both keys' case, so C1 and C4 fail and reconciliation does not see it. §7 currently draws the line at 'a host shell as the gateway's user', which is not the same thing. Add: which setup runs live (separate uid or not, fixed by day 1), and if the uid is shared, that a key read from the rogue subprocess is the admitted gap and voids C1/C4 for that run. RT2 stays the test.\n(3) Where do witness heads live? An insider who truncates or rolls back BOTH the record and the witness heads to an older valid prefix passes verify: the 'last witnessed head' just moves back. This is the truncation hole from PANEL-ENG-00 item 2. Fix: state that witness heads are stored by the witness process outside the insider's write access, and add a row for record + witness truncation or rollback. Either detect it (witness keeps its own monotonic store) or put it out of scope (production: WORM witness log).\n(4) Availability is not admitted. A rogue that sleeps or loops forever stalls the tick barrier, so every independent agent stops: the 'kill everything' outcome F6 claims to avoid. A fork or memory bomb is the same class. A hostile jury tries this first. Add a rogue row: per-tick deadline, a missing envelope counts as a no-op plus an anomaly. Or state availability and resource exhaustion as out of scope (production: container limits).\n(5) Should-fix: the recovery key and Control actions have no row. Assets list 'forge a repair', but nothing says who signs suspend, release, revoke or recover, or that the recovery key never enters an agent process. Add one line: gateway-held, used only on console approval of the dry-run diff, rules 2 and 10; the console operator is trusted.\nGaps: splitting under thresholds with no RT and no claim is ACCEPTABLE as stated (GUARDRAILS X30 backs it). Key reads: acceptable once (2) is done.\nNits: TERMS bans 'quarantine' (RT5, use 'suspension') and 'log' (rule 9, use 'record'). Map the PII side store asset to the F3 pytest.\n\n[panel · changes] CHANGES: 1 must-fix, which is new and caused by v2's Live setup; the rest passes. All 5 earlier fixes are applied correctly. (1) C6 is my wording verbatim and agrees with GUARDRAILS F11/X29/§3. (2) The Live setup is fixed for day 1, and the shared-uid consequence (key read from the rogue voids C1/C4 for that run; RT2 stays the test) is stated and repeated in the out-of-scope table. (3) The witness head store, the monotonic count and the record+heads truncation row are present, with the printed head as the anchor and
