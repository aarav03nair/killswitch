d at T counts as left (held_unresolved, which is what gives no-op R=1). An unresolved flag counts as left. If d=0, report {0,0} and flag B as empty. Clean also requires every invariant to hold at T.\n5 Self-grading. post_alert_tainted_effects = |{e in B: tick>t_alert, state in present/dispatched}|. Do not use \"recorded read set touches B\": that is our own recorder, so it undercounts exactly when we miss a read, and it compares (obj,ver) with effects. irreversible_tainted_released = dispatched payment/email sink effects that are in B, never the gateway's class I1/I2. ks.score and ks.oracle must not import ks.taint, ks.monitor, ks.policy or ks.recovery, and must not reuse detector code. Add an import-lint test.\n6 Invariants. The registry IBAN has to be a world-side seeded supplier master, because workspace suppliers.iban is what crm writes and the check is vacuous against it. Define \"2x history\", for example as the price at tick 0. Write invariants_ok to score.json.\n7 Definitions.\n tti_detect: the first alert with tick>=t0 whose evidence_seqs include a record that produced a B effect. Other alerts go to fp_cost.\n tti_attribute: root_candidates[0]==culprit (ADR-04 has no suspect field) and action_id equal to the producer of the earliest B effect. Also report the top-3 hit (RT9).\n ttc: the first culprit (attributed_agent) envelope denied with reason suspended/revoked/revoked_ancestor/stale_epoch, minus t_alert. Specify the probe: one culprit write per tick from t_alert.\n P/Rc: X = keys touched by executed (not dry-run) restore/compensate/cancel_outbox steps. P=|X n B|/|X|, Rc=|X n keys(B)|/|keys(B)|. Note that Rc != 1-R.\n kept_without_redo: |{k in G: the original eff survives, untouched by rerun/replan, and equals S*}|/|G|. Use Airlock's term, but no number comparison (SYNTHESIS 3).\n replan_cost: from executed steps and approval Controls, with (rerun+replan)/|G| as {n,d}.\n reemitted: dispatched effects that share an idempotency_key, beyond the first.\n false_accusations: distinct non-culprit agents or conns that were root_candidates[0] or got suspend/revoke. The launderer crm counts in RT9.\n fp_cost: take the SPEC Q6 subfields.\n damage_in_window: |B in [t0, t_contain]|. Add exposure = t_contain - t0, or drop it explicitly.\n8 Names: post_alert_tainted_effects and irreversible_tainted_released (PMO). Delete the mismatch bullet. Email is I1 (ADR-03, TERMS), not I2.\n9 Protocol. State T, H, t_rec and the deterministic bench approver: plan latency, release of re-run held items, flag resolution. All faults enter the 20-seed bench except F6, which is scored by the ks verify exit and first_bad. With no floats, the median is nearest-rank lower (10th of 20) and p95 is the 19th. Order ratios as rationals. Treat null as +inf and report k/20 non-null. Baselines change only the recovery step, at the same t_rec with the same alerts and holds. Snapshot: restore to t_inject-1, cancel held items, no re-execution; it is given oracle t0, so it is the best case, and say so. Revert-culprit-only: restore culprit writes with tick>=t_inject to their pre-images, with no reader repair, no conflict check and the outbox untouched. No-op: holds stay.\n10 Cross-ADR. ADR-05 flags S-17 instead of restoring it (\"no field merge\", flags \"count in R\"). So F2+ has R>0 unless a scripted bench operator resolves the flag, counted in approvals. Decide this with vikram and maya and write the expected F2+ outcome. Otherwise the R=0 hero target (D13) is out of reach.\n11 Hold. ADR-03 sensitive_early_hold only catches items created before the change. The payment for the swapped supplier is caught by beneficiary_changed_then_paid plus the lineage hold inside H. Reword this and require H > detection latency for every seed. For each seed, the world must guarantee a payment to the swapped supplier before T-H, a x10 invoice at t_inject+1 and triage's edit of that row. Test 5: >=1 (SPEC), not =1.\n12 Tests. Reword test 1 as \"a clean run scored against itself gives B empty\". Add: the import-lint; revert without rerun gives R>0; held at T counts; probe TTC; F7 null.\n13 F3: the ADR has a crm culprit, SPEC RT10 has a rogue comms. Pick one.\nASSUMPTIONS\nLive set: partly accepted. Scripted live: F2+, F5, F6 (D11). F1/F2/F4 are jury-optional live via ks inject. F7 goes to bench and pytest only and is reported as the honest failure: at +1%/tick it needs about 70 ticks to cross 2x, so with T<~140 it is never detected live. Expected result: tti_detect null, R=1.\nt0 in [T/4,T/2]: accepted on four conditions. Derive it from the seed and store it as fault_tick. State T. Guarantee the hero preconditions (11). Leave at least T/2 ticks after t0 for detect, approve, rerun, release and probe.\nWords: trim Context and the world table, or move the formulas into the score.json schema docstrings that the ADR references.\n\n[anaya · done] DONE. Resolved: 1 S*=fault disabled, pure world, culprit stops at suspend_tick (X3a); 2 t_inject vs t0, no injected label; 3 harness per-field ledger with seq/agent/idem_key; 4 B/G frozen at t_rec, compared at T, held/dispatched/flag count as left, d=0 handled; 5 ledger-defined taint metrics + import-lint; 6 world-side registry, 2x tick-0 price, invariants_ok in score.json; 7 tti_detect/attribute/ttc probe/P-Rc/kept_without_redo/replan/reemitted/false_accusations/fp_cost/damage+exposure all have formulas; 8 names; 9 protocol (T=120, H, L, approver, integer median/p95, null=+inf, baselines oracle-assisted); 10 hero B2 no flag, F2+x flag; 11 hold reworded, H>=latency; 12 tests; 13 F3 rogue comms. CALL-02: X3 (suspension stop, precondition guard, F2+c golden C>0, c_culprit_window), X4 (bench approver, value comparison), X5 (oracle-assisted baselines), F6 TTI from chained ks.alert: all resolved. Every metric is computable. Non-blocking nits for tara: file is 925 words vs the 900 acceptance cap (body 778; trim Amendments); test_probe_ttc is in the metrics doc but not the ADR test list; faulty ticks are listed only for F2+, not F1/F2/F4; RNG is sha256([seed,name,tick]) vs ADR-00 stream wording.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "tara", "msg": "→ in_progress: drafting"}, {"t": "19 Nov 06:04", "who": "tara", "msg": "posted result summary"}, {"t": "19 Nov 06:04", "who": "tara", "msg": "→ in_review: ready"}, {"t": "19 Nov 06:06", "who": "pmo", "msg": "PMO decision: use TERMS/SPEC names post_alert_tainted_effects and irreversible_tainted_released in score.json"}, {"t": "19 Nov 06:16", "who": "anaya", "msg": "review: changes"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "From the kabir review of ADR-03: the catalogue has no tools for crm customers write/delete (F1 would be class U), ledger writes or compliance findings. Comms email is I2 here but I1 in ADR-03, and I1 is needed for the hero flow. F3 culprit crm is denied at once by p.scope, and no rule stops an in-scope agent from emailing PII. RT9/RT12 need a world mechanism that carries a parent action_id (ticket origin)."}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "Call #2 freeze adopted — apply your items from CALL-02/resolutions.md assignment table + amendments X1–X9 as an 'Amendments (Call #2)' section"}, {"t": "19 Nov 06:36", "who": "tara", "msg": "posted result summary"}, {"t": "19 Nov 06:36", "who": "tara", "msg": "→ in_review: freeze applied"}, {"t": "19 Nov 10:58", "who": "anaya", "msg": "review: done"}, {"t": "19 Nov 11:11", "who": "tara", "msg": "collateral_stall + false_accusations + nits"}]}, {"id": "ADR-07", "title": "ADR-07 CLI and incident console/timeline", "sprint": 2, "track": "eng", "owner": "ishaan", "reviewer": "zoya", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "ks CLI surface (run, inject, verify, suspend/release/revoke, recover --dry-run, score) and the console/timeline the demo and jury use; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Lists every command with args and exit codes; control commands emit signed, recorded C4 Controls; console reads only the record/run dir", "Timeline shows alert → suspend → held items → recovery dry-run diff → approval (incl. replan queue) for the F2+ hero path in banking-legible terms"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-07-cli-console.md", "summary": "Call #2 freeze applied to ADR-07 (~1,300 words): ks.operator rename, ks repro, verify --head, operator socket, --pause-at/--step, inject --with-baselines with baselines/ in run dir, live verify as audit proof, dry-run prints apply command, B3 kept lane, Zoya must-fixes and terms; Amendments (Call #2) added.", "review": "[zoya · changes] Verdict: changes (4 must-fix, rest minor). Structure is right: five beats map 1:1 to console sections and TERMS wording is mostly used (suspend, lineage hold, record, dry-run diff, residual damage R / collateral loss C, root candidates). MUST-FIX: (1) Pacing: nothing lets the presenter hold beats 1-3 live. 'ks run' is a seeded batch; 'ks contain' needs a live gateway but a finished run gives IO; --hold is the hold window, not a pause. Add a tick pacing/step option (e.g. --tick-ms or --pause-at SEQ) or state that Break/Identify/Contain are shown from a completed run via 'ks console --html', and pick one. (2) Terms: ADR splits 'inject' (fault only) from '--rogue', but TERMS defines inject as fault OR arbitrary code in the rogue agent, and SEC-02 §3 shows 'ks run --rogue ... [--inject F2+]' while ADR uses '--fault F2+'. Align TERMS and SEC-02 §3 to the ADR flags (I will update TERMS inject row) so jury docs match the CLI. (3) 'console' means two things: a read-only page that never imports signer code, and the 'ks.console' signer that is the only one allowed to revoke. Jury will ask 'so the console can revoke?'. Rename the signer identity (e.g. ks.operator) or add one sentence. (4) Beat 4 promises scorecard vs snapshot and revert-culprit-only solved; seq everywhere resolved; rehearse-before-last-witnessed-seq resolved; dry-run prints apply command resolved. NOT resolved: (a) word count 1,311 vs binding <=900 (CALL-02 resolutions); (b) demo run-end-to-end gap: ADR does not say the gateway stays alive until beat 4 --apply. 'resumes on next contain/recover command' may let the run finish after --dry-run, and recover --apply uses the operator socket (finished run = IO). State that a --pause-at run holds open (or keeps the socket) until apply/--approve done; also say where the RunAnchor line for 'verify --head' is printed. Otherwise the 5 beats map to ks inject F2+ --pause-at --with-baselines / console --live / blame / contain / recover --dry-run,--apply,--approve / score / inject --hold 0 / verify --head.\n\n[zoya · done] PMO-verified close-out of Zoya's re-review: live paused-run demo through beat 4, RunAnchor location, determinism wording fixed; SEC-02 flag drift delegated to Kabir's current pass; length waived by D-14.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "ishaan", "msg": "→ in_progress: started"}, {"t": "19 Nov 06:05", "who": "ishaan", "msg": "posted result summary"}, {"t": "19 Nov 06:05", "who": "ishaan", "msg": "→ in_review: ready for review"}, {"t": "19 Nov 06:10", "who": "zoya", "msg": "review: changes"}, {"t": "19 Nov 06:19", "who": "kabir", "msg": "From the kabir review of ADR-02: 'ks verify RUN [--json]' needs --head <RunAnchor line> (CON-02 K1). Without it, the record+witness truncation and keyring-swap defences cannot be invoked. The release-epoch reply is CON-02 maya M5 (TickFrame.epoch)."}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "Call #2 freeze adopted — apply your items from CALL-02/resolutions.md assignment table + amendments X1–X9 as an 'Amendments (Call #2)' section"}, {"t": "19 Nov 06:35", "who": "ishaan", "msg": "posted result summary"}, {"t": "19 Nov 06:35", "who": "ishaan", "msg": "→ in_review: freeze applied"}, {"t": "19 Nov 10:58", "who": "zoya", "msg": "review: changes"}, {"t": "19 Nov 10:59", "who": "pmo", "msg": "PMO D-14: 900-word cap waived (≤1,500). Length-only findings closed; substantive items go to the integration pass."}, {"t": "19 Nov 10:59", "who": "ishaan", "msg": "integration pass: live paused demo/recover scope; RunAnchor location; --rogue determinism_view identity"}, {"t": "19 Nov 11:00", "who": "pmo", "msg": "PMO: line 35 determinism wording aligned with determinism_view()"}, {"t": "19 Nov 11:00", "who": "zoya", "msg": "review: done"}]}, {"id": "CON-01", "title": "Freeze contracts C1–C6 as Python modules + JSON Schema", "sprint": 2, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "maya", "status": "done", "outcome": "C1 Envelope, C2 Record, C3 State, C4 Alert/Control, C5 RecoveryPlan, C6 Run dir frozen by 22 Nov as typed modules + JSON Schema, one canonical serializer, JSON-lines-over-Unix-socket transport; every ADR builds on these", "acceptance": ["src/ks/contracts/ has one module + one JSON Schema per C1–C6 with the fields in CALL-01/maya.md §3 (C1 incl. nonce, expiry, epoch, full act chain; C2 incl. read_set, write_set before/after ver+hash, prev_hash, gw_sig; C2 values as hashes only)", "pytest round-trip: for each contract, obj → canonical bytes → obj is identity, and the canonical bytes are stable across two runs (byte-equal) and validate against the schema", "a single canonical serializer (sorted keys, fixed encoding) is the only one exported and is the one signer, gateway and verify must import", "kabir signs off that the contracts satisfy all 11 day-one rules (CALL-01/kabir.md §4), checklist in the review note"], "depends": [], "deliverable": "src/ks/contracts/", "summary": "Contracts 1.0.0 frozen in src/ks/contracts/ (pydantic v2 frozen models, extra=forbid, field docstrings with OTel gen_ai.*/ks.* mapping) + 14 JSON Schema files (draft 2020-12, all fields required; >=1 per C1-C6) + README. C1 Envelope/EnvelopeHeader (commit-then-sign: agent signs header with args_hash, so verify works after args redaction; nonce, expiry_tick, epoch, full act_chain, claimed_ts_us/claimed_seq evidence-only). C2 Record (seq from 1, tick, logical ts_us, conn_id, embedded signed header = claimed agent_id+act_chain, sig_ok, decision exec|deny|hold, closed Reason enum, action_class R/C/I1/I2/U, read_set (obj,ver,hash), write_set before/after ver+hash, outbox_ids, result_hash, Control in clear, prev_hash, hash, gw_sig; attributed_agent is None unless sig_ok) + WitnessCheckpoint. C3 StateView/StateWriter/SideStore protocols, OutboxItem (author, class, idempotency_key gateway-derived, lineage from recorded read set, status queued|held|released|dispatched|cancelled, dispatched_seq), SideEntry. C4 Alert (no suspect; ranked root_candidates; signature alerts name conn only; tamper names nobody) and Control (target agent:/conn:/action:/outbox:; revoke never auto). C5 RecoveryPlan (taint_set, discriminated steps restore|rerun|replan|cancel_outbox|compensate|flag, hash-only dry-run diff; taint-scoped revert = the restore steps). C6 RunConfig (seed, hold_window_ticks, sensitive_fields), Keyring (public only), RunDir create/validate, verify Exit enum (OK/IO/TAMPER/WITNESS/RECONCILE/FROZEN/USAGE) + VerifyReport. Transport frames for JSON lines over Unix sockets. ONE serializer ks.contracts.canonical (JCS-identical: sorted keys, UTF-8, ints within 2^53, no floats, no bytes, strict loads). Folded in TERMS section 7 and redteam SPEC Q1-Q5, Q7, Q9, Q10; Q6 (score keys) left to ADR-06; Q8 = Exit.FROZEN. pytest: 231 passed (round-trip identity, byte-stable across 2 processes with different hash seeds, schema validation, golden hashes, rule invariants, single-serializer guard).", "review": "[kabir · changes] SEC-03 (org/reports/SEC-03.md): 4 blockers before the 22 Nov freeze. B1: WitnessCheckpoint lacks the signed count (THREAT-MODEL v3, ADR-02), and keys.json is unanchored (swapping the keyring defeats verify without --head). Add count, a RunAnchor {seq,head,tick,count,keyring_hash,config_hash} and VerifyReport.anchored. B2: DETERMINISTIC_FILES includes keys.json and signed records, which forces seed-derived private keys (seed is public). Drop keys.json, add a determinism_view() without sig/hash fields, and add an ADR-01 test that keys differ across runs. B3: RELEASE 'restores the epoch' (ADR-04 6: pre-suspend epoch) revives presigned envelopes, and expiry_tick is uncapped. Make epochs strictly monotonic per agent and add MAX_EXPIRY_TICKS. B4: canonical.loads/decode_frame raise RecursionError on a 6 KB nested frame (not a ValueError, so no deny/schema record and a possible barrier crash) and a plain ValueError on huge ints. Add MAX_DEPTH=32 and wrap every exception in CanonicalError. 8 fix-before-S4 items (F1 run-dir perms 0644 expose the side store to agent uids; F2 an agent-signed ks.control/ks.recover record validates; F3 expiry-vs-tick invariant; F4 dispatch record; F5 plan approval record; F6 alerts outside the chain; F7 coarse reads; F8 frame/flood budget) and 10 notes. Rules 3 and 6 (apart from B4) pass. Q1-Q10 met except Q6 (deferred). Pseudonymised hashes: accepted with conditions. Global-only chain: accepted. I sign off once B1-B4 land with tests.\n\n[kabir · done] superseded by CON-02 v1.1.0; B1–B4 closed", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 00:54", "who": "maya", "msg": "Kabir sign-off criterion is satisfied by SEC-03 (security review of C1-C6 vs 11 day-one rules); ADR-05 is the first ADR to start once C3/C5 are drafted"}, {"t": "19 Nov 00:55", "who": "pmo", "msg": "PMO: accepted — SEC-03 satisfies CON-01's security sign-off; faulty-run≡S* test stays in ADR-00"}, {"t": "19 Nov 00:55", "who": "maya", "msg": "→ in_progress"}, {"t": "19 Nov 06:01", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 06:01", "who": "maya", "msg": "→ in_review: 231 tests green; ready for kabir (SEC-03) review"}, {"t": "19 Nov 06:12", "who": "kabir", "msg": "review: changes"}, {"t": "19 Nov 11:09", "who": "kabir", "msg": "review: done"}]}, {"id": "CON-02", "title": "Contracts v1.1.0 per design freeze", "sprint": 2, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Contracts implement the CON-02 checklist + X1, X7, X8(F1) with tests; Kabir can sign", "acceptance": ["every checklist item in CALL-02/resolutions.md implemented with a test", "Kabir's sign-off tests pass: test_count_chain, RT8(h)-ready anchor, test_fresh_keys_differ, test_epoch_monotonic, test_depth_6kb_denied, pk '.' rejected", "all existing tests green; schemas regenerated; README updated"], "depends": [], "deliverable": "src/ks/contracts/", "summary": "Contracts 1.1.0 landed in src/ks/contracts/ (CONTRACTS_VERSION 1.1.0, schemas regenerated with new c5.approval, c5.recover_args, c6.run_anchor). Every CON-02 checklist item plus X1, X2, X7, X8-F1 and PMO S5 (barrier.deadline may carry conn_id, never an agent; reconcile can have empty evidence and names nobody) is implemented with a test in tests/contracts/test_con02_checklist.py. Kabir's sign-off tests are in tests/contracts/test_signoff_kabir.py: test_count_chain, test_rt8h_keyring_swap_detected_by_anchor, test_fresh_keys_differ, test_epoch_monotonic, test_expiry_cap_and_admitted_expiry (RT4-ready), test_depth_6kb_denied, test_pk_dot_rejected, test_repro_forces_unanchored_and_refuses_rogue, test_rundir_perms_agent_eacces (actually runs: root drops to uid 60001). Golden hashes re-pinned on purpose; each change is explained in the README changelog, and the format vectors did not change. Breaking for callers: split_obj_id now returns a 3-tuple, t0_seq is renamed t0_seq_est, TickFrame needs epoch and view, and Record needs reexec_of. pytest: 310 passed (was 231), also green under PYTHONHASHSEED 0, 1 and 999.", "review": "[kabir · done] Signed, contracts 1.1.0. Suite green (310 passed, incl. test_rundir_perms_agent_eacces run as root, not skipped). All sign-off tests are real checks, not tautologies: test_count_chain (gap/restart/swapped head/truncation), RT8(h) (keys.json swapped on disk -> keyring_mismatch, config edit -> config_mismatch), test_fresh_keys_differ (two fresh-key runs: raw bytes differ, determinism_files equal), test_epoch_monotonic, expiry cap/RT4, test_depth_6kb_denied (loads/decode_frame/from_canonical/dumps), R1 pk-dot, R4 repro unanchored + refused with rogue, F1 modes. The one weak line: the final assert in test_epoch_monotonic (0 != max_epoch) checks nothing; gateway epoch test must cover it. 26 probes in /tmp/signoff/probe.py all fail closed, except as noted. reexec_of (M10): agents cannot set it (Envelope extra=forbid; submit frames carrying reexec_of in the frame or the envelope -> ContractError -> deny/schema). Records are gw_sig'd, record.jsonl 0600 gateway-only, so only the gateway writes it. Not abusable by a rogue agent. BUT the per-record validator only checks reexec_of < seq and sig_ok: a record with reexec_of=1 and expiry_tick=2^53-1 validates, and two records re-executing the same hold both validate (double exec; nonce is not re-checked). Closing that needs a cross-record check, so it is fix-before-S4 (F9, below), not a contract blocker. Follow-ups, non-blocking: README C6 still says record.jsonl 0640/witness gid while code+tests say 0600 (fix doc); make_obj_id/split_obj_id use Python '$', so 'C-1\\n' passes (ObjId rejects later, fail-closed; use fullmatch).", "log": [{"t": "19 Nov 06:33", "who": "maya", "msg": "opened"}, {"t": "19 Nov 06:34", "who": "maya", "msg": "→ in_progress: started contracts v1.1.0"}, {"t": "19 Nov 11:06", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 11:06", "who": "maya", "msg": "→ in_review: ready for kabir: 310 green"}, {"t": "19 Nov 11:07", "who": "pmo", "msg": "PMO alignment: record.jsonl 0600 gateway-only per ADR-00/02 integration pass (was 0640 witness-group); test updated"}, {"t": "19 Nov 11:09", "who": "kabir", "msg": "review: done"}, {"t": "19 Nov 11:10", "who": "pmo", "msg": "PMO: Kabir sign-off nits fixed — obj-id regex uses fullmatch (+test), README file modes aligned to 0600"}]}, {"id": "ORG-04", "title": "Call #2: design freeze — resolve all cross-ADR issues", "sprint": 2, "track": "ops", "owner": "pmo", "reviewer": "panel", "model": "opus", "created_by": "pmo", "status": "done", "outcome": "One binding resolution per open review item, owners for every ADR edit, CON-02 scope fixed", "acceptance": ["Maya drafts resolutions covering every must-fix in ADR-00..07, SEC-03 and CON-02-requests", "Kabir, Anaya, Vikram post objections or sign-off", "PMO publishes the freeze with dissent recorded"], "depends": [], "deliverable": "org/meetings/CALL-02.md", "summary": "Design freeze adopted: resolutions.md + amendments X1–X9 (org/meetings/CALL-02.md). Hero = field-level sensitive objects (⚑ Aarav). D13 wording revised (⚑ Aarav). CON-02 next, then build.", "review": "", "log": [{"t": "19 Nov 06:20", "who": "pmo", "msg": "opened"}, {"t": "19 Nov 06:20", "who": "pmo", "msg": "→ in_progress"}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "posted result summary"}, {"t": "19 Nov 06:33", "who": "pmo", "msg": "→ done"}]}, {"id": "SEC-01", "title": "Threat model document published for the jury", "sprint": 2, "track": "security", "owner": "kabir", "reviewer": "panel", "model": "opus", "created_by": "kabir", "status": "done", "outcome": "One-page threat model the jury reads before D11 live attacks: assets, trust boundaries, in/out of scope, claims we make and refuse", "acceptance": ["Lists assets (state, outbox, record+witness heads, 4 key classes, containment state, PII side store) and the 4 trust boundaries", "In scope: buggy, rogue (arbitrary Python in its subprocess), colluding (root candidates only), insider log tamper without keys; out of scope listed with production mitigation (HSM, WORM, uid/container)", "Claims match CALL-01 wording exactly: 'tamper-evident up to the last witnessed head'; key isolation 'enforced in production, detected here by reconciliation'; no prevention claim for collusion", "Maps every in-scope adversary to the RT# attacks that exercise it and the control that answers it (D6/D7/D8, rules 1-11)", "Fits on 2 pages, no unmeasured numbers (D13); panel signs off"], "depends": [], "deliverable": "org/adr/THREAT-MODEL.md", "summary": "v3 of org/adr/THREAT-MODEL.md applies the panel's must-fix, the length trims and the nit.\n(1) Sibling hijack: the Live setup now gives each agent its own numeric uid (60001 + index, no passwd entry needed), and the agent template sets PR_SET_DUMPABLE=0 before agent code runs. rlimits are per uid. I checked this in the container on 19 Nov (/tmp/kabir_uidtest/uidtest.py). subprocess user=int and preexec setuid both give children distinct uids. Cross-uid ptrace and pidfd_getfd return EPERM, whether the victim is dumpable or not. Under one shared uid, both calls succeed on a dumpable sibling, which confirms the finding. They return EPERM again once the sibling is non-dumpable.\n(2) New §5 row. Rogue | RT3b | ptrace/pidfd_getfd on a sibling to use its socket and signer handle | per-agent uid + non-dumpable agents; rule 2 | attach gets EPERM; 0 actions attributed to the victim.\n(3) The Live setup states that if per-agent uids fail, per-agent attribution is void for that run. The out-of-scope shared-uid row is updated to match.\n(4) RT3b is added to tests/redteam/SPEC.md: a catalogue row and a short section with the precondition, NOT_ENFORCEABLE fallback, script outline and boolean pass.\nLength: dropped the 'Detect, not exclude' paragraph and folded 'no printed head = out of scope (WORM)' into the record+heads row. Moved the Changes note out of the jury copy into org/adr/THREAT-MODEL-CHANGES.md. §6 is kept.\nNit: the insider now 'edits record files; holds no witness key; cannot alter the head printed at run end (the head store is defence in depth)'.", "review": "[panel · changes] CHANGES (4 must-fix, 1 should-fix; this still fits on 2 pages). Assets, B1-B4, in/out of scope with HSM/WORM/uid mitigations, the RT1-RT12 mapping (all 12 present, every in-scope adversary covered) and D13 target labelling all pass. C1-C5 are CALL-01 wording verbatim.\n(1) C6 misplaces CALL-01 wording. 'We hold, never cancel' is CALL-01's release semantics for containment, not a recovery claim. As written, C6 says recovery never cancels, which contradicts the C5 RecoveryPlan step cancel_outbox and the demo, where the held payment is discarded in recovery. A jury watching the demo will catch it. Reword C6: 'Containment holds, never cancels (release = un-hold + restore epoch). Recovery appends compensating records; a held outbox item is cancelled only by an approved recovery-plan step (cancel_outbox) after the dry-run diff.'\n(2) The key-read gap is acceptable only if its consequence is stated. Under the shared-uid fallback, the jury's sanctioned live attack (arbitrary Python in the rogue subprocess, D11) can read gateway and witness keys. That is the out-of-scope 'both keys' case, so C1 and C4 fail and reconciliation does not see it. §7 currently draws the line at 'a host shell as the gateway's user', which is not the same thing. Add: which setup runs live (separate uid or not, fixed by day 1), and if the uid is shared, that a key read from the rogue subprocess is the admitted gap and voids C1/C4 for that run. RT2 stays the test.\n(3) Where do witness heads live? An insider who truncates or rolls back BOTH the record and the witness heads to an older valid prefix passes verify: the 'last witnessed head' just moves back. This is the truncation hole from PANEL-ENG-00 item 2. Fix: state that witness heads are stored by the witness process outside the insider's write access, and add a row for record + witness truncation or rollback. Either detect it (witness keeps its own monotonic store) or put it out of scope (production: WORM witness log).\n(4) Availability is not admitted. A rogue that sleeps or loops forever stalls the tick barrier, so every independent agent stops: the 'kill everything' outcome F6 claims to avoid. A fork or memory bomb is the same class. A hostile jury tries this first. Add a rogue row: per-tick deadline, a missing envelope counts as a no-op plus an anomaly. Or state availability and resource exhaustion as out of scope (production: container limits).\n(5) Should-fix: the recovery key and Control actions have no row. Assets list 'forge a repair', but nothing says who signs suspend, release, revoke or recover, or that the recovery key never enters an agent process. Add one line: gateway-held, used only on console approval of the dry-run diff, rules 2 and 10; the console operator is trusted.\nGaps: splitting under thresholds with no RT and no claim is ACCEPTABLE as stated (GUARDRAILS X30 backs it). Key reads: acceptable once (2) is done.\nNits: TERMS bans 'quarantine' (RT5, use 'suspension') and 'log' (rule 9, use 'record'). Map the PII side store asset to the F3 pytest.\n\n[panel · changes] CHANGES: 1 must-fix, which is new and caused by v2's Live setup; the rest passes. All 5 earlier fixes are applied correctly. (1) C6 is my wording verbatim and agrees with GUARDRAILS F11/X29/§3. (2) The Live setup is fixed for day 1, and the shared-uid consequence (key read from the rogue voids C1/C4 for that run; RT2 stays the test) is stated and repeated in the out-of-scope table. (3) The witness head store, the monotonic count and the record+heads truncation row are present, with the printed head as the anchor and WORM for runs without one. (4) The stall/fork/memory-bomb row is present: per-tick deadline, missing envelope = no-op + anomaly, rlimits, container limits out of scope. (5) The Control-action/recovery-key row is present and the operator is trusted. Nits fixed: no 'quarantine'/'log' left, side store mapped to F3.\\nMUST-FIX: sibling-agent hijack (framing with a valid signature). The Live setup puts ALL agents on 'a separate unprivileged uid', one uid shared by every agent, and the out-of-scope table lists 'separate uid/container per agent' as production-only. Under the sanctioned D11 attack (arbitrary Python in the rogue), a same-uid process can ptrace an honest sibling, or use pidfd_getfd / process_vm_readv on it, and take its gateway socket and signer handle. This sandbox has no Yama (/proc/sys/kernel/yama/ptrace_scope is absent), so the classic same-uid ptrace rule applies. The rogue then submits envelopes signed by crm's key through crm's handle. By C4's own wording that is a valid signature attributing the action to crm, so D7 anti-framing, F4 identity and RT11 are defeated without a key read, and no RT exercises this. A hostile jury will try it once they see one shared agent uid. Fix: (a) Live setup: 'agents: one unprivileged uid per agent (numeric, e.g. 20000+index; root can setuid to any uid without a passwd entry), and the agent template sets PR_SET_DUMPABLE=0 before agent code runs'. Per-agent uids also make RLIMIT_NPROC per-agent, which helps the fork-bomb row. (b) Add a §5 row: Rogue | RT3 (variant) | ptrace/pidfd_getfd on a sibling agent to use its socket and signer handle | per-agent uid + non-dumpable agent processes; rule 2 | 0 envelopes accepted through another agent's handle. (c) If per-agent uids fail in an environment, say so in the Live setup sentence beside the C1/C4 one: attribution to a specific honest agent is void for that run. Kabir/Maya: add sibling-hijack to the RT2/RT3 test.\\nLENGTH (~1,630 words, criterion '2 pages'): ACCEPTABLE. It is table-dense, every row answers a jury attack, and the jury reads it before the live break, where completeness matters more than brevity. Before publishing, keep it to 2 rendered pages: (i) drop the 'Changes v2 (panel)' line from the jury copy (it is internal process; the issue log keeps it); (ii) drop the 'Detect, not exclude' paragraph, because the record+heads row already says it (fold 'a run with no printed head is out of scope (WORM)' into that row's control cell). That saves ~90 words. Do not cut §6: §5 cites the rules by number.\\nNit: the insider definition says 'no write access to the witness head store', but the record is gateway-owned (uid 0, 0600), so anyone able to edit it is effectively root and can also write the 0700 store. The printed head is the real anchor and the store is defence in depth. Word the insider as 'edits record files; holds no witness key; cannot alter the head printed at run end'. Re-review is quick: one row and two Live-setup clauses.\n\n[panel · done] DONE. Signed off for the jury. v3 fixes the sibling-hijack must-fix, applies the trims and fixes the nit.\n(1) PER-AGENT UID + NON-DUMPABLE: PASS, independently re-run. I ran /tmp/kabir_uidtest/uidtest.py with python3 -I from /tmp as uid 0, today. subprocess user=60001/60002 gives those uids with no passwd entry, and preexec setuid gives 60003. With the attacker as uid 60002 and the victim as uid 60001, ptrace and pidfd_getfd both return EPERM, whether the victim is dumpable or not. With the same uid and a dumpable victim, both succeed (ptrace OK, pidfd_getfd fd 4), which confirms the original finding. With the same uid and a non-dumpable victim, both return EPERM. Yama is absent. process_vm_readv and /proc/pid/mem go through the same ptrace-attach check, and RT3b also probes vm_read. The Live setup states it correctly: numeric uid 60001 + index, PR_SET_DUMPABLE=0 set in the template before agent code (after exec, which is right), per-uid rlimits (helps the fork-bomb row). Per-agent uids also stop cross-agent kill(), a small availability bonus.\n(2) RT3b ROW: PASS. The §5 row has the attack, the control (per-agent uid + non-dumpable; rule 2) and a boolean target. §7 now lists 'attaching to sibling agents' as sanctioned. SPEC.md has the catalogue row and a section with the precondition, the NOT_ENFORCEABLE fallback, ptrace/getfd/vm_read probes, a pass check that compares attribution to the oracle, and a documented control run that is not asserted.\n(3) VOID-ATTRIBUTION FALLBACK: PASS. The Live setup sentence sits beside the C1/C4 one. The out-of-scope shared-uid row covers both cases (agent = gateway user voids C1/C4; agents sharing a uid void per-agent attribution). C4's refuse cell ('which key signed through which handle') agrees.\n(4) TRIMS: PASS. The 'Detect, not exclude' paragraph is dropped. The WORM no-printed-head clause is folded into the truncation row. The Changes note moved to THREAT-MODEL-CHANGES.md. §6 is kept. Length is about 1,630 words against about 1,600 in v2, and the table density is the same, so it is still 2 rendered pages.\n(5) INSIDER WORDING: PASS, verbatim as requested.\nNo 'quarantine' or 'log' in the jury copy. Targets are labelled D13. C1-C6 are unchanged.\nNits (no re-review): (a) §5 RT3b target, '0 actions attributed to the victim', reads literally as crm doing nothing. Make it '0 rogue actions attributed to the victim', matching SPEC's 'beyond its own'. (b) SPEC.md line 77, RT5 'TOCTOU at quarantine': TERMS bans the word, use 'suspension'. This is in SPEC, not the jury copy. (c) 'Checked here 19 Nov' is a measured fact, not a target, so D13 is fine. Keep the script in the repo (tests/redteam) so the claim is reproducible, not only in /tmp.", "log": [{"t": "19 Nov 00:54", "who": "kabir", "msg": "opened"}, {"t": "19 Nov 00:54", "who": "kabir", "msg": "→ in_progress"}, {"t": "19 Nov 00:56", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 00:56", "who": "kabir", "msg": "→ in_review"}, {"t": "19 Nov 01:01", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 01:04", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 01:04", "who": "kabir", "msg": "→ in_review: panel fixes applied"}, {"t": "19 Nov 05:59", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 06:02", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 06:02", "who": "kabir", "msg": "→ in_review: per-agent uid + RT3b"}, {"t": "19 Nov 06:07", "who": "panel", "msg": "review: done"}, {"t": "19 Nov 06:08", "who": "pmo", "msg": "uid test moved to tests/redteam/uid_isolation_check.py for reproducibility"}, {"t": "19 Nov 11:00", "who": "kabir", "msg": "THREAT-MODEL v4 per Call #2"}, {"t": "19 Nov 11:08", "who": "panel", "msg": "v4 signed: consistent with CALL-02/resolutions (ks.operator, c-0, SO_PEERCRED socket, anchor + verify --head, repro not a security run, field objects) and ADR-01 keys; no claim beyond CALL-01/02; C3 key-classes note resolved; ~1,716 words, mostly tables, ~2.5 pages, accepted."}]}, {"id": "SEC-02", "title": "Red-team spec RT1-RT12 as executable test plan", "sprint": 2, "track": "security", "owner": "kabir", "reviewer": "maya", "model": "opus", "created_by": "kabir", "status": "done", "outcome": "Sprint 4 test spec: each of RT1-RT12 written so an engineer can turn it into a pytest or live demo script without asking", "acceptance": ["Each RT has: setup (seed, agents, preconditions), script outline (steps the rogue code runs), observable signal, binary pass criterion, owner module", "Pass criteria are machine-checkable (exit code, record field, count == 0), not prose", "Marks which run live at finale (F5/F6, ks inject, DB bypass, line edit, full rewrite) vs pytest-only (F3), per D11", "RT11 scores false-positive cost; RT3 asserts the claimed agent is NOT suspended (D7 anti-framing)", "Owner modules exist in Maya's C1-C6 / ADR names; maya confirms each is buildable"], "depends": [], "deliverable": "tests/redteam/SPEC.md", "summary": "Maya's latest review applied to tests/redteam/SPEC.md: RT3c leg (b) accepts signer_refused, out_of_scope moved to bench-signed test_scope_table; RT11b asserts fp_cost.honest_suspensions==1 and false_accusations>=1 (once ADR-06 counts operator suspends); RT13(e) checks unanchored_reason==repro_keys; RT12 requires REVOKED_ANCESTOR plus a subset of {suspended, revoked, stale_epoch}, not SUSPENDED; note added that child_of(parent_action_id) is a bench-only ks.world hook (tara), excluded from catalogue/contracts and from reporter_own_actions(run)==oracle.", "review": "[maya · changes] CHANGES (maya). A strong spec. Every RT has setup, script, signal and a machine-checkable pass. LIVE vs pytest follows D11. RT3 asserts the anti-framing property and RT11 recomputes fp_cost. I ticked §4 in SPEC.md: 7 buildable (RT1, RT2, RT3, RT3b, RT5, RT6, RT7, RT8 and the harness, after the renames), 4 waiting on a named change (RT4, RT9, RT10, RT12), 1 not buildable (RT11). Owner modules all exist in C1-C6 and the ADRs.\nMust fix:\n1. RT11 contradicts ADR-04. Suspension follows the origin, so payments is NOT suspended and false_accusations==0. Split it: 11a, the ADR-04 path (triage = root_candidates[0] suspended, payments' tainted payment held, its clean work flows, fp_cost recomputed); 11b, the operator/harness suspends payments, then release at a fresh epoch, held items go out unless tainted, lost honest effects 0, false_accusations>=1. Also state triage's write scope on suppliers.iban (ADR-03/06).\n2. Renames from SEC-03 §4: attributed_agent, envelope.act_chain[*].principal, root_candidates[0] (no suspect), status, lineage hashes, Control.op (the seq comes from the carrying record), expiry_tick.\n3. RT6: the projection compares deny/schema in run A against exec in run B, so it fails by construction. Project over conn_id != rogue, and send one envelope per tick.\n4. RT12: there is no delegation path in ADR-03/06; tara or nisha must add one, or drop the act_chain leg. ctx.reconnect is impossible with path-less socketpairs (ADR-00). release_at is not an envelope field. Effects have no seq/act_chain.\n5. RT9/RT10: use ADR-06 effects fields (value_hash, agent; no beneficiary_iban or to). Score keys as tara decides (post_alert_tainted vs _effects, irreversible_released vs irreversible_tainted_released). Under the amended ADR-04, RT9 expects crm at [0], auto-suspended and counted in false_accusations, and intake in the top 3; fix the 'operator click' note.\n6. RT8 g needs a run killed between flush and checkpoint, because ADR-00 takes a final checkpoint. Add (h) keys.json swap (SEC-03 B1).\n7. RT2 runs in fresh-key mode (SEC-03 B2). RT3(a): the signer may refuse a foreign agent_id (N2), so accept either outcome.\n8. RT7: record the redaction boundary. Setting redacted=true passes verify by design.\nDependencies on me: monotonic epoch plus TickFrame.epoch (RT4, RT11b; CON-02 M4/M5), the agent view in read sets (RT9; M6), verify!=OK => FROZEN (RT7; M12). RT5: I'm changing ADR-00 so surplus frames get over_quota. Your §2 note on RT2 is resolved: ADR-00 drops agents to per-agent uids.\n\n[maya · changes] CHANGES (maya), small. All 8 earlier items are resolved (11a/11b split, SEC-03 renames, RT6 projection, RT12 reconnect/release_at dropped, ADR-06 effect fields and score keys, RT8 g/h, RT2 fresh, RT7 redaction). §4 re-ticked against v1.1.0: RT4, RT7, RT8, RT9, RT11a, RT12, RT13 now ☑; RT3c and RT11b stay ◐. N4: ACCEPT child_of(parent_action_id) as a bench-only hook in ks.world (tara). It is the right shape: the child envelope is signed by reporter's own signer (signer_refusal doesn't look at act_chain), so the denial comes from the gateway's step-5 ancestor check. Conditions: not in the catalogue or contracts, seeded via M1, and in reporter_own_actions(run)==oracle exclude hook-made envelopes (the oracle would execute them). Must fix: (1) RT3c leg (b): the signer refuses ks.* tools (system_tool), so a rogue cannot get a sig_ok ks.control and OUT_OF_SCOPE can never appear in its pass set; accept signer_refused for (b) and assert out_of_scope in the bench-signed test_scope_table. (2) RT11b: false_accusations>=1 fails because ADR-06-metrics counts only monitor/recovery suspends, not ks.operator; tara to count operator suspends of a non-culprit, else assert fp_cost.honest_suspensions==1 only. (3) RT13(e): repro_keys is VerifyReport.unanchored_reason; reason is 'ok'. Nit: RT12 requires Reason.SUSPENDED but a suspended signer refuses and an old envelope is stale_epoch; use REVOKED_ANCESTOR plus a subset of {suspended, revoked, stale_epoch}. I edited only the §4 Buildable column.\n\n[pmo · done] PMO-verified close-out of Maya's SEC-02 review: RT3c signer_refused + test_scope_table, RT11b honest_suspensions/false_accusations (ADR-06 now counts operator suspends), RT13(e) unanchored_reason, RT12 reason set relaxed, child_of noted bench-only. Buildability table re-ticked by Maya.", "log": [{"t": "19 Nov 00:54", "who": "kabir", "msg": "opened"}, {"t": "19 Nov 00:54", "who": "kabir", "msg": "→ in_progress"}, {"t": "19 Nov 00:59", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 00:59", "who": "kabir", "msg": "→ in_review: spec ready; maya to tick section 4 buildability and answer Q1-Q10 + RT1 D7 point"}, {"t": "19 Nov 06:19", "who": "maya", "msg": "review: changes"}, {"t": "19 Nov 11:00", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 11:00", "who": "kabir", "msg": "→ in_review: freeze applied"}, {"t": "19 Nov 11:09", "who": "maya", "msg": "review: changes"}, {"t": "19 Nov 11:11", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 11:11", "who": "kabir", "msg": "→ in_review: maya fixes applied"}, {"t": "19 Nov 11:13", "who": "pmo", "msg": "review: done"}]}, {"id": "SEC-03", "title": "Security review of contracts C1-C6 against the 11 day-one rules", "sprint": 2, "track": "security", "owner": "kabir", "reviewer": "maya", "model": "opus", "created_by": "kabir", "status": "done", "outcome": "Rule-by-contract verdict table so C1-C6 freeze with no security gaps", "acceptance": ["11x6 matrix: each day-one rule (CALL-01/kabir.md s4) vs each contract C1-C6 marked pass / gap / n.a. with a one-line reason", "Every gap has a concrete proposed contract change (field, check or invariant) and severity (blocker / fix-before-S4 / note)", "Explicitly checks: one canonical serializer (rule 4), epoch+deny-list inside write txn and hold re-check at dispatch (rule 5), fail-closed U (rule 6), denials recorded (rule 11)", "Blockers resolved or accepted by maya before contracts freeze"], "depends": ["CON-01"], "deliverable": "org/reports/SEC-03.md", "summary": "org/reports/SEC-03.md: 11x6 grid (35 pass / 16 n.a. / 15 gap cells, 12 distinct gaps), backed by 64 probes in /tmp/sec03. 4 blockers: B1 witness count plus anchoring of keys.json; B2 determinism forces seed-derived private keys; B3 release reuses the pre-suspend epoch and expiry is uncapped; B4 RecursionError on a 6 KB nested frame. 8 fix-before-S4 items (F1 run-dir perms expose the side store, F2 agent-signed ks.control validates, F3-F8) and 10 notes. Rules 4/5/6/11 checked explicitly; Q1-Q10 met except Q6 (deferred). Pseudonymised hashes accepted with conditions; global-only chain accepted. CON-01 verdict: changes (B1-B4).", "review": "", "log": [{"t": "19 Nov 00:54", "who": "kabir", "msg": "opened"}, {"t": "19 Nov 06:04", "who": "kabir", "msg": "→ in_progress"}, {"t": "19 Nov 06:12", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 06:12", "who": "kabir", "msg": "→ in_review: report posted; CON-01 marked changes with B1-B4"}, {"t": "19 Nov 11:09", "who": "kabir", "msg": "B1–B4 closed in v1.1.0 (CON-02 signed; tests in tests/contracts/test_signoff_kabir.py). R1 and R4 closed. New F9: verify/gateway must check reexec_of across records: target is a sig_ok hold record with the same envelope_hash, an executed unhold action:<record_id> comes in between, and each hold is re-executed at most once. Open fix-before-S4: R2, R3, R5 (operator peercred), F4, F6, F7 test, F8, F9; witness.jsonl owner = witness uid."}, {"t": "19 Nov 11:09", "who": "kabir", "msg": "→ done: blockers closed"}]}, {"id": "SKEL-01", "title": "Walking skeleton: 2 agents → gateway stub → recorder → verify + determinism test", "sprint": 2, "track": "eng", "owner": "maya", "reviewer": "panel", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Thinnest end-to-end path on the frozen contracts before 25 Nov: two agent subprocesses send signed envelopes over Unix sockets, gateway stub runs the tick barrier, recorder writes C2, ks verify passes", "acceptance": ["2 agent subprocesses (no keys in-process, signer handle) → gateway stub → hash-chained record; ks verify exits 0 on the clean record and non-zero with first bad index after a one-line edit", "Determinism test in pytest: same seed run twice gives byte-identical record files", "Uses only src/ks/contracts/ types and the canonical serializer (no ad-hoc JSON); runs in CI-style one command"], "depends": ["CON-01"], "deliverable": "src/ks/", "summary": "Walking skeleton on contracts 1.1.0. 'PYTHONPATH=src python3 -m ks run --agents 2 --ticks 10 --seed S --key-mode fresh|repro [--repro-secret F] --out RUN' spawns the witness (uid 60000, own key in fresh mode) and N agents (uid 60001+i, PR_SET_DUMPABLE=0 set by the bootstrap after exec, clean env, close_fds, path-less socketpairs to gateway and signer), runs the tick barrier (one frame per conn FIFO, deadline -> no-op, EOF after 3 misses, execute in agent_id order), records every frame (hash chain, gw_sig, side store), pushes (seq, head, tick) to the witness each tick, kills by uid and prints the RunAnchor. Not root -> degraded mode, per-agent attribution printed VOID. 'ks verify RUN [--head A] [--json]': IO, anchor hashes, keyring, record pass (parse, seq, prev_hash, hash, gw_sig, agent sig vs sig_ok), witness pass (sig, count chain, truncated, heads), anchor vs last checkpoint; Exit codes and VerifyReport from contracts. Modules: ks.identity, ks.runtime, ks.gateway (stub: skel.noop/skel.echo only), ks.recorder, ks.witness, ks.verify, ks.cli, ks.world.skeleton. Tests: tests/skeleton, 18 (e2e anchored/unanchored, run-dir shape, line edit TAMPER first_bad, editor edit parse_error, deleted line seq_gap, truncation first_bad n+1, keyring swap caught only with --head, repro byte-identical, fresh equal under determinism_view with differing sigs, seed changes output, EACCES for agent uid, distinct agent uids, nothing left under run uids, shared-uid fallback, gateway admission paths, signer refusals, barrier deadline/FIFO/late_frame). Full suite 329 passed. ADR gaps found: see SKEL-01 hand-off (dumpable vs execve, no witness or sign-refusal frames, action_id vs nonce window, ADR-02 vs contract on no_state and tail truncation, degraded isolation invisible to verify, run_id vs determinism, final checkpoint vs strictly increasing ticks).", "review": "[panel · changes] ACs met on happy path; 329 green; 40 tamper cases (record/witness/keys/config, full re-forge, dir swap) all give correct reason+exit, keyring/config/prefix attacks caught only with --head as claimed; rogue agent uid 60001 gets EACCES on run dir, secret, /proc of gw+siblings, ptrace/kill; survivors killed by uid. MUST: M1 honest run fails verify --head (head_mismatch) when the witness acks the last tick late: anchor printed from tick n-1 while witness.jsonl has tick n; drain link / final checkpoint + test. M2 signer handle unbounded: junk-line flood kept 752k refusals (96 MB/6 ticks), ticks ms->0.8s on an oom_score_adj -1000 gateway; count refusals, per-tick line budget, EOF. Sprint 3: S1 degraded run verifies 'OK; anchored' (bind isolation into RunConfig); S2 --shared-uid as root runs agents as uid 0; S3 no conn->principal check; S4 verify semantic checks vs config. Maya's ADR gaps: real = dumpable/execve (solved), sign-refusal frame (most important), action_id window, no_state contract bug, degraded invisible, final checkpoint (worse: M1); docs-only = tail-truncation reason; fine = run_id, readiness, witness typing (1.2). Boundaries match Call #3 ownership; move gateway phases out of runtime/barrier, TOOLS behind world/state dispatch, rng out of runtime. Report: org/reports/PANEL-SKEL-01.md\n\n[pmo · done] Accepted with follow-ups: Panel M1/M2/S2/S3 → B3-36 (arjun), refactor seams → B3-37 (maya), S1 → B3-01, S4 → B3-15. Skeleton is the base for Sprint 3.", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 11:11", "who": "maya", "msg": "→ in_progress: Starting walking skeleton on contracts v1.1.0"}, {"t": "19 Nov 11:26", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 11:26", "who": "maya", "msg": "→ in_review: Skeleton built; 18 new tests, suite 329 green; ready for panel review"}, {"t": "19 Nov 11:35", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 11:38", "who": "pmo", "msg": "review: done"}]}, {"id": "B3-01", "title": "Contracts 1.2: witness frames, SignRefusal, isolation, decisions_from, reexec_invalid", "sprint": 3, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Additive contracts bump closing SKEL-01 findings 2-4 plus the contract parts of R3 and F9", "acceptance": ["Transport has WitnessInit/Pub/Files/Ready/Head/Close and SignRefusal{reason} (closed vocabulary) with round-trip + unknown-key tests; ks.witness and ks.identity use them (no ad-hoc dicts)", "RunConfig.isolation in {per_agent_uid, degraded} and VerifyReport.isolation exist; RunConfig.decisions_from: Hash|None is rejected with fault=rogue and with key_mode=repro (tests)", "VERIFY_REASONS gains reexec_invalid -> TAMPER; CONTRACTS_VERSION 1.2.0, schemas regenerated, golden hashes re-pinned with README changelog lines; full suite green"], "depends": [], "deliverable": "src/ks/contracts/", "summary": "Contracts 1.2.0, additive only (1.1 __all__ fully preserved; 11 exports added). transport: WitnessInit/Pub/Files/Ready/Head/Close (own union, decode_witness_frame, WITNESS_FILES_FDS=2) and SignRefusal{reason} with closed SIGN_REFUSAL_REASONS = signer_refusal() reasons + schema. C6: RunConfig.isolation in {per_agent_uid, degraded} (default degraded, in config_hash), VerifyReport.isolation echo (None only if config unreadable), RunConfig.decisions_from: Hash|None refused with fault=rogue and key_mode=repro; VERIFY_REASONS reexec_invalid -> TAMPER. ks.witness link/server and ks.identity signer use the contract frames (protocol.py keeps only HEADS_FILE; no ad-hoc dicts left); signer answers every refusal, agent template no-ops on SignRefusal; runtime sets isolation before spawn; verify echoes it and logs 'per-agent attribution VOID' when degraded. Schemas regenerated (/schema/1.2.0/, verified in sync with schema_gen), golden doc:run_config re-pinned (only change), README changelog 1.2.0. Tests: tests/contracts/test_contracts_12.py (43), signer refusal unit test updated, e2e isolation echo test. contracts+skeleton 373 passed; full suite 441 passed (incl. state/monitor WIP). Skeleton run --agents 2 --ticks 10 --seed 3 fresh + verify: OK, isolation per_agent_uid echoed. Left for owners: /proc readback abort (B3-10), X6 replay checks (B3-20), reexec_invalid detection (B3-25).", "review": "[kabir · done] Additive only (1.1 exports and reasons preserved). isolation is in RunConfig and so in config_hash, and VerifyReport echoes it. decisions_from is refused with rogue and with repro. SignRefusal is a frame with no envelope, so it cannot become a record. Witness frames use a separate strict union. Tests green.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 11:35", "who": "maya", "msg": "→ in_progress"}, {"t": "19 Nov 11:38", "who": "pmo", "msg": "Panel S1 confirmed in scope: RunConfig.isolation covered by config_hash; verify echoes it"}, {"t": "19 Nov 11:41", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 11:41", "who": "maya", "msg": "→ in_review: contracts 1.2.0 ready for kabir; suite 430 green"}, {"t": "19 Nov 12:23", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 12:23", "who": "maya", "msg": "→ in_review"}, {"t": "19 Nov 16:01", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-02", "title": "ADR errata for the 12 SKEL-01 findings", "sprint": 3, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Erratum blocks in ADR-00/01/02/03 and THREAT-MODEL repro row so ADR text matches contracts and the skeleton", "acceptance": ["Each of findings 1,5,6,7,8,9,10,11 has a dated 'Erratum (Call #3)' block in the owning ADR, worded exactly as CALL-03/maya-plan.md section 1", "ADR-01 section 8 points to the single admission order in ADR-03 section 1 (no second list)", "No erratum changes a CALL-02 resolution or a THREAT-MODEL claim; Kabir confirms by review"], "depends": ["SKEL-01"], "deliverable": "org/adr/", "summary": "Errata (SKEL-01) applied in place with dated 'Errata (Call #3)' blocks: ADR-00 (#1,5,11; #12 note), ADR-01 (#1,7,8; §8 now points to ADR-03 §1), ADR-02 (#5,6,9,10,11), ADR-03 (#7,8; single admission order), THREAT-MODEL (#1,6 repro). No code touched; no CALL-02 resolution or THREAT-MODEL claim changed.", "review": "[kabir · done] Erratum blocks present for findings 1,5-11 in ADR-00/01/02/03 and THREAT-MODEL. The body text matches maya-plan s1 (ADR-03 s1 is the single admission order and ADR-01 s8 points to it). No CALL-02 resolution or THREAT-MODEL claim changed. Nit, not blocking: the blocks are one-line pointers and the exact wording is in the section bodies.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 11:36", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 11:36", "who": "maya", "msg": "→ in_review"}, {"t": "19 Nov 16:01", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-03", "title": "ks.state: versioned object store", "sprint": 3, "track": "eng", "owner": "vikram", "reviewer": "maya", "model": "opus", "created_by": "maya", "status": "done", "outcome": "SQLite-backed versioned store per ADR-05: get -> (value, ver, author), history(obj), put with before/after versions", "acceptance": ["put/get/history round-trip with monotonic ver per object; put returns WriteEntry before/after ver+hash matching contracts C3", "put raises if a row value carries a sensitive key (each datum in exactly one object); field create/delete writes/tombstones field objects (test_sensitive_field_object)", "test_field_only_update_keeps_row_ver passes; store runs inside a caller-owned BEGIN IMMEDIATE txn"], "depends": ["B3-01"], "deliverable": "src/ks/state/", "summary": "src/ks/state/: SQLite versioned store per ADR-05 §1-2. objects(head) + append-only versions (UPDATE/DELETE triggers abort), values in a redactable side table in the same db (SqliteSideStore, C3 SideStore). Store implements StateView/StateWriter: put -> WriteEntry before/after ver+hash, ver+1 per object, tombstones (re-create continues counter), restore(expect=head) = new version by ks.recovery (StaleExpect / RedactedValue), visible_to=seq for M11c, history/heads/value_at. put refuses outside a caller-owned BEGIN IMMEDIATE txn, seq behind store, or 2nd write to an object at one seq; Store.txn() helper. FieldSchema (fields.py) is the B3-04 seam: sensitive-key rejection, field obj check, write_row splits rows and writes only changed objects (field-only edit keeps row ver; row create/delete writes/tombstones field objects). DB 0600. Completed interrupted attempt: lint, re-put of a redacted value re-populates side entry. tests/state: 20 passed; full suite 441 passed.", "review": "[maya · done] 20/20 tests pass. Checked against ADR-05 §1-2 and the C3 StateView/StateWriter/SideStore protocols: append-only versions (triggers), +1 per object, tombstones with the counter continuing, restore as a new version by ks.recovery (StaleExpect/RedactedValue), visible_to=seq (seq<r), history/heads/value_at, 0600 db and reopen persistence, sensitive-key rejection, and write_row changing only changed objects all match. put refuses outside a caller-owned BEGIN IMMEDIATE and enforces seq order, so it fits ADR-03 step 13. Non-blocking: (1) a later put of a value with a redacted hash revives the erased side entry, so erasure is undone by any identical write; B3-04/recorder should decide if that is acceptable. (2) get() raises RedactedValue on a redacted head instead of returning a marker; the planner must catch it. (3) state.db is separate from the record/seq store, so commit-then-append atomicity stays the gateway's job (ADR-03 step 14). (4) restore cannot delete a culprit-created object (to_ver>=1); the planner needs put(None) for that.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 11:34", "who": "maya", "msg": "Dependency on B3-01 is soft: the store needs no 1.2 field, start D1 on contracts 1.1.0 (keeps the critical path off the contracts bump)"}, {"t": "19 Nov 11:36", "who": "vikram", "msg": "→ in_progress: started: SQLite versioned store on contracts 1.1.0"}, {"t": "19 Nov 12:23", "who": "vikram", "msg": "posted result summary"}, {"t": "19 Nov 12:23", "who": "vikram", "msg": "→ in_review"}, {"t": "19 Nov 16:01", "who": "maya", "msg": "review: done"}]}, {"id": "B3-04", "title": "ks.state: read rule, field objects, state_digest, savepoints", "sprint": 3, "track": "eng", "owner": "vikram", "reviewer": "kabir", "model": "opus", "created_by": "maya", "status": "done", "outcome": "Reads record every object delivered (row + its field objects), digest for reconcile, savepoints for re-run simulation", "acceptance": ["test_row_read_includes_field_objects and test_row_read_lists_field_obj (R2 store side): whole-row reads and aggregates list the row plus every existing field object; a projection without the field lists the row only", "state_digest(fold(record)) equals the live store digest after a scripted 30-write sequence", "savepoint/rollback API: a nested simulate() block leaves the store digest unchanged"], "depends": ["B3-03"], "deliverable": "src/ks/state/", "summary": "Review fixes (kabir). (1) savepoint()/simulate() now install a SQLite authorizer while open: BEGIN/COMMIT/ROLLBACK/SAVEPOINT/RELEASE issued on store.conn inside the block raise sqlite3.DatabaseError 'not authorized', so simulated code cannot persist its writes or drop the caller's. Backstop: if the txn/savepoint is gone on exit anyway, StateError (no silent return); txn() also raises StateError if the block ended the transaction. (2) Chose persist-and-refuse over required fields= (keeps tara's API; catches drift whatever the caller passes): sensitive_fields stored in meta on first open; reopen with a different FieldSchema -> StateError; fields=None adopts the persisted list; db with objects but no stored list -> StateError. (3) read() does tuple(project). Caller-visible changes: transaction-control SQL inside savepoint/simulate is refused; open_store/Store raise StateError on field-list mismatch; FieldSchema gains entries() and value equality. Signatures unchanged. Regressions: tests/state/test_b304_review.py (16 tests, probe cases incl.). tests/state+contracts 406 passed; full suite (excl. in-progress tests/world) 480 passed.", "review": "[kabir · changes] All 3 acceptance criteria are met by tests that fail if the property breaks (test_row_read_includes_field_objects/_lists_field_obj incl. projection property loop, test_state_digest_fold_30_writes incl. visible_to prefixes, test_dryrun_savepoint). tests/state+contracts 389 passed. Two holes to fix, each with a regression test: (1) LEAK store.py:223-225 _rollback_savepoint returns silently if the txn is gone. Probe: COMMIT issued inside simulate() persists the simulated write (iban=EVIL, digest moved), no error. ROLLBACK inside simulate() within a caller txn silently drops the caller's kept writes; the only symptom is an OperationalError at txn COMMIT (store.py:188). Fix: simulate/savepoint raise StateError('transaction ended inside savepoint') when not in_transaction at exit. (2) READ-RULE HOLE store.py:161/427: fields defaults to empty and is not persisted. Store written without fields=, reopened with suppliers.iban: read(S17) returns iban with read_set=[row] only. Fix: store sensitive_fields in meta and refuse a mismatch on open (like schema, store.py:166-170), or require fields=. Minor: read() consumes a generator project twice (store.py:247 then :264), so it returns {} while listing iban. Safe direction, but do tuple(project) as read_table does (:273).\n\n[kabir · done] Re-review: all 3 findings fixed with regression tests (tests/state/test_b304_review.py). tests/state+contracts 406 passed. Bypass probe (30 cases, simulate() alone and inside a caller txn): executescript COMMIT/SELECT, conn.commit()/rollback(), autocommit=True, isolation_level changes, END TRANSACTION, RELEASE ks_sp_1 all refused 'not authorized'; second connection gets 'database is locked'; a TEMP trigger RAISE(ROLLBACK) is caught by the StateError backstop. No simulated write reached disk and caller writes were kept. Field pinning: opened without fields then with fields -> StateError; legacy db with objects but no meta row -> StateError (also with fields=None); empty legacy db pins; order/duplicates compare equal; fields=None adopts the stored list and lists iban. Residual, not blocking: code that calls conn.set_authorizer(None), COMMITs and re-creates SAVEPOINT ks_sp_N persists writes silently. In-process code is trusted (agents never hold the conn), so this guard catches bugs, not malice; describe it that way. Minor: _end_savepoint sets the authorizer to None, which clobbers any authorizer the caller had installed.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 16:01", "who": "vikram", "msg": "→ in_progress: started: read rule, digest, savepoints"}, {"t": "19 Nov 16:06", "who": "vikram", "msg": "posted result summary"}, {"t": "19 Nov 16:06", "who": "vikram", "msg": "→ in_review: read rule, digest/fold, savepoints done; tests/state 36 green"}, {"t": "19 Nov 16:20", "who": "kabir", "msg": "review: changes"}, {"t": "19 Nov 16:20", "who": "vikram", "msg": "→ in_progress: fixing kabir's 2 findings"}, {"t": "19 Nov 16:23", "who": "vikram", "msg": "posted result summary"}, {"t": "19 Nov 16:23", "who": "vikram", "msg": "→ in_review: Fixed kabir's 3 findings with regression tests; ready for re-review"}, {"t": "19 Nov 16:25", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-05", "title": "ks.world: 10 agents, F2+ scenario, per-agent view builder", "sprint": 3, "track": "eng", "owner": "tara", "reviewer": "maya", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Pure agent functions f(seed, tick, view) -> <=1 envelope for the 10 ADR-06 roles, plus the scenario seed data and TickFrame.view builder", "acceptance": ["10 agents in agent_id order, RNG = sha256(canonical([seed,name,tick])); same seed twice -> identical envelope sequence (test)", "View builder returns <=MAX_VIEW_ENTRIES ViewEntry per agent from the scenario scope; triage's view lists suppliers:S-17, not .iban (test_triage_view_excludes_iban)", "Supplier registry and tick-0 prices present so invariants are non-vacuous (test_registry_nonvacuous)"], "depends": ["B3-03"], "deliverable": "src/ks/world/", "summary": "ks.world.registry (supplier master, valid IBANs, tick-0 prices), ks.world.agents (10 pure agents step(agent,seed,tick,view,Schedule), faults f1/f2/f2plus/_c/_x/f3/f4/f7 on culprit slot, QUIET_TICKS hero guard), ks.world.scenario (seed_state, SCOPES, build_view(store,agent,visible_to), open_world_store). Tests tests/world/test_world.py: determinism, test_triage_view_excludes_iban, test_view_respects_visibility, test_registry_nonvacuous, hero chain, test_hero_precondition_guard, F2+x. Note for vikram: seed writes need a seq>=1 and author ks.gateway; a seed at seq 1 collides with record seq 1 (one write per object per seq), so the gateway must start action seqs after the seed or seed at a reserved seq.", "review": "[maya · done] All 3 acceptance items have tests that would fail if broken: determinism (same seed twice -> identical (tick,agent,tool,args) sequence over 60 ticks, different seed differs; RNG via ks.rng per (seed, world/<agent>, tick)), test_triage_view_excludes_iban (+ billing does see .iban, <=MAX_VIEW_ENTRIES, sorted), test_registry_nonvacuous (checksum-valid master IBANs, attacker IBAN valid and not in master, tick-0 prices, seeded IBAN as its own field object). Hero chain, F2+c guard and F2+x are good extras. ks.world imports no ks.runtime (AST test). Nits for later, not blocking: the t+1000/t+2000 tick offsets in draw_int reuse a consumer name at a shifted tick; use distinct names (world/crm/tier) per ADR-06-metrics M1. F5 is not an agent fault (injector side), so it is fine that it is missing from FAULTS. DECISION D-SEQ1 (also in src/ks/ARCHITECTURE.md): record seq 1 is the seed record, a gateway-authored ks.gateway record at tick 0 whose write_set is exactly seed_state(store, seq=1). Agent action seqs start at 2; the tick-1 view has visible_to=2. Seeding at seq 0 is rejected, because it needs a schema change and leaves seed versions without a record to verify against. ks.state is unchanged. nisha appends the seed record in B3-11. Until then the harnesses use the same numbering.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 16:21", "who": "tara", "msg": "→ in_progress: started: registry, agents, scenario/view, tools"}, {"t": "19 Nov 16:24", "who": "tara", "msg": "posted result summary"}, {"t": "19 Nov 16:24", "who": "tara", "msg": "→ in_review: ready"}, {"t": "19 Nov 16:25", "who": "maya", "msg": "review: done"}]}, {"id": "B3-06", "title": "ks.world: catalogue tool adapters with read/write sets", "sprint": 3, "track": "eng", "owner": "tara", "reviewer": "maya", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Every ADR-06 catalogue tool executes over ks.state inside the gateway txn and returns its read_set/write_set and class", "acceptance": ["All catalogue tools (R, C, I1, I2) implemented; test_catalogue_covers_world: every tool an agent can emit has an adapter and a class", "Each adapter's read_set/write_set equals the objects it touched (property test over 200 random calls)", "I1 tools (payments.send, comms.send_email) never execute inline; they return an outbox enqueue request"], "depends": ["B3-03", "B3-04"], "deliverable": "src/ks/world/tools.py", "summary": "Review fixes. tools.py: _Ctx accepts only WorldTxn (bare Store -> TypeError, no last_seq fallback); put_plain reuses the value already read (no store.get); WorldDispatcher.view requires .store and .visible_to (TypeError otherwise, None -> ()). Public names unchanged. Tests: spy now raises on store.get/heads/history/value_at/read_table; Maya's store.get mutation added as a must-fail regression; bare-Store rejection; view via WorldDispatcher hides a same-tick write; dead branch removed.", "review": "[maya · changes] Catalogue, classes, I1/I2-as-OutboxRequest-with-no-writes and the write-set half of the property test are good (write_set vs head diff would catch a missed or extra write). Three changes: (1) BLOCKING, read-set half is tautological. _Spy only intercepts store.read, so an adapter that reads via c.store.get/heads/history/value_at gets an empty read_set and the test still passes. I checked this by mutation: billing.draft_invoice reading the supplier via c.store.get (lost taint edge to S-17.iban) -> all tests green. Fix: adapters may touch state only via _Ctx.read/put_row/put_plain. put_plain must reuse the value already read, not call store.get. The spy must raise on any other read API (get, heads, history, value_at, read_table) during execute. Add that mutation as a regression check (e.g. a deliberately bad adapter in the test must fail). (2) M2: WorldDispatcher.view silently uses visible_to=None (all heads) when given a bare Store. Require a snapshot with .store and .visible_to (TypeError otherwise; None state -> ()) and add a test through WorldDispatcher.view that a same-tick write is invisible. See ARCHITECTURE.md 'Views (M2)'. (3) Remove the bare-Store fallback in _Ctx (seq = last_seq+1). Seq is assigned by the gateway at BEGIN IMMEDIATE (G5), never by a tool. Accept only WorldTxn. Nits: the dead 'if tool == inventory.adjust: pass' in the property test. Records/hashes: OK (payloads are raw only in OutboxRequest, which the gateway hashes into the side store).\n\n[maya · done] Re-review: all three changes are in. (1) The spy raises on get/heads/history/value_at/read_table. I re-ran my mutation directly on tools.py (draft_invoice reading the supplier via c.store.get): test_sets_equal_touched_objects_property now FAILS, and test_bad_adapter_reading_via_store_get_fails pins it. put_plain reuses the value already read. (2) WorldDispatcher.view requires .store and .visible_to (TypeError otherwise, None -> ()); the same-tick write is invisible through the dispatcher (tested). (3) _Ctx takes only WorldTxn; bare Store gives TypeError (tested). 15 world tests, full suite 515 passed. Nit for B3-11 (nisha), not blocking: view accepts visible_to=None on a snapshot, which falls back to all heads. The gateway must pass the int first seq of the tick (D-SEQ1: tick 1 -> 2); tighten to require an int when B3-11 builds the snapshot. Runtime impact: none today, the gateway passes state=None and txn=None; B3-11 builds WorldTxn/snapshot inside the gateway.\n\n[maya · done] Re-review: all 3 findings fixed. (1) _Spy now raises on get/heads/history/value_at/read_table; I re-ran my store.get mutation plus heads/history/value_at/read_table variants on draft_invoice: all 5 caught. Regression test present. No adapter touches c.store directly (grep). (2) WorldDispatcher.view: TypeError without .store/.visible_to, None -> (), same-tick-write test passes. (3) _Ctx accepts only WorldTxn. Full suite 515 passed, 8 skipped. Follow-ups (non-blocking, fold into B3-41): the spy is a blocklist, so an adapter reading via store.conn (raw SQL) or store.state_digest still yields an empty read_set and passes. Switch _Spy to an allowlist (read, put, write_row only). A closure over a module-level Store bypasses any spy, so add an AST check that adapter functions reference state only via c.read/put_row/put_plain. Nit: WorldTxn annotates Store without importing it (works only because of the __future__ import). B3-10 compatibility: runtime never calls view/execute directly; the gateway passes state=None (-> ()) and the world is capped at 1 idle tick, so no change needed.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 16:21", "who": "tara", "msg": "→ in_progress: started with B3-05"}, {"t": "19 Nov 16:24", "who": "tara", "msg": "posted result summary"}, {"t": "19 Nov 16:24", "who": "tara", "msg": "→ in_review: ready"}, {"t": "19 Nov 16:26", "who": "maya", "msg": "review: changes"}, {"t": "19 Nov 16:31", "who": "tara", "msg": "posted result summary"}, {"t": "19 Nov 16:31", "who": "tara", "msg": "→ in_review: review fixes applied"}, {"t": "19 Nov 16:33", "who": "maya", "msg": "review: done"}, {"t": "19 Nov 16:33", "who": "maya", "msg": "review: done"}]}, {"id": "B3-07", "title": "ks.monitor: detector catalogue over records (fixtures)", "sprint": 3, "track": "eng", "owner": "nisha", "reviewer": "maya", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Pure-function detectors from ADR-04 section 1, emitting Alerts that are submitted as ks.alert envelopes (F6)", "acceptance": ["beneficiary_changed_then_paid, IBAN invariant, price bound and inv.pii_egress fire on fixture records and stay silent on the clean fixture", "Each Alert carries evidence_seqs and evidence_versions; test_hard_table pins hard/soft to the C4 validator", "Alert -> ks.alert envelope helper (args = alert.to_obj()); monitor never reads RunConfig fault/culprit (AST guard)"], "depends": ["B3-01"], "deliverable": "src/ks/monitor/", "summary": "src/ks/monitor/ (model, detectors, attribute, alerts, ibanlib): ADR-04 catalogue as pure fns over C2 records + StateView + side store: iban_checksum, beneficiary_changed_then_paid (payee field object only), price_vs_history (soft), ledger_balance, scope, sig (conn only), reconcile (names nobody), witness_stall (never hard), pii_egress, barrier.deadline (conn only, empty evidence). kind/hard come from the C4 tables (DETECTOR_KIND/HARD_DETECTORS); Alert validator enforces. attribute(): [0]=writer of evidence_versions, bounded backward walk over recorded read sets (depth 3, <=5), suspect() re-derives writers: >=2 or none or read-reached => no suspend. alert_envelope() builds ks.alert (args=alert.to_obj()). 37 tests in tests/monitor incl. RT9 [crm, intake], anti-framing, test_hard_table, AST guard (no RunConfig/fault/culprit). rate and tamper not built (not in scope of this issue). Full suite 366 passed.", "review": "[kabir · done] Anti-framing holds. root_candidates[0] is the writer of the evidence version. suspect() re-derives writers from the records and suspends only when there is exactly one writer and it equals [0], so read-reached agents and 2+ writers are never suspended. kind/hard come from the C4 tables and test_hard_table pins them. barrier.deadline carries a conn only. Tests green.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 11:34", "who": "maya", "msg": "Dependency on B3-01 is soft: detectors run on 1.1.0 fixtures from D1"}, {"t": "19 Nov 11:35", "who": "nisha", "msg": "→ in_progress: started"}, {"t": "19 Nov 11:40", "who": "nisha", "msg": "posted result summary"}, {"t": "19 Nov 11:40", "who": "nisha", "msg": "→ in_review: ready for review"}, {"t": "19 Nov 16:01", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-08", "title": "ks.witness: witness-owned witness.jsonl, fd handover, 1.2 frames, per-tick idempotency", "sprint": 3, "track": "eng", "owner": "arjun", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "Witness file ownership and handover per erratum (findings 5, 11) and Kabir's owner item", "acceptance": ["witness.jsonl is owned by the witness uid, mode 0600, created at RunDir.create and handed over as an O_APPEND fd; gateway holds no write fd after attach (test, run as root)", "Link uses contracts 1.2 witness frames only", "A repeated push of the same (seq, head, tick) returns the existing checkpoint without a new line; ticks in witness.jsonl strictly increase (test)"], "depends": ["B3-01"], "deliverable": "src/ks/witness/", "summary": "Re-run in container (killswitch:arjun, --network none): tests/witness + tests/panel 9 passed, incl. witness_file_owned_by_witness_uid_mode_0600_and_gateway_holds_no_fd and shared_uid_run_as_root_uses_one_unprivileged_uid. Fix: _fds_on skips vanished fds, matches by dev/ino (dup/O_PATH counted); injected leak was caught then reverted; no leak left in src diff. Native full suite: 515 passed, 8 skipped.", "review": "[kabir · done] Accept. Suite 506 passed / 6 skipped. fd handover: os.open fds are non-inheritable, attach() closes both in finally, no dup anywhere; the root test checks /proc/self/fd after attach (correct by reading). Residual, not a defect: the gateway is uid 0 and can reopen witness.jsonl by path (CAP_DAC_OVERRIDE). THREAT-MODEL already puts gateway root compromise out of scope, and verify catches forged lines (witness sig, heads vs records). Idempotency: the same (seq,head,tick) returns the existing cp with no line; a second head for the same tick or an earlier tick gets no ack. FOLLOW-UP (non-blocking, open an issue): Witness.push accepts the SAME seq with a DIFFERENT head at a later tick (probe: push(2,H2,4) then push(2,H3,5) is signed). That is witness equivocation. verify's heads-vs-records pass catches it, but the witness should refuse m.seq==last.seq and m.head!=last.head. UNEXECUTED: test_witness_file_owned_by_witness_uid_mode_0600_and_gateway_holds_no_fd is Linux-root-only. It must pass in the container before the wave's demo.\n\n[kabir · done] Test-only fix reviewed and re-run. Container (killswitch:kabir, OrbStack arm64): tests/witness + tests/panel 9 passed. Vacuity check: ids cannot be empty (os.stat raises if a path is missing), and match is by dev/ino, so a different realpath cannot hide an fd. Positive control in container: plain, dup-only, O_PATH, witness-heads dir, heads child file, and hardlink-under-other-path fds all CAUGHT; baseline empty. Nit (non-blocking): if os.readlink raises a non-FNF OSError, 'link' is stale from the previous iteration or unbound; set link='' in that branch.", "log": [{"t": "19 Nov 11:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 16:23", "who": "arjun", "msg": "→ in_progress: start"}, {"t": "19 Nov 16:23", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 16:23", "who": "arjun", "msg": "→ in_review: ready"}, {"t": "19 Nov 16:30", "who": "kabir", "msg": "review: done"}, {"t": "19 Nov 16:41", "who": "pmo", "msg": "→ changes: Container run (OrbStack, root): test_witness_file_owned_by_witness_uid_mode_0600_and_gateway_holds_no_fd FAILS with FileNotFoundError on /proc/self/fd/14 (listdir's own fd, closed before readlink); ownership/mode asserts passed."}, {"t": "19 Nov 17:25", "who": "arjun", "msg": "posted result summary"}, {"t": "19 Nov 17:25", "who": "arjun", "msg": "→ in_review: Container-verified; ready for kabir"}, {"t": "19 Nov 17:26", "who": "kabir", "msg": "review: done"}]}, {"id": "B3-09", "title": "ks.recorder: txn semantics and GatewayHooks", "sprint": 3, "track": "eng", "owner": "arjun", "reviewer": "kabir", "model": "sonnet", "created_by": "maya", "status": "done", "outcome": "seq taken at txn start, append after commit, crash-between aborts and verify reports RECONCILE; RT8(g) hook", "acceptance": ["test_crash_commit_append: kill between commit and append -> run aborts, verify RECONCILE, never silent", "GatewayHooks.skip_checkpoint and between_check_and_txn exist and are no-ops by default (test)", "At most one checkpoint per tick; a stalled tick is witness_ack=false in timing.jsonl (test_hung_witness)"], "depends": ["B3-03"], "deliverable": "src/ks/recorder/", "summary": "ks.recorder: Recorder.begin() reserves seq at txn start (RecorderTxn.append after state commit / rollback frees i
