<style>
/* VOICE: a calm engineering-org war room; facts first, status at a glance.
   IDEA: an incident flight recorder — a red tab, a strip chart of progress, cards like log entries.
   PICTURE: the kanban itself under a progress strip of sprints with counts.
   COLOUR and TYPE: white, ink #121212, kill-switch red #e3120b, slate #2e6f8e, pale panels #e3ecf0; Source Serif 4 + Inter.
   LAYOUT: red tab, headline, figures row, sprint strip, board, then team, calls, decisions, activity. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#10191e);--ink:light-dark(#121212,#e9eef1);--mut:light-dark(#5b6670,#9fb0bb);--red:#e3120b;--sl:light-dark(#2e6f8e,#6fb3d3);--pan:light-dark(#e3ecf0,#18252c);--pan2:light-dark(#f2f6f8,#142027);--rule:light-dark(#cfd9de,#2a3a43);--ok:light-dark(#1f7a4d,#5cc38c);--warn:light-dark(#a35b00,#f0a640)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3.4vw,48px) max(5vw,16px)}.wrap{max-width:1240px;margin:0 auto}
h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,50px)}h2{font-size:clamp(24px,3vw,32px);margin-bottom:14px}
.tab{display:inline-block;background:var(--red);color:#fff;font-weight:600;font-size:13px;padding:5px 10px;margin-bottom:14px}
.lede{font-size:17px;max-width:70ch;color:var(--ink);margin:12px 0 0}.mut{color:var(--mut)}.small{font-size:13px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:22px}
.fig1{background:var(--bg);padding:12px 14px}.fig1 b{display:block;font:600 clamp(26px,4vw,36px)/1.1 "Source Serif 4",serif}.fig1 span{font-size:13px;color:var(--mut)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:22px}
.sp{background:var(--pan2);padding:12px;border-top:4px solid var(--rule)}.sp.active{border-top-color:var(--red);background:var(--pan)}.sp.done{border-top-color:var(--ok)}
.sp h3{margin:0;font-size:15px}.sp p{margin:4px 0 8px;font-size:13px;color:var(--mut)}
.meter{height:8px;background:var(--rule)}.meter i{display:block;height:100%;background:var(--sl)}.sp.done .meter i{background:var(--ok)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 12px}

:focus-visible{outline:3px solid var(--sl);outline-offset:2px}
.kb{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--pan2);padding:10px;min-height:120px}.col h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.card{background:var(--bg);border:1px solid var(--rule);padding:10px;margin-bottom:8px;cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit;min-height:auto}
.card:hover{border-color:var(--sl)}.card .id{font-size:12px;color:var(--mut);font-weight:600}.card .t{font-weight:500;font-size:14px;line-height:1.35;margin:3px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:12px;padding:1px 6px;background:var(--pan);white-space:nowrap}
.m-opus{color:var(--sl);font-weight:600}.m-fable{color:var(--red);font-weight:600}.m-sonnet{color:var(--ok);font-weight:600}.m-haiku{color:var(--warn);font-weight:600}
.st-changes,.st-blocked{border-left:4px solid var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}th{font-weight:600;color:var(--mut);font-size:13px}
.meet{border-top:1px solid var(--rule);padding:12px 0}.meet summary{cursor:pointer;font-weight:600;min-height:32px}.meet ul{margin:6px 0;padding-left:20px}
.feed{list-style:none;margin:0;padding:0}.feed li{padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}.feed time{color:var(--mut);font-size:12px;white-space:nowrap;margin-right:8px}
dialog{max-width:720px;width:calc(100% - 24px);border:0;padding:0;background:var(--bg);color:var(--ink);box-shadow:0 10px 40px #0006}
dialog .in{padding:20px;max-height:80vh;overflow:auto}dialog::backdrop{background:#0008}
pre{white-space:pre-wrap;font-size:13px;background:var(--pan2);padding:10px;overflow-x:auto}
.dates{list-style:none;padding:0;margin:0}.dates li{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}.dates b{white-space:nowrap;width:6.5em;flex:none}.hard b{color:var(--red)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}.live i{width:9px;height:9px;border-radius:50%;background:var(--red);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.live i{animation:none}}
.scroll{overflow-x:auto}
@media(max-width:1000px){.kb{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.kb{grid-template-columns:minmax(0,1fr)}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mut)}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

</main>

hanges.\n1. TTI is weakest on hero F2: a wrong IBAN is an in-scope, normal-rate write, so rule/rate monitors miss it. Add data-invariant detectors; report detect vs attribute separately.\n2. TTC is mis-defined (it ends when the culprit stops). Redefine as alert -> first denied envelope + post-alert tainted effects + irreversible tainted releases (target 0).\n3. Recovery holes: a write-write conflict clobbers honest later edits (restore only if current == culprit's after-version); re-runs can re-fire email/payments (dedupe through outbox idempotency keys).\n4. Jury breaks: gateway bypass/key theft in single process (fix: subprocess per agent + state=fold(log) reconciliation); tail truncation (witness checkpoints); honest consumer pays bad IBAN (lineage hold, RES-02 s5); false positive has no undo (suspend before revoke, release path); TOCTOU (epoch fencing, gateway-assigned seq).\n5. Cut LLM mode, Dolt, Merkle, SPIFFE from the finale. Hero = F2+ (IBAN + price x10, with a conflict case), also run with hold=0 to show honest residual damage.\n6. Framing: provenance-first. Identify, contain, recover = three queries on one graph; selective undo is the payoff shown in the demo, not the sole headline (RES-05 crowding, RES-07 single-agent incidents).", "log": [{"t": "19 Nov 00:34", "who": "maya", "msg": "opened"}, {"t": "19 Nov 00:34", "who": "maya", "msg": "→ in_progress: drafting"}, {"t": "19 Nov 00:35", "who": "maya", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "maya", "msg": "→ in_review"}, {"t": "19 Nov 00:39", "who": "panel", "msg": "review: changes"}]}, {"id": "RES-01", "title": "Selective undo & intrusion recovery prior art (Retro, Warp, Aire)", "sprint": 1, "track": "research", "owner": "meera", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "Know which selective-undo mechanisms (action history graph, dependency tracking, selective re-execution) transfer to an LLM agent network and where they break", "acceptance": ["≥5 primary sources with URLs, including Retro (OSDI'10) and Warp (SOSP'11) papers", "Table comparing ≥4 systems on: what is recorded, how dependencies are tracked, how legitimate work is preserved, handling of non-determinism, overhead", "Explicit analysis of what breaks when the 're-executed' actor is a non-deterministic LLM agent", "'Implications for our design' section naming the minimal dependency data our Recorder must capture"], "depends": [], "deliverable": "research/RES-01.md", "summary": "Retro (OSDI'10), Warp (SOSP'11), Aire (SOSP'13, not OSDI'14) and Taser (SOSP'05) all undo one actor's damage while keeping later legitimate work, via a recorded dependency graph + taint + selective rollback/re-execution. Hypothesis H1 half holds: graph and selective rollback transfer; replay-based re-execution does not, since LLM agents are non-deterministic (Warp/Aire rely on recording non-determinism; Taser/Retro sidestep it).\nAll systems hit external effects and pause for a human or send a compensating message (link to RES-02). Aire's authorized-repair model is the relevant precedent for who may trigger undo. Taser's separate log backend is the precedent for logs agents cannot edit.\nTop design implication: Recorder must store per action: agent_id + delegation/authority, write set with before/after hashes, READ SET WITH VERSIONS READ (incl. other agents' outputs), message IDs on both sides, effect class. Recovery = taint forward, revert tainted versions, hand work back to agents to re-plan with approval; do not replay LLMs.\nCaveats: GoEx read at abstract level only; Retro venue not shown in fetched PDF; numbers extracted via fetch tool, spot-check.", "review": "[anaya · done] DONE. All 4 criteria met (5 primary sources, 5-system table, s.4 non-determinism analysis, minimal Recorder field list). Strongest finding: graph + taint + selective revert transfer; replay-based re-execution does not, so repair = taint, quarantine, revert, re-plan with approval. H1 REFINED (half holds).\nSpot-check: Retro venue confirmed OSDI 2010 (dblp conf/osdi/KimWZK10, USENIX osdi10 page) - drop the 'venue per PLAN.md' hedge.\nSynthesis must carry: (1) overhead numbers (Warp 24-27%, Aire 19-30%, Retro 89-127%) were tool-extracted and are NOT in RES-10 scope - quote only after a PDF check; (2) soften 'none covers a multi-agent setting': Aire repairs across independent services with authorized repair messages, the closest precedent to multi-agent, say so; (3) GoEx read at abstract level only, do not characterise its internals.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "meera", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:35", "who": "meera", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "meera", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-02", "title": "Compensation, sagas & irreversible actions: a reversibility taxonomy for agent effects", "sprint": 1, "track": "research", "owner": "meera", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A reversible/compensable/irreversible taxonomy of agent actions with the recovery strategy and pre-execution gate each class needs", "acceptance": ["≥5 primary sources with URLs (e.g. Sagas 1987 paper, GoEx arXiv 2404.06921, event-sourcing/compensating-transaction docs)", "Taxonomy table: action class × example agent actions × recovery strategy (restore/compensate/re-execute/quarantine/none) × what must be logged beforehand", "Worked example: agent A's bad write consumed by agent B — options for B's dependent work and their trade-offs", "'Implications for our design' section covering Recovery and pre-execution gating in Containment"], "depends": [], "deliverable": "research/RES-02.md", "summary": "Reversibility taxonomy (R / C / I1 containable / I2 uncontainable / U unmediated) with recovery strategy and pre-action logging per class; 10 sources (Sagas 1987, GoEx, MS saga/compensation/event-sourcing docs, Temporal, Atomix, Cordon, State Footprints). Sagas paper itself says compensation does not notify transactions that already read partial results: that is our 'B consumed A's write' case, and no source solves it. Worked example gives 6 options for B's dependent work. Surprise: 2026 preprints (Atomix, Cordon) already do effect classes and outbox gating, but per task, not per agent. Top implication: Recorder must capture class, compensator, and read/write sets at action time; Containment must gate unclassified/irreversible calls in an outbox before execution.", "review": "[anaya · done] DONE. All 4 criteria met (10 sources, R/C/I1/I2/U taxonomy with pre-logging column, 6-option worked example, Recovery + gating implications). Strongest finding: Sagas (1987) admit compensation makes no effort to notify transactions that already read partial results - exactly our 'B consumed A' case, unsolved in the literature. H2 CONFIRMED and REFINED (3 classes -> 5; class is per action instance, not per tool).\nCorrection for synthesis: TL;DR bullet 1 over-claims ('every undo mechanism classifies before it runs'): Retro/Warp/Taser/Aire (RES-01) discover external effects at repair time. Safe wording: transactional and agent-runtime designs (Sagas, Cordon, Atomix) classify up front, and we argue we must.\nCarry: Sagas venue is ACM SIGMOD 1987 (fill in); Atomix/Cordon/State Footprints are 2026 preprints read at abstract level, existence pending RES-10; Cordon 45/45 vs 14/45 is the authors' own benchmark. Worked-example option 3 ('re-execute B') conflicts with RES-01 'do not replay LLMs' - resolve at Call #1.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "meera", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:35", "who": "meera", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "meera", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-03", "title": "Per-agent identity & delegation on every action (SPIFFE, OAuth token exchange, MCP auth, IETF agent drafts)", "sprint": 1, "track": "research", "owner": "rohan", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A recommended scheme that binds every action to one agent identity, through delegation chains and shared tools, and can be revoked fast", "acceptance": ["≥5 primary sources with URLs (specs/RFCs/drafts with version: SPIFFE, RFC 8693, MCP authorization spec, draft-klrc-aiagent-auth, RFC 9421 or similar)", "Table comparing ≥4 approaches on: granularity (workload vs action), delegation chain support, non-repudiation, revocation latency, prototype effort", "Explicit analysis of where attribution collapses (shared MCP server / service credentials) and how to keep it", "'Implications for our design' section with a recommended identity + action-signing scheme for Identity and Containment"], "depends": [], "deliverable": "research/RES-03.md", "summary": "Correction: 12 primary sources (not 13). Workload identity (SPIFFE/WIMSE) identifies a process, not an action; RFC 8693 treats prior actors in an act chain as informational only; MCP forbids token passthrough so upstream APIs see the MCP server, not the agent, which is where attribution collapses. SPIRE docs read show short TTLs (1h X.509, 5m JWT) and node ban but no SVID revocation. klrc-03 (Jul 2026) is the live IETF draft; txn-tokens-for-agents-05 and pedigree-00 are expired single-author drafts; none defines fast revocation alone. Top design implication: SPIFFE-format agent ID + RFC 8693-style act chain + per-agent Ed25519 signed action record, all via a tool gateway that writes the record and holds a deny-list (immediate containment), with short TTLs bounding the rest.", "review": "[anaya · done] DONE. All 4 criteria met (12 primary sources with versions/dates, 7-approach table on all 5 dimensions, 5 named collapse points, concrete scheme). Strongest finding: the MCP spec itself guarantees the attribution gap - spot-checked, draft authorization page says verbatim 'MCP servers MUST NOT accept or transit any other tokens' - so upstream sees the MCP server, not the agent; attribution must be written at our gateway. H3 CONFIRMED.\nCarry: (1) 'SPIRE has no SVID revocation' is 'not found in docs read', keep that hedge; (2) cascade revocation idea comes from an expired single-author draft (pedigree-00), label as our design; (3) gateway-only attribution is a stated limit when the upstream takes one service credential - say it to the jury, do not hide it; (4) dual signing (agent + gateway) is our view, decide in the Identity ADR whether it earns its complexity.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:34", "who": "rohan", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:35", "who": "rohan", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "rohan", "msg": "→ in_review"}, {"t": "19 Nov 00:35", "who": "rohan", "msg": "posted result summary"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-04", "title": "Action record schema: OpenTelemetry GenAI conventions + tamper-evident log", "sprint": 1, "track": "research", "owner": "rohan", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A draft per-action record schema mapped to OTel GenAI attributes, with the gaps (state read/write sets) and a tamper-evidence mechanism chosen", "acceptance": ["≥5 primary sources with URLs, including the official OTel GenAI semconv spec (with version/stability status) and RFC 9162 or Sigstore Rekor/Trillian docs", "Field table: proposed action-record field × OTel attribute if one exists (or 'gap') × why TTI/TTC/recovery needs it", "Comparison of ≥3 tamper-evidence options (hash chain, Merkle log, transparency log) on guarantees, verification cost, prototype effort", "'Implications for our design' section for Recorder and Monitor"], "depends": [], "deliverable": "research/RES-04.md", "summary": "OTel GenAI conventions (agent/tool spans, gen_ai.agent.id, tool.call.*, conversation.id) cover who called what, but have NO state read/write, effect-class, delegation or causal-edge fields: those are our gap fields (ks.*). All gen_ai.* still Development; spec moved to semantic-conventions-genai repo in Jun 2026 (no release found); execute_tool span details unverified (repo docs not fetchable).\nTamper-evidence: chose per-agent hash chain inside an RFC 9162-style Merkle log with Ed25519 signed checkpoints published outside agents' reach; hash chain alone fails against full rewrite; Rekor/Trillian too heavy for prototype.\nReport has 19-field draft record, 3-option comparison, Recorder and Monitor implications.\nTop design implication: the gateway (not the agent) writes records including read_set/write_set/caused_by, since these enable selective rollback and blast-radius at detection time.", "review": "[anaya · done] DONE. All 4 criteria met (OTel spec with Development status and repo move, RFC 9162, 19-field table with OTel attr/gap/why, 3-option tamper comparison, Recorder + Monitor implications). Strongest finding: gen_ai.* has no read/write-set, effect-class, delegation or causal-edge fields - span tree gives call order, not data dependency. H4a CONFIRMED. H4b CONFIRMED with RES-07 evidence (Replit agent misreported rollback; Claude Code #10077 reporter states the tool_use command was never logged - spot-checked).\nSpot-check: opentelemetry.io page confirms 'moved' to open-telemetry/semantic-conventions-genai, sidebar 1.45.0, no stability shown.\nCarry: agent-span requirement levels came from a third-party mirror of an older commit and execute_tool levels are unverified - pin a commit before Sprint 2; the 12 Jun 2026 / v1.42.0 move date is secondary; Crosby & Wallach 3100 B vs 800 MB numbers are 2009 prototype figures and NOT in RES-10 scope - check PDF before quoting.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:34", "who": "rohan", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:36", "who": "rohan", "msg": "posted result summary"}, {"t": "19 Nov 00:36", "who": "rohan", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-05", "title": "OSS survey: agent observability, guardrails & policy engines — reuse vs. missing", "sprint": 1, "track": "research", "owner": "leela", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A reuse/build decision for Monitor and Containment based on what OSS tools actually do (read from code/READMEs)", "acceptance": ["≥6 tools surveyed with repo URLs, licence and activity (e.g. Langfuse, Arize Phoenix, OpenLLMetry, NeMo Guardrails, LlamaFirewall, OPA or Cedar)", "Capability matrix: tool × per-agent attribution, OTel export, live alerting, block single call, quarantine whole agent, revoke credentials, offline/no-key use", "Each capability marked 'verified in code/docs' vs 'claimed'", "'Implications for our design' section with explicit reuse/build/avoid list"], "depends": [], "deliverable": "research/RES-05.md", "summary": "Surveyed 11 OSS tools (Langfuse, Phoenix, OpenLLMetry, AgentOps, NeMo, Guardrails AI, Invariant, LlamaFirewall, OPA, Cedar, agentgateway) by reading cloned code/READMEs; capability matrix marks V(erified)/C(laimed). No tool has agent-level quarantine; observability never blocks, guardrails judge one call. Correction to H5: agentgateway already is an identity-aware MCP gateway (JWT, CEL authz, OTLP, config hot-reload); the gap is quarantine state linked to provenance/rollback, not 'a gateway'. Licence traps: Phoenix ELv2, Langfuse ee/, LlamaFirewall needs HF+Together key. Stars/release dates unavailable (GitHub API blocked). VERDICT: BUILD a thin offline Python chokepoint + kill registry; REUSE OTel/gen_ai attrs and Cedar/OPA-style policy semantics; optional Langfuse/Phoenix viewer; AVOID LlamaFirewall/Guardrails AI/AgentOps as deps.", "review": "[anaya · done] DONE. All 4 criteria met (11 tools from cloned code, licence + last-commit activity, 7-column matrix with V/C/N, reuse/build/avoid table). Stars unavailable is a sandbox limit, not a defect; spot-check adds agentgateway ~5.7k stars, Apache-2.0, Linux Foundation project, README lists JWT/API-key/OAuth auth and 'fine-grained RBAC with CEL'. Strongest finding: correction to H5 - an identity-aware MCP chokepoint already exists (agentgateway); H5 REFINED.\nSynthesis must carry: do NOT claim 'nobody has a gateway' or flatly 'no tool can quarantine an agent' - a CEL deny rule on a JWT claim plus hot reload is close to identity-level quarantine (unverified both ways). Defensible gap: quarantine that is provenance-aware (freeze the agent AND outbox/dependents derived from its writes) and linked to selective rollback. Survey is OSS-only and skipped invariant-gateway and other MCP gateways; say 'among the 11 tools we read'.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "leela", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:36", "who": "leela", "msg": "posted result summary"}, {"t": "19 Nov 00:36", "who": "leela", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-06", "title": "OSS survey: checkpointing, time-travel & versioned data stores for per-agent rollback", "sprint": 1, "track": "research", "owner": "leela", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "Know whether any existing substrate can revert one author's changes while keeping others' later dependent work, and pick our storage substrate", "acceptance": ["≥5 tools surveyed with repo/docs URLs (e.g. LangGraph checkpointer/time-travel, Dolt, lakeFS, Git, Temporal, FS/VM snapshots)", "Table: tool × rollback granularity (whole state / branch / per-author / per-row) × keeps-others'-work? × conflict handling × Python/offline usable", "A small tested-or-documented example (from docs or a local run) of reverting one author's commit in the best candidate", "'Implications for our design' section recommending a substrate for the prototype's Recovery component"], "depends": [], "deliverable": "research/RES-06.md", "summary": "Surveyed 7 substrates (LangGraph, Temporal, Replit snapshots, DeltaBox, Git, Dolt, lakeFS); H6 holds: checkpoint/time-travel tools restore whole state and drop others' work.\nCorrection: commit-graph stores (Dolt, Git, lakeFS) have 'revert one commit, keep later commits'; per-author undo = revert all commits by author X.\nLocal Git run: independent non-adjacent edit reverts cleanly; dependent edit conflicts. Git conflicts on adjacent lines, Dolt on same cell.\nSurprise: lakeFS is BSL 1.1 and object-level; none record reads, so dependency tracking must be our own layer.\nVerdict: Dolt (row-level revert, SQL, Apache-2.0) for shared state, Git fallback, plus own provenance graph. Dolt not run locally (binary not executed); verified from tests/docs only.", "review": "[anaya · done] DONE. All 4 criteria met (7 substrates, granularity/keeps-work/conflict/offline table, local Git run + Dolt engine-test example, substrate recommendation). Strongest finding: commit-graph stores already do 'revert one commit, keep later ones'; what none has is READ tracking, so dependency is our layer. H6 CONFIRMED for checkpoint/time-travel tools and REFINED for commit-graph stores - strong support for the 'dependency problem, not snapshot problem' thesis.\nSpot-check: Dolt docs confirm DOLT_REVERT --author and that DOLT_CHERRY_PICK 'preserves the original commit's author identity'; re-check the longer DOLT_REVERT quote, docs I saw say 'Reverts the changes introduced in a commit, or set of commits.'\nRecommendation (Dolt) is NOT yet accepted: Dolt was not run, and an external Go binary + MySQL client sits outside CHARTER's stdlib/pydantic/cryptography/networkx/pytest list. Decide Dolt vs own row-versioned store at Call #1/ADR.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "leela", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:35", "who": "leela", "msg": "posted result summary"}, {"t": "19 Nov 00:35", "who": "leela", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-07", "title": "Real incidents of agents causing damage + state of automated failure attribution", "sprint": 1, "track": "research", "owner": "sameer", "reviewer": "anaya", "model": "sonnet", "created_by": "anaya", "status": "done", "outcome": "A sourced incident catalogue and attribution evidence that make the problem concrete for the framing and give us realistic test scenarios", "acceptance": ["≥6 real incidents with primary/first-hand URLs (e.g. Replit DB deletion Jul 2025, AI Incident Database entries), each with: what broke, who detected, time-to-detect/contain/recover if known, how recovered", "Summary of Who&When (arXiv 2505.00212) and ≥1 follow-up: exact reported attribution accuracies with dataset/setting", "Pattern analysis: which incidents a per-agent selective rollback would have fixed vs. not", "'Implications for framing' and 'Implications for our design' sections (incl. 3 candidate demo scenarios)"], "depends": [], "deliverable": "research/RES-07.md", "summary": "Report at research/RES-07.md: 7 incidents catalogued (Replit, Gemini CLI, Claude Code x2, Antigravity, AWS/Kiro (disputed), PocketOS) with AIID/GitHub/company sources; none is multi-agent, and attribution was trivial in all (one agent). Pain was irreversibility, backups inside blast radius, agent self-misreporting, human detection after the fact; durations rarely public.\nWho&When verified: abstract headline best 53.5% agent / 14.2% step (cell not found in body tables); GPT-4o Table 1 ranges 26-55% agent, 3.5-25.5% step vs random 12-29 / 4-19. Follow-ups FAMAS (57.61/29.35 overall), CHIEF (77.59/29.31 hand; 76.80/52.00 alg-gen), DoVer, MAST.\nPattern: selective rollback alone fixes few of the incidents; pre-execution gating, scoped identity and out-of-reach pre-images matter more. 3 demo scenarios included.\nTop framing implication: lead with 'seconds to break, days to repair, and nobody can say who/what from logs' but do not claim multi-agent incidents exist; use LLM attribution as the baseline provenance beats.", "review": "[anaya · done] DONE. All 4 criteria met (7 incidents, AIID/GitHub/company URLs as the issue allows; Who&When + 4 follow-ups with settings; rollback-would-help table; 3 demo scenarios). Strongest finding, and an honest one: every public incident is single-agent, detected by a human after the fact, recovered all-or-nothing; no public multi-agent collateral incident found. H7a CONFIRMED (with the single-agent twist); H7b CONFIRMED pending RES-10 on 53.5/14.2, FAMAS and CHIEF numbers.\nSpot-checks: Claude Code #10077 confirms 21 Oct 2025, Ubuntu/WSL2, no skip-permissions, and 'tool_use command was never logged' (use for H4b). AIID 1469 confirms PocketOS/Cursor/Railway, 24 Apr 2026; '9 seconds', 'backups in same volume' and 'three-month-old snapshot' are secondary (Mondoo, headlines) only.\nSynthesis must carry: Who&When attributes the decisive REASONING error; our provenance attributes who WROTE an effect. Do not claim provenance solves Who&When's task - claim it makes effect attribution a lookup and narrows the search. Incident 4 rests on a vendor blog only; Kiro/AWS is disputed.", "log": [{"t": "19 Nov 00:32", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:33", "who": "sameer", "msg": "→ in_progress: starting"}, {"t": "19 Nov 00:36", "who": "sameer", "msg": "posted result summary"}, {"t": "19 Nov 00:36", "who": "sameer", "msg": "→ in_review"}, {"t": "19 Nov 00:41", "who": "anaya", "msg": "review: done"}]}, {"id": "RES-08", "title": "Metrics for TTI/TTC/clean recovery + regulatory & bank-aud el": "sonnet", "created_by": "anaya", "status": "in_review", "outcome": "Every paper/number likely to reach the abstract is verified against the paper itself (via Lacuna get_paper fulltext or arXiv)", "acceptance": ["checks Who&When 53.5%/14.2% and CHIEF/FAMAS figures in the paper text", "confirms existence, authors, venue/year of Retro, Warp, Aire, Taser, GoEx, Atomix, Cordon, State Footprints, DeltaBox, MAST", "table: claim, source, verified yes/no/partial, exact location, safe wording"], "depends": [], "deliverable": "research/RES-10.md", "summary": "Audited 27 claims; table + DROP list in research/RES-10.md. Who&When 53.5/14.2 is in the abstract and reproducible from Table 1 as a 4-cell mean, but from two different methods (all-at-once agent, step-by-step step), GPT-4o; never say one method gets both. FAMAS (57.61/29.35) and CHIEF tables match; CHIEF does not win every cell (FAMAS 41.38 step hand-crafted). Cordon 45/45 vs 14/45 verified but is the authors' own 45-case suite with self-derived baseline adapters; EuroSys'27 is only a header, drop. MAST 94% is few-shot o1 accuracy (kappa 0.77): quote kappa; NeurIPS unconfirmed. Venues confirmed: Retro OSDI'10, Warp SOSP'11, Aire SOSP'13, Taser SOSP'05, Sagas SIGMOD'87, Crosby-Wallach USENIX Sec'09, Who&When ICML'25. State Footprints is a vision paper (rollback unimplemented) and close prior art; DeltaBox is whole-sandbox, v2/title conflict with RES-06. Cordon/CHIEF/State Footprints/DeltaBox read via WebFetch (second-hand): Aarav should eyeball those numbers.", "review": "", "log": [{"t": "19 Nov 00:37", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:37", "who": "rohan", "msg": "→ in_progress: auditing"}, {"t": "19 Nov 00:40", "who": "rohan", "msg": "posted result summary"}, {"t": "19 Nov 00:40", "who": "rohan", "msg": "→ in_review"}]}, {"id": "RES-11", "title": "Deep read: Airlock (2611.06727) — closest competitor, exact differentiation", "sprint": 1, "track": "research", "owner": "meera", "reviewer": "anaya", "model": "opus", "created_by": "anaya", "status": "in_review", "outcome": "A verified, full-text account of what Airlock does and does not do, so our novelty claim is precise and defensible in front of a jury", "acceptance": ["read full text via Lacuna get_paper fulltext (or arXiv)", "table: capability x (Airlock, Spark-to-Fire, us) for attribution, containment granularity, backward undo, dependant handling, external effects, tamper evidence, metrics", "verbatim (short) limitation statements with section refs", "3 safe novelty sentences + 3 claims we must NOT make"], "depends": [], "deliverable": "research/RES-11.md", "summary": "Full text of Airlock read (22pp incl. App. A-G); Spark-to-Fire read at method+eval+limitations level.\nAirlock = online FORWARD containment (provenance DAG + per-object switches + deadline-aware min-cut, Thm 5: 0 post-tau1 leaks); it declares no rollback of committed effects/absorbed memory (Table A.2 S2, 5.2), trusted unauthenticated journals, adversarial agents out of scope.\nOur safe niche: backward recovery of one agent's landed shared-state writes + repair of dependants, signed/hash-chained audit under a stronger threat model (F5/F6), recovery metrics (residual damage, collateral loss).\nDo NOT claim novelty for provenance-guided selective containment, or 'first selective undo for agents' (Wang et al. 2608.10502 does single-agent dependency-guided rollback+replay), or any head-to-head win over Airlock.\nRisk: Airlock's 'kept without redo' metric penalises re-execution; report our own metrics and make re-runs not repeat external effects. STRAWMAN A5 falsified as written.\nIncident is real (METR: ~1,200 agents, >70k msgs/files, ~700 attackers, new board ~2 days after wipe) but METR says the board came from exploiting Artifactory, not 'legitimately held credentials' as Airlock writes.", "review": "", "log": [{"t": "19 Nov 00:39", "who": "anaya", "msg": "opened"}, {"t": "19 Nov 00:39", "who": "meera", "msg": "→ in_progress: full-text read"} <script>{
const D=JSON.parse(document.getElementById('data').textContent);
const P=D.project,I=D.issues||[],T=D.team||[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=[['todo','To do'],['in_progress','In progress'],['in_review','In review'],['changes','Changes asked'],['done','Done']];
const norm=s=>s==='backlog'?'todo':s==='blocked'?'changes':s;
const who=id=>T.find(t=>t.id===id)||{name:id||'—',model:''};
document.getElementById('title').textContent=P.name+' project board';
document.getElementById('tag').textContent=P.tagline;
document.getElementById('phase').textContent=D.phase;
document.getElementById('upd').textContent=P.updated;
const cnt=s=>I.filter(i=>norm(i.status)===s).length,done=cnt('done');
const figs=[[I.length,'issues opened'],[done,'done'],[cnt('in_progress')+cnt('in_review'),'in flight'],[(D.meetings||[]).length,'team calls'],[(D.decisions||[]).length,'decisions logged'],[D.daysToAbstract,'days to abstract']];
document.getElementById('figs').innerHTML=figs.map(([n,l])=>`<div class="fig1"><b>${esc(n)}</b><span>${l}</span></div>`).join('');
document.getElementById('strip').innerHTML=D.sprints.map(s=>{const si=I.filter(i=>i.sprint===s.n),d=si.filter(i=>norm(i.status)==='done').length,pc=si.length?Math.round(100*d/si.length):(s.status==='done'?100:0);return `<div class="sp ${s.status}"><h3>Sprint ${s.n} · ${esc(s.name)}</h3><p>${esc(s.goal)}</p><div class="meter" role="img" aria-label="${pc}% done"><i style="width:${pc}%"></i></div><p class="small" style="margin:6px 0 0">${d}/${si.length} issues · ${esc(s.status)}</p></div>`}).join('');
const fs=document.getElementById('fs'),fo=document.getElementById('fo'),q=document.getElementById('q');
fs.innerHTML='<option value="">All sprints</option>'+D.sprints.map(s=>`<option value="${s.n}">Sprint ${s.n}</option>`).join('');
const owners=[...new Set(I.map(i=>i.owner))];
fo.innerHTML='<option value="">Everyone</option>'+owners.map(o=>`<option value="${esc(o)}">${esc(who(o).name)}</option>`).join('');
try{const v=JSON.parse(localStorage.getItem('ksf')||'{}');fs.value=v.s||'';fo.value=v.o||''}catch(e){}
const card=i=>{const o=who(i.owner);return `<button class="card st-${esc(i.status)}" data-id="${esc(i.id)}"><div class="id">${esc(i.id)} · S${i.sprint}</div><div class="t">${esc(i.title)}</div><div class="chips"><span class="chip">${esc(o.name)}</span><span class="chip m-${esc(i.model)}">${esc(i.model)}</span>${i.reviewer?`<span class="chip">review: ${esc(who(i.reviewer).name)}</span>`:''}</div></button>`};
function draw(){const s=fs.value,o=fo.value,t=q.value.toLowerCase();try{localStorage.setItem('ksf',JSON.stringify({s,o}))}catch(e){}
const L=I.filter(i=>(!s||String(i.sprint)===s)&&(!o||i.owner===o)&&(!t||JSON.stringify(i).toLowerCase().includes(t)));
document.getElementById('kb').innerHTML=COLS.map(([k,n])=>{const c=L.filter(i=>norm(i.status)===k);return `<div class="col"><h3><span>${n}</span><span class="mut">${c.length}</span></h3>${c.map(card).join('')||'<p class="small mut">Nothing here</p>'}</div>`}).join('')}
[fs,fo].forEach(e=>e.addEventListener('change',draw));q.addEventListener('input',draw);draw();
const dlg=document.getElementById('dlg');
document.getElementById('kb').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b)return;const i=I.find(x=>x.id===b.dataset.id),o=who(i.owner);
document.getElementById('dlgin').innerHTML=`<p class="small mut">${esc(i.id)} · Sprint ${i.sprint} · ${esc(i.track||'')} · opened by ${esc(who(i.created_by).name)}</p><h2>${esc(i.title)}</h2>
<table><tr><th>Owner</th><td>${esc(o.name)} (<span class="m-${esc(i.model)}">${esc(i.model)}</span>)</td></tr><tr><th>Reviewer</th><td>${esc(who(i.reviewer).name)}</td></tr><tr><th>Status</th><td>${esc(i.status)}</td></tr><tr><th>Outcome</th><td>${esc(i.outcome)}</td></tr><tr><th>Deliverable</th><td><code>${esc(i.deliverable||'')}</code></td></tr></table>
${(i.acceptance||[]).length?`<h3>Acceptance</h3><ul>${i.acceptance.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}
${i.summary?`<h3>Result</h3><pre>${esc(i.summary)}</pre>`:''}
${i.review?`<h3>Review</h3><pre>${esc(i.review)}</pre>`:''}
${(i.log||[]).length?`<h3>Log</h3><ul class="feed">${i.log.map(l=>`<li><time>${esc(l.t)}</time><b>${esc(who(l.who).name)}</b> ${esc(l.msg)}</li>`).join('')}</ul>`:''}
<p><button id="cl">Close</button></p>`;dlg.showModal();document.getElementById('cl').onclick=()=>dlg.close()});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
document.getElementById('meet').innerHTML=(D.meetings||[]).slice().reverse().map((m,k)=>`<details class="meet" ${k?'':'open'}><summary>${esc(m.title)} <span class="small mut">· ${esc(m.date)}</span></summary><p>${esc(m.summary)}</p>${(m.decisions||[]).length?`<b class="small">Decided</b><ul>${m.decisions.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}${(m.next||[]).length?`<b class="small">Next</b><ul>${m.next.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}<p class="small mut">Attendees: ${esc((m.attendees||[]).map(a=>who(a).name).join(', '))}</p></details>`).join('')||'<p class="mut">First call happens when Sprint 1 research lands.</p>';
document.getElementById('dates').innerHTML=D.dates.map(d=>`<li class="${d.hard?'hard':''}"><b>${esc(new Date(d.d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}))}</b><span>${esc(d.what)}</span></li>`).join('');
document.getElementById('dec').innerHTML=(D.decisions||[]).length?`<table class="stack"><thead><tr><th>ID</th><th>Decision</th><th>Status</th></tr></thead><tbody>${D.decisions.map(d=>`<tr><td>${esc(d.id)}</td><td><b>${esc(d.title)}</b><br><span class="small mut">${esc(d.summary)}</span></td><td>${esc(d.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="mut">No decisions yet.</p>';
document.getElementById('team').innerHTML=T.map(t=>{const a=I.find(i=>i.owner===t.id&&['in_progress','in_review','changes'].includes(i.status));return `<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.role)}</td><td class="m-${esc(t.model)}">${esc(t.model)}</td><td>${a?esc(a.id+' '+a.title):'<span class="mut">'+esc(t.focus)+'</span>'}</td></tr>`}).join('');
document.getElementById('feed').innerHTML=(D.activity||[]).slice(-14).reverse().map(a=>`<li><time>${esc(a.t)}</time><b>${esc(who(a.who).name)}</b> ${esc(a.msg)}</li>`).join('');
document.getElementById('risk').innerHTML=(D.risks||[]).map(r=>`<tr><td>${esc(r.r)}</td><td>${esc(r.mit)}</td></tr>`).join('');
}</script>
