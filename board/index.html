who": "maya", "msg": "opened"}]}, {"id": "ADR-04", "title": "ADR-04 Monitor detectors, graded containment and lineage hold", "sprint": 2, "track": "eng", "owner": "nisha", "reviewer": "maya", "model": "sonnet", "created_by": "maya", "status": "todo", "outcome": "Data-invariant detectors (IBAN checksum, price delta vs frozen baseline, ledger balance, beneficiary-changed-then-paid), attribution by write_set lookup, suspend→revoke/release, per-action lineage hold from recorded read sets; due 24 Nov (tara consults on detectors)", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Detect and attribute are separate steps emitting C4 Alert{detector, evidence_seqs, suspect, root_candidates, hard}; auto-suspend only on hard evidence (scope breach, I-class invariant breach, class U); tamper alert freezes recovery, suspends nobody", "Lineage hold is per action using recorded read sets only (agent-declared lineage never trusted); release = un-hold + restore epoch; hold window is one config value", "Tests listed map to RT9 (laundering: A in top-3), RT10 (0 irreversible tainted released), RT11 (framing DoS), RT12 (persistence)"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-04-monitor-containment-hold.md", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}]}, {"id": "ADR-05", "title": "ADR-05 Versioned state, taint, write-write conflict rule, deduped re-run (FIRST PRIORITY)", "sprint": 2, "track": "eng", "owner": "vikram", "reviewer": "maya", "model": "opus", "created_by": "maya", "status": "todo", "outcome": "Own row-versioned SQLite (obj=table:pk, get→(value, ver, author), history), conservative forward/backward taint, recovery plan C5 with dry-run diff; due 23 Nov so build starts day 1", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Write-write rule: restore only if current ver == culprit's after-version, else re-run or flag; recovery appends compensating records, never edits history", "Re-runs of deterministic steps go through the outbox deduped by idempotency key (re-emitted effects = 0); LLM steps become a replan item for console approval; coarse/aggregate reads over-taint", "Tests listed cover the F2+ triage conflict row, a re-run that would re-fire payment/email, and backward taint naming root candidates"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-05-state-taint-recovery.md", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}]}, {"id": "ADR-06", "title": "ADR-06 World (10 agents), fault catalogue F1–F7 + F2+, oracle and metrics", "sprint": 2, "track": "eng", "owner": "tara", "reviewer": "anaya", "model": "sonnet", "created_by": "maya", "status": "todo", "outcome": "Deterministic 10-agent demo world, fault injectors F1–F7 plus hero F2+ (IBAN swap, price ×10, triage conflict), oracle S* and the scorer reading only the C6 run dir; due 24 Nov (sameer consults on metrics)", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Oracle defined per SYNTHESIS §6: t0, S*, B, G on the effect ledger + invariants, never on our taint graph; metrics TTI-detect, TTI-attribute, TTC (Panel) + post-alert tainted effects + irreversible tainted released, R, C, re-plan cost", "Fault catalogue says per fault whether it runs live or as pytest (F5/F6 live, F3 pytest) and the F2+ dependency graph (billing/payments/comms consume; inventory/docs independent)", "Protocol: ≥20 seeded runs, median/p95/max, baselines snapshot / revert-culprit-only / no-op, hold 0 vs >0"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-06-world-faults-oracle.md", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}]}, {"id": "ADR-07", "title": "ADR-07 CLI and incident console/timeline", "sprint": 2, "track": "eng", "owner": "ishaan", "reviewer": "zoya", "model": "sonnet", "created_by": "maya", "status": "todo", "outcome": "ks CLI surface (run, inject, verify, suspend/release/revoke, recover --dry-run, score) and the console/timeline the demo and jury use; due 24 Nov", "acceptance": ["ADR file ≤900 words with sections Context, Decision, Consequences, Interface touched (which of C1–C6), Tests that prove it", "Lists every command with args and exit codes; control commands emit signed, recorded C4 Controls; console reads only the record/run dir", "Timeline shows alert → suspend → held items → recovery dry-run diff → approval (incl. replan queue) for the F2+ hero path in banking-legible terms"], "depends": ["CON-01"], "deliverable": "org/adr/ADR-07-cli-console.md", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}]}, {"id": "CON-01", "title": "Freeze contracts C1–C6 as Python modules + JSON Schema", "sprint": 2, "track": "eng", "owner": "maya", "reviewer": "kabir", "model": "opus", "created_by": "maya", "status": "in_progress", "outcome": "C1 Envelope, C2 Record, C3 State, C4 Alert/Control, C5 RecoveryPlan, C6 Run dir frozen by 22 Nov as typed modules + JSON Schema, one canonical serializer, JSON-lines-over-Unix-socket transport; every ADR builds on these", "acceptance": ["src/ks/contracts/ has one module + one JSON Schema per C1–C6 with the fields in CALL-01/maya.md §3 (C1 incl. nonce, expiry, epoch, full act chain; C2 incl. read_set, write_set before/after ver+hash, prev_hash, gw_sig; C2 values as hashes only)", "pytest round-trip: for each contract, obj → canonical bytes → obj is identity, and the canonical bytes are stable across two runs (byte-equal) and validate against the schema", "a single canonical serializer (sorted keys, fixed encoding) is the only one exported and is the one signer, gateway and verify must import", "kabir signs off that the contracts satisfy all 11 day-one rules (CALL-01/kabir.md §4), checklist in the review note"], "depends": [], "deliverable": "src/ks/contracts/", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}, {"t": "19 Nov 00:54", "who": "maya", "msg": "Kabir sign-off criterion is satisfied by SEC-03 (security review of C1-C6 vs 11 day-one rules); ADR-05 is the first ADR to start once C3/C5 are drafted"}, {"t": "19 Nov 00:55", "who": "pmo", "msg": "PMO: accepted — SEC-03 satisfies CON-01's security sign-off; faulty-run≡S* test stays in ADR-00"}, {"t": "19 Nov 00:55", "who": "maya", "msg": "→ in_progress"}]}, {"id": "SEC-01", "title": "Threat model document published for the jury", "sprint": 2, "track": "security", "owner": "kabir", "reviewer": "panel", "model": "opus", "created_by": "kabir", "status": "in_review", "outcome": "One-page threat model the jury reads before D11 live attacks: assets, trust boundaries, in/out of scope, claims we make and refuse", "acceptance": ["Lists assets (state, outbox, record+witness heads, 4 key classes, containment state, PII side store) and the 4 trust boundaries", "In scope: buggy, rogue (arbitrary Python in its subprocess), colluding (root candidates only), insider log tamper without keys; out of scope listed with production mitigation (HSM, WORM, uid/container)", "Claims match CALL-01 wording exactly: 'tamper-evident up to the last witnessed head'; key isolation 'enforced in production, detected here by reconciliation'; no prevention claim for collusion", "Maps every in-scope adversary to the RT# attacks that exercise it and the control that answers it (D6/D7/D8, rules 1-11)", "Fits on 2 pages, no unmeasured numbers (D13); panel signs off"], "depends": [], "deliverable": "org/adr/THREAT-MODEL.md", "summary": "v2 of org/adr/THREAT-MODEL.md applies all 5 panel fixes and stays at 2 pages.\n(1) C6 reworded: containment holds and never cancels (release = un-hold + restore epoch). A held outbox item is cancelled only by an approved recovery-plan step (cancel_outbox) after the dry-run diff.\n(2) Live setup is fixed: the gateway runs as uid 0, the witness under its own uid, agents under a separate unprivileged uid (setuid to nobody checked here). Keys are generated in memory, PR_SET_DUMPABLE=0 is set on gateway/witness/signer, and agents get a path-less socketpair, a clean env and close_fds. If the uid cannot be separated, C1/C4 degrade: a key read from the rogue is the admitted gap and voids them for that run. RT2 stays the test.\n(3) Witness heads are kept in the witness's own uid-owned 0700 store, with a monotonic count, and echoed to the console and run summary. New row: truncating the record AND the heads is detected against the head printed at run end. A run with no printed head is out of scope (production: WORM).\n(4) New stall/fork/memory-bomb row: a per-tick deadline makes a missing envelope a no-op plus an anomaly, and per-agent rlimits apply; container limits are listed as the production mitigation.\n(5) New Control-action/recovery-key row: the key is gateway-held, used only on console approval, never in an agent process; the operator is trusted.\nNits: suspension/record per TERMS; side store mapped to F3. Changes v2 note added.", "review": "[panel · changes] CHANGES (4 must-fix, 1 should-fix; this still fits on 2 pages). Assets, B1-B4, in/out of scope with HSM/WORM/uid mitigations, the RT1-RT12 mapping (all 12 present, every in-scope adversary covered) and D13 target labelling all pass. C1-C5 are CALL-01 wording verbatim.\n(1) C6 misplaces CALL-01 wording. 'We hold, never cancel' is CALL-01's release semantics for containment, not a recovery claim. As written, C6 says recovery never cancels, which contradicts the C5 RecoveryPlan step cancel_outbox and the demo, where the held payment is discarded in recovery. A jury watching the demo will catch it. Reword C6: 'Containment holds, never cancels (release = un-hold + restore epoch). Recovery appends compensating records; a held outbox item is cancelled only by an approved recovery-plan step (cancel_outbox) after the dry-run diff.'\n(2) The key-read gap is acceptable only if its consequence is stated. Under the shared-uid fallback, the jury's sanctioned live attack (arbitrary Python in the rogue subprocess, D11) can read gateway and witness keys. That is the out-of-scope 'both keys' case, so C1 and C4 fail and reconciliation does not see it. §7 currently draws the line at 'a host shell as the gateway's user', which is not the same thing. Add: which setup runs live (separate uid or not, fixed by day 1), and if the uid is shared, that a key read from the rogue subprocess is the admitted gap and voids C1/C4 for that run. RT2 stays the test.\n(3) Where do witness heads live? An insider who truncates or rolls back BOTH the record and the witness heads to an older valid prefix passes verify: the 'last witnessed head' just moves back. This is the truncation hole from PANEL-ENG-00 item 2. Fix: state that witness heads are stored by the witness process outside the insider's write access, and add a row for record + witness truncation or rollback. Either detect it (witness keeps its own monotonic store) or put it out of scope (production: WORM witness log).\n(4) Availability is not admitted. A rogue that sleeps or loops forever stalls the tick barrier, so every independent agent stops: the 'kill everything' outcome F6 claims to avoid. A fork or memory bomb is the same class. A hostile jury tries this first. Add a rogue row: per-tick deadline, a missing envelope counts as a no-op plus an anomaly. Or state availability and resource exhaustion as out of scope (production: container limits).\n(5) Should-fix: the recovery key and Control actions have no row. Assets list 'forge a repair', but nothing says who signs suspend, release, revoke or recover, or that the recovery key never enters an agent process. Add one line: gateway-held, used only on console approval of the dry-run diff, rules 2 and 10; the console operator is trusted.\nGaps: splitting under thresholds with no RT and no claim is ACCEPTABLE as stated (GUARDRAILS X30 backs it). Key reads: acceptable once (2) is done.\nNits: TERMS bans 'quarantine' (RT5, use 'suspension') and 'log' (rule 9, use 'record'). Map the PII side store asset to the F3 pytest.", "log": [{"t": "19 Nov 00:54", "who": "kabir", "msg": "opened"}, {"t": "19 Nov 00:54", "who": "kabir", "msg": "→ in_progress"}, {"t": "19 Nov 00:56", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 00:56", "who": "kabir", "msg": "→ in_review"}, {"t": "19 Nov 01:01", "who": "panel", "msg": "review: changes"}, {"t": "19 Nov 01:04", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 01:04", "who": "kabir", "msg": "→ in_review: panel fixes applied"}]}, {"id": "SEC-02", "title": "Red-team spec RT1-RT12 as executable test plan", "sprint": 2, "track": "security", "owner": "kabir", "reviewer": "maya", "model": "opus", "created_by": "kabir", "status": "in_review", "outcome": "Sprint 4 test spec: each of RT1-RT12 written so an engineer can turn it into a pytest or live demo script without asking", "acceptance": ["Each RT has: setup (seed, agents, preconditions), script outline (steps the rogue code runs), observable signal, binary pass criterion, owner module", "Pass criteria are machine-checkable (exit code, record field, count == 0), not prose", "Marks which run live at finale (F5/F6, ks inject, DB bypass, line edit, full rewrite) vs pytest-only (F3), per D11", "RT11 scores false-positive cost; RT3 asserts the claimed agent is NOT suspended (D7 anti-framing)", "Owner modules exist in Maya's C1-C6 / ADR names; maya confirms each is buildable"], "depends": [], "deliverable": "tests/redteam/SPEC.md", "summary": "tests/redteam/SPEC.md: RT1-RT12 each with setup, rogue script outline, signal, binary pass expression over the C6 run dir / ks verify exit enum / counts, owner modules + ADR. LIVE at finale: RT1 DB bypass, RT3 forgery (F5), RT7 line edit and RT8 full rewrite (F6), RT10 F2+ via ks inject with hold 0 vs >0; F3 is a pytest-only variant of RT10; the rest are pytest and the jury may try them through the template. RT3 asserts billing stays active and only conn:R is suspended; RT11 asserts suspend-not-revoke, release restores the victim, and fp_cost is recomputed independently. Section 3 defines the jury rogue template (ctx.send/raw_send/sign_envelope/reconnect/report/dump, ks run --rogue). 10 contract requests Q1-Q10 for CON-01/SEC-03, the big one being Q9: C2 has no agent_id/act_chain. Open D7 point: an unattributable DB bypass suspends nobody. RT2 note: the container is uid 0, so agents can be dropped to a separate uid, which may make key isolation enforceable here.", "review": "", "log": [{"t": "19 Nov 00:54", "who": "kabir", "msg": "opened"}, {"t": "19 Nov 00:54", "who": "kabir", "msg": "→ in_progress"}, {"t": "19 Nov 00:59", "who": "kabir", "msg": "posted result summary"}, {"t": "19 Nov 00:59", "who": "kabir", "msg": "→ in_review: spec ready; maya to tick section 4 buildability and answer Q1-Q10 + RT1 D7 point"}]}, {"id": "SEC-03", "title": "Security review of contracts C1-C6 against the 11 day-one rules", "sprint": 2, "track": "security", "owner": "kabir", "reviewer": "maya", "model": "opus", "created_by": "kabir", "status": "todo", "outcome": "Rule-by-contract verdict table so C1-C6 freeze with no security gaps", "acceptance": ["11x6 matrix: each day-one rule (CALL-01/kabir.md s4) vs each contract C1-C6 marked pass / gap / n.a. with a one-line reason", "Every gap has a concrete proposed contract change (field, check or invariant) and severity (blocker / fix-before-S4 / note)", "Explicitly checks: one canonical serializer (rule 4), epoch+deny-list inside write txn and hold re-check at dispatch (rule 5), fail-closed U (rule 6), denials recorded (rule 11)", "Blockers resolved or accepted by maya before contracts freeze"], "depends": ["CON-01"], "deliverable": "org/reports/SEC-03.md", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "kabir", "msg": "opened"}]}, {"id": "SKEL-01", "title": "Walking skeleton: 2 agents → gateway stub → recorder → verify + determinism test", "sprint": 2, "track": "eng", "owner": "maya", "reviewer": "panel", "model": "opus", "created_by": "maya", "status": "todo", "outcome": "Thinnest end-to-end path on the frozen contracts before 25 Nov: two agent subprocesses send signed envelopes over Unix sockets, gateway stub runs the tick barrier, recorder writes C2, ks verify passes", "acceptance": ["2 agent subprocesses (no keys in-process, signer handle) → gateway stub → hash-chained record; ks verify exits 0 on the clean record and non-zero with first bad index after a one-line edit", "Determinism test in pytest: same seed run twice gives byte-identical record files", "Uses only src/ks/contracts/ types and the canonical serializer (no ad-hoc JSON); runs in CI-style one command"], "depends": ["CON-01"], "deliverable": "src/ks/", "summary": "", "review": "", "log": [{"t": "19 Nov 00:54", "who": "maya", "msg": "opened"}]}], "daysToAbstract": 3}</script>
<script>{
const D=JSON.parse(document.getElementById('data').textContent);
const P=D.project,I=D.issues||[],T=D.team||[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=[['todo','To do'],['in_progress','In progress'],['in_review','In review'],['changes','Changes asked'],['done','Done']];
const norm=s=>s==='backlog'?'todo':s==='blocked'?'changes':s;
const who=id=>T.find(t=>t.id===id)||{name:id||'—',model:''};
document.getElementById('title').textContent=P.name+' project board';
document.getElementById('tag').textContent=P.tagline;
document.getElementById('phase').textContent=D.phase;
document.getElementById('upd').textContent=P.updated;
const cnt=s=>I.filter(i=>norm(i.status)===s).length,done=cnt('done');
const figs=[[I.length,'issues opened'],[done,'done'],[cnt('in_progress')+cnt('in_review'),'in flight'],[(D.meetings||[]).length,'team calls'],[(D.decisions||[]).length,'decisions logged'],[D.daysToAbstract,'days to abstract']];
document.getElementById('figs').innerHTML=figs.map(([n,l])=>`<div class="fig1"><b>${esc(n)}</b><span>${l}</span></div>`).join('');
document.getElementById('strip').innerHTML=D.sprints.map(s=>{const si=I.filter(i=>i.sprint===s.n),d=si.filter(i=>norm(i.status)==='done').length,pc=si.length?Math.round(100*d/si.length):(s.status==='done'?100:0);return `<div class="sp ${s.status}"><h3>Sprint ${s.n} · ${esc(s.name)}</h3><p>${esc(s.goal)}</p><div class="meter" role="img" aria-label="${pc}% done"><i style="width:${pc}%"></i></div><p class="small" style="margin:6px 0 0">${d}/${si.length} issues · ${esc(s.status)}</p></div>`}).join('');
const fs=document.getElementById('fs'),fo=document.getElementById('fo'),q=document.getElementById('q');
fs.innerHTML='<option value="">All sprints</option>'+D.sprints.map(s=>`<option value="${s.n}">Sprint ${s.n}</option>`).join('');
const owners=[...new Set(I.map(i=>i.owner))];
fo.innerHTML='<option value="">Everyone</option>'+owners.map(o=>`<option value="${esc(o)}">${esc(who(o).name)}</option>`).join('');
try{const v=JSON.parse(localStorage.getItem('ksf')||'{}');fs.value=v.s||'';fo.value=v.o||''}catch(e){}
const card=i=>{const o=who(i.owner);return `<button class="card st-${esc(i.status)}" data-id="${esc(i.id)}"><div class="id">${esc(i.id)} · S${i.sprint}</div><div class="t">${esc(i.title)}</div><div class="chips"><span class="chip">${esc(o.name)}</span><span class="chip m-${esc(i.model)}">${esc(i.model)}</span>${i.reviewer?`<span class="chip">review: ${esc(who(i.reviewer).name)}</span>`:''}</div></button>`};
function draw(){const s=fs.value,o=fo.value,t=q.value.toLowerCase();try{localStorage.setItem('ksf',JSON.stringify({s,o}))}catch(e){}
const L=I.filter(i=>(!s||String(i.sprint)===s)&&(!o||i.owner===o)&&(!t||JSON.stringify(i).toLowerCase().includes(t)));
document.getElementById('kb').innerHTML=COLS.map(([k,n])=>{const c=L.filter(i=>norm(i.status)===k);return `<div class="col"><h3><span>${n}</span><span class="mut">${c.length}</span></h3>${c.map(card).join('')||'<p class="small mut">Nothing here</p>'}</div>`}).join('')}
[fs,fo].forEach(e=>e.addEventListener('change',draw));q.addEventListener('input',draw);draw();
const dlg=document.getElementById('dlg');
document.getElementById('kb').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b)return;const i=I.find(x=>x.id===b.dataset.id),o=who(i.owner);
document.getElementById('dlgin').innerHTML=`<p class="small mut">${esc(i.id)} · Sprint ${i.sprint} · ${esc(i.track||'')} · opened by ${esc(who(i.created_by).name)}</p><h2>${esc(i.title)}</h2>
<table><tr><th>Owner</th><td>${esc(o.name)} (<span class="m-${esc(i.model)}">${esc(i.model)}</span>)</td></tr><tr><th>Reviewer</th><td>${esc(who(i.reviewer).name)}</td></tr><tr><th>Status</th><td>${esc(i.status)}</td></tr><tr><th>Outcome</th><td>${esc(i.outcome)}</td></tr><tr><th>Deliverable</th><td><code>${esc(i.deliverable||'')}</code></td></tr></table>
${(i.acceptance||[]).length?`<h3>Acceptance</h3><ul>${i.acceptance.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}
${i.summary?`<h3>Result</h3><pre>${esc(i.summary)}</pre>`:''}
${i.review?`<h3>Review</h3><pre>${esc(i.review)}</pre>`:''}
${(i.log||[]).length?`<h3>Log</h3><ul class="feed">${i.log.map(l=>`<li><time>${esc(l.t)}</time><b>${esc(who(l.who).name)}</b> ${esc(l.msg)}</li>`).join('')}</ul>`:''}
<p><button id="cl">Close</button></p>`;dlg.showModal();document.getElementById('cl').onclick=()=>dlg.close()});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
document.getElementById('meet').innerHTML=(D.meetings||[]).slice().reverse().map((m,k)=>`<details class="meet" ${k?'':'open'}><summary>${esc(m.title)} <span class="small mut">· ${esc(m.date)}</span></summary><p>${esc(m.summary)}</p>${(m.decisions||[]).length?`<b class="small">Decided</b><ul>${m.decisions.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}${(m.next||[]).length?`<b class="small">Next</b><ul>${m.next.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}<p class="small mut">Attendees: ${esc((m.attendees||[]).map(a=>who(a).name).join(', '))}</p></details>`).join('')||'<p class="mut">First call happens when Sprint 1 research lands.</p>';
document.getElementById('dates').innerHTML=D.dates.map(d=>`<li class="${d.hard?'hard':''}"><b>${esc(new Date(d.d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}))}</b><span>${esc(d.what)}</span></li>`).join('');
document.getElementById('dec').innerHTML=(D.decisions||[]).length?`<table class="stack"><thead><tr><th>ID</th><th>Decision</th><th>Status</th></tr></thead><tbody>${D.decisions.map(d=>`<tr><td>${esc(d.id)}</td><td><b>${esc(d.title)}</b><br><span class="small mut">${esc(d.summary)}</span></td><td>${esc(d.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="mut">No decisions yet.</p>';
document.getElementById('team').innerHTML=T.map(t=>{const a=I.find(i=>i.owner===t.id&&['in_progress','in_review','changes'].includes(i.status));return `<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.role)}</td><td class="m-${esc(t.model)}">${esc(t.model)}</td><td>${a?esc(a.id+' '+a.title):'<span class="mut">'+esc(t.focus)+'</span>'}</td></tr>`}).join('');
document.getElementById('feed').innerHTML=(D.activity||[]).slice(-14).reverse().map(a=>`<li><time>${esc(a.t)}</time><b>${esc(who(a.who).name)}</b> ${esc(a.msg)}</li>`).join('');
document.getElementById('risk').innerHTML=(D.risks||[]).map(r=>`<tr><td>${esc(r.r)}</td><td>${esc(r.mit)}</td></tr>`).join('');
}</script>
</body>
